---
name: flow_efficiency
description: Scores whether the interaction progressed efficiently without unnecessary
  loops or avoidable delay.
type: llm
scoreType: NUMERIC
scoreName: flow_efficiency
llmConfig:
  model: gpt-4o
  temperature: 0
  maxTokens: 2000
projectId: "8606"
staticContext: 'Primary evidence: conversation turns and tool-call sequence. Judge
  how directly the session moved from request to usable build progress. Do not score
  final-site quality here.'
criteriaSchemaFile: schemas/empty-object.json
template: |
  You are grading `flow_efficiency` for an Airo Builder session.

  Use only conversation flow and tool usage. Ignore visual polish and overall site quality.

  ## Task Context
  {{#if scenario.goal}}
  Primary goal: {{scenario.goal.name}}
  {{/if}}
  Customer summary: {{scenario.customerSummary}}

  ## Conversation Evidence
  {{#if conversation.originalPrompt}}
  Original request:
  {{conversation.originalPrompt}}
  {{/if}}
  {{#if conversation.userMessages}}
  User refinements:
  {{#each conversation.userMessages}}
  - {{this}}
  {{/each}}
  {{/if}}
  {{#if conversation.messages}}
  Transcript:
  {{#each conversation.messages}}
  TURN {{turn}} {{uppercase role}}: {{content}}
  {{#if toolCalls}}
  Tool calls on this turn:
  {{#each toolCalls}}
  - {{name}}{{#if args}} args={{args}}{{/if}}
  {{/each}}
  {{/if}}
  {{/each}}
  {{/if}}

  ## Judge This
  Score how efficiently the agent moved the session forward.

  Reward:
  - early progress toward a usable build
  - concise, necessary clarification only when it unblocks important work
  - tool usage that matches the next obvious step
  - adaptation after a user refinement without restarting unnecessarily

  Penalize:
  - repetitive clarification loops
  - contradictory progress updates
  - obvious wheel-spinning, stalling, or redoing work without reason
  - too many turns spent on low-value chatter instead of advancing the build

  Do not penalize legitimate iteration when the user changes direction or asks for substantial edits.

  ## Rubric
  5 = very direct progression with little or no wasted motion.
  4 = mostly efficient with minor detours.
  3 = acceptable but somewhat repetitive, slow, or over-chatty.
  2 = clearly inefficient with repeated loops or avoidable churn.
  1 = severely inefficient.
  0 = essentially no meaningful forward progress.

  In the reasoning, distinguish unavoidable iteration from avoidable delay.
scoreConfig:
  min: 0
  max: 5
