---
key: airo-baseline-candle-maker-launching-ember-wick-retail-e-commerce
name: Candle maker launching Ember & Wick
syntheticUserName: Candle maker launching Ember & Wick

business:
  industry: Retail & E-commerce
  businessName: Ember & Wick
  businessDescription: Hand-poured soy candles with seasonal scents
  targetAudience: Gift shoppers and home decor buyers
  brandPersonality:
    - calm
    - premium
    - handmade
  colorPreferences:
    - charcoal
    - cream
    - copper
  stylePreferences:
    - minimal
    - product-first
    - warm

goal:
  name: candle storefront with checkout and publishing
  goals:
    - Move a handmade candle business from a loose selling idea to a small publish-ready storefront
      with product pages, checkout path, and basic discoverability.
customerSummary: craft-focused, wants a small online store with products, checkout, product photos,
  SEO basics, and help publishing on a domain. hard scenario.
testingCapability: "Complexity: hard | Primary intent: ecommerce website + publish | Skill under
  test: commerce/media/seo/publishing | Scenario cluster: Small storefront with checkout and go-live
  path | Expected: setup storefront, products, SEO basics, and publish guidance"

trials: 1
maxTurns: 7

llmConfig:
  model: gpt-5.2
  temperature: 0.75
  maxTokens: 32000

browserConfig:
  browserAuth:
    type: form
    credentialsSecretId: goarena/airo/login01
  requiresPerTurnScreenshots: true
  qualityEval:
    enabled: true
    siteType: portfolio
    wcagLevel: AA
    thresholds:
      minOverallScore: 75
      minAccessibility: 80

evaluators:
  - evaluatorName: "Airo Functional Evaluator"
    weight: 25
    criteria:
      checkLinks: true
      checkImages: true
      checkConsoleErrors: true
  - evaluatorName: "Airo Accessibility Evaluator"
    weight: 25
    criteria:
      wcagLevel: AA
  - evaluatorName: "Airo SEO Evaluator"
    weight: 15
    criteria:
      checkOpenGraph: true
      checkTwitterCards: true
  - evaluatorName: "Airo Performance Evaluator"
    weight: 15
    criteria:
      timeout: 30000
  - evaluatorName: "Airo Security Evaluator"
    weight: 10
    criteria:
      requireHttps: true
      checkHeaders: true
  - evaluatorName: intent_inference_quality
    weight: 6
    criteria: {}
