      checkLinks: true
      checkImages: true
      checkConsoleErrors: true
  - evaluatorName: "Airo Accessibility Evaluator"
    weight: 25
    criteria:
      wcagLevel: AA
  - evaluatorName: "Airo SEO Evaluator"
    weight: 15
    criteria:
