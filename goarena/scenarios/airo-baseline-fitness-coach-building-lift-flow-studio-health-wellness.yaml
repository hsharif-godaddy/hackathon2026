key: airo-baseline-fitness-coach-building-lift-flow-studio-health-wellness
name: Fitness coach building Lift & Flow Studio
syntheticUserName: Fitness coach building Lift & Flow Studio

business:
  industry: Health & Wellness
  businessName: Lift & Flow Studio
  businessDescription: Small fitness studio offering strength classes, yoga, and weekend workshops
  targetAudience: Adults looking for local group fitness classes
  brandPersonality:
    - energetic
    - supportive
    - modern
  colorPreferences:
    - black
    - teal
    - white
  stylePreferences:
    - bold
    - mobile-first
    - conversion-focused
goal:
  name: fitness studio site with bookings and payments
  goals:
    - Help a fitness studio convert mobile visitors into class bookings, with clear schedules,
      pricing, booking requests, and a simple drop-in payment option.
customerSummary: busy, wants a polished fitness studio website with class schedule, booking
  requests, payments for drop-in classes, and strong mobile CTAs. hard scenario.
testingCapability: "Complexity: hard | Primary intent: website + appointments + payments | Skill
  under test: online-appointments/commerce-one-time-payment | Scenario cluster: Booking and payment
  flow | Expected: create class pages, booking request flow, pricing, and simple payment CTA"

trials: 1
maxTurns: 7

llmConfig:
  model: gpt-5.2
  temperature: 0.75
  maxTokens: 32000

