---
key: airo-baseline-frustrated-consultant-redesigning-clearpath-ops-business-services
name: Frustrated consultant redesigning ClearPath Ops
syntheticUserName: Frustrated consultant redesigning ClearPath Ops

business:
  industry: Business Services
  businessName: ClearPath Ops
  businessDescription: Operations consulting for small companies
  targetAudience: Business owners with messy internal processes
  brandPersonality:
    - sharp
    - practical
    - credible
  colorPreferences:
    - navy
    - white
    - orange
  stylePreferences:
    - clean
    - direct
    - professional

goal:
  name: consulting site with corrected positioning
  goals:
    - Recover from user corrections and reshape a generic consulting site into a specific
      operations-consulting site with stronger copy and a consultation request path.

customerSummary: impatient, wants a business consulting site but changes direction often and asks
  for copy edits after each preview. adversarial scenario.
testingCapability: "Complexity: adversarial | Primary intent: website + repeated content editing +
  form | Skill under test: content editing/forms/flow recovery | Scenario cluster: User correction
  and scope refinement | Expected: adapt to corrections, avoid repetition, improve copy, and
  preserve lead-capture goal"

trials: 1
maxTurns: 7

llmConfig:
  model: gpt-5.2
  temperature: 0.75
  maxTokens: 32000

browserConfig:
  browserAuth:
    type: form
    credentialsSecretId: goarena/airo/login04
  requiresPerTurnScreenshots: false
  qualityEval:
    enabled: true
    siteType: service-business
    wcagLevel: AA
    thresholds:
      minOverallScore: 70
      minAccessibility: 75

evaluators:
  - evaluatorName: "Airo Functional Evaluator"
    weight: 25
    criteria:
      checkLinks: true
      checkImages: true
      checkConsoleErrors: true
  - evaluatorName: "Airo Accessibility Evaluator"
    weight: 25
    criteria:
      wcagLevel: AA
  - evaluatorName: "Airo SEO Evaluator"
    weight: 15
    criteria:
      checkOpenGraph: true
      checkTwitterCards: true
  - evaluatorName: "Airo Performance Evaluator"
    weight: 15
    criteria:
      timeout: 30000
  - evaluatorName: "Airo Security Evaluator"
    weight: 10
    criteria:
      requireHttps: true
      checkHeaders: true
  - evaluatorName: intent_inference_quality
    weight: 6
    criteria: {}
  - evaluatorName: intent_to_output_alignment
    weight: 4
    criteria: {}
