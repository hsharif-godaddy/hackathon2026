# Evaluation Suite: Browser-Based Website Testing
# Tests AI agent's website generation capabilities using browser automation

version: "1.0"

suite:
  name: "Browser-Based Website Generation Tests"
  description: |
    Tests AI website builder agents using browser automation.
    Evaluates generated websites using a hybrid approach of system
    evaluators (library-based) and LLM evaluators (AI-powered).

    For browser-based scenarios (with browserConfig), each evaluator
    has a weight and the overall score is the weighted average.

  scenarios:
    - key: "airo-restaurant-website-requester"
    #- key: "airo-portfolio-demanding-client"

  config:
    mode: "simulation"
