# Matches budget-service postgres so DATABASE_URL can be:
# postgres://budget:budget@localhost:5432/budget_test?sslmode=disable
#
# Schema: run the server (or tests) with DATABASE_URL set — golang-migrate applies embedded SQL on startup.
# Existing volumes keep data; to re-init, `make down -v` then `make up`.
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: budget
      POSTGRES_DB: budget_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget -d budget_test"]
      interval: 2s
      timeout: 5s
      retries: 10
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.151.0
    configs:
      - source: otel-collector-config
        target: /etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"

  # Local E2E only (docker compose --profile e2e up -d). Budget service on host POSTs webhooks to host:9999.
  webhook-sink:
    profiles: [e2e]
    build:
      context: ./e2e/webhook-sink
      dockerfile: Dockerfile
    ports:
      - "9999:9090"

configs:
  otel-collector-config:
    content: |
      receivers:
        otlp:
          protocols:
            http:
              endpoint: 0.0.0.0:4318
            grpc:
              endpoint: 0.0.0.0:4317
      exporters:
        debug:
          verbosity: detailed
      service:
        pipelines:
          metrics:
            receivers: [otlp]
            exporters: [debug]
          traces:
            receivers: [otlp]
            exporters: [debug]
