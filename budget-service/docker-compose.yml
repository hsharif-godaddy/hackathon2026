# budget-service/docker-compose.yml
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: budget
      POSTGRES_DB: budget_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget -d budget_test"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro

  budget-service:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://budget:budget@postgres:5432/budget_test?sslmode=disable
      PORT: 8080
      LOG_LEVEL: info
      AUDIT_LOG_PATH: /var/log/budget-service/audit.log
    ports:
      - "8080:8080"
