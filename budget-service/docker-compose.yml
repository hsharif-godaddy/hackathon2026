# Matches budget-service postgres so DATABASE_URL can be:
# postgres://budget:budget@localhost:5432/budget_test?sslmode=disable
#
# First init: runs migrations/001_init.sql via docker-entrypoint-initdb.d. Seed: `make data` (see seed/).
# Existing volumes keep old data; to re-init, `make down` then `make up`, then `make data`.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: budget
      POSTGRES_DB: budget_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget -d budget_test"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro

  # Local E2E only (docker compose --profile e2e up -d). Budget service on host POSTs webhooks to host:9999.
  webhook-sink:
    profiles: [e2e]
    build:
      context: ./e2e/webhook-sink
      dockerfile: Dockerfile
    ports:
      - "9999:9090"
