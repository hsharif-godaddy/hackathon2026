openapi: 3.0.3
info:
  title: Budget Service API
  description: |
    Credits and budget sessions for Airo. `/api/v1/*` requires IAM / cert-class service JWT
    (`Authorization: Bearer` or `sso-jwt`) via `packages/go-auth`, except when `LOCAL_AUTH_DISABLE=true`.
    This spec and Swagger UI are served without authentication at `/openapi.yaml` and `/swagger/`.
    When `DATABASE_URL` is unset, most `/api/v1` handlers return **503** `SERVICE_UNAVAILABLE` (`database not configured`).
  version: 1.0.0

servers:
  - url: /
    description: Same host as the service

tags:
  - name: docs
    description: OpenAPI spec and Swagger UI (no auth)
  - name: health
  - name: v1
    description: Authenticated API (see security)

security:
  - bearerAuth: []

paths:
  /openapi.yaml:
    get:
      tags: [docs]
      summary: OpenAPI 3 document (embedded; same bytes as this file)
      security: []
      responses:
        "200":
          description: YAML document
          content:
            application/yaml:
              schema:
                type: string
    head:
      tags: [docs]
      summary: OpenAPI document metadata (no body)
      security: []
      responses:
        "200":
          description: OK

  /swagger:
    get:
      tags: [docs]
      summary: Redirect to Swagger UI
      security: []
      responses:
        "301":
          description: Redirect to `/swagger/`
          headers:
            Location:
              schema:
                type: string
                example: /swagger/

  /swagger/:
    get:
      tags: [docs]
      summary: Swagger UI (loads `/openapi.yaml`)
      security: []
      responses:
        "200":
          description: HTML
          content:
            text/html:
              schema:
                type: string

  /health:
    get:
      tags: [health]
      summary: Liveness — aggregate status only (DB ping and token generator checked internally; not exposed)
      security: []
      responses:
        "200":
          description: OK (`status` is `ok`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Not ready (`status` is `degraded` or `unhealthy`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
    head:
      tags: [health]
      summary: Liveness (no body)
      security: []
      responses:
        "200":
          description: OK
        "503":
          description: Service degraded or unhealthy

  /api/v1/auth-check:
    get:
      tags: [v1]
      summary: Auth probe — returns 200 when JWT is accepted
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: IAM or Cert-class service JWT accepted

  /api/v1/products:
    get:
      tags: [v1]
      summary: List products
      parameters:
        - $ref: "#/components/parameters/includeDeletedQuery"
      responses:
        "200":
          description: Product rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      tags: [v1]
      summary: Register or revive productKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productKey]
              properties:
                productKey:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/products/{productKey}:
    delete:
      tags: [v1]
      summary: Soft-delete product
      parameters:
        - $ref: "#/components/parameters/productKeyPath"
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/webhooks:
    get:
      tags: [v1]
      summary: List webhooks
      description: Returns webhook subscriptions (active only unless `includeDeleted` is `true` or `1`). Omit `productKey` to list all; set `productKey` to restrict to one product.
      parameters:
        - $ref: "#/components/parameters/productKeyQuery"
        - $ref: "#/components/parameters/includeDeletedQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Webhook"
        "400":
          $ref: "#/components/responses/Error"
    post:
      tags: [v1]
      summary: Create webhook subscription
      description: |
        Subscribe to webhook events for a product. Supported event types:
        - `report.created` — Fired after a session report is created (reconciliation)
        - `budget-item.reset` — Fired when a budget item's credits are reset (periodic renewal)
        - `budget-item.expired` — Fired when a budget item's `expiresAt` timestamp passes
        - `budget-item.exhausted` — Fired when a budget item's `creditsUsed` equals `creditsTotal`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventType, productKey, url]
              properties:
                eventType:
                  type: string
                  enum:
                    - report.created
                    - budget-item.reset
                    - budget-item.expired
                    - budget-item.exhausted
                productKey:
                  type: string
                url:
                  type: string
                  format: uri
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/webhooks/{webhookId}:
    get:
      tags: [v1]
      summary: Get webhook
      parameters:
        - $ref: "#/components/parameters/webhookIdPath"
        - $ref: "#/components/parameters/includeDeletedQuery"
      responses:
        "200":
          description: OK (includes soft-deleted webhooks when `includeDeleted` is `true` or `1`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [v1]
      summary: Soft-delete webhook
      parameters:
        - $ref: "#/components/parameters/webhookIdPath"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/reports:
    get:
      tags: [v1]
      summary: List session reports
      description: |
        Returns **summary** rows (`reportId`, `sessionId`, `budgetId`, `productKey`, `createdAt`) per report, optionally filtered. For the full report body (totals, `reportItems`, allocations), call `GET /api/v1/sessions/{sessionId}/reports/{reportId}` for each id.
        Response includes `limit`, `offset`, and `hasMore` for pagination. Default `limit` is 50, maximum 500. Default `offset` is 0. Default sort is `createdAt` with `order=desc`.

        `productKey` (when set) matches `budgets.product_key` (exact string). A non-empty but non-matching key returns `{"reports":[],"total":0,...}` (not 404) — the same as no rows in the DB for that key.
      parameters:
        - name: productKey
          in: query
          required: false
          description: |
            Return only reports whose session’s budget has this `product_key` (exact). Omit to include all reports (no product filter). Max length 256.
          schema:
            type: string
            maxLength: 256
            example: dev-ui-product
        - name: budgetId
          in: query
          required: false
          description: Filter by budget UUID
          schema:
            type: string
            format: uuid
        - name: sessionId
          in: query
          required: false
          description: Filter by session UUID
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 500
        - name: offset
          in: query
          required: false
          description: Skipped rows (0-based)
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: sort
          in: query
          required: false
          description: Only `createdAt` is supported; omit to use the default
          schema:
            type: string
            enum: [createdAt]
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportListResponse"
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/reports/aggregate:
    get:
      tags: [v1]
      summary: Aggregate report line costs by product and/or label
      description: |
        Sums `budgetCost` and `productCost` from `reportItems` lines whose parent report’s `created_at` is in `[from, to)` (half-open; `to` is exclusive). **At least one** of `productKey` or `label` must be set. When both are set, both filters apply. When only `productKey` is set, all labels for that product in the window are included. When only `label` is set, that label is summed across all products. String filters use exact match after trim.

        When `from` and `to` are both omitted, the window is one calendar month ending at the server’s current time in UTC: `to = now()`, `from = to` minus one month (via `AddDate(0,-1,0)`). When both are provided, they must be RFC3339 or RFC3339Nano; you must not send only one of them. Report lines whose budget row has `deleted_at` set are **included** in sums (the previous implementation excluded them via `budgets.deleted_at IS NULL` on the join).
      parameters:
        - name: productKey
          in: query
          required: false
          description: |
            When set, restricts to this `budgets.product_key` (exact). Omitted when aggregating by `label` only. Max length 256.
          schema:
            type: string
            maxLength: 256
        - name: label
          in: query
          required: false
          description: When set, restricts to this `budget_session_report_items.label` (exact). Omitted when aggregating by `productKey` only. Max length 256.
          schema:
            type: string
            maxLength: 256
        - name: budgetId
          in: query
          required: false
          description: Optional filter to one budget
          schema:
            type: string
            format: uuid
        - name: sessionId
          in: query
          required: false
          description: Optional filter to one session’s reports
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          description: Inclusive start (RFC3339 or RFC3339Nano). Omit with `to` to use the default one-month window.
          schema:
            type: string
        - name: to
          in: query
          required: false
          description: Exclusive end — rows with `br.created_at < to` are included.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportAggregateResponse"
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/budgets:
    post:
      tags: [v1]
      summary: Create budget (optional items)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostBudgetRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/budgets/{budgetId}:
    get:
      tags: [v1]
      summary: Get budget
      parameters:
        - $ref: "#/components/parameters/budgetIdPath"
        - $ref: "#/components/parameters/includeDeletedQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [v1]
      summary: Batch update existing budget items
      parameters:
        - $ref: "#/components/parameters/budgetIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/PatchBudgetBatchItem"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      tags: [v1]
      summary: Soft-delete budget and items
      parameters:
        - $ref: "#/components/parameters/budgetIdPath"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/budgets/{budgetId}/budget-items:
    post:
      tags: [v1]
      summary: Append one budget item
      parameters:
        - $ref: "#/components/parameters/budgetIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetItem"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/budgets/{budgetId}/budget-items/{budgetItemId}:
    get:
      tags: [v1]
      summary: Get budget item
      parameters:
        - $ref: "#/components/parameters/budgetIdPath"
        - $ref: "#/components/parameters/budgetItemIdPath"
        - $ref: "#/components/parameters/includeDeletedQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetItem"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [v1]
      summary: Update budget item
      parameters:
        - $ref: "#/components/parameters/budgetIdPath"
        - $ref: "#/components/parameters/budgetItemIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchBudgetItem"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetItem"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [v1]
      summary: Soft-delete budget item
      parameters:
        - $ref: "#/components/parameters/budgetIdPath"
        - $ref: "#/components/parameters/budgetItemIdPath"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/sessions:
    post:
      tags: [v1]
      summary: Open session (402 if no consumable capacity)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [budgetId]
              properties:
                budgetId:
                  type: string
                  format: uuid
                metadata:
                  type: object
                  nullable: true
                  additionalProperties: true
                  description: Optional opaque JSON
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetSession"
        "402":
          description: NO_BUDGET_CAPACITY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/sessions/{sessionId}:
    get:
      tags: [v1]
      summary: Get session (404 if reconciled)
      parameters:
        - $ref: "#/components/parameters/sessionIdPath"
        - name: debug
          in: query
          schema:
            type: string
            enum: ["1"]
          description: If set to 1, include allocation debug in response
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetSession"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [v1]
      summary: Append spend lines
      description: >
        Appends session lines with full `cost` USD stored per line. Virtual USD→credits allocation uses the
        same priority walk as reports but may be partial: under `?debug=1`, `debug.sessionItems[].creditsChargedStored`
        and `creditsChargedReplayed` reflect only what the pool could cover; excess `cost` USD does not fail the request.
      parameters:
        - $ref: "#/components/parameters/sessionIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionItems]
              properties:
                sessionItems:
                  type: array
                  items:
                    type: object
                    required: [cost, callRequestId]
                    properties:
                      cost:
                        description: USD amount (JSON string or number)
                        oneOf:
                          - type: string
                          - type: number
                      callRequestId:
                        type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetSession"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/sessions/{sessionId}/reports:
    post:
      tags: [v1]
      summary: Close session with report (sets reconciled_at)
      description: >
        Each `reportItems` line allocates `budgetCost` USD against the budget using the same walk as session spend;
        full coverage is required per line. If `budgetCost` exceeds remaining allocatable credits, **400** with
        `code` **INSUFFICIENT_CREDITS** — reduce `budgetCost` to what fits, move uncovered USD to `productCost`,
        e.g. a line with `label` **overages**. Ledger spend is applied here (not on PATCH).
      parameters:
        - $ref: "#/components/parameters/sessionIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reportItems]
              properties:
                reportItems:
                  type: array
                  items:
                    type: object
                    required: [budgetCost, productCost, label]
                    properties:
                      budgetCost:
                        description: Non-negative USD (string or number)
                      productCost:
                        description: Non-negative USD (string or number)
                      label:
                        type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionReport"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/sessions/{sessionId}/reports/{reportId}:
    get:
      tags: [v1]
      summary: Get report
      parameters:
        - $ref: "#/components/parameters/sessionIdPath"
        - $ref: "#/components/parameters/reportIdPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionReport"
        "404":
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: IAM or Cert-class service JWT (see go-auth)

  parameters:
    budgetIdPath:
      name: budgetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    budgetItemIdPath:
      name: budgetItemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    sessionIdPath:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    reportIdPath:
      name: reportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    webhookIdPath:
      name: webhookId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    productKeyPath:
      name: productKey
      in: path
      required: true
      schema:
        type: string
    productKeyQuery:
      name: productKey
      in: query
      required: false
      description: Filter by `productKey` (exact). Omit to list all rows this endpoint returns. Reject requests longer than 256 characters with 400.
      schema:
        type: string
        maxLength: 256
    includeDeletedQuery:
      name: includeDeleted
      in: query
      required: false
      description: |
        When `true` or `1`: **`GET /budgets/{budgetId}`** — include soft-deleted rows in the nested **`items`** array only (budget header and `deletedAt` on the budget are unchanged). **`GET .../budget-items/{id}`** and **`GET /webhooks/{webhookId}`** — return **200** with body (including **`deletedAt`**) instead of **404** for a soft-deleted resource. **`GET /products`** and **`GET /webhooks`** — include soft-deleted list entries with **`deletedAt`** set.

        Undocumented query keys → **400** on **`GET /products`**, **`GET /budgets/{budgetId}`**, **`GET .../budget-items/{budgetItemId}`**, **`GET /webhooks`**, and **`GET /webhooks/{webhookId}`**. Allowed keys: list **`GET /webhooks`** — **`productKey`**, **`includeDeleted`**; all other listed **`GET`s** — **`includeDeleted`** only (plus path parameters).
      schema:
        type: string

  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"

  schemas:
    ErrorBody:
      type: object
      required: [code, error]
      properties:
        code:
          type: string
          example: BAD_REQUEST
        error:
          type: string

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, unhealthy]
          description: |
            **ok** — checks passed. **degraded** — database ping failed when `DATABASE_URL` is configured.
            **unhealthy** — outbound SSO token generator is unhealthy when configured.
            Token failure wins over DB degradation when both apply.
          example: ok

    Product:
      type: object
      properties:
        productKey:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        deletedAt:
          type: string
          description: Present when the product is soft-deleted and was returned via `includeDeleted`

    Webhook:
      type: object
      properties:
        webhookId:
          type: string
        eventType:
          type: string
        productKey:
          type: string
        url:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        deletedAt:
          type: string
          description: Present when the webhook is soft-deleted and was returned via `includeDeleted`

    BudgetItemInput:
      type: object
      required: [creditsTotal]
      properties:
        creditsTotal:
          type: string
          description: NUMERIC(20,6) non-negative
        creditsUsed:
          type: string
          description: Optional initial credits spent (for migration); must be <= creditsTotal
        costToCreditRatio:
          type: string
          description: USD per credit (positive); defaults to 1 when omitted on create
        expiresAt:
          type: string
          nullable: true
        startsAt:
          type: string
          nullable: true
        resetsAt:
          type: string
          nullable: true
        resetInterval:
          type: string
          nullable: true
        label:
          type: string
          nullable: true
          description: Optional free-form label

    PatchBudgetItem:
      type: object
      properties:
        budgetItemId:
          type: string
          format: uuid
          nullable: true
        creditsTotal:
          type: string
        creditsUsed:
          type: string
          description: New absolute creditsUsed value. Requires creditsUsedReason.
        creditsUsedReason:
          type: string
          enum: [upgrade, downgrade, reimbursement]
          description: Reason for the creditsUsed change. Required when creditsUsed is provided.
        costToCreditRatio:
          type: string
        expiresAt:
          type: string
          nullable: true
        startsAt:
          type: string
          nullable: true
        resetsAt:
          type: string
          nullable: true
        resetInterval:
          type: string
          nullable: true
        label:
          type: string
          nullable: true
          description: Optional free-form label

    PatchBudgetBatchItem:
      description: Each entry updates an existing item; use POST .../budget-items to add an item.
      allOf:
        - $ref: "#/components/schemas/PatchBudgetItem"
        - type: object
          required: [budgetItemId]
          properties:
            budgetItemId:
              type: string
              format: uuid

    BudgetItem:
      type: object
      properties:
        budgetId:
          type: string
          format: uuid
          description: Present on GET/POST single budget item responses
        budgetItemId:
          type: string
        creditsTotal:
          type: string
        creditsUsed:
          type: string
        costToCreditRatio:
          type: string
        expiresAt:
          type: string
          nullable: true
        startsAt:
          type: string
          nullable: true
        resetsAt:
          type: string
          nullable: true
        resetInterval:
          type: string
          nullable: true
        label:
          type: string
          nullable: true
          description: Optional free-form label
        deletedAt:
          type: string
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string

    PostBudgetRequest:
      type: object
      required: [productKey]
      properties:
        productKey:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/BudgetItemInput"

    Budget:
      type: object
      properties:
        budgetId:
          type: string
        productKey:
          type: string
        creditsTotal:
          type: string
        creditsPending:
          type: string
        creditsUsed:
          type: string
        deletedAt:
          type: string
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/BudgetItem"

    BudgetSession:
      type: object
      properties:
        budgetId:
          type: string
        sessionId:
          type: string
        costTotal:
          description: JSON number
        sessionItems:
          type: array
          items:
            type: object
            properties:
              cost:
                description: USD amount (JSON string or number in responses)
                oneOf:
                  - type: string
                  - type: number
              callRequestId:
                type: string
        reconciledAt:
          type: string
          nullable: true
        metadata:
          type: object
          nullable: true
          additionalProperties: true
          description: Opaque JSON when present
        createdAt:
          type: string
        updatedAt:
          type: string

    ReportAggregateResponse:
      type: object
      required: [from, to, budgetCostTotal, productCostTotal, reportLineCount]
      properties:
        productKey:
          type: string
          description: Echo of query; empty when the request did not set `productKey`
        label:
          type: string
          description: Echo of query; empty when the request did not set `label`
        from:
          type: string
          description: Effective window start (UTC, RFC3339 nanoseconds)
        to:
          type: string
          description: Effective window end (UTC), exclusive in the query
        budgetCostTotal:
          description: |
            Non-negative total; this API encodes the value as a JSON number. `oneOf` string/number matches other money fields in this spec; for this response expect a number.
          oneOf:
            - type: string
            - type: number
        productCostTotal:
          description: |
            Non-negative total; this API encodes the value as a JSON number. `oneOf` string/number matches other money fields in this spec; for this response expect a number.
          oneOf:
            - type: string
            - type: number
        reportLineCount:
          type: integer
          description: Count of matching `budget_session_report_items` rows
          minimum: 0

    ReportListResponse:
      type: object
      required: [reports, total, limit, offset, hasMore]
      properties:
        reports:
          type: array
          description: Summary rows; not the full SessionReport from single-report GET
          items:
            $ref: "#/components/schemas/SessionReportListItem"
        total:
          type: integer
          description: Count matching the filters, before limit/offset
          minimum: 0
        limit:
          type: integer
          description: Page size applied
          minimum: 1
          maximum: 500
        offset:
          type: integer
          description: Skipped rows
          minimum: 0
        hasMore:
          type: boolean
          description: True when more rows exist after this page (offset + len(reports) < total)

    SessionReportListItem:
      type: object
      required: [reportId, sessionId, budgetId, productKey, createdAt]
      description: List entry; use GET .../sessions/{sessionId}/reports/{reportId} for full report
      properties:
        reportId:
          type: string
        sessionId:
          type: string
        budgetId:
          type: string
        productKey:
          type: string
          description: Empty string when the budget has no product_key
        createdAt:
          type: string
          description: RFC3339 (nanosecond precision in responses)

    SessionReport:
      type: object
      description: Report shape matches GET after POST. Includes sessionCallRequestIds (all callRequestId values from PATCH spend for the session, id order).
      additionalProperties: true
      properties:
        sessionCallRequestIds:
          type: array
          description: callRequestId from each row in budget_session_items for this session, in id order
          items:
            type: string
