events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging - send all logs to stdout/stderr for docker logs
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;
    error_log /dev/stderr;

    # Basic settings for stability
    sendfile on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # Upstream server
    upstream openai_api {
        server caas-gocode-prod.caas-prod.prod.onkatana.net:443;
        keepalive 32;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # FIXME : temp measure to test proxy, move to lua based auth check
    # Map to check if Authorization header contains valid gd-* token
    map $http_authorization $valid_gd_token {
        default 0;
        ~^Bearer\s+gd-.+ 1;
    }

    server {
        listen 8888 ssl;
        http2 on;
        server_name _;

        # SSL Configuration
        ssl_certificate /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Proxy only /v1/ API requests
        location /v1/ {
            # Check if valid gd-* token is present
            if ($valid_gd_token = 0) {
                add_header Content-Type application/json;
                return 401 '{"error": {"message": "access denied", "type": "invalid_request_error"}}';
            }

            proxy_pass https://openai_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Remove any existing authorization header from client
            proxy_set_header Authorization "";
            
            # Set the API key from environment variable
            # This will be replaced by envsubst in the Docker container
            proxy_set_header Authorization "Bearer ${API_SECRET}";
            
            # Standard proxy headers
            proxy_set_header Host caas-gocode-prod.caas-prod.prod.onkatana.net;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket specific settings
            proxy_set_header Origin "";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 60s;
            
            # Disable buffering for real-time communication
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            
            # Keep-alive settings
            proxy_socket_keepalive on;
            
            # SSL settings for upstream
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
        }

        # Reject all other requests
        location / {
            return 404 "Not Found";
        }
    }
}
