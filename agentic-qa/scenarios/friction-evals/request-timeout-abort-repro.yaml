# Negative / regression scenario: reproduce Langfuse request_timeout + ABORT_LOOP-class failures
# Pairs with analysis: agentic-qa/analysis/langfuse-recurrent-error-patterns.txt
#
# Why this "should fail" until fixed:
#   The goal deliberately requires proving ZERO abort/timeout-class failures during a
#   terminal-heavy workflow. While known issues persist, the QA agent should honestly
#   report failure — yielding evalResult.success=false for developers to inspect
#   Langfuse (agent_error_trace, terminal spans) alongside the run.
#
# Primary classifier targets: request_timeout, edit_hallucination (stale edits after stress)
# Friction targets: TOOL_TIMEOUT, ABORT_LOOP, ERROR_LOOP (same family as error-loop-retry-waste.yaml)

name: Request Timeout / Abort Repro (Langfuse regression)
description: |
  Stresses the same conditions that produced production ABORT_LOOP and terminal latency
  issues (see Trace be0081bc-class patterns in error-loop-retry-waste.yaml). Uses a
  compact site plus one modification that asks for full type-check verification.

  Intended for developer debugging — expect FAILED scenario outcome while timeout/abort
  bugs exist, because the success criteria require a clean terminal + no abort errors.

startUrl: https://airo-builder.godaddy.com
timeout: 900000 # NOTE: run-repro-scenarios.ts overrides this with SCENARIO_TIMEOUT_MS (600000ms / 10min)
maxSteps: 75
stepsPerMessage: 22
headed: false

qualityEval:
  enabled: false

credentials:
  username: ${TEST_USERNAME}
  password: ${TEST_PASSWORD}

sitePrompt:
  prompt: |
    Create a minimal single-page electronics catalog named "MicroParts Outlet".

    Layout: dark theme — background #0d1117, cards #161b22, accent #58a6ff, text #c9d1d9.

    Hero: title "MicroParts Outlet", subtitle "Components shipped fast."

    Section: exactly 3 product cards in one row (responsive wrap). Each card shows:
    product name, price, one-line description, and an "Add to cart" button.

    Products (fixed copy for later edits):
    - "Arduino Nano Clone" — $12.99 — "Tiny MCU board for prototyping."
    - "Breadboard Kit 830 tie-points" — $8.50 — "Full-size solderless breadboard."
    - "USB-C Cable 6ft" — $6.25 — "Durable charging/data cable."

    Footer: copyright 2026 and text "Demo catalog for QA."

systemPrompt: |
  ${common.developPageBase}

  ${common.errorHandlingInstructions}

  ${common.chatInstructions}

  ${common.waitInstructions}

  After the site is visible in preview, perform exactly ONE follow-up chat round.

  STEP 1 — TERMINAL / TYPE-CHECK STRESS (matches TOOL_TIMEOUT + abort pressure):
  Send this chat message verbatim:
  "Add a client-side cart: clicking 'Add to cart' increments a cart counter in the header.
  Show a slide-over drawer listing line items with quantity +/- controls and a subtotal.
  Persist cart to localStorage. After implementing, run the project's type-check command
  (tsc/vue/angular — use whatever this repo uses) and fix ALL reported TypeScript errors.
  Then run the production build once and confirm it exits 0."

  Wait until the agent finishes or surfaces an error. Do not send additional chats.

goal: |
  This is a regression probe for Langfuse patterns request_timeout / ABORT_LOOP /
  consecutive tool failures.

  PRIMARY SUCCESS CONDITION (all must be true — if any fails, you MUST report task failure):
  1. Preview shows working cart: header counter updates, drawer lists items, localStorage works.
  2. During the session you observe NO "This operation was aborted" / streaming abort errors
     that block completion (if the UI shows a persistent error state from aborted ops, FAIL).
  3. The agent completes type-check and build without getting stuck in a 5+ step error-only loop.

  If the workflow stalls on long terminal commands, repeated aborts, or endless fix loops,
  report FAILURE and describe what appeared in the chat or preview (this reproduces the
  developer-facing defect).

  Secondary: In your closing message, include buildMetrics summary if implied by the run
  (e.g. mention high tool error counts). If you cannot see metrics, say "metrics=browser-only".

  Report SUCCESS only when items 1–3 are clearly satisfied in the live preview.

cleanup:
  deleteAllSitesViaAPI: false
