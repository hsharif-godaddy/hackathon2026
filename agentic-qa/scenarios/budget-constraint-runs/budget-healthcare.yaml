  - "Build a complete Provider Directory page. Show all 18 providers in a filterable grid. Each provider card has: circular photo placeholder with initials, full name with credentials (MD, DO, NP, PA-C, PhD, LCSW), specialty, years of experience, a 2-sentence bio, languages spoken, 'Accepting New Patients' badge (green) or 'Waitlist Only' badge (yellow), star rating, and 'Book Appointment' button. The 18 providers: FAMILY MEDICINE: 1) Dr. Sarah Chen, MD — Board-certified family physician, 15 years experience. Special interests in preventive care and chronic disease management. Languages: English, Mandarin. Accepting new patients. 2) Dr. James Rodriguez, DO — Osteopathic family medicine, 12 years. Focus on sports medicine and musculoskeletal care. Languages: English, Spanish. Accepting. 3) Maria Gonzalez, NP — Family nurse practitioner, 8 years. Specializes in women's health and diabetes management. Languages: English, Spanish. Accepting. INTERNAL MEDICINE: 4) Dr. Amir Patel, MD — Internist, 20 years. Special interests in cardiology risk assessment and geriatric care. Languages: English, Hindi, Gujarati. Waitlist only. 5) Dr. Lisa Thornton, MD — Internist, 10 years. Focus on thyroid disorders and autoimmune conditions. Languages: English. Accepting. 6) Robert Kim, PA-C — Physician assistant, 6 years. Expertise in hospital follow-up care and medication management. Languages: English, Korean. Accepting. PEDIATRICS: 7) Dr. Emily Watson, MD — Pediatrician, 18 years. Focus on developmental pediatrics and ADHD management. Languages: English. Accepting. 8) Dr. Marcus Johnson, MD — Pediatrician, 9 years. Special interest in pediatric asthma and allergies. Languages: English. Accepting. 9) Jennifer Park, NP — Pediatric nurse practitioner, 7 years. Well-child visits and adolescent health. Languages: English, Korean. Accepting. OB/GYN: 10) Dr. Rachel Abrams, MD — OB/GYN, 22 years. High-risk pregnancies and minimally invasive surgery. Languages: English, Hebrew. Waitlist only. 11) Dr. Priya Sharma, MD — OB/GYN, 11 years. Focus on fertility, PCOS, and menopause management. Languages: English, Hindi. Accepting. 12) Stephanie Miller, CNM — Certified nurse midwife, 14 years. Natural birth, prenatal yoga, lactation support. Languages: English. Accepting. DERMATOLOGY: 13) Dr. Michael Torres, MD — Dermatologist, 16 years. Skin cancer screening, cosmetic dermatology, psoriasis. Languages: English, Spanish. Waitlist only. 14) Dr. Hannah Lee, MD — Dermatologist, 7 years. Acne, eczema, and dermatologic surgery. Languages: English, Korean. Accepting. 15) Ashley Brown, PA-C — Dermatology PA, 5 years. General dermatology and cosmetic procedures. Languages: English. Accepting. BEHAVIORAL HEALTH: 16) Dr. David Okafor, PhD — Clinical psychologist, 13 years. CBT, trauma therapy, and executive coaching. Languages: English. Accepting. 17) Dr. Nina Vasquez, MD — Psychiatrist, 19 years. Medication management, treatment-resistant depression, anxiety disorders. Languages: English, Spanish. Waitlist only. 18) Amanda Foster, LCSW — Licensed clinical social worker, 10 years. Family therapy, adolescent counseling, grief support. Languages: English. Accepting. Add filter controls: specialty dropdown, 'Accepting new patients' toggle, language dropdown, and a search input for provider name. Add a 'Compare Providers' feature: checkboxes on each card to select up to 3, then a 'Compare' button that opens a side-by-side comparison table."

  - "Build a comprehensive Appointment Booking system as a multi-step wizard. Step 1 — Select Visit Type: 6 cards for visit types — New Patient Visit (60 min), Follow-Up Visit (30 min), Annual Physical/Wellness Exam (45 min), Sick Visit/Urgent (20 min), Telehealth Video Visit (20 min), Specialist Consultation (45 min). Each card shows: icon, visit type name, duration, brief description. For new patients, show a notice: 'New patients please arrive 15 minutes early with completed forms.' Step 2 — Choose Specialty & Provider: specialty dropdown that filters the provider list. Show available providers as cards with name, credentials, photo placeholder, next available date, and patient rating. Allow selecting 'First Available' for fastest appointment. Step 3 — Select Date & Time: calendar widget showing the current month with available dates highlighted in teal. Unavailable dates grayed out. Weekend slots only available for Saturday morning. When a date is selected, show available time slots in 30-minute increments grouped as: Morning (7:00-11:30), Afternoon (12:00-3:30), Evening (4:00-6:00). Each slot shows the time and remaining availability ('3 slots left'). Gray out past and full slots. Step 4 — Patient Information: two sub-paths — 'Existing Patient' (date of birth + last name lookup) or 'New Patient' (full registration form: first name, last name, date of birth, gender dropdown, email, phone, preferred contact method radio, address fields, emergency contact name + phone + relationship, primary insurance carrier dropdown with 15 options including Aetna/BlueCross/Cigna/UnitedHealthcare/Humana/Medicare/Medicaid/Self-Pay/Other, insurance member ID, group number, subscriber name if different, secondary insurance toggle). Step 5 — Confirmation: summary showing visit type, provider name + credentials, date + time, location address, and pre-visit instructions based on visit type (e.g., 'Fast for 12 hours before labs' for physicals). Two buttons: 'Confirm Appointment' and 'Add to Calendar' (generates .ics download). Show cancellation policy: '24-hour notice required for cancellations.' Wire to 'appointments' database table with: patient_name, patient_email, patient_phone, provider_id, visit_type, appointment_date, appointment_time, insurance_carrier, insurance_member_id, status defaulting to 'confirmed', special_instructions, and created_at."

  - "Build a Patient Portal login and dashboard system. Add a 'Patient Portal' button in the navigation. The portal login page has: heading 'Secure Patient Portal', email input, password input, 'Remember this device' checkbox, 'Sign In' button, 'Forgot Password?' link, 'First time? Create your account' link, and a security notice 'This portal is encrypted and HIPAA-compliant. Never share your login credentials.' On successful mock login (accept email ending in @patient.evergreenmed.com with password 'demo123'), show the patient dashboard with: Welcome banner 'Good morning, Jennifer' with today's date. Top row — 4 action cards: 'Book Appointment' (link to booking), 'Message Your Provider' (link to messaging), 'Request Rx Refill' (link to refills), 'Pay a Bill' (link to billing). Section 'Upcoming Appointments': table showing 2 upcoming appointments with provider name, specialty, date, time, visit type, location, and action buttons ('Reschedule', 'Cancel', 'Pre-Visit Check-In'). Section 'Recent Messages': 3 message previews showing sender (provider name + credentials), subject, preview text, date, and read/unread indicator. Section 'Medications': table with 5 current medications: medication name, dosage, frequency, prescribing provider, last filled date, refills remaining, and 'Request Refill' button (disabled if 0 refills with 'Contact provider' note). Medications: 1) Lisinopril 10mg - Once daily - Dr. Patel - 2 refills. 2) Metformin 500mg - Twice daily - Dr. Chen - 0 refills. 3) Levothyroxine 75mcg - Once daily morning - Dr. Thornton - 5 refills. 4) Sertraline 50mg - Once daily - Dr. Vasquez - 3 refills. 5) Tretinoin Cream 0.025% - Once daily evening - Dr. Torres - 1 refill. Section 'Health Summary': expandable cards for Allergies (Penicillin - severe, Sulfa drugs - moderate, Latex - mild), Active Conditions (Type 2 Diabetes, Hypertension, Hypothyroidism), Immunizations (last flu shot date, COVID boosters, Tdap). Add a 'Log Out' button and session timeout warning after 15 minutes of inactivity. Store login attempts in 'portal_logins' database table."

  - "Build a comprehensive Insurance & Billing page. Section 1 'Accepted Insurance': show a grid of 20 insurance plan logos/names organized in 4 columns. The insurers: Aetna, Anthem Blue Cross, Blue Cross Blue Shield, Cigna, Humana, UnitedHealthcare, Medicare, Medicaid (Texas), Tricare, Ambetter, Molina Healthcare, Oscar Health, Scott & White Health Plan, Baylor Scott & White, Community Health Choice, Superior HealthPlan, Sendero Health Plans, FirstCare Health Plans, Self-Pay, and Workers' Compensation. Each card shows the insurer name and a checkmark icon. Add a note: 'Insurance coverage varies by plan. Please contact us at 512-555-0180 to verify your specific plan is accepted before scheduling.' Section 2 'Understanding Your Bill': 4 expandable accordion sections explaining — 'What to Expect After Your Visit' (explanation of how claims are processed, typical timeline of 2-6 weeks), 'Reading Your Statement' (annotated diagram placeholder showing parts of a medical bill: provider charges, insurance adjustments, insurance payment, patient responsibility, account balance), 'Common Billing Terms' (definitions for: Copay, Coinsurance, Deductible, Out-of-Pocket Maximum, Allowed Amount, EOB, Prior Authorization, Balance Billing — each with a clear plain-language explanation), 'Financial Assistance' (description of sliding fee scale based on Federal Poverty Level, information about payment plans, and charity care application process). Section 3 'Pay Your Bill Online': a form with patient name, date of birth, account number, payment amount input (with 'Pay Full Balance' and 'Pay Other Amount' radio options), credit card number, expiration, CVV, billing zip code, and 'Make Payment' button. Show accepted payment methods: Visa, Mastercard, Amex, Discover, HSA/FSA cards. Add a note about automatic payment plans: 'For balances over $500, interest-free payment plans of 3, 6, or 12 months are available.' Section 4 'Contact Billing Department': separate contact card with billing-specific phone number (512-555-0185), billing email, hours (Mon-Fri 8am-5pm), and a billing inquiry form (name, account number, email, inquiry type dropdown: Statement Question/Payment Plan Request/Insurance Issue/Refund Request/Other, message). Wire payment attempts to 'billing_payments' database table and billing inquiries to 'billing_inquiries' table."

