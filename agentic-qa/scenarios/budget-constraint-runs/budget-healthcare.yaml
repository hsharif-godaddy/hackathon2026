Cancer (N/A / N/A / every 10yr colonoscopy / every 10yr), Mammogram (N/A / annually women / annually women / annually women), Pap Smear (every 3yr women / every 3yr / every 3yr / per provider), Prostate PSA (N/A / discuss with provider men / annually men / annually men), Skin Cancer (annually / annually / annually / annually), Vision (every 2yr / every 2yr / annually / annually), Hearing (per symptoms / per symptoms / every 3yr / annually), Bone Density (N/A / N/A / women at 50 / women every 2yr), Depression Screening (annually / annually / annually / annually), Lung Cancer CT (N/A / N/A / annually if smoking history / annually if history), Thyroid (per symptoms / every 5yr women / every 5yr / every 5yr), AAA Ultrasound (N/A / N/A / N/A / once for men who smoked). Color code cells: green for routine, yellow for conditional, gray for not applicable. Section 3 'Health Risk Assessment': an interactive questionnaire with 15 questions to assess health risks — age, gender, height/weight (auto-calculate BMI), smoking status, alcohol use, exercise frequency, family history checkboxes (Heart Disease, Diabetes, Cancer, Stroke, Mental Illness), current medications count, sleep hours, stress level slider, diet quality rating, existing conditions checkboxes, last physical exam date. Show a results summary: BMI calculation with category (Underweight/Normal/Overweight/Obese) and color indicator, identified risk factors as cards, recommended screenings based on answers, and a 'Schedule Your Screenings' CTA linking to appointment booking. Wire assessment to 'health_assessments' database table."

  - "Now do a complete accessibility and design polish pass across every page. Update the entire color system to ensure WCAG AAA compliance wherever possible and AA as minimum. New refined palette: primary deep teal #0F766E (passes AAA on white), secondary medical blue #2563EB (passes AA on white), accent warm terracotta #C2410C (passes AA on white), success #15803D, warning #A16207, error #B91C1C, background #FEFEFE, surfaces #FFFFFF with subtle #F1F5F9 alternating, text #0F172A, muted #475569 (passes AA on white). Apply across every page ensuring: all text has minimum 4.5:1 contrast ratio against its background, all interactive elements have visible focus rings (3px solid offset teal), all buttons have minimum 44x44px touch targets, all form inputs have associated visible labels (not just placeholders), all images/icons have descriptive alt text, all tables have proper th scope attributes and caption elements, all modals trap focus and are dismissable with Escape key, skip-to-content link as first focusable element on every page, all error messages are associated with form fields via aria-describedby, all expandable/accordion sections use proper aria-expanded attributes, all status badges have sr-only text alternatives (not just color), all time-based content has no auto-advancing without user control. Add a site-wide accessibility statement page covering: commitment statement, WCAG 2.1 AA conformance target, testing methodology (automated + manual + assistive technology), known limitations, feedback mechanism (email + phone for accessibility concerns), third-party content disclaimer, and last audit date. Update all navigation to support keyboard-only operation: arrow keys for menu items, Enter/Space to activate, Escape to close dropdowns. Add a visible 'Accessibility Settings' button in the footer that opens a panel with: text size controls (100%/125%/150%), high contrast mode toggle, reduce motion toggle, and dyslexia-friendly font toggle. Store preferences in localStorage."

qualityEval:
  enabled: true
  siteType: service-business
  thresholds:
    minOverallScore: 50
    minPerformance: 30
    minAccessibility: 60

cleanup:
  deleteAllSitesViaAPI: false
