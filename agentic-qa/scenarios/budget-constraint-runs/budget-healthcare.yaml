# Budget-based build scenario: healthcare platform with patient portal and compliance
name: Budget Build - Healthcare Platform
description: |
  Build a comprehensive healthcare clinic website and keep sending complex
  modifications until $5 of AI token spend. Exercises patient portals,
  appointment booking, provider directories, compliance features, and
  medical-grade UI patterns.

startUrl: https://airo-builder.godaddy.com
timeout: 2400000 # 40 minutes
maxSteps: 50
stepsPerMessage: 20
headed: false

credentials:
  username: ${TEST_USERNAME}
  password: ${TEST_PASSWORD}

tokenBudgetUSD: 5.00

sitePrompt:
  prompt: |
    I'm building the website for Evergreen Medical Group, a multi-specialty medical
    practice in Austin, Texas. We have 18 providers across Family Medicine, Internal
    Medicine, Pediatrics, OB/GYN, Dermatology, and Behavioral Health. We serve 12,000+
    active patients.

    Design: Clean, calming, trustworthy. Primary healing teal #0D9488, secondary soft
    blue #3B82F6, accent warm coral #F97316 for CTAs and urgency, background warm white
    #FEFDFB, card surfaces #FFFFFF, dark text #1E293B, muted #64748B. Typography: friendly
    but professional — rounded sans-serif headings (like Nunito), clean body text. Lots of
    whitespace, rounded corners on everything, soft shadows. Accessible color contrast
    ratios throughout.

    Hero: Welcoming photo placeholder with overlay, headline "Your Health, Our Priority"
    with subtext "Comprehensive care for the whole family since 2008." Three CTAs:
    "Book an Appointment" (primary coral), "Find a Provider" (outline), "Patient Portal"
    (outline). Below hero: 3 stat cards — "18 Providers", "6 Specialties",
    "12,000+ Patients Served".

    Navigation: Home, Services, Providers, Patients (dropdown: Book Appointment, Patient
    Portal, Insurance, Forms), About, Contact. Right side: phone number and "Book Now" button.

    Services overview grid with 6 specialty cards: Family Medicine, Internal Medicine,
    Pediatrics, OB/GYN, Dermatology, Behavioral Health. Each card: icon placeholder,
    specialty name, 2-sentence description, "Learn More" link.

    Testimonial section: 3 patient testimonials with star ratings, quote text,
    and patient first name + last initial.

    Footer: address (4200 Medical Parkway, Suite 300, Austin TX 78756), phone
    (512-555-0180), fax, email, office hours (Mon-Fri 7am-6pm, Sat 8am-12pm),
    emergency notice "For medical emergencies, call 911", social links, HIPAA
    notice, ADA compliance statement.

systemPrompt: |
  ${common.developPageBase}

  ${common.errorHandlingInstructions}

  ${common.chatInstructions}

  IMPORTANT - During site creation, Airo may ask clarifying questions with
  multiple-choice options. You MUST actively answer these questions by clicking
  on the most relevant option to continue the build process. Do NOT just wait.

goal: |
  The site is being created. During the build process, Airo may ask you
  clarifying questions with multiple-choice options (radio buttons). You must:

  1. If you see a question with options, click the most appropriate answer:
     - For goal questions, pick "Get appointments" or "Provide information"
     - For style questions, pick the most clean/professional/calming option
     - For any other question, pick the first relevant option
  2. After answering all questions, wait for the site to finish building
  3. The preview iframe should become visible with "Evergreen Medical Group" content

  Report success once the preview is loaded and showing the site content.
  Do NOT just wait passively - interact with any questions that appear.

