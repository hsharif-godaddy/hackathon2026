pens if my visit needs to become in-person?, How is my privacy protected during video visits?, Can I see a specialist via telehealth?, Do I need to download an app? Section 5 'Telehealth Consent': a consent form with patient name, date of birth, checkboxes for 4 consent items (I understand the visit will be conducted via video, I understand the limitations of telehealth, I consent to the provider accessing my medical records, I understand I may be asked to come in person if needed), digital signature input (text field for typed name as signature), date auto-filled, and 'Submit Consent' button. Wire to 'telehealth_consents' database table."

