life-threatening emergencies, call 911', nearest ER locations (St. David's Medical Center — 2.1 miles, Dell Seton Medical Center — 3.4 miles, Ascension Seton — 4.0 miles), Mental Health Crisis Line (988 Suicide & Crisis Lifeline), Poison Control (1-800-222-1222), and After-Hours Nurse Line (512-555-0199)."

