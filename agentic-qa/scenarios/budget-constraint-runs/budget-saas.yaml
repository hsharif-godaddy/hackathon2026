# Budget-based build scenario: SaaS product marketing site with complex features
name: Budget Build - SaaS Platform
description: |
  Build a B2B SaaS analytics platform website and keep sending complex
  modifications until $5 of AI token spend. Exercises dashboards, pricing
  tables, documentation, integrations, and enterprise features.

startUrl: https://airo-builder.godaddy.com
timeout: 2400000 # 40 minutes
maxSteps: 50
stepsPerMessage: 20
headed: false

credentials:
  username: ${TEST_USERNAME}
  password: ${TEST_PASSWORD}

tokenBudgetUSD: 5.00

sitePrompt:
  prompt: |
    I'm building the marketing site for Nexus Analytics, a B2B SaaS platform that
    provides real-time business intelligence and predictive analytics for mid-market
    companies. Based in San Francisco.

    Design: Modern, clean, tech-forward. Primary electric indigo #4F46E5, secondary
    cool slate #475569, accent emerald #10B981 for success/positive states, warning
    amber #F59E0B, background snow white #FAFBFC, dark mode navy #0F172A for contrast
    sections. Typography: geometric sans-serif headings (like Inter or Satoshi), monospace
    accents for data/metrics, clean body text.

    Hero: Split layout — left side has headline "Turn Data Into Decisions in Real Time",
    subtext about AI-powered analytics, two CTAs "Start Free Trial" (primary) and
    "Watch Demo" (outline with play icon), plus 3 social proof stats: "2,400+ Companies",
    "99.9% Uptime", "$2.1B Data Processed Daily". Right side: a polished dashboard
    screenshot placeholder showing a chart and metric cards.

    Navigation: Product (dropdown), Solutions, Pricing, Resources, Company. Right side:
    "Log In" text link and "Start Free Trial" button.

    Trusted By section: logo row of 8 company logos (placeholder rectangles with names:
    Stripe, Notion, Linear, Vercel, Figma, Loom, Retool, Webflow).

    Features grid with 6 feature cards: Real-Time Dashboards, Predictive Analytics,
    Custom Reports, Team Collaboration, API & Integrations, Enterprise Security.
    Each card: icon placeholder, title, 2-sentence description.

    Testimonial: Quote from "Sarah Lin, VP of Analytics at Notion" — "Nexus replaced
    3 tools and gave us insights we never knew we were missing."

    Footer: Product links, Company links, Resources links, Legal links, SOC2 and GDPR
    badges, newsletter signup.

systemPrompt: |
  ${common.developPageBase}

  ${common.errorHandlingInstructions}

  ${common.chatInstructions}

  IMPORTANT - During site creation, Airo may ask clarifying questions with
  multiple-choice options. You MUST actively answer these questions by clicking
  on the most relevant option to continue the build process. Do NOT just wait.

goal: |
  The site is being created. During the build process, Airo may ask you
  clarifying questions with multiple-choice options (radio buttons). You must:

  1. If you see a question with options, click the most appropriate answer:
     - For goal questions, pick "Generate leads" or "Get signups"
     - For style questions, pick the most modern/tech/clean option
     - For any other question, pick the first relevant option
  2. After answering all questions, wait for the site to finish building
  3. The preview iframe should become visible with "Nexus Analytics" content

  Report success once the preview is loaded and showing the site content.
  Do NOT just wait passively - interact with any questions that appear.

chatMessages:
  - "Build a comprehensive interactive Pricing page with 3 tiers and a toggle. At the top: heading 'Simple, Transparent Pricing' with subtext 'Start free. Scale as you grow. No surprises.' Add a Monthly/Annual toggle switch (annual shows 20% discount with a 'Save 20%' badge). Three pricing columns: 1) Starter (Free forever): Up to 5 users, 3 dashboards, 10K events/month, 7-day data retention, community support, basic integrations (5), email reports (weekly), single workspace. CTA: 'Get Started Free'. 2) Pro ($79/mo or $63/mo annual per user): Unlimited dashboards, 1M events/month, 12-month data retention, priority email support (< 4hr response), 50+ integrations, custom reports, real-time alerts, 10 workspaces, API access (10K calls/day), SSO (Google/Okta), data export (CSV/PDF), custom branding, role-based permissions. CTA: 'Start 14-Day Free Trial' with 'Most Popular' badge. 3) Enterprise (Custom): Unlimited everything, unlimited data retention, dedicated success manager, phone + Slack support (< 1hr response), 200+ integrations, custom ML models, SLA guarantee (99.99%), custom data residency, SOC2/HIPAA/GDPR compliance, on-premise deployment option, custom contracts, training and onboarding. CTA: 'Contact Sales'. Below the tiers: a full feature comparison table with 30+ rows grouped into sections (Core Analytics, Collaboration, Security, Support, Integrations) with checkmarks, X marks, and specific values. Below that: FAQ accordion with 8 pricing questions (Can I switch plans?, What happens when I exceed limits?, Is there a startup discount?, Do you offer nonprofit pricing?, What payment methods?, Can I cancel anytime?, What's included in the free trial?, How does per-user pricing work?)."

  - "Build a comprehensive Product page with 4 tabbed feature sections, each with detailed content and interactive demos. Tab 1 'Real-Time Dashboards': hero mockup showing a dashboard with 6 metric cards (MRR, ARR, Churn Rate, NPS, CAC, LTV) each with sparkline trend, a line chart showing revenue over 12 months, and a donut chart showing customer segments. Below the mockup: 3-column feature breakdown — Drag & Drop Builder (build dashboards without code, 50+ chart types, custom date ranges), Live Data Streaming (sub-second latency, WebSocket connections, auto-refresh configurable), Sharing & Embedding (public/private links, embed in Notion/Confluence, scheduled PDF delivery). Tab 2 'Predictive Analytics': hero mockup showing a prediction confidence chart and anomaly detection alerts. Features: Revenue Forecasting (ML-powered 12-month projections, scenario modeling, confidence intervals), Churn Prediction (risk scoring for every customer, early warning triggers, recommended retention actions), Anomaly Detection (automatic baseline learning, real-time alerting, root cause analysis). Tab 3 'Integrations': show a grid of 24 integration cards organized in 4 rows (Data Sources: PostgreSQL, MySQL, Snowflake, BigQuery, Redshift, MongoDB; CRMs: Salesforce, HubSpot, Pipedrive; Communication: Slack, Teams, Discord; Payment: Stripe, Chargebee, Recurly; Marketing: Google Analytics, Mixpanel, Amplitude; Dev Tools: GitHub, Jira, Linear). Each card: icon placeholder, name, category badge, 'Connect' button. Below: 'Build Custom Integrations' section with REST API and Webhook documentation preview and a 'View API Docs' link. Tab 4 'Security & Compliance': show compliance badges in a row (SOC2 Type II, GDPR, HIPAA, ISO 27001, CCPA), then detailed cards for: Data Encryption (AES-256 at rest, TLS 1.3 in transit, customer-managed keys option), Access Control (SSO/SAML, MFA, role-based permissions, IP allowlisting, audit logs), Infrastructure (AWS/GCP multi-region, 99.99% uptime SLA, automated backups, disaster recovery), Privacy (data residency options, DPA available, right to deletion, data portability)."

  - "Build a complete Solutions page with 4 industry-specific solution sections. Each solution is a full page section with alternating layouts (image left/text right, then text left/image right). Solution 1 'SaaS & Subscription Businesses': dashboard mockup placeholder on left, content on right — heading 'Built for Subscription Metrics', 3-paragraph explanation of how Nexus tracks MRR, cohort analysis, and expansion revenue. Feature list: MRR/ARR tracking with net revenue retention, Cohort analysis with configurable dimensions, Expansion and contraction revenue attribution, Trial-to-paid conversion funnels with 12-step breakdown, Customer health scoring with 15 configurable signals, Pricing experimentation with A/B test support. Customer quote from 'Mike Chen, CEO at CloudSync ($15M ARR)' — 'We switched from ChartMogul and the depth of cohort analysis alone justified the move.' CTA: 'See SaaS Demo'. Solution 2 'E-Commerce & DTC': content on left, mockup on right — heading 'Optimize Every Step of the Customer Journey'. Features: GMV and AOV tracking with attribution, Product performance heatmaps with inventory alerts, Cart abandonment analysis with automated recovery triggers, Customer lifetime value prediction by acquisition channel, Marketing spend optimization with ROAS by channel, Inventory forecasting using ML demand signals. Quote from 'Jessica Park, Head of Growth at ThreadCo' — 'Nexus helped us identify that our best customers came from Instagram Reels, not paid search.' Solution 3 'FinTech & Financial Services': heading 'Enterprise-Grade Analytics for Regulated Industries'. Features: Real-time transaction monitoring with fraud scoring, Regulatory compliance dashboards (SOX, PCI-DSS), Risk modeling with Monte Carlo simulations, Portfolio performance attribution across 20+ asset classes, AML pattern detection with configurable thresholds, Custom reporting for board and regulator submissions. Quote from 'David Okafor, CTO at PayRight' — 'The compliance dashboards alone save our team 40 hours per month in manual reporting.' Solution 4 'Healthcare & Life Sciences': heading 'HIPAA-Compliant Analytics Built for Healthcare'. Features: Patient outcome tracking with cohort comparison, Clinical trial dashboard with enrollment velocity metrics, Revenue cycle management with denial prediction, Population health analytics with risk stratification, PHI-safe data sharing with de-identification, Integration with Epic, Cerner, and Athenahealth EHRs. Quote from 'Dr. Nina Vasquez, COO at MediCore' — 'Finally, an analytics platform that understands both our data needs and our compliance requirements.'"

  - "Build a full Developer Documentation center. Create a 'Docs' page accessible from the Resources dropdown. Left sidebar navigation with expandable sections: Getting Started (Quick Start, Installation, Authentication, First API Call), Core Concepts (Data Sources, Metrics, Dimensions, Filters, Segments), API Reference (REST API, GraphQL API, Webhooks, Rate Limits), SDKs (JavaScript, Python, Ruby, Go), Guides (Building Custom Dashboards, Setting Up Alerts, Creating Custom Metrics, Data Modeling Best Practices, Migration from Competitors), Changelog. Main content area for each section. Build out the 'Quick Start' page fully: Step 1 'Create Your Account' — code block showing curl command to create account via API. Step 2 'Install the SDK' — tabbed code blocks for npm/pip/gem/go install commands. Step 3 'Connect Your First Data Source' — code block showing JavaScript SDK initialization with API key and data source configuration. Step 4 'Query Your Data' — code block showing a sample analytics query with filtering and grouping. Step 5 'Build a Dashboard' — code block showing dashboard creation via API with widget configuration. Each code block should be styled with syntax highlighting (dark background, colored text), a copy button, and language tabs where applicable. Add a 'Was this helpful?' feedback widget at the bottom with thumbs up/down. Build the 'REST API' reference page with: Base URL display, Authentication section (API key in header example), 3 full endpoint documentation blocks — GET /v1/metrics (list metrics, query params: workspace_id, date_range, granularity; example response JSON), POST /v1/queries (run analytics query, request body with dimensions, metrics, filters, limit; example response), POST /v1/dashboards (create dashboard, request body with name, widgets array, sharing settings; example response). Each endpoint shows: method badge (GET green, POST blue), path, description, parameter table with name/type/required/description columns, example request (curl + SDK), and example response (formatted JSON). Add search bar at top of docs with keyboard shortcut hint (Cmd+K)."

  - "Build a full Changelog page accessible from the Resources dropdown. Show a timeline-style layout with version releases. Each entry has: version number (semver), release date, category badges (Feature/Improvement/Fix/Breaking Change — color-coded green/blue/yellow/red), and detailed content. Include 8 releases: 1) v3.2.0 - Feb 2025 - Features: New predictive churn model with 94% accuracy (up from 87%), Slack integration now supports thread-based alerts, Added 12 new chart types including waterfall and funnel. Improvements: Dashboard load time reduced by 40% through query optimization, CSV export now supports up to 10M rows. Fixes: Fixed timezone handling in weekly aggregation for APAC regions, Resolved SSO logout redirect issue for Okta customers. 2) v3.1.0 - Jan 2025 - Features: GraphQL API beta launch, Custom metric builder with formula editor supporting 30+ functions, New 'Insights' tab with AI-generated recommendations. Improvements: Reduced memory footprint for embedded dashboards by 60%, Added bulk user management API. 3) v3.0.0 - Dec 2024 - BREAKING: API v2 endpoints deprecated (6-month migration window), New dashboard JSON schema (migration tool provided). Features: Complete UI redesign with dark mode, Real-time collaboration on dashboards (Google Docs-style cursors), Workspace-level permissions with inherited roles. 4-8) Generate 5 more releases going back to Jul 2024, each with 2-3 features, 2 improvements, and 1-2 fixes, covering topics like new integrations, performance improvements, security enhancements, mobile support, and data pipeline features. Add a 'Subscribe to Updates' email form and an RSS feed icon link. Add category filter pills at the top to filter by Feature/Improvement/Fix/Breaking Change."

  - "Build a full ROI Calculator for the SaaS platform. Create an interactive tool at '/roi-calculator'. Header: 'Calculate Your Analytics ROI' with subtext 'See how Nexus Analytics pays for itself.' Step 1 — Your Current Stack: checkboxes to select current tools (Google Analytics, Mixpanel, Amplitude, Looker, Tableau, Metabase, Mode, Custom/In-house, Other with text input). Show estimated annual cost for each selected tool as you check them. Running total 'Current Annual Spend: $X'. Step 2 — Your Team: number of analysts (slider 1-50), number of dashboard viewers (slider 5-500), hours per week spent on manual reporting (slider 1-40), hours per week spent waiting for queries (slider 0-20), average analyst salary (dropdown: $80K/$100K/$120K/$140K/$160K). Step 3 — Your Data: number of data sources (slider 1-50), monthly event volume (dropdown: <100K/100K-1M/1M-10M/10M-100M/100M+), data freshness requirement (dropdown: Real-time/Hourly/Daily). Step 4 — Results Dashboard: animated count-up numbers revealing: Recommended Nexus Plan and monthly cost, Annual Tool Cost Savings (current stack cost minus Nexus cost), Annual Time Savings in hours (calculated from manual reporting and query wait times), Dollar Value of Time Saved (hours * (avg salary / 2080)), Total Annual ROI as a percentage, Payback Period in months. Show a side-by-side bar chart (CSS-based): 'Before Nexus' (tall bar showing total current costs + time costs) vs 'With Nexus' (shorter bar). Below results: 'Detailed Breakdown' expandable section with line-item savings table. Add 'Email My ROI Report' with name/email/company and 'Schedule a Demo' CTA pre-filled with calculator inputs. Wire email capture to 'roi_calculator_leads' database table."

  - "Build a complete Customer Stories page with 6 in-depth case studies. Each case study is a full section with: company logo placeholder, company name and industry badge, a key metric highlight bar showing 3 impressive numbers (e.g., '340% ROI', '40hrs/mo saved', '$2.1M revenue attributed'). Expandable content with: Background (company overview, team size, previous tools), Challenge (2-3 paragraphs describing specific pain points with quotes from the stakeholder), Solution (how they implemented Nexus, timeline, which features they use most), Results (detailed metrics in a 2x3 grid with before/after comparisons), Quote (large styled testimonial with photo placeholder and full attribution). The 6 companies: 1) CloudSync (B2B SaaS, 200 employees) — VP Analytics Sarah Kim — Challenge: 6 different analytics tools, no single source of truth, 20hrs/week building reports manually. Results: Consolidated to 1 tool, 85% reduction in report build time, discovered $400K in hidden churn signals. 2) ThreadCo (DTC E-Commerce, 50 employees) — Head of Growth Jessica Park — Challenge: Couldn't attribute revenue to marketing channels, CAC increasing 30% QoQ with no visibility into why. Results: Identified top 3 profitable channels, reduced CAC by 42%, increased ROAS by 180%. 3) PayRight (FinTech, 500 employees) — CTO David Okafor — Challenge: Regulatory reporting taking 2 full-time analysts, real-time fraud detection gaps. Results: Automated 90% of compliance reports, caught $1.2M in fraud in first quarter, reduced reporting headcount by 1.5 FTE. 4) MediCore (Healthcare, 1000 employees) — COO Dr. Nina Vasquez — Challenge: Clinical trial data scattered across 4 systems, enrollment forecasting inaccurate. Results: Unified patient data, enrollment forecasting accuracy improved from 62% to 91%, trial timelines shortened by average 3 months. 5) ScaleUp Ventures (VC Fund, 25 employees) — Managing Partner Alex Tran — Challenge: Portfolio company reporting inconsistent, board deck preparation taking 2 weeks per quarter. Results: Standardized KPI tracking across 40 portfolio companies, board decks auto-generated in 2 hours, identified 3 at-risk companies 6 months earlier. 6) NomadHQ (Remote Work Platform, 150 employees) — CEO/Founder Priya Mehta — Challenge: Couldn't measure feature adoption across 3M users, product decisions based on gut feel. Results: Built real-time feature adoption dashboard, A/B test velocity increased 4x, NPS improved from 38 to 67 in 6 months."

  - "Build a comprehensive Comparison page showing Nexus vs. competitors. Header: 'See How Nexus Compares' with subtext 'We believe in transparency. Here's how we stack up against alternatives.' Create a tabbed comparison interface with 4 tabs: 'vs. Mixpanel', 'vs. Amplitude', 'vs. Looker', 'vs. Tableau'. Each tab shows a detailed comparison table with 25+ rows grouped into sections. Section 'Pricing': starting price, per-user cost, free tier limits, hidden costs, total cost for 20-user team. Section 'Core Analytics': real-time analytics (speed comparison), custom metrics, funnel analysis, cohort analysis, retention analysis, attribution modeling, predictive analytics. Section 'Data': data sources supported (count), data freshness, data retention, query language, custom SQL support, raw data export, data warehouse connection. Section 'Collaboration': shared dashboards, real-time co-editing, commenting, scheduled reports, embedding, public links, API access. Section 'Enterprise': SSO/SAML, audit logs, role-based access, data residency, HIPAA compliance, SLA guarantee, dedicated support. Section 'Developer Experience': API quality, SDK languages, webhook support, documentation quality, CLI tool, Terraform provider. For each row, show the Nexus value in the first column (highlighted green when superior) and the competitor value in the second column (highlighted red when inferior, yellow when comparable). Below each comparison table: a summary card 'Why teams switch from [Competitor] to Nexus' with 3 bullet points specific to that competitor's weaknesses. Below all tabs: 'Don't just take our word for it' section with 3 G2/Capterra-style review quotes from verified users who switched. Add a final CTA: 'Try Nexus Free for 14 Days — No Credit Card Required' with email input and 'Start Free Trial' button."

  - "Build an advanced Status page and Trust Center. Create '/status' page. Top banner: current overall status with large colored dot (green 'All Systems Operational', yellow 'Degraded Performance', red 'Major Outage'). Below that: 8 service status rows, each with: service name, status indicator dot, current status text, and uptime percentage for last 90 days shown as a thin horizontal bar chart with colored segments (green for operational, yellow for degraded, red for outage). Services: Dashboard API (99.99%), Query Engine (99.98%), Data Ingestion Pipeline (99.97%), Real-Time Streaming (99.95%), Authentication Service (100%), Webhook Delivery (99.96%), Export Service (99.94%), Embed Service (99.99%). Below services: 'Incident History' section showing last 5 incidents in reverse chronological order. Each incident: date, severity badge (Minor/Major/Critical), title, timeline of updates (Investigating → Identified → Monitoring → Resolved) with timestamps. Mock incidents: 1) Feb 5 - Minor - 'Elevated Query Latency in US-East Region' - 45 min to resolve. 2) Jan 28 - Major - 'Dashboard API Intermittent 500 Errors' - 2 hours. 3) Jan 15 - Minor - 'Delayed Webhook Delivery' - 30 min. 4) Dec 20 - Critical - 'Data Ingestion Pipeline Outage' - 4 hours. 5) Dec 8 - Minor - 'Slow CSV Export for Large Datasets' - 1 hour. Add 'Subscribe to Updates' section with email input and notification preference checkboxes (Email, Slack webhook URL, SMS). Below the status page: Trust Center section with: Security Overview (encryption, access control, infrastructure), Compliance Certifications grid (SOC2 Type II certificate date, GDPR DPA download link, HIPAA BAA request form, ISO 27001 cert date, CCPA compliance statement, PCI-DSS for payment data), Penetration Test Summary (last test date, firm name, findings summary — 0 critical, 2 medium resolved, 4 low accepted), Bug Bounty Program link and scope, and Responsible Disclosure Policy."

  - "Now do a complete visual design overhaul across every page. Switch to a bold dark-mode-first design: background #0A0A0F, card surfaces #141420, elevated surfaces #1E1E2E, primary electric violet #7C3AED, secondary cyan #06B6D4, accent lime #84CC16, text white #F8FAFC, muted text #94A3B8, borders #2D2D3F. Apply throughout the entire site. Hero: dark gradient background from #0A0A0F to #141420 with animated gradient mesh (CSS gradient animation that slowly shifts colors), headline in white with a violet gradient text effect on key words, stats with cyan glow effect. Navigation: glassmorphism effect (backdrop-blur, semi-transparent background, subtle border), logo in violet-to-cyan gradient. All cards: dark surface with subtle border, violet glow on hover, smooth scale-up transition. Pricing cards: dark surface with the popular plan having a violet gradient border with a glow. Buttons: primary gets a violet-to-cyan gradient with white text and glow shadow on hover, secondary gets a transparent background with violet border. Code blocks in docs: deeper black background #050510 with cyan/lime syntax colors. Dashboard mockups: dark themed with violet/cyan/lime chart colors on dark backgrounds. Status indicators: use cyan for operational, amber for warning, red for outage — all with subtle glow effects. Add micro-animations: cards fade-up on scroll, metric numbers count up when they enter viewport, integration icons have a subtle float animation, the pricing toggle has a smooth slide with color transition. The overall feel should be like Linear meets Vercel's dark mode — premium, technical, and cutting-edge."

qualityEval:
  enabled: true
  siteType: service-business
  thresholds:
    minOverallScore: 50
    minPerformance: 30
    minAccessibility: 60

cleanup:
  deleteAllSitesViaAPI: false
