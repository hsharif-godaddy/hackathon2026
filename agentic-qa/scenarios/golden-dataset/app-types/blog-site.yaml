# Test creating a blog website with rich content and design specs
name: Create Blog Site
description: |
  Create a content-heavy tech blog with 8+ article previews,
  category sidebar, newsletter signup, and detailed author bio.

startUrl: https://airo-builder.godaddy.com
timeout: 480000  # 8 minutes
maxSteps: 80
headed: false

credentials:
  username: ${TEST_USERNAME}
  password: ${TEST_PASSWORD}

sitePrompt:
  prompt: |
    Starting a tech blog called Code & Coffee about web development, AI, and startup life. I am Maya Rodriguez, full-stack developer. Need a blog that developers actually want to read, like Dan Abramov's blog meets The Pragmatic Engineer.

    Design: Dark charcoal background with bright orange accent links and white text. Developer-friendly aesthetic with monospace code snippets. Use Inter for headings and system sans-serif for body. Blog post grid should be a single-column reading layout with a sticky sidebar on desktop. On mobile the sidebar collapses below posts. Featured post gets a full-width hero card at the top.

    Homepage layout: Featured post hero at top, then a grid of recent posts below, with a sidebar showing categories, popular posts, and newsletter signup.

    8 sample articles with previews (show title, date, category tag, reading time, and 2-3 sentence preview):

    1. "Why I Switched from React to Svelte (And What I Miss)" - Jan 15 2024 - Web Dev - 8 min read - "After 4 years of React, I moved my side project to Svelte. The DX improvement was immediate, but there are real tradeoffs around ecosystem maturity..."
    2. "Building RAG Applications with LangChain: A Practical Guide" - Jan 8 2024 - AI/ML - 12 min read - "RAG is everywhere right now, but most tutorials skip the hard parts. Here's how I built a production RAG system that actually handles messy real-world documents..."
    3. "My Side Project Journey from $0 to $10k MRR" - Dec 28 2023 - Startups - 15 min read - "It took 18 months, 3 pivots, and one near-burnout. Here's the honest timeline of building a profitable SaaS as a solo founder..."
    4. "PostgreSQL Tips That Saved Me Hours of Debugging" - Dec 15 2023 - Databases - 6 min read - "CTEs, window functions, and EXPLAIN ANALYZE became my best friends. These 7 PostgreSQL patterns will level up your query game..."
    5. "The Future of Edge Computing: What Developers Need to Know" - Dec 5 2023 - Infrastructure - 10 min read - "Edge functions are changing how we think about latency and data locality. I deployed the same app to Cloudflare Workers, Vercel Edge, and Deno Deploy..."
    6. "Design Patterns in TypeScript That Actually Matter" - Nov 22 2023 - Web Dev - 9 min read - "Forget the Gang of Four. Here are 5 patterns I use daily in production TypeScript codebases that solve real problems..."
    7. "How I Failed My First Technical Interview (and What I Learned)" - Nov 10 2023 - Career - 7 min read - "I bombed a FAANG interview so badly they ended it early. Two years later, I got offers from 3 of the Big 5. Here's what changed..."
    8. "Containerizing Everything: My Docker Compose Setup for Local Dev" - Oct 30 2023 - Infrastructure - 11 min read - "My local dev environment runs 8 services in Docker Compose. Here's the exact setup with PostgreSQL, Redis, MinIO, and hot reloading..."

    Sidebar content:
    - Categories with post counts: Web Dev (12), AI/ML (8), Startups (5), Career (4), Databases (3), Infrastructure (6), Tutorials (9)
    - Popular posts: top 3 by views
    - Tags cloud: React, TypeScript, Python, Docker, PostgreSQL, LangChain, Svelte, AWS, Vercel, Next.js

    About page: Maya Rodriguez, 5 years as a full-stack developer. Stanford CS grad 2019. Previously at Google (2 years on Chrome DevTools team) and now Senior Engineer at a YC-backed startup in SF. Passionate about developer experience and making complex topics accessible. Speaking at ReactConf 2024.

    Newsletter signup: "Join 5,000+ developers getting weekly insights on web dev, AI, and the startup grind" with email field and "Subscribe" button. Note: "No spam, unsubscribe anytime."

    Footer with Twitter @mayacodescoffee, GitHub @mayarodriguez, LinkedIn, RSS feed link. "Built with Next.js and MDX" badge. Copyright 2024 Code & Coffee.

systemPrompt: |
  ${common.developPageBase}

  ${common.errorHandlingInstructions}

goal: |
  1. Wait for site creation to complete
  2. Verify the preview contains:
     - "Code & Coffee" or "Code and Coffee" blog name
     - At least 6 article previews with titles, dates, and category tags
     - Category list or sidebar with multiple categories
     - Author name "Maya Rodriguez" somewhere on the site
     - Newsletter signup with email field
     - Reading time indicators on posts
     - About section or page with author bio
  3. Report success if at least 5 of the above elements are present

qualityEval:
  enabled: true
  siteType: blog
  thresholds:
    minOverallScore: 60
    minPerformance: 40
    minAccessibility: 70
