# Test creating a restaurant website
name: Create Restaurant Website
description: |
  Create a restaurant website with menu, location,
  and reservation capabilities.

startUrl: https://airo-builder.godaddy.com
timeout: 480000  # 8 minutes
maxSteps: 80
headed: false

credentials:
  username: ${TEST_USERNAME}
  password: ${TEST_PASSWORD}

sitePrompt:
  prompt: |
    My family owns Bella Cucina, an Italian restaurant in downtown Portland for 25 years. Need a website that makes people hungry.

    Big hero image of homemade pasta.

    Menu is crucial: Appetizers with Bruschetta $12, Caprese Salad $14, Calamari Fritti $16. Mains with Spaghetti Carbonara $22, Osso Buco $34, Chicken Parmigiana $26, Seafood Risotto $28. Desserts: Tiramisu $10, Panna Cotta $9, Cannoli $8.

    Hours: Tuesday-Sunday 5pm-10pm, closed Mondays.

    Address: 742 Pearl Street Portland OR 97205. Phone 503-555-0147.

    Need a reservation form with name, email, phone, date, time, party size.

    Warm colors burgundy cream and gold. Traditional Italian trattoria feel.

systemPrompt: |
  ${common.developPageBase}

  ${common.errorHandlingInstructions}

goal: |
  1. Wait for site creation to complete
  2. Verify the preview contains:
     - "Bella Cucina" restaurant name
     - Menu items with prices
     - Operating hours
     - Location or address information
  3. Report success if restaurant essentials are present


