# Test creating an event planning website with rich content and design specs
name: Create Event Planner Website
description: |
  Create a wedding/event planning website with detailed packages,
  venue partnerships, past event gallery, testimonials, and inquiry form.

startUrl: https://airo-builder.godaddy.com
timeout: 480000  # 8 minutes
maxSteps: 80
headed: false

credentials:
  username: ${TEST_USERNAME}
  password: ${TEST_PASSWORD}

sitePrompt:
  prompt: |
    Finally launching my dream business called Ever After Events! Been planning weddings for friends for years and now going legit. Based in Nashville but travel anywhere. Think romantic, luxurious, and modern.

    Design: Rose gold and blush pink color scheme with ivory white backgrounds and charcoal text. Romantic and luxurious like a high-end wedding magazine. Use a elegant serif font for headings and a light sans-serif for body. Package cards should be in a 3-column comparison layout on desktop. Gallery should be a masonry grid. Hero with a dreamy outdoor wedding setup photo and script text overlay.

    Hero: "Creating Unforgettable Moments" in elegant script with "Begin Your Journey" button and "View Our Work" secondary link.

    Services with detailed descriptions:
    - Weddings - From intimate elopements to grand 300+ guest celebrations. We handle venue selection, vendor coordination, timeline management, rehearsal dinner planning, and day-of logistics. Every detail matters.
    - Corporate Events - Holiday parties, product launches, team retreats, award galas, and conferences. Professional events that reflect your brand and impress your guests.
    - Social Events - Milestone birthdays (sweet 16, 30th, 50th), anniversaries, baby showers, engagement parties, graduation celebrations. Personal touches that make every gathering special.
    - Destination Events - We plan events worldwide. Popular destinations: Napa Valley, Tulum, Amalfi Coast, Santorini. We handle travel logistics, local vendor sourcing, and legal requirements.

    Detailed package comparison:
    - Day-Of Coordination ($1,500): Includes 8 hours on event day, vendor confirmation calls, timeline creation, ceremony rehearsal direction, setup and breakdown oversight. Best for: organized couples who planned everything but need someone to execute.
    - Partial Planning ($3,500): Everything in Day-Of plus 3 months of planning support, 5 vendor referrals, 2 venue visits, budget tracking, design consultation. Best for: couples who started planning but need professional guidance.
    - Full Service ($7,500+): Complete planning from engagement to reception. Unlimited vendor sourcing, contract negotiation, design and decor planning, guest management, RSVP tracking, seating arrangements, all logistics. Best for: busy couples who want to enjoy the process without the stress.
    - Luxury Experience ($15,000+): White-glove concierge service. Everything in Full Service plus welcome bags, guest travel coordination, multi-day event planning, after-party planning, honeymoon departure coordination, personal attendant for the couple. Best for: high-profile or destination weddings.

    Venue partnerships section:
    - The Cordelle - Downtown Nashville, industrial chic, capacity 300
    - Cedarwood Weddings - Outdoor estate, rustic elegance, capacity 250
    - The Bell Tower - Historic church venue, classic charm, capacity 200
    - Graystone Quarry - Dramatic cliff-side, modern luxury, capacity 400
    Note: "We have preferred relationships with 20+ venues in the Nashville area and can source venues nationwide."

    Past event gallery descriptions (6 events):
    - "The Henderson Wedding" - 200 guests, garden ceremony at Cedarwood, blush and gold palette, live string quartet
    - "TechStart Annual Gala" - 500 guests, The Cordelle, corporate elegance with tech-forward touches
    - "Sarah's Sweet 16" - 75 guests, rooftop venue, neon lights and modern glam theme
    - "The Martinez Anniversary" - 50 guests, intimate dinner party, vineyard setting, Tuscan inspiration
    - "Bloom Product Launch" - 150 guests, art gallery venue, minimalist and editorial style
    - "The Patel-Williams Wedding" - 350 guests, two-day multicultural celebration, vibrant colors

    Testimonials:
    - "Jessica made our wedding day absolutely perfect. Every detail was handled with such care." - The Hendersons, 200-guest garden wedding
    - "Our corporate gala was the talk of the company for months. Flawless execution." - TechStart Inc., annual gala
    - "She turned my vision board into reality and then exceeded it." - Sarah K., destination wedding in Tulum
    - "We interviewed 5 planners. Ever After was the only one who truly understood our multicultural vision." - The Patel-Williams family

    Contact/inquiry form: Full Name, Email, Phone, Event Type (dropdown: Wedding, Corporate Event, Social Event, Destination Event, Other), Estimated Event Date, Estimated Guest Count, Budget Range (dropdown: Under $10K, $10-25K, $25-50K, $50-100K, $100K+), How Did You Hear About Us, Tell Us About Your Vision (textarea). Submit button: "Let's Start Planning."

    Instagram @everafterevents with 15K+ followers. Pinterest board link. Featured in Nashville Bride Guide and Style Me Pretty.

    Footer with Nashville TN base, "Available for travel worldwide." Email hello@everafterevents.com. Copyright 2024 Ever After Events LLC.

systemPrompt: |
  ${common.developPageBase}

  ${common.errorHandlingInstructions}

goal: |
  1. Wait for site creation to complete
  2. Verify the preview contains:
     - "Ever After Events" business name
     - At least 3 service categories (Weddings, Corporate, Social)
     - At least 3 package tiers with prices ($1,500, $3,500, $7,500+)
     - Package comparison showing what's included
     - Photo gallery or portfolio section with event descriptions
     - Testimonials from past clients
     - Venue partnerships section
     - Contact/inquiry form with event type and budget fields
  3. Report success if at least 6 of the above elements are present

qualityEval:
  enabled: true
  siteType: event-planner
  thresholds:
    minOverallScore: 60
    minPerformance: 40
    minAccessibility: 70
