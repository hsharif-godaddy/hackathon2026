# Test creating a modern SaaS landing page
name: Create SaaS Landing Page
description: |
  Create a modern SaaS landing page with hero section,
  features, pricing, and call-to-action.

startUrl: https://airo-builder.godaddy.com
timeout: 480000  # 8 minutes
maxSteps: 80
headed: false

credentials:
  username: ${TEST_USERNAME}
  password: ${TEST_PASSWORD}

sitePrompt:
  prompt: |
    Building a SaaS startup called TaskFlow - a project management tool for remote teams. Need a killer landing page.

    Hero section with headline like Finally Project Management That Actually Works and a big Start Free Trial button with product screenshot.

    Show 3 key features: Real-time Collaboration where teams edit together, Smart Automations reducing repetitive tasks by 80%, and Integrations with Slack GitHub Notion and 50+ tools.

    Pricing: Free tier for up to 5 users, Pro at $12/user/month with unlimited projects, Enterprise with custom pricing and SSO support.

    Modern and trustworthy design with blues and whites. Include social proof like 10,000+ teams trust TaskFlow.

systemPrompt: |
  ${common.developPageBase}

  ${common.errorHandlingInstructions}

goal: |
  1. Wait for site creation to complete
  2. Verify the preview contains:
     - "TaskFlow" brand name somewhere
     - A hero section with a call-to-action button
     - Multiple feature items
     - Pricing information
  3. Report success if key elements are present


