# Budget-based build scenario: keep modifying the site until $5 of app AI spend
name: Budget Build - Consulting Site
description: |
  Build a consulting website and keep sending modifications until the app's
  AI token spend reaches $5. Measures how much site improvement is achievable
  within a fixed dollar budget.

startUrl: https://airo-builder.godaddy.com
timeout: 1800000 # 30 minutes (budget-based, may take a while)
maxSteps: 50 # Steps for initial goal (answer questions + wait for site creation)
stepsPerMessage: 20 # Steps per individual chat message
headed: false

credentials:
  username: ${TEST_USERNAME}
  password: ${TEST_PASSWORD}

# Budget: stop sending chat messages when the app has spent this much
tokenBudgetUSD: 5.00

sitePrompt:
  prompt: |
    I run Peak Performance Consulting, a business strategy firm in Denver, Colorado.
    We help startups and mid-size companies scale.

    Design: Clean, modern look with navy blue and white. Minimal, professional feel
    like McKinsey or Bain websites. Use a bold sans-serif for headings.

    Hero with tagline "Scale Smarter. Grow Faster." and a "Schedule a Call" CTA button.

    About section: Founded in 2018, 50+ clients served, specializing in go-to-market
    strategy, operational efficiency, and leadership development.

    Services: Strategy Consulting, Growth Advisory, Team Training, Executive Coaching.

    Contact form with Name, Email, Company, Phone, and Message fields.

systemPrompt: |
  ${common.developPageBase}

  ${common.errorHandlingInstructions}

  ${common.chatInstructions}

  IMPORTANT - During site creation, Airo may ask clarifying questions with
  multiple-choice options (e.g. "What's your primary goal for the website?").
  You MUST actively answer these questions by clicking on the most relevant
  option to continue the build process. Do NOT just wait - select an answer
  and proceed. If there are multiple questions (e.g. "1/2", "2/2"), answer
  each one as it appears.

goal: |
  The site is being created. During the build process, Airo may ask you
  clarifying questions with multiple-choice options (radio buttons). You must:

  1. If you see a question with options, click the most appropriate answer:
     - For "primary goal" questions, pick "Generate leads and consultation bookings"
     - For style/design questions, pick the most professional/modern option
     - For any other question, pick the first relevant option
  2. After answering all questions, wait for the site to finish building
  3. The preview iframe should become visible with "Peak Performance Consulting" content

  Report success once the preview is loaded and showing the site content.
  Do NOT just wait passively - interact with any questions that appear.

# Chat messages sent one-by-one until budget is reached.
# Each message is deliberately large and complex to exercise heavy code generation.
chatMessages:
  - "Completely redesign the color system. I want a sophisticated palette: primary forest green #1B4332, secondary warm gold #D4A574, accent copper #B87333, background cream #FAF8F5, dark text #1A1A2E, muted text #6B7280. Apply these throughout the entire site - hero gradient from #1B4332 to #0B2620, section backgrounds alternating between cream and white, gold accents on buttons and highlights, copper for hover states. Update every heading, paragraph, button, link, border, and shadow to use this palette. Make the overall feel like a premium luxury consulting brand."

  - "Build a complete interactive Services section with 6 detailed service cards arranged in a 3x2 grid. Each card must have: an icon area, service title, detailed 3-sentence description, a bullet list of 4 specific deliverables, pricing, and a 'Learn More' button. The services are: 1) Go-to-Market Strategy ($8,000/engagement) - We build comprehensive market entry plans for B2B SaaS companies. Deliverables: Market sizing report, competitive landscape analysis, ideal customer profile document, 90-day launch roadmap. 2) Revenue Operations Consulting ($5,000/month) - Align your sales, marketing, and CS teams around unified revenue goals. Deliverables: RevOps audit report, CRM pipeline redesign, lead scoring model, monthly KPI dashboard. 3) Executive Leadership Development ($3,500/day) - Transform C-suite effectiveness through structured coaching and 360 feedback. Deliverables: Leadership assessment, personalized development plan, quarterly progress reviews, peer advisory sessions. 4) M&A Due Diligence ($15,000/project) - Strategic evaluation of acquisition targets for PE firms and corporate buyers. Deliverables: Target company assessment, synergy analysis, integration roadmap, risk matrix. 5) Organizational Design ($6,000/engagement) - Restructure teams and reporting lines for maximum efficiency at scale. Deliverables: Current state org analysis, future state design, transition plan, RACI matrix for all roles. 6) Data Strategy & Analytics ($4,500/month) - Build the data infrastructure to make every business decision evidence-based. Deliverables: Data maturity assessment, KPI framework, dashboard implementation, team training curriculum. Add hover effects that lift cards with a shadow, and a subtle gradient border on hover."

  - "Create a full Case Studies section with 4 detailed case studies, each in an expandable accordion. Each case study must include: company name, industry, challenge (2-3 sentences), our approach (3-4 numbered steps), results with specific metrics in a styled metrics grid, a client testimonial quote with photo placeholder and attribution, and a timeline showing project duration. The case studies: 1) NovaTech (B2B SaaS) - Challenge: Plateaued at $2M ARR with a 14-month sales cycle and 45% churn. Approach: Rebuilt ICP around mid-market, redesigned sales process from 7 to 4 stages, implemented customer health scoring, launched a CSM program. Results: $8.2M ARR in 18 months, sales cycle reduced to 6 months, churn dropped to 12%, NPS went from 32 to 71. Quote from CEO Sarah Chen. 2) GreenScale (Sustainable Consumer Goods) - Challenge: Operating in 3 US markets with thin margins and no e-commerce presence. Approach: Conducted market expansion analysis across 20 markets, built D2C Shopify Plus store, negotiated 4 new distribution partnerships, redesigned supply chain for 3PL fulfillment. Results: Expanded to 12 markets, revenue grew 340%, online sales became 40% of revenue, gross margin improved from 28% to 41%. Quote from Founder Marcus Rivera. 3) Meridian Health (Healthcare Tech) - Challenge: Series B startup struggling to sell into enterprise hospital systems with a 24-month sales cycle. Approach: Created hospital CIO persona research, built ROI calculator tool, designed pilot program framework, trained sales team on consultative selling. Results: 8 enterprise contracts in 12 months, average deal size increased from $120K to $450K, sales cycle reduced to 9 months, raised Series C at 4x valuation. Quote from CRO Dr. Amara Osei. 4) Atlas Logistics (Supply Chain) - Challenge: Manual warehouse operations causing 8% error rate and 3-day fulfillment times. Approach: Mapped all 47 warehouse processes, implemented WMS integration, designed barcode scanning workflow, built real-time inventory dashboard. Results: Error rate dropped to 0.3%, fulfillment time reduced to 4 hours, labor costs decreased 25%, processed 3x more orders with same headcount. Quote from VP Ops James Nakamura."

  - "Build an interactive Team section with 6 team members displayed in a grid. Each member card must have: a circular photo placeholder with initials, full name, title, a 3-sentence bio, a list of 3 areas of expertise as styled tags/pills, links to LinkedIn and email, and an expandable 'Full Bio' section that reveals 2 more paragraphs about their background. The team: 1) David Morrison, Founder & Managing Partner - Former McKinsey engagement manager with 15 years in strategy consulting. Harvard MBA, started Peak Performance after seeing how mid-market companies were underserved. Personally led 200+ engagements across 14 industries. Expertise: Corporate Strategy, M&A Advisory, Board Advisory. Full bio: Began his career at Bain & Company before joining McKinsey where he became the youngest engagement manager in the Denver office. Has served on 3 nonprofit boards and mentors MBA students at CU Boulder. 2) Rachel Torres, Partner & Head of Growth - Spent 8 years at Salesforce scaling EMEA from $200M to $1.2B revenue. Built and managed a 45-person growth team. Known for data-driven experimentation frameworks. Expertise: Revenue Growth, Sales Enablement, Go-to-Market. Full bio: Prior to Salesforce, Rachel led growth at two YC-backed startups through Series B. She holds an MS in Operations Research from Stanford and speaks at SaaStr and Dreamforce annually. 3) James Okafor, Partner & Head of People Strategy - Organizational psychologist with a PhD from Columbia. Built leadership programs for Google, Amazon, and Microsoft. Published researcher on high-performance team dynamics. Expertise: Leadership Development, Org Design, Culture Transformation. Full bio: His research on psychological safety has been cited over 500 times. He previously led the People Analytics team at Google where he designed the manager effectiveness framework used by 40,000+ managers. 4) Dr. Priya Sharma, Director of Analytics - Data scientist and former VP of Analytics at Stripe. Built ML models predicting customer lifetime value and churn risk. Expert in translating complex data into executive-ready insights. Expertise: Data Strategy, Predictive Analytics, Business Intelligence. Full bio: Holds a PhD in Statistical Machine Learning from MIT. At Stripe, her team's models influenced $2B+ in credit decisions. She's an advisor to 4 data-focused startups. 5) Marcus Webb, Senior Consultant - 10 years in management consulting at Deloitte and BCG. Specializes in operational transformation for manufacturing and logistics companies. Led a $50M supply chain optimization for a Fortune 500 retailer. Expertise: Operations, Supply Chain, Process Improvement. Full bio: Marcus holds a Six Sigma Black Belt and PMP certification. Before consulting he was an industrial engineer at Boeing and is passionate about applying lean principles to service businesses. 6) Elena Vasquez, Senior Consultant - Former Head of Strategy at a Series D fintech company that IPO'd in 2023. Deep expertise in financial services, payments, and regulatory strategy. Expertise: Fintech Strategy, Regulatory Compliance, Product Strategy. Full bio: Elena spent 5 years at Goldman Sachs in the Strategy Group before moving to tech. She's fluent in Spanish and Portuguese and leads our Latin America advisory practice."

  - "Create a comprehensive multi-tab Pricing page. Build a tabbed interface with 3 tabs: 'Project-Based', 'Retainer', and 'Enterprise'. Each tab has a different pricing table. Project-Based tab: 4 columns (Starter $5K, Professional $12K, Premium $25K, Custom) with 12 feature rows including Strategy Workshop (2hr/Full day/2 days/Custom), Market Research (Basic/Comprehensive/Deep-dive/Custom), Deliverables (Summary/Full report/Full report + roadmap/Custom), Implementation Support (Email only/2 check-ins/Weekly for 1 month/Dedicated team), Revisions (1/3/Unlimited/Unlimited), Executive Presentation (No/Yes/Yes + board deck/Yes), Data Analysis (No/Basic/Advanced + ML/Custom), Team Training (No/No/Half day/Multi-day), Priority Support (No/No/Yes/Yes), Dedicated Slack Channel (No/No/No/Yes), Quarterly Reviews (No/No/No/Yes), Money-back Guarantee (No/30-day/60-day/90-day). Retainer tab: 3 columns (Growth $4K/mo, Scale $8K/mo, Transform $15K/mo) with 10 feature rows. Enterprise tab: custom form with company size, industry, budget range dropdowns, and a textarea for requirements. Add a toggle for annual billing (15% discount). Include a 'Most Popular' badge on Professional and Scale. Add a comparison FAQ below: 'Which plan is right for me?' with 4 expandable answers based on company stage."

  - "Build a full-featured Contact page with: 1) A split layout - left side has a multi-step form wizard (Step 1: Name, Email, Phone, Company. Step 2: Company Size dropdown with options 1-10/11-50/51-200/201-500/500+, Annual Revenue dropdown with options Under $1M/$1M-$5M/$5M-$20M/$20M-$100M/$100M+, Industry dropdown with 12 options. Step 3: Select services interested in as checkboxes for all 6 services, Budget range dropdown, Preferred start date picker, How did you hear about us dropdown. Step 4: Detailed message textarea and file upload for RFP/briefs). Add a progress bar across the top showing steps 1-4. Right side has: office address with an embedded map placeholder, phone number, email, office hours (Mon-Fri 8am-6pm MT), and 3 quick-action cards: 'Schedule a Free Call' linking to Calendly, 'Download Our Capabilities Deck' with a download button, and 'Join Our Newsletter' with an email input. Wire the entire form to save all fields to a database table called 'contact_submissions' with columns for every field plus a created_at timestamp and a status field defaulting to 'new'."

  - "Build a comprehensive Blog/Insights section with 8 article cards in a 2-column masonry layout. Each card needs: category tag (Strategy/Growth/Leadership/Operations/Data/Culture), publication date, estimated read time, title, 3-sentence excerpt, author name with small avatar placeholder, and a 'Read More' link. The articles: 1) Strategy - Jan 2025 - 8 min - 'The $10M Ceiling: Why Most B2B Startups Stall and the 5 Strategic Shifts to Break Through' - Most B2B startups hit a ceiling between $5M and $10M ARR. The playbook that got you here won't get you there. We break down the 5 strategic shifts our most successful clients made. By David Morrison. 2) Growth - Dec 2024 - 12 min - 'Building a RevOps Machine: The Complete Framework for Aligning Sales, Marketing, and Customer Success' - Revenue operations isn't just a buzzword. Companies with mature RevOps functions grow 19% faster. Here's the exact framework we use with clients. By Rachel Torres. 3) Leadership - Nov 2024 - 6 min - 'The Psychological Safety Playbook: How Google's Approach to Team Effectiveness Applies to Your 50-Person Company' - Google's Project Aristotle showed psychological safety is the #1 predictor of team success. But how do you implement it outside Big Tech? By James Okafor. 4) Operations - Oct 2024 - 10 min - 'Zero to Automated: How We Helped Atlas Logistics Eliminate 97% of Warehouse Errors in 90 Days' - A deep dive into our operational transformation methodology. From process mapping to real-time dashboards, every step of the journey. By Marcus Webb. 5) Data - Sep 2024 - 15 min - 'The Executive's Guide to AI Strategy: Separating Hype from High-ROI Use Cases in 2025' - AI is everywhere but ROI is nowhere for most companies. We share a practical framework for identifying which AI investments will actually move your bottom line. By Dr. Priya Sharma. 6) Culture - Aug 2024 - 7 min - 'Remote, Hybrid, or Office? The Data Behind Our Recommendation for Growth-Stage Companies' - We analyzed productivity and retention data from 40+ clients. The answer isn't what most founders expect. By James Okafor. 7) Growth - Jul 2024 - 9 min - 'The PLG to Sales-Led Transition: A Step-by-Step Guide for SaaS Companies Crossing $5M ARR' - Product-led growth gets you to $5M. Enterprise sales gets you to $50M. Here's how to make the transition without breaking what works. By Rachel Torres. 8) Strategy - Jun 2024 - 11 min - 'Due Diligence Red Flags: 7 Things We Look for When Evaluating Acquisition Targets for PE Firms' - After evaluating 100+ acquisition targets, these are the patterns that separate good deals from bad ones. By David Morrison. Add category filter buttons at the top and a 'Load More' button at the bottom."

  - "Build a full Events & Workshops page. Create 3 sections: Upcoming Events (cards with registration), Past Events (archive), and Custom Workshops (inquiry form). Upcoming Events section has 5 events, each with: event type badge (Workshop/Summit/Masterclass/Webinar), title, date and time with timezone, location (physical address or 'Virtual - Zoom'), 2-sentence description, speaker name and title, price, spots remaining counter, and a 'Register Now' button. Events: 1) Workshop - 'Scaling Your Startup: From $1M to $10M ARR' - March 15, 2025, 9am-5pm MT - The Maven Hotel, 1850 Wazee St, Denver CO - A full-day intensive workshop covering go-to-market strategy, sales process design, and unit economics optimization for B2B SaaS founders. Led by David Morrison and Rachel Torres. $499/person, 8 spots remaining. 2) Webinar - 'AI-Powered Decision Making for Executives' - March 22, 2025, 12pm-1:30pm MT - Virtual Zoom - Learn how to evaluate AI use cases, build a business case, and avoid common pitfalls. Includes live Q&A and a take-home assessment tool. Led by Dr. Priya Sharma. Free, 200 spots remaining. 3) Summit - 'Peak Performance Annual Leadership Summit 2025' - April 22-23, 2025, 8am-6pm MT - The Broadmoor, Colorado Springs CO - Two days of keynotes, workshops, and networking with 150+ executive leaders. Tracks for CEO/Founders, CROs, and COOs. Featured speakers from Stripe, Salesforce, and HubSpot. $1,299/person (Early Bird $999 until March 1), 42 spots remaining. 4) Masterclass - 'Operational Excellence: Lean Six Sigma for Service Companies' - May 10, 2025, 9am-4pm MT - Peak Performance Office, Denver - Hands-on masterclass applying manufacturing efficiency principles to consulting, SaaS, and professional services. Participants receive a Six Sigma toolkit. Led by Marcus Webb. $699/person, 12 spots remaining. 5) Workshop - 'Building High-Performance Teams: A Workshop for People Leaders' - June 5, 2025, 9am-3pm MT - Peak Performance Office, Denver - Interactive workshop with team assessments, role-play exercises, and a personalized action plan. Designed for VPs and Directors managing 10+ people. Led by James Okafor. $399/person, 15 spots remaining. Past Events section shows 4 archived events with title, date, and attendee count. Custom Workshops section has a form: company name, contact name, email, number of attendees (10-20/20-50/50-100/100+), preferred topics (multi-select checkboxes for all 6 service areas), preferred dates, budget range, and additional requirements textarea. Wire to database table 'workshop_inquiries'."

  - "Build a complete Client Portal login system. Add a 'Client Login' button in the header navigation. When clicked, it opens a modal with: 1) A login form with email, password, 'Remember me' checkbox, and 'Sign In' button. Below the form add 'Forgot password?' link and 'Don't have an account? Request access' link. 2) On successful login (mock it - accept any email ending in @client.peakperformance.com with password 'demo123'), show a client dashboard page with: a welcome message using the user's name parsed from email, 4 stat cards (Active Projects: 2, Completed Projects: 7, Next Meeting: Mar 15, Total Investment: $45,000), a project list table with columns: Project Name, Status (Active/Completed/Paused), Start Date, Last Update, Progress bar, and an action button. Populate with 5 mock projects. Below the table add a Documents section showing 8 downloadable files (PDF/XLSX) organized in folders: Strategy Documents, Monthly Reports, Meeting Notes. Add a Messages section showing 3 recent messages from consultants with timestamps. Include a 'Log Out' button that clears the session and returns to the main site. Store login attempts in a database table 'client_portal_logins' with email, timestamp, and success/failure status."

  - "Build a complete Resource Library page. Create a filterable grid of 12 downloadable resources organized by type and topic. Each resource card has: type badge (Playbook/Template/Toolkit/Guide/Whitepaper/Checklist), title, 2-sentence description, page count or file type indicator, topic tags (Strategy/Growth/Operations/Leadership/Data/Finance), a thumbnail placeholder, and a download button. Gate 6 resources behind an email capture form (name + email + company), while 6 are ungated. The resources: 1) Playbook - 'The B2B SaaS Growth Playbook' - 42 pages - Our complete framework for scaling SaaS companies from $1M to $20M ARR. Covers unit economics, go-to-market, and team building. GATED. 2) Template - 'Quarterly Business Review Template' - Excel/Google Sheets - The exact QBR template we use with clients. Includes financial summary, KPI tracking, OKR progress, and action items sections. UNGATED. 3) Toolkit - 'Leadership 360 Assessment Kit' - 15 pages + survey template - A complete toolkit for running 360-degree feedback including question banks, scoring rubrics, and development plan templates. GATED. 4) Guide - 'M&A Due Diligence Checklist' - 28 pages - Comprehensive checklist covering financial, operational, legal, and cultural due diligence with 200+ evaluation criteria. GATED. 5) Whitepaper - 'The State of AI in Business Strategy: 2025 Report' - 35 pages - Original research analyzing AI adoption across 500 mid-market companies with ROI data and implementation recommendations. GATED. 6) Template - 'Sales Pipeline Scorecard' - Excel/Google Sheets - Score and prioritize your pipeline deals using our weighted criteria model. Includes conversion probability calculator. UNGATED. 7) Checklist - 'Website Launch Readiness Checklist' - 8 pages - 150-point checklist for launching or relaunching a B2B website covering SEO, performance, accessibility, and conversion optimization. UNGATED. 8) Guide - 'The Remote Team Management Handbook' - 22 pages - Best practices for managing distributed teams including async communication frameworks, meeting cadences, and culture-building activities. UNGATED. 9) Toolkit - 'Customer Health Scoring Framework' - 18 pages + dashboard template - Build a predictive customer health score using our tested methodology. Includes data collection guide and intervention playbooks. GATED. 10) Template - 'Board Deck Template' - PowerPoint/Google Slides - Investor-ready board presentation template with 20 slides covering financials, metrics, strategy, and asks. UNGATED. 11) Whitepaper - 'Operational Efficiency Benchmarks for Professional Services Firms' - 30 pages - Benchmarking data from 80+ professional services companies on utilization rates, margins, and growth metrics. GATED. 12) Checklist - 'Pre-Investment Due Diligence for Founders' - 10 pages - What to prepare before your Series A or B fundraise. Covers data room setup, financial model requirements, and common VC questions. UNGATED. Add filter buttons for resource type and topic. Wire gated downloads to save contact info to a 'resource_downloads' database table with name, email, company, resource_title, and downloaded_at timestamp."

  - "Build a full ROI Calculator as an interactive tool. The calculator should have: Step 1 - Input your current metrics: Annual Revenue (number input with $ formatting), Number of Employees (number input), Current Annual Growth Rate (% slider from 0-100), Average Customer Acquisition Cost (number input), Monthly Customer Churn Rate (% input), Average Sales Cycle Length in days (number input), and Current Gross Margin % (slider). Step 2 - Select services you're considering (checkboxes for all 6 services with monthly/project cost shown). Step 3 - Show projected results in a dashboard with side-by-side comparison: Current State vs. With Peak Performance. Display projected improvements: Revenue Growth (current rate + estimated uplift based on selected services), CAC Reduction (estimated 20-40% reduction), Churn Improvement (estimated 30-50% reduction), Sales Cycle Reduction (estimated 25-40% reduction), 12-month Revenue Projection with a line chart comparing current trajectory vs. optimized trajectory, Projected ROI percentage, Payback Period in months, 3-Year Net Value. Below the results, add a 'Get Your Custom Analysis' CTA that pre-fills the contact form with the calculator inputs. Add an 'Email My Results' button that captures email and sends a summary. Make all calculations reactive - updating in real-time as inputs change. Use JavaScript for the calculations and build the chart using CSS bar charts (no external chart library needed)."

  - "Build a comprehensive Careers page with an Applicant Tracking System. Create sections: Company Culture (hero with values), Open Positions (job listings), Benefits, and Application Form. Culture section: Large heading 'Build Your Career at Peak Performance' with a subheading about the mission. Show 4 core values in cards with icons: Excellence (We pursue mastery in everything we do), Impact (We measure success by client outcomes), Collaboration (We believe the best ideas emerge from diverse perspectives), Growth (We invest in our people as much as our clients). Benefits section: 2-column grid showing 8 benefits: Competitive base salary + performance bonus, Equity/profit sharing for partners, Unlimited PTO with 3-week minimum, $5,000 annual learning budget, Fully remote with Denver office option, Premium health/dental/vision, 16 weeks paid parental leave, Annual team retreat (last year: Costa Rica). Open Positions section: Show 5 job listings, each expandable with full details. 1) Senior Consultant (Strategy) - Full-time, Denver/Remote - $150K-$200K + bonus. Requirements: 5+ years management consulting or corporate strategy, MBA preferred, experience with B2B companies. Responsibilities: Lead client engagements, develop strategic frameworks, mentor junior consultants. 2) Associate Consultant - Full-time, Denver/Remote - $90K-$120K + bonus. Requirements: 2-4 years in consulting, analytics, or operations. Strong analytical skills, excellent communication. 3) Head of Marketing - Full-time, Denver preferred - $140K-$180K + equity. Requirements: 7+ years B2B marketing, experience scaling professional services brand, content strategy expertise. 4) Data Analyst - Full-time, Remote - $100K-$130K + bonus. Requirements: 3+ years data analysis, SQL/Python proficiency, experience with BI tools, ability to translate data into business recommendations. 5) Executive Assistant to Managing Partner - Full-time, Denver - $70K-$90K. Requirements: 3+ years supporting C-suite executives, exceptional organizational skills, discretion with confidential information. Application form with: Full name, email, phone, LinkedIn URL, position applying for (dropdown), years of experience (dropdown), current company, current title, cover letter (textarea, 500 words max), resume upload (PDF/DOCX), portfolio URL (optional), how did you hear about us (dropdown), and 'Are you authorized to work in the US?' radio. Wire to 'job_applications' database table with all fields plus applied_at timestamp and status defaulting to 'received'."

  - "Build a full-featured Testimonials & Social Proof page. Create 3 sections: Video Testimonials (placeholder cards), Written Testimonials (detailed quotes), and Awards & Recognition. Video Testimonials section: 4 cards in a 2x2 grid, each with a 16:9 video placeholder area with a play button overlay, client name, title, company, and a pull quote beneath. The clients: 1) Sarah Chen, CEO of NovaTech - 'Peak Performance didn't just advise us - they rolled up their sleeves and helped us execute.' 2) Marcus Rivera, Founder of GreenScale - 'The ROI on our engagement was 12x within the first year.' 3) Dr. Amara Osei, CRO of Meridian Health - 'They understood enterprise healthcare sales in a way no other consultancy did.' 4) James Nakamura, VP Operations at Atlas Logistics - 'Our warehouse went from chaos to clockwork in 90 days.' Written Testimonials section: 8 testimonials in a masonry layout with varied card sizes. Each has: 5-star rating display, a 2-4 sentence quote in large italic text, client name, title, company name, company logo placeholder, industry tag, and the specific service they used. Include a mix of all 6 services. Make the quotes genuine-sounding and specific with numbers where possible. Awards section: Show 8 award badges in a scrolling row: Inc. 5000 Fastest Growing (2023, 2024), Clutch Top Strategy Consulting Firm, Forbes Advisor Best Management Consulting, Great Place to Work Certified, BBB A+ Rating, Colorado Companies to Watch Winner, Denver Business Journal Fast 50. Each badge is a styled card with the award name, year, and a brief description."

  - "Now I need you to completely rebuild the site navigation. Create a mega-menu navigation system. The header should have: Logo on the left, then these nav items with dropdowns: 'Services' (dropdown showing all 6 services in a 2x3 grid with icons and one-line descriptions, plus a 'View All Services' link and a featured case study card on the right), 'Case Studies' (dropdown with 4 recent case study links plus industry filter pills), 'Resources' (dropdown with 3 columns: Learn showing Blog, Podcast, Newsletter links; Tools showing ROI Calculator, Assessment links; Download showing top 3 resources with thumbnails), 'About' (dropdown showing Team, Careers, Values, Awards links in a list plus a stat: '200+ engagements completed'), 'Pricing' (no dropdown, direct link). On the right side of nav: Search icon that expands into a full-width search bar, 'Client Login' button (outline style), and 'Get Started' button (filled primary). Make the nav sticky on scroll with a background blur effect. On mobile, collapse into a hamburger menu with a full-screen overlay showing all menu items in an accordion style."

  - "Build a Podcast page for our show 'The Growth Equation'. Create: a hero section with podcast artwork placeholder (square, styled), show description ('Weekly conversations with founders, executives, and investors about what it really takes to build and scale a business. Hosted by David Morrison.'), subscribe buttons for Apple Podcasts, Spotify, and Google Podcasts (styled as platform-colored buttons), and stats (127 episodes, 50K+ monthly listeners, Top 50 Business Podcast). Below that, show 6 episode cards in a list layout. Each episode has: episode number, publication date, duration, title, guest name and title, 2-sentence description, a play button (non-functional, just styled), and topic tags. Episodes: 1) Ep 127 - Feb 2025 - 48 min - 'Scaling Culture: How Stripe Maintained Engineering Excellence Through 10x Growth' with Lisa Patel, VP Engineering at Stripe. 2) Ep 126 - Feb 2025 - 52 min - 'The $100M ARR Playbook: Lessons from HubSpot's Growth Journey' with Kipp Bodnar, CMO at HubSpot. 3) Ep 125 - Jan 2025 - 41 min - 'From Bootstrapped to Acquired: Building a $50M Company Without VC' with Rob Walling, Founder of TinySeed. 4) Ep 124 - Jan 2025 - 55 min - 'The PE Playbook: How Private Equity Really Evaluates Companies' with Sarah Tavel, General Partner at Benchmark. 5) Ep 123 - Jan 2025 - 38 min - 'Rebuilding Trust After a Data Breach: A CISO's Perspective' with Alex Stamos, Former CSO at Facebook. 6) Ep 122 - Dec 2024 - 45 min - 'Why Most Sales Teams Fail at Enterprise: The Consultative Selling Framework' with Mark Roberge, Former CRO at HubSpot. Add a 'Load More Episodes' button and a sidebar with 'Top Episodes' showing 3 all-time most popular."

  - "Build an advanced Analytics Dashboard page (accessible from Client Portal). The dashboard should have: a date range picker at the top (Last 7 days / 30 days / 90 days / Custom range), then 6 KPI cards in a row: Total Revenue (with % change vs previous period), New Customers, Customer Churn Rate, Average Deal Size, Pipeline Value, and NPS Score. Each card shows the current value, a trend arrow (up/down), and a sparkline-style mini chart using CSS. Below the KPIs, create 3 rows of visualizations: Row 1: A revenue trend chart (build as a CSS bar chart with 12 monthly bars, labeled with month names, alternating heights to simulate realistic data, bars colored with gradient from green to gold), and a pie chart built with CSS conic-gradient showing revenue by service line (Strategy 35%, Growth 25%, Training 20%, Coaching 10%, Analytics 10%). Row 2: A project status board with 3 columns (In Progress, Review, Completed) showing 2-3 project cards in each column with project name, client, progress percentage, and due date - styled like a Kanban board. Row 3: A recent activity feed showing 10 timestamped entries (mix of: 'New lead from website form', 'Proposal sent to [Company]', 'Meeting scheduled with [Person]', 'Invoice paid by [Company]', 'Project milestone completed') and a team utilization table showing 4 consultants with their current utilization %, number of active projects, and a colored bar (green >80%, yellow 60-80%, red <60%). Make all data hardcoded but realistic looking."

qualityEval:
  enabled: true
  siteType: service-business
  thresholds:
    minOverallScore: 50
    minPerformance: 30
    minAccessibility: 60

cleanup:
  deleteAllSitesViaAPI: true
