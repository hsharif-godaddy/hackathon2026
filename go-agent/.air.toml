root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/go-agent"
  cmd = "go build -ldflags=\"-X main.Version=dev\" -o ./tmp/go-agent ./cmd/agent"
  delay = 1000
  exclude_dir = ["dist", "tmp", "e2e", "data"]
  exclude_regex = ["_test\\.go$"]
  include_ext = ["go"]
  kill_delay = "0s"
  send_interrupt = true
  stop_on_error = true

[log]
  main_only = true

[misc]
  clean_on_exit = true
