name: no-attributes
description: Baseline without attributes.md (skip personalization details section)

model: claude-sonnet-4-6
temperature: 0.5
max_output_tokens: 8000
max_steps: 10

prompt_files:
  - ../../../agents/src/prompts/initial/core.md
  - ../../../agents/src/prompts/shared/communication.md
  - ../../../agents/src/prompts/initial/guidelines.md
  - ../../../agents/src/prompts/initial/examples.md
  - ../../../agents/src/prompts/shared/security.md

prompt_overrides: {}

responder:
  model: claude-sonnet-4-6

judge:
  model: claude-sonnet-4-6
  criteria_file: criteria/standard.yaml

runs_per_case: 1

test_cases_file: scenarios/standard.yaml
