name: prompt-enhancer
description: |
  Initial-agent variant that asks one structured form of 3-6 questions, then
  synthesizes an authoritative enhanced brief before handoff. Mirrors the
  manifest at agents/src/prompts/initial/prompt-enhancer/manifest.json
  (base 3.0 + variant questioning, prompt-enhancer, and handoff-template
  overrides), followed by shared/communication.md and shared/security.md as
  appended by the initial-agent loader.

model: claude-sonnet-4-6
temperature: 0.5
max_output_tokens: 8000
max_steps: 10

prompt_files:
  - ../../../agents/src/prompts/initial/3.0/identity.md
  - ../../../agents/src/prompts/initial/prompt-enhancer/questioning.md
  - ../../../agents/src/prompts/initial/prompt-enhancer/prompt-enhancer.md
  - ../../../agents/src/prompts/initial/3.0/project-name.md
  - ../../../agents/src/prompts/initial/3.0/feature-list.md
  - ../../../agents/src/prompts/initial/prompt-enhancer/handoff-template.md
  - ../../../agents/src/prompts/shared/communication.md
  - ../../../agents/src/prompts/shared/security.md

responder:
  model: claude-sonnet-4-6

judge:
  model: claude-sonnet-4-6
  criteria_file: criteria/standard.yaml

runs_per_case: 1

test_cases_file: scenarios/standard.yaml
