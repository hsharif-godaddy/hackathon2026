- id: llm-essay-prompt
  persona: Coffee roastery owner who had ChatGPT write their brief, very detailed and specific
  user_message: 'I''m looking to create a comprehensive digital platform for my artisanal coffee roasting business called Ember & Oak. We''re a small-batch specialty roaster based in the Pacific Northwest
    that sources single-origin beans directly from farmers in Ethiopia, Colombia, and Guatemala. Our brand identity centers around craftsmanship, sustainability, and the story behind each cup. We want our
    online presence to reflect the warmth and intentionality that goes into every roast.


    Our primary audience is coffee enthusiasts aged 25-45 who care about origin, process, and flavor profiles. They''re willing to pay premium prices for exceptional quality and transparent sourcing. Many
    of them follow us on Instagram where we share behind-the-scenes content of our roasting process, farm visits, and brewing guides. We also have a growing wholesale segment supplying boutique cafes across
    Oregon and Washington.


    The website needs to serve multiple functions. First and foremost, it should be an e-commerce platform where customers can browse our current offerings, learn about each bean''s origin story and tasting
    notes, and place orders for home delivery on a subscription or one-time basis. We''d also like a wholesale inquiry section for cafe owners interested in carrying our beans. A blog or journal section
    would be valuable for sharing brewing guides, farm visit stories, and industry insights.


    Design-wise, we''re drawn to earthy, warm aesthetics that feel handcrafted rather than corporate. Think exposed wood textures, matte finishes, and photography that captures the rich browns and ambers
    of freshly roasted beans. We want the site to feel like walking into a cozy, well-designed coffee shop. Typography should feel artisanal but readable, and the overall experience should be smooth and
    intuitive on both desktop and mobile.


    We currently have a basic Shopify store but it feels generic and doesn''t tell our story well. We want something that truly represents who we are and creates an emotional connection with visitors before
    they even taste the coffee. Budget isn''t the primary concern — getting the brand experience right is what matters most to us.'
