  - id: "dom-scg-001"
    previousMessage: "connect my domain"
    previousAssessmentTaskType: "domain"
    prompt: "yes that one"
    expectedTaskType: "domain"
    expectedPath: "haiku"
    tags: ["domain", "multi-turn", "session-context-gate"]
    rationale: "Confirmation follow-up during active domain flow. Embedding scores below threshold for 'yes that one', session context gate routes to Haiku."

  - id: "dom-scg-002"
    previousMessage: "i want to use my own domain"
    previousAssessmentTaskType: "domain"
    prompt: "the .com one"
    expectedTaskType: "domain"
    expectedPath: "haiku"
    tags: ["domain", "multi-turn", "session-context-gate"]
    rationale: "Clarification follow-up during active domain configuration."
