    prompt: "ok so here is the situation i already own a domain that i bought a few years ago when i first started my business and its registered with google domains but now i want to use it for this new website that we are building together so can you help me figure out how to connect it and make sure the dns settings are correct so everything works properly including my email which is also on that domain"
