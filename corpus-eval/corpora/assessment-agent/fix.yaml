  # ============================================================================
  # QUESTIONS (8 cases)
  # Questions about fixing are informational, not action requests.
  # For billing purposes, these should be classified as "general".
  # ============================================================================

  - id: "fix-q-001"
    prompt: "how do i fix this"
    expectedTaskType: "general"
    tags: ["fix", "question"]
    rationale: "How-to question, not fix request"

  - id: "fix-q-002"
    prompt: "why isnt it working"
    expectedTaskType: "fix"
    tags: ["fix", "question"]
    rationale: "Implies something is broken, asking for diagnosis/fix"

  - id: "fix-q-003"
    prompt: "whats wrong"
