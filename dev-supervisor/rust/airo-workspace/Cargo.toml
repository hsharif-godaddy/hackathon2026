[package]
name = "airo-workspace"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
nix = { version = "0.30", features = ["signal", "process", "poll"] }

# Strangler-fig migration deps. Staged ahead of PR #3 (airo-workspace owns
# the public socket and proxies to the Go binary on an internal UDS) so a
# musl-link or feature-flag regression surfaces in isolation, before the
# proxy code lands on top.
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "signal"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
