metadata:
  name: Skill Loader - Payments
  version: 1.0.0

# Payment skill routing rules (from skill.md frontmatter):
#
# stripe       — load ONLY when user explicitly says "Stripe". For general e-commerce, use commerce.
# commerce     — load IMMEDIATELY for ANY e-commerce intent (store, shop, sell, cart, checkout)
#                WITHOUT an explicit Stripe mention. NEVER suggest Stripe for generic requests.
# commerce-one-time-payment — "accept payments / buy-now / one-time payment / charge customers"
#               but loads commerce first, so the evaluator (stop-after-first-skill) captures commerce.
# stripe-v2    — same trigger as stripe; platform-managed sandbox flow.
#               If the agent picks stripe-v2 instead of stripe for the cases below,
#               update expectedSkill to stripe-v2 to match actual behavior.

cases:
  # ──────────────────────────────────────────────────────────────────────────
  # Positive: stripe — user explicitly says "Stripe"
  # ──────────────────────────────────────────────────────────────────────────

  - id: stripe-explicit-add
    prompt: 'Add Stripe to my website'
    expectedSkill: stripe
    tags: [positive, stripe]
    rationale: '"add Stripe" is the canonical explicit trigger phrase in stripe skill.md'

  - id: stripe-checkout
    prompt: 'Set up Stripe checkout for my store'
    expectedSkill: stripe
    tags: [positive, stripe]
    rationale: Stripe + checkout — explicit integration request

  - id: stripe-payments-explicit
    prompt: 'I want to accept payments through Stripe'
    expectedSkill: stripe
    tags: [positive, stripe]
    rationale: Stripe explicitly named as the payment processor

  - id: stripe-subscriptions
    prompt: 'Add Stripe subscriptions to my app'
    expectedSkill: stripe
    tags: [positive, stripe]
    rationale: Stripe subscription intent — explicit Stripe mention

  - id: stripe-membership
    prompt: 'I want to sell memberships using Stripe'
    expectedSkill: stripe
    tags: [positive, stripe]
    rationale: Selling memberships via Stripe — explicit Stripe mention with recurring intent

  - id: stripe-payment-processing
    prompt: 'Integrate Stripe for payment processing on my site'
    expectedSkill: stripe
    tags: [positive, stripe]
    rationale: '"Integrate Stripe" is a direct trigger phrase'

  - id: stripe-products
    prompt: 'I have products ready. Set up Stripe so customers can buy them'
    expectedSkill: stripe
    tags: [positive, stripe]
    rationale: Explicit Stripe with product purchase intent

  - id: stripe-one-time
    prompt: 'Add a Stripe one-time payment button to my landing page'
    expectedSkill: stripe
    tags: [positive, stripe]
    rationale: Stripe + one-time payment button — explicit processor named

  # Positive stripe — harder cases (Stripe mentioned but less directly)

  - id: stripe-alternative
    prompt: "I don't want GoDaddy Commerce — I want to use Stripe instead"
    expectedSkill: stripe
    tags: [positive, stripe, hard]
    rationale: Explicit Stripe preference over commerce; should load stripe not commerce

  - id: stripe-prefer
    prompt: 'My client specifically wants Stripe on their site'
    expectedSkill: stripe
    tags: [positive, stripe, hard]
    rationale: Explicit Stripe requirement stated by user on behalf of client

  - id: stripe-connect-existing
    prompt: 'I already have a Stripe account — can you hook it up to my app?'
    expectedSkill: stripe
    tags: [positive, stripe, hard]
    rationale: Existing Stripe account connect — explicit Stripe mention

  # ──────────────────────────────────────────────────────────────────────────
  # Positive: commerce — general e-commerce, NO explicit Stripe mention
  # ──────────────────────────────────────────────────────────────────────────

  - id: commerce-sell-online
    prompt: 'I want to sell products online'
    expectedSkill: commerce
    tags: [positive, commerce]
    rationale: Generic sell-online intent — commerce skill, not stripe

  - id: commerce-add-store
    prompt: 'Add an online store to my website'
    expectedSkill: commerce
    tags: [positive, commerce]
    rationale: Online store request — commerce loads immediately for this intent

  - id: commerce-ecommerce
    prompt: 'Set up e-commerce on my site'
    expectedSkill: commerce
    tags: [positive, commerce]
    rationale: E-commerce keyword — commerce skill per whenToUse

  - id: commerce-cart-checkout
    prompt: 'Add a shopping cart and checkout to my app'
    expectedSkill: commerce
    tags: [positive, commerce]
    rationale: Cart + checkout — commerce skill. NEVER Stripe unless explicitly requested.

  - id: commerce-shop
    prompt: 'I want to build a shop where customers can browse and buy my products'
    expectedSkill: commerce
    tags: [positive, commerce]
    rationale: Shop/buy intent — generic e-commerce, commerce skill

  - id: commerce-accept-payments
    prompt: 'I want to accept payments on my website'
    expectedSkill: commerce
    tags: [positive, commerce]
    rationale: Generic accept-payments intent (no Stripe mention) — commerce, not stripe

  - id: commerce-catalog
    prompt: 'Help me set up a product catalog with pricing'
    expectedSkill: commerce
    tags: [positive, commerce]
    rationale: Catalog + pricing setup — commerce skill territory

  - id: commerce-one-time-charge
    prompt: 'I want to charge customers a one-time fee for my service'
    expectedSkill: commerce
    tags: [positive, commerce]
    rationale: One-time charge intent — commerce handles this; no Stripe mention

  # Positive commerce — harder (implicit selling intent, no commerce keywords)

  - id: commerce-start-selling
    prompt: 'I want my visitors to be able to buy things from my site'
    expectedSkill: commerce
    tags: [positive, commerce, hard]
    rationale: 'No "store" or "e-commerce" keyword but buy-from-site intent triggers commerce'

  - id: commerce-buy-now-button
    prompt: 'Add a buy now button to my product page'
    expectedSkill: commerce
    tags: [positive, commerce, hard]
    rationale: Buy-now without naming Stripe — commerce, not stripe

  - id: commerce-payment-page
    prompt: 'Create a payment page so customers can pay for my consulting sessions'
    expectedSkill: commerce
    tags: [positive, commerce, hard]
    rationale: Payment page for services — commerce-one-time-payment intent but commerce loads first

  # ──────────────────────────────────────────────────────────────────────────
  # Negative: critical disambiguation — wrong skill must NOT load
  # ──────────────────────────────────────────────────────────────────────────

  - id: paypal-not-stripe
    prompt: 'Add PayPal as a payment method'
    expectedSkill: null
    tags: [negative, hard]
    rationale: PayPal is a different processor — not a Stripe trigger and not generic enough for commerce alone; no skill should load

  - id: payment-mention-no-intent
    prompt: 'I used to work at a payments company, can you add a team bio page?'
    expectedSkill: null
    tags: [negative, hard]
    rationale: '"Payments" appears but user intent is a bio page — no payment skill should load'

  - id: stripe-non-integration
    prompt: 'I once tried Stripe but decided not to use it. Just make the site look better.'
    expectedSkill: null
    tags: [negative, hard]
    rationale: Stripe is mentioned dismissively; actual request is a design change

  - id: fake-payment-ui
    prompt: 'Show a placeholder credit card form in the UI — no real payments needed'
    expectedSkill: null
    tags: [negative, hard]
    rationale: Mock/placeholder UI with no real payment integration intent

  # ──────────────────────────────────────────────────────────────────────────
  # Negative: unrelated requests — no payment skill should load
  # ──────────────────────────────────────────────────────────────────────────

  - id: fix-mobile-layout
    prompt: 'The mobile layout is broken on my homepage, please fix it'
    expectedSkill: null
    tags: [negative]
    rationale: Layout bug fix — no payment intent

  - id: add-hero-section
    prompt: 'Add a hero section with a background image'
    expectedSkill: null
    tags: [negative]
    rationale: UI feature — no payment intent

  - id: create-about-page
    prompt: 'Create an About page with our team bios'
    expectedSkill: null
    tags: [negative]
    rationale: New page — no payment intent

  - id: change-color-scheme
    prompt: 'Change the color scheme to something more professional'
    expectedSkill: null
    tags: [negative]
    rationale: Design change — no payment intent
