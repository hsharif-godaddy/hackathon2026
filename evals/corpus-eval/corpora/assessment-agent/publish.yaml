    tags: ["publish", "multi-turn"]

  - id: "pub-mt-012"
    previousMessage: "publish the website"
    prompt: "with the new changes"
    expectedTaskType: "publish"
    tags: ["publish", "multi-turn"]
    skip: true
    skipReason: "Multi-turn follow-up too vague without full context"

