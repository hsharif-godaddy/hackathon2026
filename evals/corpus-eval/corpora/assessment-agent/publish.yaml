  # QUESTIONS (10 cases)
  # Questions about publishing are informational, not action requests.
  # For billing purposes, these should be classified as "general".
  # ============================================================================

  - id: "pub-q-001"
    prompt: "how do i publish"
    expectedTaskType: "publish"
    tags: ["publish", "question"]
