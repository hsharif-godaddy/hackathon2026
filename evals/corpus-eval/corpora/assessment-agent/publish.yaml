  - id: "pub-long-004"
    prompt: "my website is complete and i want it to be accessible to anyone who searches for my business online"
    expectedTaskType: "publish"
    tags: ["publish", "long"]
    rationale: "Clear publish intent - 'complete' and 'accessible to anyone' indicates going live"

  - id: "pub-long-005"
