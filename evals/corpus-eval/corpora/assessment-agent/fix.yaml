    expectedTaskType: "general"
    tags: ["fix", "question"]
    rationale: "How-to question, not fix request"

  - id: "fix-q-002"
    prompt: "why isnt it working"
    expectedTaskType: "fix"
    tags: ["fix", "question"]
    rationale: "Implies something is broken, asking for diagnosis/fix"

  - id: "fix-q-003"
