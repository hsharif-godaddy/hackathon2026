metadata:
  name: "Assessment Agent - Fix Classification"
  version: "1.0.0"
  agent: "assessment-agent"
  description: "All fix-related test cases: bugs, errors, broken functionality"
  created: "2026-04-06"

config:
  defaultModel: "haiku"
  timeoutMs: 5000

