  # AMBIGUOUS INCOMPLETE WORK (billing-critical)
  # NOTE: Non-ambiguous continuation/incomplete patterns are covered in general.yaml.
  # These cases document ambiguous patterns that currently classify as fix but
  # should change to general once context-aware classification is in place.
  # ============================================================================

  # TODO: Change to general once context-aware classification is in place
  # Currently ambiguous - could be incomplete work OR bug, classifier defaults to fix
  - id: "fix-ambiguous-incomplete-001"
