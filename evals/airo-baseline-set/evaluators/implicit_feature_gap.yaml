---
name: implicit_feature_gap
description:
  Checks whether the final site avoids meaningful gaps in important implied
  features.
type: llm
scoreType: BOOLEAN
scoreName: no_implicit_feature_gap
llmConfig:
  model: gpt-4o
  temperature: 0
  maxTokens: 2000
projectId: airo-builder-regression
staticContext:
  "Use the requested goal plus the final artifact to determine whether
  important implied features are missing. Evaluate each checklist item as pass/fail
  and return true only when there is no meaningful implied-feature gap."
criteriaSchemaFile: schemas/checklist-single-item.json
template: |
  You are grading `implicit_feature_gap` for an Airo Builder output.

  Judge whether the final site is missing features that are reasonably implied by the requested business goal, even if the user did not spell them out word for word.

  ## Requested Outcome
  {{#if scenario.business}}
  Business: {{scenario.business.businessName}} ({{scenario.business.industry}})
  Description: {{scenario.business.businessDescription}}
  {{/if}}
  {{#if scenario.goal}}
  Primary goal: {{scenario.goal.name}}
  Goal bullets:
  {{#each scenario.goal.goals}}
  - {{this}}
  {{/each}}
  {{/if}}
  Customer summary: {{scenario.customerSummary}}
  {{#if conversation.originalPrompt}}
  Original request:
  {{conversation.originalPrompt}}
  {{/if}}

  ## Final Artifact Evidence
  Headings:
  {{#each pageContent.headings}}
  - {{this}}
  {{/each}}
  Buttons:
  {{#each pageContent.buttons}}
  - {{this}}
  {{/each}}
  Links:
  {{#each pageContent.links}}
  - {{this}}
  {{/each}}
  Form count: {{pageContent.formCount}}
  Main text:
  {{pageContent.mainText}}

  ## Checklist
  Evaluate each implied-feature checklist item as pass/fail with brief visible evidence.
  {{#each criteria.checklist}}
  - {{id}}: {{description}}
  {{/each}}

  ## Judge This
  Return true only when the final site is free of meaningful implied-feature gaps.

  A gap is meaningful when a normal visitor would reasonably expect it for the requested site type or when its absence weakens the main use case.

  Do not count cosmetic extras or low-priority nice-to-haves.

  Set the top-level boolean score:
  - true = implied needs are reasonably covered or an acceptable visible alternative exists
  - false = one or more checklist failures reveal a meaningful implied-feature gap
