---
name: intent_inference_quality
description: Scores how well the agent inferred the builder user's real website intent
  across the full session.
type: llm
scoreType: NUMERIC
scoreName: intent_inference_quality
llmConfig:
  model: gpt-4o
  temperature: 0
  maxTokens: 2000
projectId: airo-builder-regression
staticContext: 'Primary evidence: conversation transcript and tool-call sequence. Judge
  whether the agent understood the requested website, implied constraints, and later
  refinements. Do not score visual quality or artifact polish here.'
criteriaSchemaFile: schemas/empty-object.json
template: |
  You are grading `intent_inference_quality` for an Airo Builder session.

  Use only the conversation and tool-call evidence below. Do not reward or penalize the final website here except as a minor confirmation signal if it is mentioned in the conversation.

  ## What The User Needed
  {{#if scenario.goal}}
  Primary goal: {{scenario.goal.name}}
  Goal bullets:
  {{#each scenario.goal.goals}}
  - {{this}}
  {{/each}}
  {{/if}}
  {{#if scenario.business}}
  Business: {{scenario.business.businessName}} ({{scenario.business.industry}})
  Audience: {{scenario.business.targetAudience}}
  Constraints: {{json scenario.business.constraints}}
  {{/if}}
  Customer summary: {{scenario.customerSummary}}

  ## Conversation Evidence
  {{#if conversation.originalPrompt}}
  Original request:
  {{conversation.originalPrompt}}
  {{/if}}
  {{#if conversation.userMessages}}
  User refinements:
  {{#each conversation.userMessages}}
  - {{this}}
  {{/each}}
  {{/if}}
  {{#if conversation.messages}}
  Transcript:
  {{#each conversation.messages}}
  TURN {{turn}} {{uppercase role}}: {{content}}
  {{#if toolCalls}}
  Tool calls made on this turn:
  {{#each toolCalls}}
  - {{name}}{{#if args}} args={{args}}{{/if}}
  {{/each}}
  {{/if}}
  {{/each}}
  {{/if}}

  ## Judge This
  Score how well the agent inferred the real build request.

  Look for:
  - whether it captured the actual business/use case instead of latching onto surface words
  - whether it noticed implied needs like booking, lead capture, pricing, trust, gallery, or contact paths when the request called for them
  - whether it updated its understanding after refinements or corrections
  - whether clarifying questions were targeted and useful rather than generic

  Penalize:
  - building toward the wrong site type or wrong visitor outcome
  - ignoring explicit corrections
  - missing a major implied requirement that the user clearly signaled

  ## Rubric
  5 = fully understood the requested outcome, implied needs, and later refinements.
  4 = strong understanding with only minor misses.
  3 = understands the core request but misses an important nuance or refinement.
  2 = partial understanding with a clear misunderstanding that would affect the build.
  1 = major misunderstanding of the requested website or workflow.
  0 = no meaningful understanding of the user's intent.

  Cite 2-3 concrete moments from the conversation in your reasoning.
scoreConfig:
  min: 0
  max: 5
