---
name: primary_cta_presence
description: Explicitly checks whether the final site includes a clear primary CTA
  aligned to the user's goal.
type: llm
scoreType: BOOLEAN
scoreName: primary_cta_presence
llmConfig:
  model: gpt-4o
  temperature: 0
  maxTokens: 2000
projectId: airo-builder-regression
staticContext: 'Primary evidence: screenshots, visible buttons/forms/links, and requested
  business goal. Judge the visible primary conversion path only. Return checklist
  evidence and set the boolean score to whether the item passes.'
criteriaSchemaFile: schemas/checklist-single-item.json
template: |
  You are grading `primary_cta_presence` for an Airo Builder output.

  Use the requested business goal plus visible CTA evidence from screenshots, buttons, links, and forms.

  ## Goal Context
  {{#if scenario.business}}
  Business: {{scenario.business.businessName}} ({{scenario.business.industry}})
  {{/if}}
  {{#if scenario.goal}}
  Primary goal: {{scenario.goal.name}}
  Goal bullets:
  {{#each scenario.goal.goals}}
  - {{this}}
  {{/each}}
  {{/if}}

  ## Visible CTA Evidence
  Buttons:
  {{#each pageContent.buttons}}
  - {{this}}
  {{/each}}
  Links:
  {{#each pageContent.links}}
  - {{this}}
  {{/each}}
  Form count: {{pageContent.formCount}}
  Screenshots of the final site are attached separately.

  ## Checklist
  For each checklist item, decide pass/fail and provide short visual evidence.
  {{#each criteria.checklist}}
  - {{id}}: {{description}}
  {{/each}}

  ## Judge This
  The primary CTA should be:
  - visible enough that a normal visitor can notice it
  - specific enough that the next step is clear
  - aligned with the real business goal, such as booking, quote request, inquiry, signup, or browse/shop

  A generic button that does not move the visitor toward the intended outcome should not count.

  Set the top-level boolean score to true only if every checklist item passes.
