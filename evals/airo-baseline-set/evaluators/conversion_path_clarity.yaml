template: |
  You are grading `conversion_path_clarity` for an Airo Builder output.

  Focus on the visible visitor journey from landing on the site to the intended next action.

  ## CRITICAL: Presentation Clarity vs Functional Verification

  ### This Evaluator Scores: PRESENTATION CLARITY

  **Presentation = How CTAs are shown to visitors (agent controls this)**

  Evaluate:
  ✓ CTA labels are clear and action-oriented ("Book Now" not "Click Here")
  ✓ CTAs are visually prominent (size, color, placement)
  ✓ Supporting copy explains the next step
  ✓ Single clear primary action (not competing CTAs)
  ✓ Form fields are appropriately labeled
  ✓ Instructions guide user toward action
  ✓ Visual hierarchy emphasizes conversion path

  Evidence: Visible button/link labels, form presence, placement in screenshots

  ### This Evaluator Does NOT Score: FUNCTIONAL VERIFICATION

  **Function = Whether actions actually work (agent cannot test this)**

  Do NOT evaluate:
  ✗ Whether clicking CTA actually navigates
  ✗ Whether form submit actually processes
  ✗ Whether booking actually creates appointment
  ✗ Whether payment actually goes through
  ✗ Whether email actually sends
  ✗ Post-interaction confirmation pages
  ✗ Multi-step flow completion

  Evidence: Would require browser testing, not available to agent

  ### Examples

  **Example 1: Booking site - GOOD clarity**

  Presentation (evaluate):
  ✓ Large "Book Your Appointment" button above fold
  ✓ Supporting text: "Schedule a consultation in 3 easy steps"
  ✓ Form has clear labels: Name, Email, Phone, Preferred Date
  ✓ Submit button says "Confirm Booking"

  Score: 90+ (excellent presentation clarity)

  Function (do NOT evaluate):
  ? Does form actually send to calendar system
  ? Does user receive confirmation email

  **Example 2: E-commerce site - GOOD clarity**

  Presentation (evaluate):
  ✓ "Add to Cart" buttons on each product
  ✓ Cart icon in navigation shows item count
  ✓ Prominent "Checkout" button in cart
  ✓ Clear pricing and shipping info

  Score: 85-95 (good presentation clarity)

  Function (do NOT evaluate):
  ? Does Add to Cart actually update state
  ? Does Checkout actually process payment

  **Example 3: Lead gen site - POOR clarity**

  Presentation (evaluate):
  ✗ Button just says "Submit" (unclear what for)
  ✗ Form is below fold, hard to find
  ✗ No supporting text explaining purpose
  ✗ Competing CTAs (Download, Contact, Subscribe)

  Score: 30-49 (poor presentation clarity)

  ## Agent Capability Boundaries

  **Agent CAN control:**
  - CTA wording and labels
  - Button styling and prominence
  - Form field labels and structure
  - Supporting copy and instructions
  - Visual hierarchy and placement

  **Agent CANNOT control:**
  - Whether CTAs functionally work when clicked
  - Whether forms actually submit
  - Whether integrations are connected
  - Post-click behavior
  - Backend processing

