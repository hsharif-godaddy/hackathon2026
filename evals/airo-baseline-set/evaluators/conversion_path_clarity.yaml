  ## Judge This

  ### Evidence boundary (visible next step presentation)

  Score whether the **Conversion Evidence** makes the intended **next action** presentation clear:
  - CTA labels, placement, supporting copy, forms
  - This is NOT a test of whether submit succeeds or follow-on pages appear
  - Do not penalize solely because post-interaction states not shown
  - Buttons/Links are **surface text** only—never penalize routing to external systems

  Score whether a real visitor can quickly **identify and understand** the intended next step
  from what's VISIBLY PRESENTED.

  ## Evaluation Criteria

  **Clarity of CTA Wording (0-25 points)**
  - 25: Action-oriented, specific, clear ("Book Free Consultation")
  - 20: Clear but generic ("Submit", "Continue")
  - 15: Vague but understandable ("Learn More", "Click Here")
  - 10: Ambiguous or confusing
  - 0: No clear CTA or unintelligible

  **Visual Prominence (0-25 points)**
  - 25: Highly prominent (large, contrasting, above fold)
  - 20: Prominent (visible, clear hierarchy)
  - 15: Present but not emphasized
  - 10: Buried or low contrast
  - 0: Invisible or hidden

  **Supporting Context (0-25 points)**
  - 25: Excellent explanation of what/why/how
  - 20: Good context provided
  - 15: Minimal context
  - 10: No context, user must guess
  - 0: Confusing or contradictory

  **Conversion Path Focus (0-25 points)**
  - 25: Single clear primary action
  - 20: Clear primary with relevant secondary
  - 15: Multiple options but one is emphasized
  - 10: Competing actions, unclear priority
  - 0: No clear path or many competing CTAs

  **Total: 0-100**

  ## Do NOT Penalize For

  - Unverifiable routing destinations
  - Untested form submission
  - Unknown backend integrations
  - Post-click behavior not shown
  - Multi-step flow not captured
  - Functional aspects you cannot inspect

  If structure/labels suggest clear next step but function unverifiable:
  → Score based on presentation clarity alone

  ## Rubric (Graduated 0-100)

  **90-100** = conversion path presentation is obvious, well labeled, and aligned
    - Excellent CTA wording
    - Highly prominent placement
    - Strong supporting context
    - Clear single focus

  **70-89** = clear presentation with only minor friction
    - Good CTA wording
    - Prominent placement
    - Adequate context
    - Mostly focused

  **50-69** = next step exists but presentation not especially clear
    - Generic CTA wording
    - Moderate prominence
    - Minimal context
    - Some competing elements

  **30-49** = weak, confusing, or buried conversion path presentation
    - Vague CTA wording
    - Low prominence
    - No context
    - Multiple competing CTAs

  **10-29** = barely visible or clearly mismatched next step presentation
    - Unclear what to do
    - Hidden CTAs
    - Confusing labels

  **0-9** = no meaningful conversion path presentation
    - No clear CTA
    - No forms or contact methods
    - Visitor lost

