template: |
  Evaluate ambiguity_handling_quality for an Airo Builder session.

  Use only the conversation and tool-call evidence. Do not use the final website as primary basis.

  ## CRITICAL: Impossible Requests vs Genuine Ambiguity

  ### Appropriate Clarification (GOOD - Do NOT Penalize)

  **When user asks for things agent cannot do:**

  User asks impossible thing:
  - "Show me screenshots of the site"
  - "Navigate to /products/test"
  - "Click the button and test it"
  - "Make the preview switch pages"

  Agent appropriately clarifies:
  - "I cannot navigate the preview, but I can:"
  - "Would you like me to:"
  - "I can verify the code structure or provide navigation guidance"
  - "Let me check if the routing code exists"

  **This is EXCELLENT ambiguity handling, NOT generic questioning**

  Characteristics:
  ✓ Acknowledges capability limitation honestly
  ✓ Offers specific alternatives within capabilities
  ✓ Provides multiple concrete options
  ✓ Reframes request to match what agent CAN do

  ### Generic Questioning (POOR - Should Penalize)

  **When request is clear but agent asks unnecessary questions:**

  User asks clear thing:
  - "Create a booking site"
  - "Add a contact form"
  - "Make the hero image bigger"

  Agent asks generic questions:
  - "What kind of site do you want?"
  - "What features should it have?"
  - "What style do you prefer?"

  **This is poor handling when request was already clear**

  Characteristics:
  ✗ Blocks on questions user already answered
  ✗ Generic/broad questions when specifics known
  ✗ Repetitive questioning
  ✗ Doesn't make sensible defaults

  ## Agent Capability Boundaries

  **Agent CAN:**
  - Generate and edit code
  - Provide navigation instructions
  - Diagnose code issues
  - Verify code structure

  **Agent CANNOT:**
  - Navigate preview browser
  - Take screenshots
  - Test interactions
  - Control browser

