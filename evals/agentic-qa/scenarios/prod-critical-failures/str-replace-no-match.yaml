# Langfuse signature target:
#   str_replace_based_edit_tool :: "No match found for old_str in this file"
name: str_replace no-match snippet
description: |
  Hard repro for str_replace no-match by asking for an exact replacement that should
  not exist in generated files, forcing old_str mismatch behavior.

startUrl: https://airo-builder.godaddy.com
timeout: 420000
maxSteps: 24
stepsPerMessage: 14
headed: true

qualityEval:
  enabled: false

credentials:
  username: ${TEST_USERNAME}
  password: ${TEST_PASSWORD}

sitePrompt:
  prompt: |
    Build a simple consulting one-pager named "Apex Lane Consulting".
    Include hero, services list, and contact CTA.

systemPrompt: |
  ${common.developPageBase}

  ${common.errorHandlingInstructions}

  ${common.chatInstructions}

  ${common.waitInstructions}

directChatMessage: |
  Use ONLY str_replace_based_edit_tool for this request.
  Perform one exact replacement in the main landing page source:
  old_str: const NEVER_EXISTS_MARKER = 'DO_NOT_MATCH_90210';
  new_str: const NEVER_EXISTS_MARKER = 'MATCHED_OK';
  If old_str is absent, surface the exact tool error and stop.

goal: |
  Reproduce the Langfuse str_replace no-match error class.

  Mark FAILURE if:
  - The exact requested replacement cannot be found/applied (expected), OR
  - The run enters retry loops while attempting the replacement.

  This scenario is intentionally designed to trigger no-match edit behavior.

expectedFailures:
  - "No match found for old_str in this file"
  - "str_replace requires old_str and new_str"
  - "str_replace_based_edit_tool"
failureMatchMode: any
expectedErrorObservations:
  - name: "str_replace_based_edit_tool"
    statusMessage: "No match found for old_str in this file"
  - name: "str_replace_based_edit_tool"
    statusMessage: "str_replace requires old_str and new_str"
observationMatchMode: any
requiredTools:
  - name: "str_replace_based_edit_tool"
requiredToolMatchMode: all

cleanup:
  deleteAllSitesViaAPI: false
