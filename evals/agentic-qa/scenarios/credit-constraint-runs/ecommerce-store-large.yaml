# Credit-based build scenario: premium e-commerce platform with advanced features
name: Credit Build - E-Commerce Platform
description: |
  Build a premium multi-category e-commerce store and keep sending complex
  modifications until 50 credits consumed. Exercises product catalogs,
  cart systems, checkout flows, loyalty programs, and advanced UI patterns.

startUrl: https://airo-builder.godaddy.com
timeout: 2400000 # 40 minutes
maxSteps: 50
stepsPerMessage: 20
headed: false

credentials:
  username: ${TEST_USERNAME}
  password: ${TEST_PASSWORD}

creditLimit: 50

sitePrompt:
  prompt: |
    I'm launching Velvet & Vine, a premium home goods and lifestyle e-commerce store
    based in Portland, Oregon. We sell artisan ceramics, handmade textiles, natural
    candles, curated kitchen tools, and small-batch skincare. Every product is hand-
    selected from independent makers who share our commitment to sustainable
    craftsmanship. We are certified B Corp, 1% for the Planet member, and Climate
    Neutral certified. Our packaging is 100% plastic-free and compostable.

    Design: Warm minimalist aesthetic with earthy tones. Primary color warm terracotta
    #C67B5C, secondary sage green #8B9F82, accent cream #F5F0E8, dark charcoal #2D2D2D
    for text. Typography: serif headings (like Playfair Display), clean sans-serif body.
    Lots of whitespace, editorial feel like Kinfolk magazine meets Anthropologie.

    Hero: Full-width lifestyle image placeholder with headline "Thoughtfully Crafted for
    Everyday Living" and subtext "Artisan home goods from independent makers. Each piece
    tells a story of craft, care, and connection." Two CTAs: "Shop New Arrivals" and
    "Our Story".

    Announcement Bar: Fixed at top, cream background, rotating messages: "Free Shipping
    Over $150 | Easy 30-Day Returns | Handmade With Love in Small Batches".

    Navigation: Shop (with mega-menu for categories), New Arrivals, Best Sellers,
    Our Story, Journal, Contact. Right side: search icon, wishlist heart with count
    badge, cart bag icon with item count.

    Product categories with 4 items each showing name, price, and short description:

    Ceramics: Speckled Dinner Plate Set (4pc) $128 — hand-thrown stoneware, organic
    speckle glaze, 10.5" diameter, colors Bone White/Sage/Dusty Rose. Hand-thrown
    Ceramic Vase $85 — imperfect wobble finish, 12" tall, colors Sand/Charcoal/Ocean.
    Ramen Bowl Duo $72 — chopstick rests in rim, 7" diameter, colors Midnight/Celadon.
    Espresso Cup Set (2pc) $48 — thumb-dimple grip, 3oz, colors Terracotta/Cream/Slate.

    Textiles: Linen Table Runner $65 — stonewashed Belgian linen, raw edge, 14"x72",
    colors Natural/Fog/Terracotta/Olive. Hand-loomed Throw Blanket $195 — Peruvian
    highland wool, 50"x70", Oatmeal/Charcoal Stripe or Rust/Cream Herringbone.
    Organic Cotton Napkin Set (6pc) $54 — GOTS-certified, block-printed, 18"x18".
    Indigo Dyed Pillow Cover $78 — Japanese shibori technique, 20"x20".

    Candles: Cedarwood & Sage Candle 8oz $38 — coconut-soy wax, cotton wick, 45-hour
    burn, reusable terracotta vessel. Lavender Fields Trio Set $89 — three 4oz candles
    gift-boxed with dried lavender sprig. Beeswax Taper Set (4pc) $32 — pure Oregon
    beeswax, 10" tall, hand-dipped. Fireside Amber Candle 12oz $45 — amber resin and
    vetiver, crackling wooden wick, 65-hour burn, matte black ceramic vessel.

    Kitchen: Olivewood Cutting Board $92 — from 100-year-old olive trees in Tunisia,
    16"x10", includes board butter. Brass Measuring Spoons $48 — set of 6 in solid
    brass with leather loop, engraved, hand-finished in Jaipur. Handforged Chef Knife
    8" $165 — high-carbon steel, walnut and brass handle, leather blade guard.
    Ceramic Salt Cellar $36 — open-top with wooden spoon, colors Cream/Sage/Charcoal.

    Skincare: Rosehip Face Oil 1oz $42 — cold-pressed with vitamin E and jojoba,
    amber glass dropper bottle, certified organic. Shea Body Butter 8oz $34 — whipped
    unrefined shea with sweet almond oil, scents Unscented/Vanilla/Citrus/Lavender.
    Charcoal Clay Mask 4oz $28 — bamboo charcoal with kaolin clay and tea tree oil.
    Botanical Hand Cream 3oz $22 — calendula and chamomile, scents Rose/Herb/Unscented.

    Each product card: image placeholder, name, price, "Add to Bag" button, quick-view
    icon. Show "New" badge on 4 items, "Best Seller" on 3 items, "Low Stock" on 2.

    "Our Makers" section: 4 maker profile cards with portrait, name, location, quote.
    Maria Torres, Oaxaca — "Every imperfection in clay is a fingerprint of the maker."
    Akira Yamamoto, Kyoto — "I've shaped clay for 40 years and it still surprises me."
    Ilze Berzina, Riga — "Linen taught me patience. Good things need time."
    Fatima Benali, Atlas Mountains — "My grandmother taught me these patterns."

    "Sustainability" banner: sage green background, 4 stats: "100% Plastic-Free
    Packaging", "Carbon Neutral Shipping", "40-60% Above Fair Trade", "B Corp Certified".

    "Reviews" section: 3 customer reviews with 5-star ratings:
    "The ceramics are even more beautiful in person." — Amanda R., Seattle
    "Bought the throw blanket as a gift and kept it for myself." — Marcus T., Denver
    "A brand that cares about sustainability AND has gorgeous products." — Priya K., Brooklyn

    Newsletter: "Join the Vine — 10% off your first order" with email signup field.

    Footer: 4-column layout. Shop links, About (Our Story, Makers, Sustainability),
    Help (FAQ, Shipping, Returns, Contact), Connect (Instagram @velvetandvine,
    Pinterest). Bottom: © 2025 Velvet & Vine | Privacy | Terms | Accessibility.
    Payment icons: Visa, Mastercard, Amex, Apple Pay, Shop Pay, Afterpay.

systemPrompt: |
  ${common.developPageBase}

  ${common.errorHandlingInstructions}

  ${common.chatInstructions}

  IMPORTANT - During site creation, Airo may ask clarifying questions with
  multiple-choice options. You MUST actively answer these questions by clicking
  on the most relevant option to continue the build process. Do NOT just wait.

goal: |
  The site is being created. During the build process, Airo may ask you
  clarifying questions with multiple-choice options (radio buttons). You must:

  1. If you see a question with options, click the most appropriate answer:
     - For goal questions, pick "Sell products online"
     - For style questions, pick the most warm/minimal/editorial option
     - For any other question, pick the first relevant option
  2. After answering all questions, wait for the site to finish building
  3. The preview iframe should become visible with "Velvet & Vine" content

  Report success once the preview is loaded and showing the site content.
  Do NOT just wait passively - interact with any questions that appear.

chatMessages:
  - "Build a fully interactive shopping cart system. Add a cart icon in the header that shows item count as a badge. When clicked, it opens a slide-out cart drawer from the right side with: each item showing product image placeholder, name, selected variant, unit price, quantity selector (minus/plus buttons with number between them), line total, and a remove (X) button. Below the items show: Subtotal, Estimated Shipping (Free over $150, otherwise $12), Estimated Tax (8.5%), and Order Total. Add a promo code input with 'Apply' button — if the code 'WELCOME10' is entered, show a 10% discount line item. Add 'Continue Shopping' link and a prominent 'Proceed to Checkout' button. When cart is empty, show an illustration placeholder, 'Your bag is empty' message, and a 'Start Shopping' button. Store cart contents in localStorage so they persist across page refreshes. Wire the 'Add to Bag' buttons on all product cards to actually add items to the cart with a brief animation (button text changes to 'Added!' for 2 seconds)."

  - "Build a complete multi-step Checkout page. Step 1 — Contact Information: email input with 'Subscribe to newsletter' checkbox, phone number. Step 2 — Shipping Address: first name, last name, company (optional), address line 1, address line 2 (optional), city, state dropdown (all 50 US states), zip code, country (default US). Add 'Save this address' checkbox. Step 3 — Shipping Method: radio buttons for Standard Shipping ($12, 5-7 business days), Express Shipping ($22, 2-3 business days), Overnight ($35, next business day). Show free shipping badge if order > $150. Step 4 — Payment: credit card number input with card type auto-detection icon (Visa/MC/Amex), expiration date (MM/YY), CVV, name on card. Add icons for accepted payment methods. Show 'Secure checkout' trust badge with lock icon. Below all steps: Order Summary sidebar showing all cart items, subtotal, discount (if applied), shipping, tax, and total. Add 'Place Order' button that validates all fields and shows a success confirmation page with order number (randomly generated), estimated delivery date, and 'Continue Shopping' link. Save the full order to a 'orders' database table with all fields plus order_id, status defaulting to 'pending', and created_at timestamp."

  - "Create a comprehensive Product Detail page template. When any product is clicked, it should navigate to a detail page showing: large product image gallery placeholder (main image + 4 thumbnail slots with click-to-zoom), product name as h1, price with 'or 4 interest-free payments of $X with Afterpay' message, star rating display (4.5 stars default) with review count, color/variant selector as clickable swatches (3-4 options per product), quantity selector, 'Add to Bag' button (full width, primary color) and 'Add to Wishlist' button (outline with heart icon). Below that in tabs: Tab 1 'Details' — 3-paragraph product description, material/dimensions specs in a definition list, care instructions. Tab 2 'Shipping & Returns' — shipping options table and 30-day return policy details. Tab 3 'Reviews' — 4 customer reviews each with: 5-star rating, reviewer name, date, verified purchase badge, review title, review text, and helpful/not helpful vote buttons. Show overall rating breakdown as horizontal bars (5-star: 65%, 4-star: 22%, 3-star: 8%, 2-star: 3%, 1-star: 2%). Add a 'Write a Review' form with rating selector, title, text, and photo upload. Below everything: 'You May Also Like' section showing 4 related product cards. Wire the 'Add to Bag' button to the cart system."

  - "Build a customer Loyalty & Rewards program page. Hero banner: 'The Vine Club — Earn Points on Every Purchase' with 3 tier cards side-by-side. Tier 1 'Seedling' (0-499 points): 1 point per $1 spent, free standard shipping, birthday 10% coupon, early access to sales. Tier 2 'Bloom' (500-1499 points): 1.5 points per $1, free express shipping, birthday 15% coupon, exclusive member-only products, quarterly surprise gift. Tier 3 'Harvest' (1500+ points): 2 points per $1, free overnight shipping, birthday 20% coupon, VIP events, personal shopping consultant, annual $50 credit. Below the tiers: a points redemption chart showing how points convert to rewards (100 pts = $5 off, 250 pts = $15 off, 500 pts = $35 off, 1000 pts = $80 off). Add an interactive points calculator: 'Enter your average monthly spend' number input, and it dynamically calculates: points earned per month, time to reach each tier, annual rewards value. Below that: FAQ accordion with 8 questions about the program (How do I join?, Do points expire?, Can I gift points?, How do I check my balance?, etc.). Add a sign-up form: name, email, birthday (for birthday rewards), 'Join The Vine Club' button. Wire to database table 'loyalty_members' with all fields plus points_balance defaulting to 0, tier defaulting to 'seedling', and joined_at timestamp."

  - "Create a full Journal/Blog section with magazine-quality editorial layout. Featured article at the top spans full width with large image placeholder, category badge 'Behind the Craft', date, 8 min read, title 'The Art of Slow Living: How Our Makers Find Beauty in Imperfection', 3-sentence excerpt about wabi-sabi philosophy in artisan craftsmanship, author 'Elena Park, Creative Director'. Below that: 2-column grid of 8 article cards. Each card: image placeholder, category tag, date, read time, title, 2-sentence excerpt, author. Articles: 1) 'Home & Style' - 'A Ceramicist's Studio in Oaxaca: Inside Maria Torres's Workshop' - 6 min - Visit the sun-drenched studio where our best-selling pottery is hand-thrown. Maria shares her 20-year journey from architect to ceramic artist. By James Liu. 2) 'Recipes' - 'Five Winter Soups That Deserve a Beautiful Bowl' - 4 min - Our favorite seasonal recipes paired with the perfect serving vessels from our collection. From miso ramen to French onion. By Sarah Kim. 3) 'Sustainability' - 'From Seed to Shelf: Tracing Our Candle Supply Chain' - 10 min - We spent 6 months documenting every step of our candle-making process, from the beekeeper in Vermont to our Portland workshop. By Elena Park. 4) 'Gift Guides' - 'The Thoughtful Gift Guide: 20 Gifts Under $75' - 5 min - Curated selections for the host, the homebody, the cook, and the self-care enthusiast. Every item hand-picked by our team. By Maya Chen. 5) 'Behind the Craft' - 'Why We Only Work With Independent Makers' - 7 min - Our founder explains the philosophy behind our sourcing decisions and why we'll never carry mass-produced goods. By Olivia Hart, Founder. 6) 'Home & Style' - 'Small Space, Big Impact: Styling Tips from a 500sqft Portland Apartment' - 5 min - Interior designer Ava Cole transforms a compact studio using key pieces from our textile and ceramics collections. By James Liu. 7) 'Sustainability' - 'The Hidden Cost of Fast Homeware: What the Industry Won't Tell You' - 12 min - An investigative look at the environmental and human cost of cheap home goods, and why investing in quality pays off. By Elena Park. 8) 'Recipes' - 'Summer Entertaining: A Farm-to-Table Dinner Party Menu' - 6 min - A complete 4-course menu with wine pairings, plating tips, and a Spotify playlist. All served on Velvet & Vine tableware. By Sarah Kim. Add category filter pills at the top and a 'Load More' button."

  - "Build a comprehensive Gift Registry system. Create a page 'Gift Registry' accessible from navigation. Landing section: 'Create Your Registry for Any Occasion' with occasion type cards: Wedding, Housewarming, Baby Shower, Birthday, Holiday. Below that: 'Find a Registry' search form with registrant name input and 'Search' button. Create Registry flow as a multi-step wizard: Step 1 — Your Details: names of 1-2 registrants, occasion type dropdown, event date picker, personal message textarea. Step 2 — Select Items: show all products in a grid with 'Add to Registry' buttons. Each added item shows quantity wanted selector (1-10) and priority level (Must Have/Nice to Have/Dream Item). Show running count of items added. Step 3 — Sharing Preferences: generate a unique registry URL, toggle to make registry public or private, option to add a cover photo, select a theme/color for registry page. Step 4 — Review and publish showing all selections in a summary table. The public registry page should show: registrant names, occasion, event date, personal message, progress bar showing 'X of Y items fulfilled', and product grid where each item shows: image, name, price, quantity requested vs. purchased, and a 'Purchase This Gift' button that adds it to the visitor's cart with a gift note option. Wire registry data to 'gift_registries' table with registrant_names, occasion, event_date, message, unique_url, is_public, created_at. Wire registry items to 'gift_registry_items' table with registry_id, product_name, quantity_wanted, quantity_purchased, priority."

  - "Build a complete Store Locator and Stockist page. Hero: 'Find Velvet & Vine Near You' with a large search input 'Enter city or zip code' and a 'Find Stores' button. Below that: a split layout. Left side: scrollable list of 10 retail stockist locations, each showing: store name, store type badge (Flagship/Boutique Partner/Pop-up), full address, phone number, hours (with today's hours highlighted in green if currently open), distance from searched location, and 2 action buttons: 'Get Directions' and 'View Store Details'. Right side: a styled map placeholder (large rectangle with the 10 location pins numbered to match the list). The 10 stores: 1) Velvet & Vine Flagship - 820 NW 23rd Ave, Portland OR - Full collection + exclusive items - Mon-Sat 10am-7pm, Sun 11am-5pm. 2) Commune Design - 3528 W 3rd St, Los Angeles CA - Curated selection - Tue-Sat 11am-6pm. 3) The Primary Essentials - 372 Atlantic Ave, Brooklyn NY - Ceramics & candles - Mon-Sun 11am-7pm. 4) Canoe - 1136 SW Alder St, Portland OR - Kitchen & textiles - Mon-Sat 10am-6pm, Sun 12pm-5pm. 5) Mociun - 224 Wythe Ave, Brooklyn NY - Skincare & ceramics - Daily 12pm-7pm. 6) Parachute Home - 1932 N Milwaukee Ave, Chicago IL - Textiles collection - Mon-Sat 10am-6pm, Sun 11am-5pm. 7) Yowie - 1700 Sansom St, Philadelphia PA - Full collection - Wed-Sun 11am-6pm. 8) Coming Soon - 53 Canal St, New York NY - Candles & accessories - Daily 12pm-8pm. 9) Pop-up at Ponce City Market - 675 Ponce de Leon Ave, Atlanta GA - Seasonal pop-up, open through March - Thu-Sun 11am-7pm. 10) The Good Liver - 2431 Bartlett St, Houston TX - Skincare & candles - Tue-Sat 10am-6pm. Below the map section: 'Become a Stockist' section with a form: store name, contact name, email, phone, website URL, store address, how many years in business dropdown, product categories interested in (multi-select checkboxes), average monthly foot traffic dropdown, and message textarea. Wire to 'stockist_applications' database table."

  - "Build an advanced Product Filtering and Search system. Replace the basic product grid with a sophisticated shopping experience. Left sidebar with filters: Category (checkboxes for Ceramics, Textiles, Candles, Kitchen, Skincare with item counts), Price Range (dual-handle range slider from $0 to $200 with min/max number inputs), Material (checkboxes: Ceramic/Stoneware, Linen, Cotton, Beeswax, Soy Wax, Wood, Brass, Glass), Availability (In Stock, Pre-order, Made to Order), Rating (clickable star ratings 4+, 3+, 2+), Special (New Arrivals, Best Sellers, Sale Items, Gift Sets). Above the product grid: sort dropdown (Featured, Price Low to High, Price High to Low, Newest, Best Selling, Top Rated), view toggle (grid 3-col / grid 2-col / list view), results count ('Showing 24 of 48 products'), and active filter chips that can be individually removed with X buttons, plus 'Clear All' link. The product grid should support infinite scroll — show 12 products initially, load 12 more as user scrolls near bottom, with a loading spinner. In list view, each product shows: larger image, name, price, 2-line description, star rating, 'Quick Add' and 'View Details' buttons. Add a full-width search bar in the header with autocomplete suggestions that shows: 3 product suggestions with thumbnail/name/price, 2 category suggestions, and 1 journal article suggestion as user types. Add 'No results' state with suggestions and a 'Trending Now' section showing 4 popular products."

  - "Build a complete Wishlist system with social sharing. Add a heart icon next to the cart icon in the header showing wishlist count. Every product card and product detail page gets a heart toggle button. When clicked, it toggles the item in/out of the wishlist with a brief heart-fill animation. The Wishlist page (accessible from header icon and user menu) shows: 'My Wishlist (X items)' heading, sharing buttons (Copy Link, Email, Pinterest), and a grid of wishlisted products. Each wishlisted item shows: image, name, price, stock status (In Stock in green, Low Stock in orange, Out of Stock in red), date added, 'Move to Bag' button, and remove button. Add a 'Share Your Wishlist' feature: generate a unique URL that creates a read-only public version of the wishlist (useful for gift-giving). Add 'Price Drop Alert' toggle per item — when enabled, show a bell icon indicating the user will be notified (store preference). Below the wishlist: 'Recommended For You' section showing 4 products based on wishlist categories. Store wishlist in localStorage for anonymous users. Add an optional 'Save Wishlist to Account' form with name and email that wires to a 'wishlists' database table with visitor_name, email, items as JSON, shared_url, created_at, and updated_at."

  - "Build a comprehensive Returns & Exchanges portal. Create a 'Returns' page accessible from footer navigation. Top section: policy summary in 3 icon-cards: '30-Day Returns' (with clock icon), 'Free Return Shipping' (with truck icon), 'Easy Exchanges' (with refresh icon). Below that: 'Start a Return' multi-step form wizard. Step 1 — Find Your Order: order number input and email input, 'Look Up Order' button. Step 2 — Select Items to Return: show a mock order with 3 items, each with checkbox to select, quantity to return (dropdown), return reason dropdown (Changed my mind, Wrong size, Defective/Damaged, Not as described, Arrived too late, Other), and optional details textarea. Step 3 — Choose Resolution: radio buttons for Full Refund (to original payment, 5-7 business days), Store Credit (instant, +10% bonus credit), Exchange (select new size/variant). Step 4 — Shipping Method: radio buttons for 'Print prepaid label' (free, drop at any UPS location), 'QR code for carrier drop-off' (free, no printer needed), 'Schedule a pickup' ($5 fee, select date). Step 5 — Confirmation: summary of return, estimated refund timeline, return tracking number (generated), and printable packing slip. Below the wizard: FAQ accordion with 10 questions (Can I return sale items?, What if my item arrived damaged?, How long do refunds take?, Can I exchange for a different product?, Do I need the original packaging?, What items are final sale?, Can I return a gift?, How do I track my return?, What if I miss the 30-day window?, International return policy). Wire return requests to 'return_requests' database table with order_number, email, items_json, resolution_type, shipping_method, return_tracking_number, status defaulting to 'initiated', and created_at."

  - "Now completely overhaul the site's visual design system for a luxury editorial rebrand. Change the color palette to: primary deep burgundy #722F37, secondary warm ivory #FFFEF2, accent brushed gold #C9A96E, text near-black #1C1C1C, muted warm gray #9A9590. Apply a new typography system: headings in a refined serif (like Cormorant Garamond), body text in a modern humanist sans-serif, accent text in an elegant italic serif for quotes and callouts. Update every section across the entire site: hero gets a layered parallax-style layout with burgundy overlay on image, all buttons become rounded with subtle shadow and gold border on hover, product cards get a refined shadow with burgundy accent line on top, section transitions use subtle cream-to-white gradients, testimonials and quotes use large decorative quotation marks in gold, the navigation gets a transparent-to-solid scroll effect with the logo in brushed gold, footer gets a full dark burgundy treatment with ivory text and gold accent links. Add micro-interactions: buttons scale slightly on hover, product images zoom 5% on hover, section headings fade in as you scroll to them, the 'Add to Bag' button has a ripple effect on click. This should touch every component across every page of the site to create a cohesive ultra-premium feel."

qualityEval:
  enabled: true
  siteType: ecommerce
  thresholds:
    minOverallScore: 50
    minPerformance: 30
    minAccessibility: 60

cleanup:
  deleteAllSitesViaAPI: false
