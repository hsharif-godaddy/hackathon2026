# Credit-based build scenario: simple landing page (~10 credits)
name: Credit Build - Small Landing Page
description: |
  Build a simple personal trainer landing page with minimal modifications.
  Exercises basic site creation and a few refinement messages within a
  small credit budget. Validates the lightest-weight build path.

startUrl: https://airo-builder.godaddy.com
timeout: 900000 # 15 minutes
maxSteps: 50
stepsPerMessage: 20
headed: false

credentials:
  username: ${TEST_USERNAME}
  password: ${TEST_PASSWORD}

# Small credit limit for a quick, simple build
creditLimit: 10

sitePrompt:
  prompt: |
    I'm a personal trainer named Alex Carter in Austin, Texas.
    I need a simple one-page website.

    Design: Clean and energetic. Bold black and bright orange (#FF6B35) accent.
    White background, modern sans-serif font.

    Hero section with my name "Alex Carter — Personal Training", tagline
    "Get Stronger. Feel Better. Live More." and a "Book a Session" CTA button.

    About section: Certified personal trainer with 5 years experience, ACE and
    NASM certified. Specializing in strength training and weight loss.

    Services: 3 cards — One-on-One Training ($75/session), Group Classes
    ($30/person), Online Coaching ($199/month).

    Contact: Phone 512-555-0101, email alex@alexcarterfit.com,
    Instagram @alexcarterfit.

systemPrompt: |
  ${common.developPageBase}

  ${common.errorHandlingInstructions}

  ${common.chatInstructions}

  IMPORTANT - During site creation, Airo may ask clarifying questions with
  multiple-choice options. You MUST actively answer these questions by clicking
  on the most relevant option to continue the build process. Do NOT just wait.

goal: |
  The site is being created. During the build process, Airo may ask you
  clarifying questions with multiple-choice options (radio buttons). You must:

  1. If you see a question with options, click the most appropriate answer:
     - For goal questions, pick "Get appointments" or "Promote services"
     - For style questions, pick the most energetic/modern option
     - For any other question, pick the first relevant option
  2. After answering all questions, wait for the site to finish building
  3. The preview iframe should become visible with "Alex Carter" content

  Report success once the preview is loaded and showing the site content.
  Do NOT just wait passively - interact with any questions that appear.

# Chat messages sent one-by-one until credit limit is reached.
chatMessages:
  - "Add a testimonials section with 3 client reviews. 1) 'Alex helped me lose 30 pounds in 4 months. Best investment I ever made.' — Sarah M. 2) 'The group classes are incredible. High energy and great community.' — Marcus T. 3) 'Online coaching fits my travel schedule perfectly. Highly recommend.' — Priya K. Show star ratings (5 stars each) and style with a light gray background."

  - "Add a simple FAQ section with 4 questions in an accordion: 'What should I bring to my first session?' (Comfortable workout clothes, water bottle, and a towel), 'Do you offer free consultations?' (Yes, a free 15-minute phone consultation), 'What is your cancellation policy?' (24-hour notice required), 'Where do sessions take place?' (Downtown Austin gym at 500 Congress Ave or outdoor at Zilker Park)."

  - "Add a weekly class schedule section showing Monday through Friday. Monday: HIIT 6am & Strength 5pm. Tuesday: Yoga 7am & Boxing 6pm. Wednesday: HIIT 6am & Core 5pm. Thursday: Strength 7am & Cardio 6pm. Friday: Full Body 6am. Style as a clean grid table with alternating row colors."

qualityEval:
  enabled: true
  siteType: service-business
  thresholds:
    minOverallScore: 50
    minPerformance: 30
    minAccessibility: 60

cleanup:
  deleteAllSitesViaAPI: false
