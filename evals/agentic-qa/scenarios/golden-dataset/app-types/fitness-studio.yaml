# Test creating a fitness studio website with rich content, design specs, and chat mods
name: Create Fitness Studio Site
description: |
  Create a boutique fitness studio website with full weekly schedule,
  trainer profiles with certifications, membership tiers, facility amenities,
  then use chat to add a free trial form and class schedule table.

startUrl: https://airo-builder.godaddy.com
timeout: 600000  # 10 minutes (creation + 2 chat modifications)
maxSteps: 90
headed: false

credentials:
  username: ${TEST_USERNAME}
  password: ${TEST_PASSWORD}

sitePrompt:
  prompt: |
    Opening my boutique fitness studio ZenFit in Venice Beach. Need a website that converts visitors to members. Energetic but zen, like a balance between CrossFit intensity and yoga calm.

    Design: Teal and white color scheme with coral accent for CTAs. Fresh and energetic like ClassPass or Mindbody. Use a bold condensed font for headings and a clean sans-serif for body. Class schedule should display as a weekly grid/table on desktop and a scrollable list on mobile. Hero with a high-energy group class photo and an overlapping "First Class Free" badge.

    Hero: "Transform Your Body, Free Your Mind" with a "Book Your Free Class" button and "View Schedule" secondary link.

    Full weekly class schedule:
    Monday: 6am Morning Flow Yoga (60min), 8am Power Vinyasa (75min), 12pm Express HIIT (30min), 5:30pm Strength & Sculpt (60min), 7pm Candlelight Yin (75min)
    Tuesday: 6am Sunrise Bootcamp (45min), 8am Pilates Reformer (50min), 12pm Power Lunch Yoga (45min), 5:30pm HIIT Bootcamp (60min), 7pm Barre Fusion (50min)
    Wednesday: 6am Morning Flow Yoga (60min), 8am Power Vinyasa (75min), 12pm Express HIIT (30min), 5:30pm Kickboxing Cardio (60min), 7pm Restorative Yoga (75min)
    Thursday: 6am Sunrise Bootcamp (45min), 8am Pilates Reformer (50min), 12pm Power Lunch Yoga (45min), 5:30pm HIIT Bootcamp (60min), 7pm Barre Fusion (50min)
    Friday: 6am Morning Flow Yoga (60min), 8am Strength & Sculpt (60min), 12pm Express HIIT (30min), 5:30pm Happy Hour Yoga (60min)
    Saturday: 8am Weekend Warrior Bootcamp (75min), 10am Power Pilates (60min), 12pm Community Yoga (free, 60min)
    Sunday: 9am Meditation & Breathwork (45min), 10:30am Slow Flow Yoga (75min)

    Trainer profiles with certifications:
    - Sarah Kim - E-RYT 500 Certified Yoga Instructor, 10+ years experience, trained in Mysore India. Specialty: vinyasa flow and meditation. Former dancer with Alvin Ailey. Quote: "Yoga changed my life. I want to share that transformation."
    - Marcus Johnson - NASM Certified Personal Trainer, CSCS Strength & Conditioning Specialist. Former D1 football player (USC). 8 years coaching experience. Specialty: HIIT and functional strength. Known for tough-love motivation.
    - Elena Reyes - STOTT Pilates certified, trained at Body Arts and Science International in Germany. 12 years experience. Specialty: reformer Pilates and injury rehabilitation. Also certified in pre/postnatal fitness.
    - Kai Nakamura - ACE Certified Group Fitness Instructor, 3rd degree black belt in karate. 6 years experience. Specialty: kickboxing cardio and barre fusion. Brings martial arts discipline to every class.

    Membership tiers:
    - Drop-in: $25/class - No commitment, pay as you go
    - 10-Class Pack: $200 ($20/class) - Valid for 3 months, share with a friend
    - Monthly Unlimited: $149/month - Unlimited classes, 10% retail discount, guest passes
    - Annual Unlimited: $1,299/year ($108/month) - Best value, unlimited classes, 20% retail discount, 2 free guest passes/month, priority booking
    - Student/Military: $99/month unlimited with valid ID
    First class is always free for new members. No enrollment fees.

    Facility amenities: Heated studio for hot yoga, Pilates reformer room with 10 machines, strength training area with free weights and kettlebells, showers with organic toiletries, lockers (rental $10/month), mat and towel rental ($3), smoothie bar with protein shakes, free wifi, and street parking plus bike racks.

    Address: 1847 Pacific Avenue Venice CA 90291. Phone 310-555-0163. Email hello@zenfitvenice.com.

    Hours: Mon-Fri 5:30am-9pm, Sat 7:30am-2pm, Sun 8:30am-12:30pm.

    Footer with Instagram @zenfitvenice, YouTube channel for at-home workouts, Yelp reviews. Newsletter signup: "Get weekly class updates and wellness tips." Copyright 2024 ZenFit Venice.

systemPrompt: |
  ${common.developPageBase}

  ${common.errorHandlingInstructions}

  ${common.chatInstructions}

  Chat messages to send (in order):
  1. "Can you add a free trial signup form? I need fields for name, email, phone, fitness goals (dropdown: weight loss, muscle building, flexibility, stress relief, general fitness), and preferred class type. Put a big 'Claim Your Free Class' button."
  2. "Can you show the weekly class schedule as a proper table or grid? Days across the top, time slots down the side, with class names and instructor in each cell. Color code it so yoga classes are teal, HIIT/bootcamp are coral, and Pilates/barre are gold."

goal: |
  Send 2 chat messages to modify the site. Success criteria:
  - Site creation completed with class information displayed
  - "ZenFit" studio name is prominent
  - Class schedule with at least 5 different class types visible
  - At least 3 trainer profiles with names and certifications
  - Membership tiers with prices (Drop-in $25, Monthly $149, Annual $1,299)
  - Facility amenities mentioned
  - Free trial signup form was added after first chat message
  - Schedule displayed as table/grid after second chat message
  - Address showing "1847 Pacific Avenue" visible

  Report success if the site has trainers, schedule, memberships, and at least 1 of the 2 chat modifications are visible.

qualityEval:
  enabled: true
  siteType: fitness
  thresholds:
    minOverallScore: 60
    minPerformance: 40
    minAccessibility: 70
