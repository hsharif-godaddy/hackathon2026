# Full publish lifecycle: create, edit, publish, verify live, post-publish edit
# Differs from edit-after-publish.yaml by explicitly verifying publish success
# state (alert appeared, button becomes disabled) rather than only testing
# edit persistence as a regression check.
name: Publish Lifecycle
description: |
  Create a simple landing page, make a pre-publish edit, publish the site via
  the header Publish button, verify the publish succeeded (success alert and
  disabled publish button), then make a post-publish edit and confirm it appears
  in the preview. Tests the complete publish lifecycle end-to-end.

startUrl: https://airo-builder.godaddy.com
timeout: 600000 # 10 minutes
maxSteps: 60
stepsPerMessage: 15
headed: false

credentials:
  username: ${TEST_USERNAME}
  password: ${TEST_PASSWORD}

sitePrompt:
  prompt: |
    Create a simple one-page landing page for a yoga studio called "Calm Flow Yoga".
    Include a hero section with heading "Calm Flow Yoga" and tagline "Find your balance."
    Add a class schedule section with 3 classes: Morning Flow (7am), Power Yoga (12pm),
    and Restorative (6pm). Include a contact section with email hello@calmflowyoga.com.
    Keep it minimal with a soft blue and white color scheme.

systemPrompt: |
  ${common.developPageBase}

  ${common.errorHandlingInstructions}

  ${common.chatInstructions}

  ${common.waitInstructions}

  You need to test the full publish lifecycle. Follow these steps exactly:

  STEP 1 - PRE-PUBLISH EDIT:
  Send this chat message: "Add a testimonial section with a quote from Sarah M. saying 'Calm Flow changed my life. I feel stronger and more centered than ever.'"
  Wait for the change to appear in the preview. Verify the testimonial text is visible.

  STEP 2 - PUBLISH THE SITE:
  Find and click the Publish button in the header/toolbar area at the top of the page.
  If a publish confirmation dialog or popover appears, confirm and proceed with the publish.
  Wait for the publish process to complete. You should see a success alert or message
  indicating the site was published successfully.
  If a "Go Live" modal appears after publish, dismiss it by clicking "Later" or closing it.

  STEP 3 - VERIFY PUBLISH SUCCESS:
  After publishing, check that:
  - A success alert or notification appeared (look for text like "published" or "live")
  - The Publish button in the header is now disabled (grayed out), meaning there are
    no unpublished changes — this confirms the publish completed successfully

  STEP 4 - POST-PUBLISH EDIT:
  After publish completes, send this chat message: "Change the tagline to 'Breathe. Move. Transform.'"
  Wait for the change to appear in the preview.

  STEP 5 - VERIFY POST-PUBLISH EDIT:
  Check that the preview shows the updated tagline "Breathe. Move. Transform."
  This confirms that editing still works after publishing.

goal: |
  Complete all 5 steps in order. Success criteria:

  1. PRE-PUBLISH EDIT: The testimonial from Sarah M. was added to the site
  2. PUBLISH: The Publish button was clicked and the publish process completed
  3. PUBLISH VERIFICATION: A success alert appeared AND the Publish button is disabled
  4. POST-PUBLISH EDIT: The chat message to change the tagline was sent and processed
  5. POST-PUBLISH VERIFICATION: The preview shows "Breathe. Move. Transform."

  Report success if:
  - The publish completed (success alert appeared or site is confirmed live)
  - AND the post-publish edit appears in the preview

  Report FAILURE if:
  - The publish button could not be found or clicked
  - The publish process failed or timed out with no success indication
  - The post-publish edit does not appear in the preview
  - The chat becomes unresponsive after publish

cleanup:
  deleteAllSitesViaAPI: false
