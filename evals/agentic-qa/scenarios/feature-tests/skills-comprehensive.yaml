# Multi-skill verification: database, blog, SEO, and media in a single site build
name: Skills Comprehensive
description: |
  Create a restaurant website with a reservation form, then send 4 chat
  messages that each trigger a different agent skill: database (wire form),
  blog (add posts), SEO (meta tags and structured data), and media (replace
  hero image). Verifies that the builder can load and execute multiple skills
  within one session.

startUrl: https://airo-builder.godaddy.com
timeout: 900000 # 15 minutes (creation + 4 skill-heavy chat modifications)
maxSteps: 100
stepsPerMessage: 15
headed: false

credentials:
  username: ${TEST_USERNAME}
  password: ${TEST_PASSWORD}

sitePrompt:
  prompt: |
    Create a website for a small Italian restaurant called "Trattoria Sole" in Austin TX.

    Design: Warm terracotta and cream color scheme. Clean modern layout with
    Playfair Display for headings and a sans-serif body font.

    Hero section with heading "Trattoria Sole" and tagline "Authentic Italian
    flavors in the heart of Austin." Include a "Reserve a Table" call-to-action button.

    Menu section with at least 6 dishes across Antipasti, Mains, and Desserts
    categories. Each dish should show name, short description, and price.

    Reservation form with fields: Name, Email, Phone, Date, Time, Party Size,
    and a Submit button.

    About section: Family-owned since 2010, Chef Rosa Marchetti brings
    traditional Tuscan recipes passed down for three generations.

    Footer with address 401 Congress Ave Austin TX 78701, phone 512-555-0198,
    and social links for Instagram and Facebook.

systemPrompt: |
  ${common.developPageBase}

  ${common.errorHandlingInstructions}

  ${common.chatInstructions}

  ${common.waitInstructions}

  You need to test 4 different Airo Builder skills by sending chat messages.
  Follow these steps exactly in order:

  STEP 1 - DATABASE SKILL:
  Send this chat message: "I need the reservation form to save submissions to a database so I can view all bookings. Store the name, email, phone, date, time, and party size."
  Wait for the AI to finish processing. The agent should load the database skill and wire the form.

  STEP 2 - BLOG SKILL:
  Send this chat message: "Add a blog section to the site with 2 posts: one titled 'Our New Summer Menu' about seasonal dishes, and another titled 'Meet Chef Rosa' about the chef's background."
  Wait for the AI to finish. The agent should load the blog skill and create blog pages.

  STEP 3 - SEO SKILL:
  Send this chat message: "Optimize this site for search engines. Add proper meta descriptions, Open Graph tags for social sharing, and structured data for the restaurant."
  Wait for the AI to finish. The agent should load the SEO skill.

  STEP 4 - MEDIA SKILL:
  Send this chat message: "Replace the hero image with a professional photo of Italian pasta from the media library."
  Wait for the AI to finish. The agent should use the media skill to find and insert an image.

goal: |
  Send 4 chat messages, each exercising a different skill. ALL 4 skills must
  succeed. Use observable checks — do not rely only on the agent saying it
  succeeded.

  Success criteria (verify each one in the preview):

  1. DATABASE: The reservation form shows a connected/submitted state, or the
     agent's chat response explicitly mentions the form is wired to a database
     and no errors appeared during the process.
  2. BLOG: A blog section or blog page links are visible on the site with at
     least one of the requested post titles ("Our New Summer Menu" or
     "Meet Chef Rosa") appearing in the preview.
  3. SEO: Open the preview page source or inspect the page head — verify that
     a <meta name="description"> tag or an og: meta tag is present. If you
     cannot inspect source, confirm the agent's response described specific
     tags it added (not just "I optimized SEO").
  4. MEDIA: The hero image <img> src changed from the original placeholder.
     Verify the preview hero area shows a different image than before the
     chat message was sent.

  Report success ONLY if ALL 4 skill modifications produced observable results.

  Report FAILURE and name the specific skill(s) that failed if:
  - Any skill modification did not produce an observable change
  - A chat message was sent but the agent errored or did not complete the task
  - The site failed to create
  - Persistent errors blocked the chat from working

qualityEval:
  enabled: true
  siteType: restaurant
  thresholds:
    minOverallScore: 50
    minPerformance: 30
    minAccessibility: 60

cleanup:
  deleteAllSitesViaAPI: false
