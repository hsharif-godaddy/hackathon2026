# Database skill end-to-end: wire form to DB, fill it out, verify in Settings
name: Database Skill
description: |
  Create a site with a simple text-only contact form (no date pickers),
  wire it to a database, fill it out in preview, then verify the row
  in Settings > Database.

startUrl: https://airo-builder.godaddy.com
timeout: 600000 # 10 minutes
maxSteps: 80
stepsPerMessage: 10
headed: false

credentials:
  username: ${TEST_USERNAME}
  password: ${TEST_PASSWORD}

sitePrompt:
  prompt: |
    Create a one-page site for "Happy Paws Dog Walking" with a booking form fast and simple.
    Form fields: Owner Name (text), Email (email), Phone (text), Dog Name (text),
    and a Submit button. No date picker — all fields must be plain text or email inputs.
    Connect the form to a database so submissions are saved.
    Keep it minimal and make it fast.

systemPrompt: |
  ${common.developPageBase}

  ${common.errorHandlingInstructions}

  ${common.chatInstructions}

  ${common.waitInstructions}

  IMPORTANT — work efficiently. Do not retry a failing action more than twice.
  If an element cannot be found, try a different approach or skip to the next step.

  The site prompt already asked to connect the form to a database.
  Wait for site creation to complete, then proceed directly to filling the form.

  STEP 1 - FILL THE FORM IN PREVIEW:
  Do NOT try to interact with the iframe. Instead, open the preview in a new tab:
  Click the "Visit Site" button in the top toolbar, then click "Visit Preview".
  This navigates to the live preview URL. Dismiss any cookie banner.
  Scroll down to find the booking form. Fill in the fields:
  - Owner Name: "Jane Test"
  - Email: "jane.test@example.com"
  - Phone: "555-0199"
  - Dog Name: "Buddy"
  Click the Submit button.

  STEP 2 - VERIFY DATABASE ENTRY:
  Navigate back to the develop page using goto (use the URL from before).
  Click the Settings tab in the chat toolbar.
  Click "Database" in the settings nav. Verify a table exists, then click
  the table name or "Edit table" to open the data browser.
  Look for a row containing "Jane Test" and "jane.test@example.com".
  Click refresh if available. This proves the database skill works end-to-end.

goal: |
  Complete both steps. Success criteria:

  1. FORM SUBMITTED: The form was filled with test data and submitted
  2. DATABASE ENTRY: Settings > Database shows a table with a row containing
     "Jane Test" and "jane.test@example.com"

  Report success ONLY if Step 2 passes.

  Report FAILURE and describe what went wrong if:
  - The form could not be filled or submitted
  - No table appeared in Settings > Database
  - The row does NOT appear in the database table viewer

cleanup:
  deleteAllSitesViaAPI: false
