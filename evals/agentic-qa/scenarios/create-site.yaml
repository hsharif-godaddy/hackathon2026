# Agentic version of tests/smoke/user-journey.spec.ts

name: Create Hello World Site
description: |
  Create a professional consulting website using Airo Builder,
  then use chat to make 5 modifications to the site.
  Tests the full iterative design workflow.

startUrl: https://airo-builder.godaddy.com
timeout: 900000 # 15 minutes (site creation + 5 chat interactions)
maxSteps: 100
headed: false

credentials:
  username: ${TEST_USERNAME}
  password: ${TEST_PASSWORD}

sitePrompt:
  prompt: |
    Launching my freelance consulting business and need a professional website called Summit Consulting.

    Design: Modern forest green and white color scheme, clean and trustworthy like Stripe or Linear. Use Inter for headings and a clean sans-serif for body text. Hero should be full-width with a subtle gradient overlay. Services in a 2-column card layout on desktop, stacked on mobile. Plenty of whitespace.

    Clean hero section with tagline "Elevate Your Business" and subtext about helping small businesses grow. Big "Book a Call" button in the hero and a secondary "Learn More" link.

    About section explaining I help small businesses with strategy and growth. 10 years of experience working with Fortune 500 companies before going independent. Based in Austin TX.

    Contact form with Name, Email, Company, Message fields and a Submit button.

systemPrompt: |
  ${common.developPageBase}

  ${common.errorHandlingInstructions}

  ${common.chatInstructions}

  Chat messages to send (in order):
  1. "Actually, can we try a forest green color scheme instead? I think it feels more grounded and trustworthy for consulting"
  2. "Can you add a testimonials section? I have 3 clients - Sarah from TechStart who said I helped them 2x their revenue, Mike from GreenLeaf Cafe who said I transformed their operations, and Lisa from Bloom Marketing who said my strategy sessions were game-changing"
  3. "Change the main headline to 'Transform Your Business, Accelerate Your Growth' - I think that's more compelling"
  4. "I need a services section showing my 4 main offerings: Business Strategy ($500/session), Growth Consulting ($2000/month), Team Workshops ($1500/day), and Executive Coaching ($300/hour)"
  5. "Make the footer darker with my social links - I'm on LinkedIn, Twitter and have a Calendly for bookings. Also add a small copyright notice"

goal: |
  Send 5 chat messages to modify the site. Success criteria:
  - All 5 chat messages were sent successfully
  - Site shows green color scheme (changed from blue)
  - Testimonials section is visible with client names (Sarah, Mike, Lisa)
  - Headline reads "Transform Your Business, Accelerate Your Growth"
  - Services section with 4 offerings and prices ($500, $2000, $1500, $300)
  - Footer is dark with social icons (LinkedIn, Twitter, Calendly)

  Report success if at least 3 of the 5 modifications are visible in the preview.

qualityEval:
  enabled: true
  siteType: service-business
  thresholds:
    minOverallScore: 60
    minPerformance: 40
    minAccessibility: 70
