# Minimal scenario for quick testing — create a site with no chat modifications
name: Hello World
description: |
  Create a simple hello world landing page with zero follow-up messages.
  Fastest possible scenario for validating the pipeline end-to-end.

startUrl: https://airo-builder.godaddy.com
timeout: 300000 # 5 minutes
maxSteps: 30
stepsPerMessage: 10
headed: false

credentials:
  username: ${TEST_USERNAME}
  password: ${TEST_PASSWORD}

sitePrompt:
  prompt: |
    Create a simple one-page hello world website.
    Just a centered heading "Hello World" and a short tagline "Welcome to my site."
    Keep it minimal — white background, dark text, one section only.

systemPrompt: |
  ${common.developPageBase}

  ${common.errorHandlingInstructions}

  IMPORTANT - During site creation, Airo may ask clarifying questions with
  multiple-choice options. You MUST actively answer these questions by clicking
  on the most relevant option to continue the build process. Do NOT just wait.

goal: |
  Wait for the site to finish building. If Airo asks clarifying questions
  with options, click the most reasonable answer.

  Report success once the preview iframe is visible and showing content.

qualityEval:
  enabled: true
  siteType: landing-page
  thresholds:
    minOverallScore: 30
    minPerformance: 20
    minAccessibility: 30

cleanup:
  deleteAllSitesViaAPI: false
