# Agent Correction Quality: validates agent handles sequential same-section edits without regression
# Covers: USER_CORRECTION friction detection + agent quality under correction pressure
# Target failure: stale str_replace old_str after agent's own prior edit (30-50% failure rate)
name: User Correction Friction
description: |
  Tests the agent's ability to correctly apply sequential corrections to the SAME
  section of code — the #1 agent failure mode from Langfuse production traces.

  The agent edits section A → user asks to modify section A again → agent uses
  stale old_str (from before its own edit) → "No match found" → enters recovery loop.

  The chat messages form a "same-section double-edit trap":
    1. Create a pricing section with 3 tier cards
    2. Modify the Pro tier IN the same section (forces re-read of own output)
    3. Reorder cards IN the same section (regression trap — must use post-edit-2 state)

  Assertions (hard-gating — scenario fails if any miss):
    - requiredTools: agent must have used str_replace_based_edit_tool (real edits, not just ack)
    - expectedFrictionPatterns: USER_CORRECTION must be detected (user corrects agent's work)

  Metrics (non-gating — reported but do not fail the scenario):
    - qualityEval: evaluates final preview output (functional/visual score tracked in report)

  When this fails, the developer signal is:
    - requiredTools miss → agent gave up and stopped editing
    - friction not detected → friction detector regression
    - quality check fails → agent used stale context / regressed earlier edit

startUrl: https://airo-builder.godaddy.com
timeout: 900000
maxSteps: 80
stepsPerMessage: 20
headed: false

qualityEval:
  enabled: true
  siteType: service-business
  skipCategories:
    - performance
    - seo
    - accessibility

credentials:
  username: ${TEST_USERNAME}
  password: ${TEST_PASSWORD}

sitePrompt:
  prompt: |
    Create a simple business landing page for "Bright Solutions Consulting".
    Include a hero section with heading and CTA button, a 3-column services section,
    and a footer with contact info. Color scheme: white background, dark navy text (#1a1a3e),
    green accent (#2ecc71).

goal: |
  Validate the agent correctly applies sequential same-section corrections without regression.

  Success criteria (all must hold in final preview):
  1. Pricing section exists with 3 cards
  2. Middle card is "Enterprise" ($199/mo, unlimited) — moved from position 3
  3. First card is "Basic" ($29/mo, 5 users) — unchanged
  4. Last card is "Business" (renamed from Pro, $99/mo, 6 features, "Most Popular" CTA)
  5. "Compare All Plans" link visible below the cards

  Failure diagnosis (for developers):
  - If str_replace "No match found" errors appear: agent used stale file context
  - If earlier edits are lost (e.g., Pro still shows instead of Business): regression bug
  - If duplicate sections appear: agent added instead of replacing

# creditLimit enables credit-mode in runner.ts, which gates chatMessages delivery.
# Budget of 45 credits ensures all 3 messages are processed even if message 1
# (building pricing from scratch) consumes 10-15 credits. Each correction is lighter (~3-5).
creditLimit: 45

# USER_CORRECTION detection requires at least 2 messages (detector needs timestamps
# of consecutive messages to identify correction patterns). Require 2 as minimum.
minChatMessages: 2

# Assert agent actually performed str_replace edits (not just text generation)
requiredTools:
  - name: str_replace_based_edit_tool
requiredToolMatchMode: all

# Assert that the friction detector identifies USER_CORRECTION — the user sending
# follow-up messages after agent completed work always fires this pattern regardless
# of whether the agent succeeded or failed at applying the correction.
expectedFrictionPatterns:
  - "USER_CORRECTION"
frictionPatternMatchMode: any

chatMessages:
  - "Add a pricing section below the services section. Create 3 pricing tier cards side by side: Basic ($29/mo, 5 users, 4 features: Email support, 1 project, Basic analytics, Community access), Pro ($79/mo, 25 users, 4 features: Priority support, 10 projects, Advanced analytics, API access), and Enterprise ($199/mo, unlimited users, 4 features: Dedicated support, Unlimited projects, Custom analytics, Custom integrations). Each card needs a title, price, feature list, and green CTA button saying 'Get Started'."
  - "In the pricing section you just created, change the Pro tier: rename it to 'Business', update the price to $99/mo, and expand its feature list to 6 items (keep the original 4 and add: Team collaboration, White-label reports). Change its CTA button text to 'Most Popular' and add a highlighted border in the accent color around that card only."
  - "Now in the same pricing section, move the Enterprise card to the MIDDLE position (so the order is Basic, Enterprise, Business from left to right), and add a 'Compare All Plans' text link centered below all three cards."

cleanup:
  deleteAllSitesViaAPI: false
