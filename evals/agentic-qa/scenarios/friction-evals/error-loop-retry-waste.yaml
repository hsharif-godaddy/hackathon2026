# Error Loop & Retry Waste Detection: captures retry bursts, abort loops, and wasted tool cost
# Covers: ERROR_LOOP, ABORT_LOOP, NULL_ERROR_LOOP, RAPID_RETRY, TOOL_TIMEOUT, STUCK_DRIFT
name: Error Loop & Retry Waste
description: |
  Exercises complex build-then-modify patterns that are known to trigger agent
  error loops, retry bursts, and tool timeouts. Captures per-session metrics
  for retry classification, escalation state tracking, and cost attribution.

  Failure types targeted:
    - ERROR_LOOP: Repeated tool call failures (str_replace "No match", terminal errors)
    - RAPID_RETRY: Same or near-same input retried within <10s gap
    - TOOL_TIMEOUT: terminalCommand exceeding 15s (npm build, type-check blocking agent loop)
    - STUCK_DRIFT: Many LLM turns with no tool invocation (thinking loops)
    - ABORT_LOOP: "This operation was aborted" — streaming timeout / user kill
    - NULL_ERROR_LOOP: statusMessage=null — silent LLM/infra errors
    - INVALID_LLM_OUTPUT: Malformed tool params / invalid payload

  Retry classification tracked:
    - transient_retry: infra/tool issue (timeout, 5xx, rate limit)
    - agent_retry: bad params / bad plan (stale context, wrong old_str)
    - user_induced_retry: clarification / change of mind

  Escalation states:
    - first_occurrence → warned → repeated_after_warning → killed

  Production trace references:
    - Trace be0081bc: ABORT_LOOP — 3 consecutive aborts, $0.54 wasted, 0 tools succeeded
    - Trace 73e58f3f: NULL_ERROR — 4 null statusMessage errors, 0 tool calls
    - Trace 7432f8c1: EDIT_LOOP — 2 str_replace failures + grep spiral recovery, $2.86
    - Session TOiwepmWZpxAB4_AAAAB: ERROR_LOOP — 29 turns, 13-turn error streak, $0.95 wasted

  Cost breakdown categories:
    - wasted_llm_cost: tokens consumed in failed/unproductive turns
    - wasted_tool_cost: tool calls that errored or produced no state change
    - agent_friction_cost: total cost attributed to agent-caused inefficiency
    - retry_cost: cost of transient + agent retries combined

startUrl: https://airo-builder.godaddy.com
timeout: 900000   # 15 minutes
maxSteps: 80
stepsPerMessage: 20
headed: false

qualityEval:
  enabled: false

credentials:
  username: ${TEST_USERNAME}
  password: ${TEST_PASSWORD}

sitePrompt:
  prompt: |
    Create an e-commerce landing page for "NovaTech Gadgets" — a small electronics shop.

    Design: Modern dark theme. Background #0d1117, card surface #161b22,
    primary blue #58a6ff, accent orange #f0883e, text #c9d1d9.

    Hero: Large heading "NovaTech Gadgets — Smart Tech for Everyday Life" with a
    "Shop Now" CTA button. Animated gradient background (subtle).

    Products section: 4 product cards in a 2x2 grid. Each card has:
    image placeholder, product name, price, star rating (out of 5), and
    "Add to Cart" button.
    Products: Wireless Earbuds Pro ($79.99, 4.5★), Smart Home Hub ($129.99, 4.2★),
    USB-C Charging Station ($49.99, 4.7★), Portable Bluetooth Speaker ($59.99, 4.3★).

    Features section: 3-column layout with icons — "Free Shipping", "30-Day Returns",
    "24/7 Support". Each has an icon placeholder, heading, and short description.

    Newsletter section: Email input + "Subscribe" button with text "Get 10% off
    your first order."

    Footer: Company info, quick links (FAQ, Shipping, Returns, Contact),
    social icons (Twitter, Instagram, YouTube), copyright 2026.

systemPrompt: |
  ${common.developPageBase}

  ${common.errorHandlingInstructions}

  ${common.chatInstructions}

  ${common.waitInstructions}

  You will perform modifications that stress-test error handling, retry logic,
  and the agent's ability to recover from failures gracefully.

  STEP 1 — COMPLEX INTERACTIVE COMPONENT (tests TOOL_TIMEOUT / STUCK_DRIFT):
  Send this chat message:
  "Add a fully functional product comparison feature. Create a 'Compare' checkbox
  on each product card. When 2-3 products are checked, show a floating comparison
  panel at the bottom of the screen with a side-by-side table comparing: name,
  price, rating, and key features. Include a 'Clear Comparison' button. Use
  React state and CSS transitions for smooth animation. Run type-check to verify
  no TypeScript errors."
  Wait for completion. The type-check terminal command is a known latency trigger
  (10-44s per run). This tests whether the agent handles slow tool responses
  without entering a retry loop.

  STEP 2 — SURGICAL MULTI-POINT EDIT (tests ERROR_LOOP / RAPID_RETRY):
  Send this chat message:
  "I need to change the product data: rename 'Wireless Earbuds Pro' to 'ProAudio Max'
  and change its price from $79.99 to $549.99. Also rename 'USB-C Charging Station'
  to 'QuickCharge Dock' and change its price to $39.99. These names appear in the
  product cards, the comparison feature you just added, and possibly the page title
  or meta tags. Update EVERY occurrence across all files — do not miss any."
  Wait for completion. Editing data that appears in multiple files and was just
  modified risks stale-context str_replace failures and rapid retries.

  STEP 3 — CONFLICTING STYLE OVERRIDE (tests INVALID_LLM_OUTPUT / EDIT_LOOP):
  Send this chat message:
  "Override the entire color scheme: change background from #0d1117 to #ffffff,
  card surface from #161b22 to #f6f8fa, primary from #58a6ff to #0969da, accent
  from #f0883e to #cf222e, text from #c9d1d9 to #24292f. This is a dark-to-light
  theme flip — make sure contrast ratios still work. Also update any CSS
  variables, inline styles, and Tailwind classes that reference the old colors.
  Verify there are no build errors afterward."
  Wait for completion. A theme-wide color flip requires touching many CSS
  declarations and risks partial edits where str_replace targets have already
  changed from a prior edit in the same session.

  STEP 4 — VALIDATION:
  After all 3 modifications, verify in the preview:
  - Comparison feature works (checkboxes visible on product cards)
  - Product names updated ("ProAudio Max", "QuickCharge Dock") with correct prices
  - Light theme applied (white/light background, dark text)

goal: |
  Complete all 3 chat modifications and verify results. The primary purpose is
  to capture error loop and retry waste metrics from the agent's build traces.

  Success criteria (verify each in preview):
  1. COMPARISON FEATURE: Product cards have compare checkboxes, selecting 2+
     shows a floating comparison panel with a side-by-side table
  2. PRODUCT RENAME: "ProAudio Max" ($549.99) and "QuickCharge Dock" ($39.99) appear
     consistently across all views (cards, comparison, any meta references)
  3. THEME FLIP: Background is white/light, text is dark, all UI elements have
     adequate contrast (no invisible text on white)

  Error/retry detection criteria (analyzed from ordered Langfuse trace observations):
  NOTE: Sequential checks require per-turn ordering from raw Langfuse observations,
  not the aggregated buildMetrics summary. The eval agent should inspect the ordered
  tool call sequence in the trace to detect these patterns.
  - ERROR_LOOP: 2+ consecutive tool errors in the same trace
  - RAPID_RETRY: Same tool called with near-identical input within 10s
  - TOOL_TIMEOUT: Any terminalCommand exceeding 15s (npm build, type-check)
  - STUCK_DRIFT: 3+ consecutive LLM turns with no tool call (tools/turn < 0.5)
  - ABORT_LOOP: 2+ consecutive "This operation was aborted" errors (streaming timeout / user kill)
  - NULL_ERROR_LOOP: 2+ consecutive statusMessage=null errors (silent LLM/infra failures)
  - INVALID_LLM_OUTPUT: Tool call with malformed params or empty output

  Aggregate metrics available from buildMetrics:
  - toolErrorCount, toolErrors, toolFailedNames (error counts and messages)
  - turns, totalCostUSD, toolUsage (overall session aggregates)

  Retry classification (from buildMetrics.toolErrors and trace observations):
  - transient_retry: error contains "timeout", "aborted", "ECONNRESET", "5xx"
  - agent_retry: error contains "No match found", "invalid", "malformed"
  - user_induced_retry: N/A (no user corrections in this scenario)

  Cost attribution (from buildMetrics aggregates + trace analysis):
  - wasted_tool_cost: sum of costs for tool calls with level=ERROR
  - wasted_llm_cost: cost of turns where site_state hash did not change
  - agent_friction_cost: total wasted_tool_cost + wasted_llm_cost

  Report success if all 3 visual changes are confirmed.
  Include friction metrics in the message field regardless of pass/fail:
    "error_count=N, retry_events=N, tool_timeouts=N, stuck_turns=N,
     est_wasted_cost=$X.XX"
  If buildMetrics is unavailable, report "friction_metrics=unavailable" in the
  message field so silent Langfuse failures are visible in test reports.

  Report FAILURE if:
  - Any modification was not visually applied
  - The agent hit 5+ consecutive errors without recovery (kill condition)
  - Total tool errors exceed 10 in a single trace

cleanup:
  deleteAllSitesViaAPI: false
