[package]
name = "llm-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Replay captured mitmproxy LLM workloads against an OpenAI-compatible endpoint and report load/latency metrics."

[[bin]]
name = "llm-bench"
path = "src/main.rs"

[lints.rust]
unsafe_code = "warn"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "http2"] }
bytes = "1"
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
comfy-table = "7"
async-channel = "2"
anyhow = "1"
thiserror = "2"
csv = "1.3"

[dev-dependencies]
axum = "0.8"
