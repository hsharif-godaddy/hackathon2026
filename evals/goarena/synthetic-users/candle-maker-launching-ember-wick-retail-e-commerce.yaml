      path | Expected: setup storefront, products, SEO basics, and publish guidance"
  decisionPattern: They approve when products are easy to browse, checkout feels real, and the site is
    ready to publish.
  communicationStyle:
    formality: low
    detailLevel: medium
    technicalLevel: low
