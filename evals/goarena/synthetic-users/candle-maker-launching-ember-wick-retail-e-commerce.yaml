  name: Candle maker launching Ember & Wick (Retail & E-commerce)
  coreTraits:
    - wants products to look premium
    - does not understand checkout setup
    - cares about SEO
    - wants to go live
    - "risk tolerance: Medium - comfortable with guided commerce setup"
