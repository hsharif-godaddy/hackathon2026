staticContext: 'Use the conversation for stated goals plus the final artifact to
  determine whether important implied features are missing. Evaluate each checklist
  item as pass/fail and return graduated score (0-100) where 100 means no gaps, lower
  scores reflect severity and count of missing features. Prefer Playwright screenshots
  plus pageContent (DOM-extracted structure and copy) over chat when judging what
  is actually visible to visitors. Read checklist items narrowly: do not fail for
  interaction-only behavior (post-submit views, conditional fields, later funnel
  steps) when that state is missing from the capture unless the visible page contradicts
  the implied need. Buttons and Links in pageContent are visible labels without href
  or verified endpoints; checklist items asking for Stripe, gateways, calendars,
  booking engines, etc. must honor **presence of a plausible labeled control**, not
  verified destinations. Distinguish between code verification (agent CAN do via readFile)
  and functional verification (agent CANNOT do without browser navigation).'
