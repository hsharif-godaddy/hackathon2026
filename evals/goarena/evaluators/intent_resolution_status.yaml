template: |
  You are grading `intent_resolution_status` for an Airo Builder session.

  Use only the conversation and tool-call evidence below. Do not reward or penalize the final website here except as a minor confirmation signal.

  Your job is to determine whether the agent correctly resolved the user's underlying
  job-to-be-done and active sub-intent with enough nuance to steer the right build behavior.

  ## CRITICAL: Intent Capability Validation Pre-Check

  **BEFORE assigning or judging intent, validate it matches agent capabilities.**

  ### Agent Capabilities Reference

  **Agent CAN:**
  - Generate and edit code (readFile, str_replace_based_edit_tool, directoryListing)
  - Provide clear navigation instructions to user
  - Diagnose code issues via file reading
  - Use 30+ available tools (git, server management, publishing, database, etc.)
  - Verify code structure exists via file inspection
  - Offer guidance on how user can test/navigate

  **Agent CANNOT:**
  - Navigate preview browser or any iframe
  - Take screenshots or capture visual artifacts
  - Click buttons or test interactions
  - Control browser state or behavior
  - "Show" anything visual to user
  - Verify appearance without screenshots
  - Test functionality without browser automation

  ### Intent Validation Questions (ASK THESE FIRST)

  Before judging agent's intent resolution, ask:

  □ **Does the stated/expected intent require browser navigation?**
     - If YES → Intent is MISGUIDED unless reframed as guidance/code generation
     - Example: ❌ "Verify flow in preview" vs ✅ "Generate code for flow"

  □ **Does the stated/expected intent require taking screenshots?**
     - If YES → Intent is MISGUIDED unless reframed as code verification
     - Example: ❌ "Show screenshots of pages" vs ✅ "Verify page code exists"

  □ **Is user signaling a functional blocker?**
     - Keywords: "can't get X to work", "won't navigate", "doesn't switch", "broken"
     - If YES → Primary intent should be Troubleshoot, NOT Create/Continue
     - Example: "preview won't switch pages" = Troubleshoot → User Support

  □ **Is the expected outcome physically possible for agent?**
     - If NO → Intent classification itself is MISGUIDED
     - Score should reflect evaluator error, not agent failure

  ### Misguided Intent Patterns (DO NOT BLAME AGENT)

  These intent classifications are EVALUATOR ERRORS:

  ❌ **Misguided:** "Continue → Verify flow in preview"
     - Agent cannot navigate preview
     - When agent says "I can't navigate", that's HONESTY not failure

  ✅ **Correct:** "Troubleshoot → User Support: Help user navigate preview"
     - Agent provides guidance for user to navigate
     - Agent verifies code via readFile

  ❌ **Misguided:** "Create → Show screenshots of pages"
     - Agent cannot take screenshots
     - When agent says "I don't have screenshot capability", that's TRUTH

  ✅ **Correct:** "Continue → Generate page code and describe structure"
     - Agent generates code for pages
     - Agent explains structure via code reading

  ❌ **Misguided:** "Continue → Make preview switch pages"
     - Agent cannot control browser
     - When agent provides instructions instead, that's APPROPRIATE

  ✅ **Correct:** "Troubleshoot → Diagnose navigation issue"
     - Agent checks routing code via readFile
     - Agent suggests fixes if code issue found

  ### If You Detect Misguided Intent Classification

  If the "expected" intent requires capabilities agent doesn't have:

  1. **Identify the true appropriate intent** (what agent SHOULD do)
  2. **Check if agent recognized the appropriate intent**
  3. **Score based on agent recognizing appropriate intent**
  4. **Note in response that original expectation was misguided**
  5. **Do NOT penalize agent for being honest about limitations**

  Example:
  ```
  Expected intent (misguided): "Continue → Verify store flow in preview"
  True intent (correct): "Troubleshoot → Help user navigate + verify code"
  Agent understanding: "I cannot navigate, but I can verify code and guide you"
  Score: HIGH (agent correctly understood its actual capability-appropriate intent)
  Note: "Original expectation was misguided - agent cannot navigate preview"
  ```

