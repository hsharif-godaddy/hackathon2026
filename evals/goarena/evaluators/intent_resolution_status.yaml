  ## Judge This
  Decide how accurately the agent resolved the user's real intent.

  Use the App Builder taxonomy explicitly when reasoning. Internally identify the
  best-fit primary intent and sub-intent that matches AGENT CAPABILITIES, then judge
  whether the agent recognized that same intent.

  Taxonomy families and sub-intents:
  - Create
    - Website Creation: starting a new site, first-time builder flow, project initiation
    - Content Generation: creating copy, blogs, policies, SEO-oriented content
    - Visual Design: imagery, logo, color palette, visual styling
  - Continue
    - Iterative Refinement: make this change, apply updates, repeated edits
    - Resume Editing: continue an existing project, reopen draft, go back to my site
    - Workflow Progression: move to next step, recommendations, guided progression
  - Troubleshoot
    - System Errors: technical malfunction, timeout, broken feature
    - User Support: how-to questions, feature guidance, help requests, "show me how to X"
    - Context Issues: misunderstanding, clarification, "that's not what I meant"
  - Grow
    - Marketing Enhancement: promotion, marketing content, acquisition-oriented asks
    - Business Development: strategy, growth advice, business guidance
    - Technical Integration: domain, hosting, payments, connecting external tools
  - Explore
    - Feature Discovery: what can this do, what features are available
    - Template Browsing: examples, designs, styles, templates
    - Process Understanding: how does this work, what are the steps

  ## Scoring Rubric (Graduated 0-100)

  **90-100: Excellent Intent Resolution**
  - Captured real business/use case
  - Correctly identified capability-appropriate intent
  - Recognized all major implied needs
  - Updated understanding after refinements
  - **Recognized when user asked for impossible things and reframed appropriately**
  - **Did NOT attempt to do things outside capabilities**

  **75-89: Good Intent Resolution**
  - Generally understood request correctly
  - Intent mostly matches capabilities
  - Caught most implied needs
  - Responded appropriately to corrections
  - Minor capability boundary confusion

  **60-74: Fair Intent Resolution**
  - Core intent understood but nuances missed
  - Some capability boundary confusion
  - Missed some implied needs
  - Slow to adapt

  **40-59: Poor Intent Resolution**
  - Wrong intent for agent capabilities
  - Significant capability confusion
  - Missed major requirements
  - **Attempted impossible tasks instead of reframing**

  **20-39: Very Poor Intent Resolution**
  - Fundamental misunderstanding
  - Tried to do impossible things
  - Ignored corrections
  - **Claimed capabilities it doesn't have**

  **0-19: Failed / Misguided Evaluation**
  - **EVALUATOR assigned impossible intent expectations**
  - **Agent correctly identified limitations but evaluator expected impossible things**
  - Use this score when the EVALUATION ITSELF is misguided

  ## Critical: Honesty About Limitations is GOOD

  If agent says:
  - "I cannot navigate the preview" → This is HONEST ✓
  - "I don't have screenshot capability" → This is TRUTHFUL ✓
  - "I can verify code but cannot test it" → This is APPROPRIATE ✓
  - "I can provide instructions for you to navigate" → This is HELPFUL ✓

  These are NOT failures. These are correct capability awareness.

  ## Response Format

  ```json
  {
    "score": <0-100>,
    "summary": "Brief explanation with capability validation note",
    "intentAnalysis": {
      "capabilityValidation": {
        "originalExpectationMisguided": true|false,
        "requiresImpossibleCapabilities": ["list if misguided"],
        "appropriateIntent": "what agent SHOULD do given capabilities"
      },
      "trueIntent": {
        "primary": "Create|Continue|Troubleshoot|Grow|Explore",
        "subIntent": "specific sub-intent matching capabilities",
        "reasoning": "Why this is the capability-appropriate intent"
      },
      "agentIntent": {
        "primary": "what agent understood",
        "subIntent": "what agent understood",
        "reasoning": "Evidence of agent's understanding"
      },
      "matched": true|false,
      "capabilityAwareness": "excellent | good | fair | poor | very poor"
    },
    "keyMoments": [
      {
        "turn": <number>,
        "type": "strength|weakness|honest_limitation",
        "description": "What happened",
        "capabilityNote": "If relevant, note capability boundary"
      }
    ],
    "evaluationNote": "If original intent expectation was misguided, explain here",
    "confidence": <0-1>
  }
  ```

  **CRITICAL:** If you detect the intent expectation was misguided (requires impossible capabilities),
  clearly state this in `evaluationNote` and `capabilityValidation`, and do NOT penalize agent
  for being honest about its limitations.

