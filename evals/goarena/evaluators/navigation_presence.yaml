---
name: navigation_presence
description: Explicitly checks whether the final site provides clear navigation or
  equivalent wayfinding.
type: llm
scoreType: BOOLEAN
scoreName: navigation_presence
llmConfig:
  model: gpt-4o
  temperature: 0
  maxTokens: 2000
projectId: "8606"
staticContext: 'Primary evidence: final screenshots plus visible links/headings. Judge
  visible navigation or wayfinding only. Return checklist evidence and set the boolean
  score to whether the item passes.'
criteriaSchemaFile: schemas/checklist-single-item.json
template: |
  You are grading `navigation_presence` for an Airo Builder output.

  Use screenshots and visible link/heading cues. Judge only visible wayfinding.

  ## Site Context
  {{#if scenario.goal}}
  Primary goal: {{scenario.goal.name}}
  {{/if}}

  ## Visible Evidence
  Links:
  {{#each pageContent.links}}
  - {{this}}
  {{/each}}
  Headings:
  {{#each pageContent.headings}}
  - {{this}}
  {{/each}}
  Screenshots of the final site are attached separately.

  ## Checklist
  For each checklist item, decide pass/fail and provide short visual evidence.
  {{#each criteria.checklist}}
  - {{id}}: {{description}}
  {{/each}}

  ## Judge This
  Navigation can be:
  - a traditional header/nav
  - single-page anchor links
  - another clear wayfinding pattern that helps a visitor understand where to go

  Do not require a multi-page header. Fail only when the visitor lacks a clear way to orient themselves or move through the page/site.

  Set the top-level boolean score to true only if every checklist item passes.
