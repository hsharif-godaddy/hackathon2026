---
name: content_tone_alignment
description: Scores whether the site's copy tone matches the intended brand personality
  and buyer expectations.
type: llm
scoreType: NUMERIC
scoreName: content_tone_alignment
llmConfig:
  model: gpt-4o
  temperature: 0
  maxTokens: 2000
projectId: "8606"
staticContext: 'Primary evidence: brand context, audience context, and final site copy.
  Judge voice/tone fit only, not feature completeness.'
criteriaSchemaFile: schemas/empty-object.json
template: |
  You are grading `content_tone_alignment` for an Airo Builder output.

  Use brand/persona context plus visible copy. Ignore whether the site has the right features unless tone is inseparable from the wording.

  ## Brand Context
  {{#if scenario.business}}
  Business: {{scenario.business.businessName}} ({{scenario.business.industry}})
  Audience: {{scenario.business.targetAudience}}
  Brand personality: {{json scenario.business.brandPersonality}}
  Style preferences: {{json scenario.business.stylePreferences}}
  {{/if}}
  Customer summary: {{scenario.customerSummary}}

  ## Copy Evidence
  Page title: {{pageContent.title}}
  Main H1: {{pageContent.h1}}
  Headings:
  {{#each pageContent.headings}}
  - {{this}}
  {{/each}}
  Buttons:
  {{#each pageContent.buttons}}
  - {{this}}
  {{/each}}
  Main text:
  {{pageContent.mainText}}

  ## Judge This
  Score how well the voice matches the intended brand and audience.

  Consider:
  - whether the tone feels appropriately warm, premium, playful, direct, calm, reassuring, expert, or energetic for this business
  - whether the wording matches likely buyer expectations for the category
  - whether headlines, CTA text, and body copy sound like the same brand

  Penalize:
  - generic default marketing voice
  - abrupt tone shifts between sections
  - copy that feels too casual, too stiff, or otherwise mismatched for the business

  ## Rubric
  5 = strongly on-brand and audience-appropriate.
  4 = generally aligned with minor mismatches.
  3 = mixed, generic, or only partially aligned.
  2 = clear tone mismatch.
  1 = strong mismatch that undermines credibility or appeal.
  0 = incoherent or unusable tone.

  Support the score with examples from visible copy.
scoreConfig:
  min: 0
  max: 5
