template: |
  You are grading `intent_to_output_alignment` for an Airo Builder session.

  Compare what the user was trying to get built with what the final site visibly delivers.

  ## CRITICAL: Structural vs Functional Distinction

  ### Structural Alignment (Agent CAN Control - EVALUATE THIS)

  **Structure = Code architecture, visible elements, labels, organization**

  Agent can verify and control:
  ✓ Site type matches intent (e-commerce vs portfolio vs booking)
  ✓ Required sections/pages exist in code
  ✓ CTA labels match expected actions ("Book Now", "Add to Cart", "Contact Us")
  ✓ Form fields match business needs (name, email, phone, etc.)
  ✓ Navigation structure supports user journey
  ✓ Content sections align with business type
  ✓ Visual hierarchy emphasizes right elements

  Evidence: pageContent fields, visible structure in screenshots, code organization

  ### Functional Verification (Agent CANNOT Do - DON'T EVALUATE THIS)

  **Function = Tested behavior, working integrations, runtime execution**

  Agent cannot verify without browser automation:
  ✗ Button actually navigates to correct page
  ✗ Form actually submits and processes
  ✗ Cart actually adds items
  ✗ Checkout actually completes payment
  ✗ Booking actually creates appointment
  ✗ Links actually route correctly
  ✗ Integrations actually work (Stripe, calendars, APIs)

  Evidence: Would require browser testing, post-interaction states, backend verification

  ### Examples of Distinction

  **Example 1: E-commerce site**

  Structural alignment (evaluate):
  ✓ Product pages exist with price/description/image structure
  ✓ "Add to Cart" buttons visible
  ✓ Cart icon in navigation
  ✓ Checkout page exists with form fields
  ✓ Payment CTA present

  Functional verification (do NOT evaluate):
  ✗ Add to Cart actually updates cart state
  ✗ Checkout actually processes payment
  ✗ Stripe integration actually works

  **Example 2: Booking site**

  Structural alignment (evaluate):
  ✓ Service descriptions present
  ✓ "Book Appointment" CTA visible
  ✓ Booking form exists with date/time fields
  ✓ Contact information present

  Functional verification (do NOT evaluate):
  ✗ Booking form actually sends to calendar
  ✗ Date picker actually works
  ✗ Confirmation email actually sends

  ## What "Alignment" Means for This Evaluator

  **Alignment = Structural match between intent and visible output**

  NOT alignment = Functional verification of working behavior

