  Main text:
  {{pageContent.mainText}}

  ## Judge This

  ### Evidence boundary (visible structural alignment)

  Judge alignment between intended outcome and **structural evidence** (screenshots, DOM fields):
  - Site type and visitor journey structure
  - Visible support for business use case (sections, CTAs, forms)
  - Incorporation of requirements and implied needs
  - CTA labels and form fields match intent

  **Do NOT judge:**
  - Whether buttons/forms actually work (functional)
  - Whether integrations actually connect (functional)
  - Whether flows actually complete (functional)
  - Post-interaction behavior not captured

  Labeled Buttons/Links are sufficient for structural alignment to checkout, booking,
  or integration outcomes. Do **not** withhold marks because destinations cannot be
  verified from extraction.

  ## Evaluation Focus

  Determine whether the site **structure** reflects the user's intended outcome.

  **Reward (structural alignment):**
  - Correct site type and visitor journey structure
  - Visible structural support for business use case
  - Appropriate sections, CTAs, forms for intent
  - Important refinements reflected in structure
  - CTA labels align with expected actions

  **Penalize (structural misalignment):**
  - Wrong site type (portfolio when user wanted e-commerce)
  - Wrong visitor journey structure (lead gen when user wanted booking)
  - Missing critical structural elements (no cart for shopping, no booking form for appointments)
  - CTA labels misaligned with intent ("Download" when user wanted "Book")
  - Structural implementation doesn't match request

  **Do NOT Penalize:**
  - Unverifiable functional behavior
  - Untested integration connections
  - Post-click behavior not in capture
  - Backend functionality you cannot inspect

  ## If Structure is Present but Function Unverifiable

  Example scenario:
  - User wanted: "Booking site"
  - Structure shows: Booking form with date/time fields, "Book Appointment" button
  - Function unknown: Can't verify form actually books

  Verdict: **Structurally aligned** → Score 85-95

  Do NOT lower score for unverifiable function if structure is correct.

  ## Rubric (Graduated 0-100)

  Return a single integer from 0 through 100. Higher means stronger structural alignment.

  **90-100** = strongly matches intended structural outcome
    - Site type correct
    - Visitor journey structure correct
    - All critical structural elements present
    - CTA labels align perfectly
    - Refinements incorporated

  **70-89** = core structural intent reflected, minor gaps
    - Site type correct
    - Journey mostly correct
    - Most structural elements present
    - Minor label or section mismatches

  **50-69** = partial structural alignment
    - Site type correct but journey unclear
    - Some critical structural elements missing
    - CTA labels partially aligned
    - Some requirements not structurally represented

  **30-49** = weak structural alignment
    - Site type questionable
    - Journey misdirected
    - Major structural gaps
    - CTA labels misaligned

  **10-29** = poor structural alignment
    - Wrong site type
    - Wrong visitor journey structure
    - Critical structural elements absent

  **0-9** = does not structurally reflect intent at all
    - Completely wrong site type
    - No structural alignment with request

  ## Response Format

  ```json
  {
    "score": <0-100>,
    "summary": "Brief comparison of intended vs structural output",
    "alignment_analysis": {
      "structural_alignment": {
        "site_type": "correct | incorrect | partially",
        "visitor_journey": "aligned | misaligned | partially",
        "critical_elements": ["list present structural elements"],
        "missing_elements": ["list missing structural elements"],
        "cta_alignment": "excellent | good | fair | poor"
      },
      "functional_verification": {
        "note": "Functional verification not possible/required for this evaluation",
        "structural_indicators": ["what structure suggests about function"]
      }
    },
    "strengths": ["structural alignment strengths"],
    "weaknesses": ["structural misalignment issues"],
    "unverifiable_functional_aspects": ["list for transparency"],
    "confidence": <0-1>
  }
  ```

  In the reasoning, compare requested structural outcome vs visible structural output directly.
  Be clear about what's structural alignment vs functional uncertainty.

