# Usability Evaluator
# LLM-based evaluator using Nielsen's 10 Usability Heuristics
# Uses screenshots with vision API to evaluate UI/UX

evaluatorId: "airo-usability"
name: "Airo Usability Evaluator"
description: "Evaluates website usability based on Nielsen's 10 Usability Heuristics using screenshots"

# Evaluator type - "llm" means LLM-as-Judge evaluation
type: llm

# Score configuration
scoreType: NUMERIC
scoreName: "usability_score"
scoreConfig:
  min: 0
  max: 100

# LLM configuration - must use a vision-capable model
llmConfig:
  model: "gpt-4o"  # Vision-capable model
  temperature: 0
  maxTokens: 3000

# Project ID (set when uploading to Synthia)
projectId: "8606"

# Handlebars template for LLM prompt
# This evaluator uses SCREENSHOTS (vision API) - the screenshots array is passed
# to the LLM automatically when the evaluator name contains "visual" or "usability"
# Available browser context variables:
#   - screenshots: Array of base64 images (passed to vision API automatically)
#   - previewUrl: URL of the generated website
#   - scenario.business: Business context
#   - scenario.goal: Goal information
#   - conversation.originalPrompt: First user message (original request)
#   - conversation.userMessages: All user messages (requirements)
template: |
  You are evaluating the usability of a generated website using Nielsen's 10 Usability Heuristics.

  ## What the User Requested
  {{#if conversation.originalPrompt}}
  **Original Request:**
  {{conversation.originalPrompt}}

  {{#if conversation.userMessages.length}}
  {{#unless (eq conversation.userMessages.length 1)}}
  **Additional Requirements:**
  {{#each conversation.userMessages}}
  {{#unless @first}}
  - {{this}}
  {{/unless}}
  {{/each}}
  {{/unless}}
  {{/if}}
  {{/if}}

  ## Business Context
  {{#if scenario.business}}
  Business Name: {{scenario.business.businessName}}
  Industry: {{scenario.business.industry}}
  Target Audience: {{scenario.business.targetAudience}}
  {{/if}}

  ## Website URL
  {{previewUrl}}

  ## Nielsen's 10 Usability Heuristics
  {{#each criteria.heuristics}}
  ### {{number}}. {{name}}
  {{description}}

  {{/each}}

  ## Your Task
  Analyze the provided screenshots and evaluate each heuristic.

  For each heuristic, identify:
  - Whether the heuristic is violated
  - Severity of any violations:
    - 0 = No usability problem
    - 1 = Cosmetic problem only (fix if time permits)
    - 2 = Minor usability problem (low priority)
    - 3 = Major usability problem (high priority to fix)
    - 4 = Usability catastrophe (must fix before release)
  - Specific examples from the screenshots

  Scoring: 100 - (total_severity / max_severity) * 100
  Where max_severity = 4 × number of heuristics evaluated ({{criteria.heuristics.length}})
  So for {{criteria.heuristics.length}} heuristics: max_severity = {{criteria.heuristics.length}} × 4 = worst score of 0

  Respond with JSON in this format:
  {
    "heuristicsEvaluated": {{criteria.heuristics.length}},
    "heuristics": [
      {
        "number": 1,
        "name": "heuristic name",
        "violated": boolean,
        "severity": 0-4,
        "observations": "specific observations from screenshots",
        "examples": ["list of specific violations found"]
      }
    ],
    "totalSeverity": number (sum of all severity scores),
    "maxSeverity": number ({{criteria.heuristics.length}} × 4),
    "overallScore": number (100 - (total_severity / ({{criteria.heuristics.length}} * 4)) * 100),
    "criticalViolations": ["list of severity 3-4 violations"],
    "summary": "brief usability summary",
    "confidence": number between 0 and 1
  }

# Criteria schema for validation (optional)
criteriaSchema:
  type: object
  properties:
    heuristics:
      type: array
      items:
        type: object
        properties:
          number:
            type: integer
          name:
            type: string
          description:
            type: string
  required:
    - heuristics

# Example usage in scenario.evaluators:
# evaluators:
#   - evaluatorId: usability
#     weight: 10
#     criteria:
