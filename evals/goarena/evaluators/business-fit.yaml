# Business Fit Evaluator
# LLM-based evaluator for assessing site-type-specific requirements
# Uses extracted page content to verify business-specific elements are present

evaluatorId: "airo-business-fit"
name: "Airo Business Fit Evaluator"
description: "Evaluates whether the website meets business-specific requirements for the site type"

# Evaluator type - "llm" means LLM-as-Judge evaluation
type: llm

# Score configuration
scoreType: NUMERIC
scoreName: "business_fit_score"
scoreConfig:
  min: 0
  max: 100

# LLM configuration
llmConfig:
  model: "gpt-4o"
  temperature: 0
  maxTokens: 2000

# Project ID (set when uploading to Synthia)
projectId: "8606"

# Handlebars template for LLM prompt
# Uses extracted page content to verify presence of business elements
# Available browser context variables:
#   - pageContent.title: Page title
#   - pageContent.h1: Main H1 heading
#   - pageContent.headings: Array of H1-H3 headings (up to 15)
#   - pageContent.mainText: Main text content (truncated to 8000 chars)
#   - pageContent.links: Array of link texts (up to 15)
#   - pageContent.buttons: Array of button/CTA texts (up to 10)
#   - pageContent.formCount: Number of forms on page
#   - pageContent.imageCount: Number of images on page
#   - previewUrl: URL of the generated website
#   - scenario.business: Business context
#   - scenario.goal: Goal information
#   - conversation.originalPrompt: First user message (original request)
#   - conversation.userMessages: All user messages (requirements)
template: |
  You are evaluating whether a generated website meets the specific requirements for its business type.

  ## What the User Requested
  {{#if conversation.originalPrompt}}
  **Original Request:**
  {{conversation.originalPrompt}}

  {{#if conversation.userMessages.length}}
  {{#unless (eq conversation.userMessages.length 1)}}
  **Additional Requirements:**
  {{#each conversation.userMessages}}
  {{#unless @first}}
  - {{this}}
  {{/unless}}
  {{/each}}
  {{/unless}}
  {{/if}}
  {{/if}}

  ## Business Context
  {{#if scenario.business}}
  Business Name: {{scenario.business.businessName}}
  Industry: {{scenario.business.industry}}
  Description: {{scenario.business.businessDescription}}
  Target Audience: {{scenario.business.targetAudience}}
  {{/if}}

  ## Site Type
  {{criteria.siteType}}

  ## Required Elements for {{criteria.siteType}}
  {{#each criteria.requiredElements}}
  - {{this}}
  {{/each}}

  ## Optional Elements (bonus points)
  {{#each criteria.optionalElements}}
  - {{this}}
  {{/each}}

  ## Website Content Analysis

  **Page Title:** {{pageContent.title}}
  **Main Heading:** {{pageContent.h1}}

  **Section Headings:**
  {{#each pageContent.headings}}
  - {{this}}
  {{/each}}

  **Navigation/Links:**
  {{#each pageContent.links}}
  - {{this}}
  {{/each}}

  **Buttons/CTAs:**
  {{#each pageContent.buttons}}
  - {{this}}
  {{/each}}

  **Forms:** {{pageContent.formCount}}
  **Images:** {{pageContent.imageCount}}

  **Main Text Content (excerpt):**
  ---
  {{pageContent.mainText}}
  ---

  ## Your Task
  For each required element:
  1. Check if it's present in the website content
  2. Evaluate its quality/completeness (1-100)
  3. Note any issues or missing information

  {{#if conversation.originalPrompt}}
  **IMPORTANT:** Also verify that the website addresses what the user specifically requested in their original prompt. Missing requested features should be noted.
  {{/if}}

  Respond with JSON in this format:
  {
    "siteType": "{{criteria.siteType}}",
    "requiredElements": [
      {
        "element": "element name",
        "present": boolean,
        "quality": 1-100 or null if not present,
        "evidence": "where/how it was found",
        "notes": "observations or issues"
      }
    ],
    "optionalElements": [
      {
        "element": "element name",
        "present": boolean,
        "notes": "observations"
      }
    ],
    "overallScore": number 1-100 (average of required element quality scores),
    "missingCritical": ["list of missing required elements"],
    "summary": "brief business fit summary",
    "confidence": number between 0 and 1
  }

# Criteria schema for validation (optional)
criteriaSchema:
  type: object
  properties:
    siteType:
      type: string
    requiredElements:
      type: array
      items:
        type: string
    optionalElements:
      type: array
      items:
        type: string
  required:
    - siteType
    - requiredElements

# Example usage in scenario.evaluators:
# evaluators:
#   - evaluatorId: business-fit
#     weight: 2
#     criteria:
#       siteType: restaurant
#       requiredElements:
#         - "Restaurant name prominently displayed"
#         - "Menu with food items and prices"
#         - "Contact information (phone, email)"
#         - "Location/address"
#         - "Hours of operation"
#       optionalElements:
#         - "Online ordering capability"
#         - "Reservation system"
#         - "Photo gallery of food/restaurant"
#         - "Customer reviews or testimonials"
