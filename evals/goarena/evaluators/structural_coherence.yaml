template: |
  You are grading `structural_coherence` for an Airo Builder output.

  Focus on information architecture and section logic of the CAPTURED page.

  ## CRITICAL: Capture Limitations

  ### What You Can Evaluate (Captured Evidence)

  **This capture shows:**
  - {{pageContent.title}} page
  - Heading hierarchy on THIS page
  - Section flow on THIS page
  - Navigation labels (as text, not verified destinations)
  - Content organization on THIS page

  **Evaluate:**
  ✓ Heading hierarchy makes sense (H1 → H2 → H3 logical progression)
  ✓ Sections flow logically on this page
  ✓ Navigation labels are coherent and descriptive
  ✓ Content is appropriately grouped
  ✓ Page structure supports apparent purpose
  ✓ Internal consistency within this page

  ### What You CANNOT Evaluate (Not Captured)

  **This capture does NOT show:**
  - Other pages that may exist (/about, /services, /contact, etc.)
  - Multi-page site architecture
  - Navigation destinations (only labels visible)
  - Page transitions or routing
  - Full site map

  **Do NOT penalize:**
  ✗ "Missing" pages that exist in code but not captured
  ✗ Multi-page navigation you cannot verify
  ✗ Structure that exists in code but not in screenshot
  ✗ Routes/pages implied by nav links but not shown
  ✗ Full site architecture beyond this page

  ### Agent Capability Boundaries

  **Agent CAN control (fair to evaluate):**
  - Heading hierarchy in generated code
  - Section organization in generated code
  - Navigation label text
  - Content grouping logic
  - Single-page structure coherence

  **Agent CANNOT control (don't penalize):**
  - Which pages are captured for evaluation
  - Multi-page architecture if only one page captured
  - Navigation destinations beyond label text

  ## Example Scenarios

  **Scenario 1: Homepage captured**

  Navigation links visible: Home | About | Services | Contact

  ✓ **Good evaluation:** "Navigation labels are clear and coherent. Page sections (Hero, Services Overview, CTA) flow logically. Heading hierarchy is appropriate."

  ✗ **Bad evaluation:** "Missing About and Services pages - structure incomplete."
  → Problem: Those pages may exist, just not captured

  **Scenario 2: Product page captured**

  Navigation shows: Shop | Products | Cart | Checkout

  ✓ **Good evaluation:** "Product page structure is coherent with appropriate sections (images, description, specifications, add to cart). Headings follow logical hierarchy."

  ✗ **Bad evaluation:** "Cannot find homepage or cart page - poor structure."
  → Problem: Evaluating pages not in capture

  **Scenario 3: Single page site**

  All content on one page with anchor navigation

  ✓ **Good evaluation:** "Single-page structure with clear sections. Navigation anchors correspond to visible sections. Good hierarchy and flow."

