  {{pageContent.mainText}}

  ## Judge This

  ### Evidence boundary (captured IA only)

  - Score structure from headings, sections, nav affordances visible in **Final Structure Evidence**
  - Do NOT penalize for "missing" pages or states not represented in capture
  - Nav link text does not expose destinations; coherent IA does not depend on inspecting href
  - If nav links suggest multi-page site, assume pages exist if agent was asked to generate them

  Score whether the VISIBLE CAPTURED page structure is coherent for the apparent site purpose.

  ## Evaluation Criteria

  **Heading Hierarchy (0-25 points)**
  - 25: Clear H1 → H2 → H3 progression, logical nesting
  - 20: Mostly logical, minor hierarchy issues
  - 15: Some hierarchy confusion
  - 10: Poor hierarchy structure
  - 0: No coherent hierarchy

  **Section Flow (0-25 points)**
  - 25: Logical progression from intro → details → action
  - 20: Good flow with minor rough edges
  - 15: Workable but uneven
  - 10: Confusing or disconnected flow
  - 0: No coherent flow

  **Navigation Coherence (0-25 points)**
  - 25: Clear, descriptive labels that make sense together
  - 20: Good labels, minor improvements possible
  - 15: Adequate but generic
  - 10: Confusing or inconsistent labels
  - 0: No coherent navigation
  - N/A: If no navigation present on this page

  **Content Grouping (0-25 points)**
  - 25: Excellent grouping, no redundancy
  - 20: Good grouping, minor overlaps
  - 15: Workable but somewhat repetitive
  - 10: Confusing or very redundant
  - 0: No coherent grouping

  **Total: 0-100**

  ## What Structural Coherence Means

  Consider:
  - Whether THIS page has logical flow from intro → supporting sections → action
  - Whether headings and sections feel non-redundant and appropriately grouped
  - Whether navigation/wayfinding and section names make sense together (as labels)
  - Whether structure covers main informational needs visible on THIS page

  Penalize (only for captured page):
  - Disconnected or repetitive sections ON THIS PAGE
  - Confusing heading hierarchy ON THIS PAGE
  - Page reads like unrelated blocks
  - Important structural omissions FOR THIS PAGE'S purpose

  Do NOT penalize:
  - Other pages that may exist but aren't captured
  - Multi-page architecture not visible
  - Navigation destinations you cannot verify

  ## Rubric (Graduated 0-100)

  **90-100** = coherent and well organized
    - Excellent heading hierarchy
    - Logical section flow
    - Clear navigation labels
    - Well-grouped content

  **70-89** = strong structure with minor rough edges
    - Good hierarchy
    - Mostly logical flow
    - Decent navigation
    - Minor redundancy

  **50-69** = workable but uneven
    - Acceptable hierarchy
    - Some flow issues
    - Generic navigation
    - Some redundancy

  **30-49** = confusing or noticeably incomplete structure ON THIS PAGE
    - Poor hierarchy
    - Confusing flow
    - Unclear navigation
    - Significant redundancy

  **10-29** = poor structure that harms usability
    - No clear hierarchy
    - Disconnected sections
    - Confusing labels
    - Major structural problems

  **0-9** = no coherent structure
    - Complete chaos
    - No organization

  ## Response Format

  ```json
  {
    "score": <0-100>,
    "summary": "Brief structural assessment OF CAPTURED PAGE",
    "scoring_breakdown": {
      "heading_hierarchy": <0-25>,
      "section_flow": <0-25>,
      "navigation_coherence": <0-25 or "n/a">,
      "content_grouping": <0-25>
    },
    "structure_analysis": {
      "captured_page": "{{pageContent.title}}",
      "heading_assessment": "excellent | good | fair | poor",
      "flow_assessment": "excellent | good | fair | poor",
      "nav_labels": ["list navigation labels if present"],
      "sections_identified": ["list main sections on this page"]
    },
    "strengths": ["structural strengths ON THIS PAGE"],
    "weaknesses": ["structural issues ON THIS PAGE"],
    "capture_limitations_note": "Only evaluated captured page structure. Other pages may exist but are not assessed.",
    "implied_multi_page": true|false,
    "confidence": <0-1>
  }
  ```

  Explain which sections or headings make the structure work or fail ON THE CAPTURED PAGE.
  Do NOT penalize for pages not in capture.

