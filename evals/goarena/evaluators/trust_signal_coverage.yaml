template: |
  You are grading `trust_signal_coverage` for an Airo Builder output.

  Judge only visible trust cues on the final site.

  ## CRITICAL: Presence vs Functional Verification

  ### Trust Signals = PRESENCE of credibility indicators

  **This evaluation scores PRESENCE (agent controls):**

  ✓ Contact form visible on page
  ✓ Email address displayed
  ✓ Phone number displayed
  ✓ Physical address mentioned
  ✓ Professional credentials shown (licenses, certifications)
  ✓ Testimonials or reviews present
  ✓ Privacy policy link exists
  ✓ Terms of service link exists
  ✓ Security badges displayed (SSL, payment processor logos)
  ✓ Social proof elements (client logos, case studies)
  ✓ About section with team info
  ✓ Business hours listed

  Evidence: Visible text, forms, badges, links in pageContent/screenshots

  ### This evaluation does NOT score FUNCTION (agent cannot verify)

  **Do NOT evaluate functional verification:**

  ✗ Contact form actually submits email
  ✗ Email address actually exists/works
  ✗ Phone number actually rings/connects
  ✗ Address actually is business location
  ✗ Credentials actually are valid/verified
  ✗ Testimonials actually are real
  ✗ SSL certificate actually is valid
  ✗ Payment processor actually is connected
  ✗ Links actually route to policy pages

  Evidence: Would require backend verification, not available

  ### Examples

  **Example 1: Service business - GOOD coverage**

  Presence (evaluate):
  ✓ Contact form with name/email/phone/message fields
  ✓ Email: contact@business.com visible in footer
  ✓ Phone: (555) 123-4567 in header
  ✓ Address: "123 Main St, City, State" in footer
  ✓ "Licensed & Insured" badge
  ✓ 3 customer testimonials with names
  ✓ Privacy Policy link in footer

  Score: 85-95 (excellent presence)

  Function (do NOT evaluate):
  ? Does form actually send email
  ? Is phone number active
  ? Is business actually licensed

  **Example 2: E-commerce - GOOD coverage**

  Presence (evaluate):
  ✓ Secure checkout badges (Visa, Mastercard, SSL)
  ✓ Return policy link
  ✓ Customer service email
  ✓ FAQ section
  ✓ "30-Day Money Back Guarantee" displayed

  Score: 80-90 (good presence)

  Function (do NOT evaluate):
  ? Is payment processor connected
  ? Is return policy enforceable

  **Example 3: Consulting - POOR coverage**

  Presence (evaluate):
  ✗ No contact information visible
  ✗ No credentials or certifications shown
  ✗ No client testimonials
  ✗ No about section

  Score: 10-29 (very poor presence)

  ## Agent Capability Boundaries

  **Agent CAN generate/display:**
  - Contact forms with appropriate fields
  - Email addresses, phone numbers, addresses
  - Credential badges and certifications
  - Testimonial sections
  - Policy links
  - Security badges
  - Social proof elements

  **Agent CANNOT verify:**
  - Forms actually submit
  - Contact info actually works
  - Credentials actually are valid
  - Testimonials actually are real
  - Policies actually are comprehensive
  - Security actually is implemented

