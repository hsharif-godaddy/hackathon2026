  {{/each}}

  ## Checklist Interpretation

  For each checklist item, interpret as PRESENCE check:

  **"Contact information visible" →** Check for visible email/phone/address/form
  - Pass: Email, phone, or contact form visible
  - Fail: No contact method visible
  - Do NOT require: Verified working email/phone

  **"Professional credentials shown" →** Check for visible licenses/certs/badges
  - Pass: Credentials, licenses, certifications displayed
  - Fail: No professional credentials visible
  - Do NOT require: Verified valid credentials

  **"Privacy policy present" →** Check for visible policy link or section
  - Pass: Privacy policy link or section visible
  - Fail: No policy mentioned
  - Do NOT require: Comprehensive policy content verification

  **"Payment security indicated" →** Check for visible security badges/mentions
  - Pass: SSL badge, payment logos, security mentions visible
  - Fail: No security indicators visible
  - Do NOT require: Verified SSL certificate or payment connection

  **"Testimonials or reviews" →** Check for visible testimonial content
  - Pass: Testimonials, reviews, case studies visible
  - Fail: No social proof visible
  - Do NOT require: Verified real testimonials

  ## Judge This

  Trust signals should be appropriate for the business type.

  **Evaluate PRESENCE of:**
  - Real contact paths (form, email, phone)
  - Service area/location
  - Pricing cues
  - Testimonials or social proof
  - Professional credentials
  - Process clarity
  - Policies where relevant

  **Do NOT evaluate FUNCTION of:**
  - Whether contact methods actually work
  - Whether credentials are valid
  - Whether testimonials are real
  - Whether policies are comprehensive
  - Whether security is implemented

  Set the numeric score from 0 through 100 using the checklist and overall importance.

  ## Rubric (Graduated 0-100)

  **90-100** = trust presence coverage is strong
    - All important trust indicators visible
    - Comprehensive contact options
    - Strong professional signals
    - Clear policies and security mentions

  **70-89** = mostly strong trust presence
    - Most important indicators visible
    - Good contact coverage
    - Some professional signals
    - Basic policies present

  **50-69** = mixed presence
    - Enough trust indicators to proceed
    - Basic contact present
    - Some professional signals
    - Notable gaps remain

  **30-49** = weak trust presence
    - Several important indicators missing
    - Limited contact options
    - Few professional signals
    - Major presence gaps

  **10-29** = very little visible trust basis
    - Most trust indicators absent
    - Minimal contact info
    - No professional signals
    - Critical presence gaps

  **0-9** = trust signals essentially absent
    - No contact information
    - No professional indicators
    - No policies or security mentions
    - Cannot establish credibility from visible elements

  Weight business-critical trust items more heavily than nice-to-have polish.

  ## Mandatory `checklist` row contract

  The `checklist` array drives automated aggregation: every element **must** include:
  - `id`: the criterion **`id` copied verbatim** from the checklist block below (required string; never omit)
  - `pass`: boolean — trust presence verdict for that row (**must be named `pass`, not `passed`**)
  - `evidence`: short string citing visible cues from the site or screenshots

  Emit **exactly** one checklist object per enumerated criterion (**{{criteria.checklist.length}}** rows). Keep the detailed trust breakdown in **`trust_signal_analysis`** and narrative fields below; **do not** replace `pass`/`id`/`evidence` with synonyms.

  ## Response Format

  ```json
  {
    "score": <0-100>,
    "summary": "Brief trust presence assessment",
    "checklist": [
      {
        "id": "exact_criterion_id_from_config",
        "pass": true,
        "evidence": "Visible cue that supports pass/fail"
      }
    ],
    "trust_signal_analysis": {
      "contact_methods": ["list visible methods"],
      "professional_signals": ["list visible credentials/badges"],
      "social_proof": ["list visible testimonials/reviews"],
      "policies": ["list visible policy links"],
      "security_indicators": ["list visible security badges"]
    },
    "presence_strengths": ["strong trust presence elements"],
    "presence_gaps": ["missing trust indicators"],
    "unverifiable_functional": ["list for transparency"],
    "confidence": <0-1>
  }
  ```

