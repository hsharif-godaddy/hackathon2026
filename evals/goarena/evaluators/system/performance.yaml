# System Evaluator: Performance
# Uses Navigation Timing API for Core Web Vitals
#
# This is a SYSTEM evaluator - the evaluation logic is built into Synthia.
# No LLM is used - it measures performance metrics directly.

evaluatorId: "airo-system-performance"
name: "Airo Performance Evaluator"
description: |
  Evaluates page load performance using the Navigation Timing API.
  Measures Core Web Vitals and other performance metrics.

# Evaluator type - "system" means library-based evaluation (no LLM)
type: system
systemCategory: performance

# Score configuration
scoreType: NUMERIC
scoreName: "performance_score"
scoreConfig:
  min: 0
  max: 100

# Project ID (set when uploading to Synthia)
projectId: "8606"

# What it checks:
# - Largest Contentful Paint (LCP) - main content load time
# - First Contentful Paint (FCP) - first visual render
# - DOM Content Loaded time
# - Total page load time
# - Time to First Byte (TTFB)
# - Number of resources loaded
# - Total transfer size

# Performance thresholds (based on Google's Core Web Vitals):
# LCP:
#   - Good: < 2.5s
#   - Needs Improvement: 2.5s - 4s
#   - Poor: > 4s
# FCP:
#   - Good: < 1.8s
#   - Needs Improvement: 1.8s - 3s
#   - Poor: > 3s

# Scoring:
# Based on weighted combination of metrics:
#   - LCP: 30% weight
#   - FCP: 25% weight
#   - DOM Load: 20% weight
#   - Total Load: 15% weight
#   - TTFB: 10% weight

# Example usage in scenario.evaluators:
# evaluators:
#   - evaluatorId: system-performance
#     criteria:
#       timeout: 30000
#       minScore: 65
