          "competes_with_primary": true|false,
          "dilutes_focus": true|false,
          "points_deducted": <number>,
          "reasoning": "Why this is off-scope and impact"
        }
      ]
    },
    "drift_summary": {
      "critical_drift_count": <number>,
      "major_drift_count": <number>,
      "minor_drift_count": <number>,
      "total_drift_elements": <number>
    },
    "scoring_breakdown": {
      "starting_score": 100,
      "critical_deductions": <number>,
      "major_deductions": <number>,
      "minor_deductions": <number>,
      "impact_multipliers": <number>,
      "pattern_penalty": <number>,
      "helpful_bonus": <number>,
      "final_score": <0-100>
    },
    "visitor_journey_impact": "none|slight|moderate|severe",
    "recommendations": [
      "What to remove or refocus if applicable"
    ],
    "confidence": <0-1>
  }
  ```

  The reasoning should explain:
  - What was requested vs what was delivered
  - Which elements are off-scope and why
  - How drift impacts the primary visitor outcome
  - Whether extras help or hurt the site's effectiveness

