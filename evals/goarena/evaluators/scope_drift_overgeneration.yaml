  {{pageContent.mainText}}

  ## Scope Drift Severity Levels

  ### Critical Drift (-30 to -40 points)
  - Site targets completely different use case than requested
  - Core functionality diverted to wrong business model
  - Primary visitor journey redirected to unrelated outcome
  - Feature complexity that fundamentally changes the site purpose

  ### Major Drift (-15 to -25 points)
  - Significant extra feature area pulling toward different use case
  - Major section competing with requested primary outcome
  - Substantial complexity muddying visitor journey
  - Multiple unrelated features added

  ### Minor Drift (-5 to -10 points)
  - Small extra section that slightly dilutes focus
  - Minor feature addition not explicitly requested
  - Reasonable default that goes slightly beyond scope
  - One unrelated element present

  ### NOT Drift (0 points deduction)
  - Small helpful additions that strengthen the site
  - Normal marketing/supporting sections (about, contact, FAQ)
  - Reasonable defaults that enhance requested site
  - Standard boilerplate (privacy, terms)
  - Features that support but don't compete with primary goal

  ## Scoring Formula (Graduated 0-100)

  **Start with 100 points (perfect scope adherence).**

  For each scope drift element found:
  1. Identify the extra/off-scope element
  2. Classify severity (Critical/Major/Minor)
  3. Assess impact on primary outcome
  4. Deduct appropriate points
  5. Continue until all elements analyzed

  **Impact multipliers:**
  - Drift competes with primary CTA: +50% deduction
  - Drift causes confusion in visitor journey: +30% deduction
  - Drift is prominent (hero, first section): +20% deduction
  - Drift is subtle (footer, sidebar): -30% deduction

  **Helpful additions bonus:**
  - If extra elements clearly support primary goal: reduce deduction by 50%
  - If extra elements are reasonable defaults: reduce deduction by 30%

  **Pattern penalties:**
  - 1 drift element: base deduction
  - 2-3 drift elements: suggest pattern, +10 points penalty
  - 4+ drift elements: clear overgeneration, +20 points penalty

  **Minimum score: 0**

  ## Graduated Scoring Bands

  **90-100: Excellent scope adherence**
  - Site precisely matches requested scope
  - Only reasonable defaults or helpful additions
  - No competing or dilutive elements
  - Clean, focused visitor journey

  **75-89: Good scope adherence**
  - Site mostly matches requested scope
  - 1-2 minor extra elements that don't compete
  - Visitor journey remains clear
  - Minor additions enhance rather than dilute

  **60-74: Fair scope adherence**
  - Site generally matches requested scope
  - Some extra sections or features present
  - Slight dilution of primary focus
  - Visitor journey still navigable

  **40-59: Poor scope adherence**
  - Site has significant extra features
  - Multiple sections compete for attention
  - Primary outcome somewhat diluted
  - Visitor journey cluttered

  **20-39: Very poor scope adherence**
  - Site diverges substantially from request
  - Major competing feature areas
  - Primary outcome heavily diluted
  - Visitor journey confused

  **0-19: Failed scope adherence**
  - Site targets wrong use case entirely
  - Core purpose fundamentally changed
  - Requested scope almost unrecognizable
  - Critical overgeneration

  ## Judge This

  Base scope drift on **Final Output Evidence** (visible sections, links, and copy). Do not treat uncaptured pages or interaction-only views as proof of extra scope. Button and link lists are extraction labels—do **not** treat unverifiable click targets alone as drift.

  For each element in the artifact:
  1. Was this explicitly or implicitly requested?
  2. Does it support the primary goal?
  3. Does it compete with the primary goal?
  4. Is it a reasonable default?
  5. Does it add value or dilute focus?

  If off-scope or overgenerated:
  1. Classify severity
  2. Assess impact on primary outcome
  3. Calculate point deduction with multipliers
  4. Document in findings

  **Do not penalize:**
  - Small helpful additions
  - Normal marketing/supporting sections
  - Reasonable defaults that strengthen the requested site

  **Do penalize:**
  - Extra feature areas that pull the site toward a different use case
  - Unnecessary complexity that muddies the visitor journey
  - Irrelevant sections that compete with the requested primary outcome

  ## Examples

  **Example 1: Perfect scope (Score: 100)**
  - Everything present was requested or implied
  - No competing elements
  - Clean, focused execution
  - Deductions: 0

  **Example 2: Minor helpful addition (Score: 95)**
  - Added FAQ section (reasonable default)
  - Supports primary goal
  - Deduction: -5 points

  **Example 3: Minor drift (Score: 88)**
  - Added blog section not requested
  - Doesn't compete with primary CTA
  - Base deduction: -15, reduced 50% for supporting content = -7.5
  - Rounded: -12

  **Example 4: Major drift (Score: 68)**
  - Added e-commerce for consulting site
  - Competes with booking primary goal
  - Base deduction: -20, +50% competition penalty = -30
  - Total: -32

  **Example 5: Critical drift (Score: 38)**
  - Requested portfolio, got full e-commerce platform
  - Completely different use case
  - Base deduction: -35, +50% compete +20% prominent = -59.5
  - Rounded: -62

  **Example 6: Multiple minor drifts (Score: 67)**
  - 3 unrequested sections (blog, shop, community)
  - Each minor individually (-8, -7, -10 = -25)
  - Pattern penalty: -10
  - Total: -35, final score 65, rounded to 67

