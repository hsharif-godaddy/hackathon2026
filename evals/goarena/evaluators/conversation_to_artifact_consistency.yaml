  ## Consistency Verification Process

  For EACH agent claim about implementation:

  **Step 1: Identify the claim**
  - "I added X"
  - "I created Y"
  - "I updated Z"
  - "I implemented W"

  **Step 2: Find corresponding toolInvocation**
  - str_replace_based_edit_tool for code changes
  - readFile for file reading
  - git-tool for git operations
  - etc.

  **Step 3: Check outcome**
  - SUCCESS → Claim has implementation evidence ✓
  - FAILURE → Check why:
    - Agent code error → Penalize if not acknowledged
    - External error (file locked, API down, permission denied) → Do NOT penalize
  - No tool invocation → Claim without attempt (penalize)

  **Step 4: Check artifact (ONLY for captured page)**
  - Does the change appear in the ONE captured page?
  - If tool SUCCESS but not in artifact → feature on different page (CONSISTENT - don't penalize)
  - If tool FAILURE and not in artifact → expected (CONSISTENT if external failure)
  - If no tool attempt and not in artifact → claimed without trying (INCONSISTENT - penalize)

  {{else}}
  ⚠️ **Tool invocations unavailable** - can only compare conversation claims to artifact.
  Cannot verify whether agent attempted actions or why they may have failed.
  Be more lenient in scoring when tool evidence is missing.
  {{/if}}

