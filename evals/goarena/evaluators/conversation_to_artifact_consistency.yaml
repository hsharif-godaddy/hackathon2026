template: |
  You are grading `conversation_to_artifact_consistency` for an Airo Builder session.

  Compare what the agent explicitly said it did or would do against what is visible in the final artifact.

  ## 🚨 CRITICAL RULE - INCOMPLETE ARTIFACT SNAPSHOTS

  **ARTIFACT SHOWS ONE PAGE ONLY**

  The pageContent and screenshots capture ONE PAGE (typically homepage, cart, or last viewed page).
  Other pages exist on separate routes:
  - Checkout page → /checkout (NOT on cart/homepage)
  - Admin pages → /admin/* (NOT on public pages)
  - Success/cancel pages → /success, /cancel (NOT in main flow)
  - Contact forms → /contact (NOT on homepage)
  - Product pages → /products/* (NOT on homepage)

  ### YOU MUST:
  ✓ Check toolInvocations for SUCCESS/FAILURE evidence FIRST
  ✓ If tool shows SUCCESS → mark as CONSISTENT (even if not in artifact capture)
  ✓ Distinguish: "unverifiable" (different page) vs "inconsistent" (contradicted by evidence)
  ✓ Only penalize when artifact CONTRADICTS claim OR tool shows agent-caused FAILURE

  ### YOU MUST NOT:
  ✗ Treat "unverifiable from artifact" as "inconsistent"
  ✗ Penalize claims about features on uncaptured pages
  ✗ Use phrases like "none of those are verifiable... mismatch"
  ✗ Score low when agent has successful tool invocations but artifact is incomplete

  ### CORRECT EVALUATION:
  ✓ Agent: "I added Stripe checkout" + Tool: edit checkout.tsx → SUCCESS + Artifact: Cart page shown
    → CONSISTENT (tool success proves implementation, cart ≠ checkout page)

  ✓ Agent: "I added admin/orders page" + Tool: create admin-orders.tsx → SUCCESS + Artifact: Cart page
    → CONSISTENT (tool success, admin pages not in public artifact)

  ### VIOLATION EXAMPLES - DO NOT DO THIS:
  ❌ "Agent claimed Stripe checkout... unverifiable from cart page artifact... mismatch" → Score 55
  ❌ "Success pages not visible in artifact... inconsistent" → Score 60
  ❌ "Multiple claims unverifiable... scoring as inconsistent" → Score 45

  ## CRITICAL: Tool Invocation Evidence

  {{#if conversation.messages.[0].toolInvocations}}
  ✓ Tool invocations with OUTCOMES available - use for ground truth verification
  {{else}}
  ⚠️ Tool invocations not available - evaluation limited to conversation and artifact comparison
  {{/if}}

  **Fair Consistency Evaluation Requires:**
  1. Identify what agent claimed to do
  2. Check if agent ATTEMPTED it (toolInvocations evidence)
  3. Check if attempt SUCCEEDED or FAILED
  4. If FAILED, determine if agent's fault or external issue
  5. Check if result appears in artifact

  **Do NOT penalize:**
  - Agent attempted but tool failed due to external issue (infrastructure, locked files, API down)
  - Agent honestly said "I attempted X but it failed"
  - Agent said "I cannot do X" when X is truly impossible

  **DO penalize:**
  - Agent claimed "I did X" with NO tool invocation attempt
  - Agent claimed success when tool showed FAILURE without acknowledging
  - Agent claimed capability it doesn't have

