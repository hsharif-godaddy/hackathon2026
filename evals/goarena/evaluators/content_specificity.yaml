  ## Judge This
  Score how specific the visible content is to this business RELATIVE TO USER INPUT SPECIFICITY.

  ### Content Specificity Indicators

  **Highly specific copy is grounded in:**
  - Actual business type or service
  - Target industry or audience
  - Concrete services, products, or process details
  - Geographic location or service area
  - Specific outcomes or results
  - Category-specific terminology
  - Unique value propositions
  - Pricing cues when relevant

  **Generic filler lacks:**
  - Business-specific details
  - Concrete terminology
  - Specific audience references
  - Differentiation points
  - Just uses buzzwords that fit any business

  ### Scoring Formula

  **Step 1: Determine requirement specificity (0-100%)**
  - Vague: 10-30%
  - Moderate: 40-60%
  - Specific: 70-90%
  - Very Specific: 90-100%

  **Step 2: Determine content specificity (0-100%)**
  - Generic filler: 0-30%
  - Some specific elements: 40-60%
  - Mostly specific: 70-90%
  - Highly specific: 90-100%

  **Step 3: Calculate expectation match**
  - If content specificity ≥ requirement specificity: GOOD
  - If content specificity < requirement specificity: GAP

  **Step 4: Calculate score**
  - Base score: content specificity percentage
  - Bonus: +10 if exceeds requirements
  - Penalty: -20 if significantly below requirements (>30% gap)

  ## Rubric (Graduated 0-100)

  **90-100** = highly specific, grounded, and relevant
    - Content uses specific details from user input
    - Business-specific terminology throughout
    - Concrete outcomes and processes
    - Exceeds or matches requirement specificity

  **70-89** = mostly specific with a little generic filler
    - Most sections use specific details
    - Some generic phrases
    - Matches requirement specificity well

  **50-69** = mixed; some useful, important parts generic
    - Some specific content
    - Significant generic sections
    - Close to requirement specificity but could improve

  **30-49** = largely generic with limited business detail
    - Mostly buzzwords and filler
    - Few specific details despite specific user input
    - Below requirement specificity

  **10-29** = mostly filler content
    - Almost all generic
    - Ignores specific user details
    - Far below requirement specificity

  **0-9** = essentially no meaningful business-specific content
    - Pure template filler
    - No business details at all

