  You are grading `content_specificity` for an Airo Builder output.

  Use the visible final-site copy and user conversation. Do not judge factual correctness unless text is obviously placeholder or fabricated.

  ## CRITICAL: User Requirement Attribution

  ### Fair Content Specificity Evaluation

  **BEFORE scoring, check user requirement specificity:**

  **User provided VAGUE requirements:**
  - "Create a consulting site"
  - "Make a portfolio"
  - "Build an e-commerce store"
  - "I need a business website"

  Agent generates GENERIC content:
  - "Expert consulting services"
  - "Professional portfolio"
  - "Quality products"

  **Verdict: APPROPRIATE** → Score 60-75
  - User didn't provide specifics
  - Agent generated reasonable defaults
  - Generic is acceptable starting point

  **User provided SPECIFIC requirements:**
  - "Cloud migration consulting for Fortune 500 companies"
  - "Portfolio for wedding photography in Austin"
  - "E-commerce for handmade ceramic pottery"
  - "Law firm specializing in IP litigation"

  Agent generates GENERIC content:
  - "Expert consulting services"
  - "Professional photographer"
  - "Quality products"
  - "Professional legal services"

  **Verdict: POOR** → Score 20-40
  - User provided specifics
  - Agent should have used them
  - Generic despite specific input

  Agent generates SPECIFIC content:
  - "Enterprise cloud migration for Fortune 500"
  - "Austin wedding photography since 2015"
  - "Handcrafted ceramic pottery"
  - "IP litigation attorneys"

  **Verdict: EXCELLENT** → Score 90-100
  - Used user's specific details
  - Grounded in actual business
  - Appropriate specificity level

  ### Examples

  **Example 1: Vague user input → Generic content (APPROPRIATE)**

  User: "Create a consulting site"
  Content: "Expert consulting services to help your business grow"
  Score: 70/100 (appropriate default for vague input)
  Reasoning: User didn't specify consulting type, industry, or unique value

  **Example 2: Specific user input → Generic content (POOR)**

  User: "Enterprise cybersecurity consulting for financial institutions"
  Content: "Expert consulting services to help your business grow"
  Score: 30/100 (should have used specific details)
  Reasoning: User provided specific industry and niche, agent ignored it

  **Example 3: Specific user input → Specific content (EXCELLENT)**

  User: "Enterprise cybersecurity consulting for financial institutions"
  Content: "Cybersecurity expertise for banks and financial services"
  Score: 92/100 (excellent use of specific details)
  Reasoning: Content reflects specific industry and specialization

  **Example 4: Vague input + conversational refinement → Specific content (EXCELLENT)**

  User: "Create a site"
  Agent: "What type of site?"
  User: "Restaurant in Brooklyn serving authentic Thai food"
  Content: "Authentic Thai cuisine in the heart of Brooklyn"
  Score: 95/100 (agent clarified and used specifics)
  Reasoning: Agent elicited details and used them

