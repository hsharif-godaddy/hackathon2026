  ## Requirement Specificity Analysis

  **Before scoring content, analyze user requirements:**

  Requirement specificity level:
  - **Vague** (10-30% detail): Business type only, no specifics
  - **Moderate** (40-60% detail): Business type + some details (industry, location, or target audience)
  - **Specific** (70-90% detail): Business type + multiple details (industry, location, target audience, unique value)
  - **Very Specific** (90-100% detail): Comprehensive details (industry, niche, location, audience, services, differentiators)

  Expected content specificity should match requirement specificity ±15%.

