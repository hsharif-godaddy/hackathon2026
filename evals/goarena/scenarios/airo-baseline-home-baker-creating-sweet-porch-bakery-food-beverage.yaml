---
key: airo-baseline-home-baker-creating-sweet-porch-bakery-food-beverage
name: Home baker creating Sweet Porch Bakery
syntheticUserName: Home baker creating Sweet Porch Bakery

business:
  industry: Food & Beverage
  businessName: Sweet Porch Bakery
  businessDescription: Small home bakery selling cupcakes, cookies, and custom cakes
  targetAudience: Local families and people ordering birthday treats
  brandPersonality:
    - warm
    - cheerful
    - homemade
  colorPreferences:
    - butter-yellow
    - cream
    - soft-pink
  stylePreferences:
    - simple
    - cozy
    - photo-friendly

goal:
  name: simple bakery website with order requests
  goals:
    - Help a home baker get a friendly first website online where local customers can see flavors,
      hours, and ask about custom cake or cookie orders.
customerSummary: friendly, non-technical, wants a cute bakery website where people can see flavors
  and ask about custom orders. easy scenario.
testingCapability: "Complexity: easy | Primary intent: new website + contact/order form | Skill
  under test: forms/content/media | Scenario cluster: Simple local business website | Expected:
  create clear hero, menu, photos, hours, and inquiry form"

trials: 1
maxTurns: 13

llmConfig:
  model: gpt-5.2
  temperature: 0.75
  maxTokens: 32000

browserConfig:
  browserAuth:
    type: form
    credentialsSecretId: goarena/airo/login05
    loginUrl: https://sso.test-godaddy.com
    passwordSelector: "#password"
    submitSelector: "#submitBtn"
    usernameSelector: "#username"
  requiresPerTurnScreenshots: false
  qualityEval:
    enabled: true
    siteType: service-business
    wcagLevel: AA
    thresholds:
      minOverallScore: 70
      minAccessibility: 75

evaluators:
  - evaluatorName: "Airo Functional Evaluator"
    weight: 25
    criteria:
      checkLinks: true
      checkImages: true
      checkConsoleErrors: true
  - evaluatorName: "Airo Accessibility Evaluator"
    weight: 25
    criteria:
      wcagLevel: AA
  - evaluatorName: "Airo SEO Evaluator"
    weight: 15
    criteria:
      checkOpenGraph: true
      checkTwitterCards: true
  - evaluatorName: "Airo Performance Evaluator"
    weight: 15
    criteria:
      timeout: 30000
  - evaluatorName: "Airo Security Evaluator"
    weight: 10
    criteria:
      requireHttps: true
      checkHeaders: true
  - evaluatorName: intent_inference_quality
    weight: 6
    criteria: { }
  - evaluatorName: intent_to_output_alignment
    weight: 4
    criteria: { }
