version: "2"

run:
  go: "1.25"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - gocritic
    - gocyclo
    - gosec
  settings:
    gocyclo:
      min-complexity: 25
    govet:
      disable:
        - fieldalignment
    revive:
      rules:
        - name: exported
          disabled: true
    staticcheck:
      checks:
        - all
        # ST1000: missing package comment. Cosmetic.
        - -ST1000
        # ST1003: var/method naming (subId/Dns). Renaming would break API contract.
        - -ST1003
        # QF1001: De Morgan's law. Cosmetic.
        - -QF1001
        # QF1012: WriteString(fmt.Sprintf(...)) -> Fprintf. Cosmetic.
        - -QF1012
  exclusions:
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      # Tests intentionally use 0o755/0o644 perms and call setup helpers without checking errs.
      - path: '_test\.go'
        linters:
          - errcheck
          - gosec
          - gocyclo
          - gocritic
      # Trusted local-dev tool: docker/git subprocesses are validated by the caller.
      - path: 'internal/docker/'
        linters:
          - gosec
        text: "G204|G702|G703|G306"
      - path: 'internal/setup/template\.go'
        linters:
          - gosec
        text: "G204|G304|G301|G306|G703"
      # Outbound HTTP to user's own preview/agent containers and template path ops by design.
      - path: 'internal/api/apps\.go'
        linters:
          - gosec
        text: "G703|G704"
      - path: 'internal/api/secrets\.go'
        linters:
          - gosec
        text: "G703"
      - path: 'internal/projectenv/'
        linters:
          - gosec
        text: "G304|G703"
      # Secret name string, not a credential.
      - path: 'internal/auth/jwt\.go'
        linters:
          - gosec
        text: "G101"
      # Compose project path is constructed from the app workspace root, not user input.
      - path: 'internal/docker/compose\.go'
        linters:
          - gosec
        text: "G703"

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
