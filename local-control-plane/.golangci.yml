version: "2"
run:
  go: "1.25"
linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - gocritic
    - gocyclo
    - goconst
    - gosec
  settings:
    gocyclo:
      min-complexity: 15
    goconst:
      min-len: 3
      min-occurrences: 3
    govet:
      disable:
        - fieldalignment
    revive:
      rules:
        - name: exported
          disabled: true
formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      extra-rules: true
