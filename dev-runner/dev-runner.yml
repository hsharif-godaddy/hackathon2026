processes:
  - name: App
    command: pnpm run dev
    dir: app
    errorPatterns:
      - "FATAL"
      - "Module not found"
      - "EADDRINUSE"
    healthCheck:
      url: https://local.gasket.dev-godaddy.com:8443/api/health
      unhealthyInterval: 10s
      healthyInterval: 60s
      insecure: true

  # OPENAI_BASE_URL / ANTHROPIC_BASE_URL point the agent at the local LLM proxy
  # (AIROBUILD-2998). This is set on the command (process env) rather than in
  # agents/.env so it is dev-only: `local:test` / `local:prod` run agents
  # outside dev-runner and keep talking to the real provider. load-env.cjs loads
  # .env with override:false, so this process-env value wins. The proxy reads
  # agents/.env to learn the mode + real upstreams. SKIP_GOCODE_KEY_VALIDATION
  # avoids load-env.cjs's startup key-check racing the proxy in api-key mode
  # (s2s mode skips that check regardless).
  - name: Agents
    command: OPENAI_BASE_URL=http://127.0.0.1:8788/u/openai ANTHROPIC_BASE_URL=http://127.0.0.1:8788/u/anthropic SKIP_GOCODE_KEY_VALIDATION=true pnpm run dev
    dir: agents
    errorPatterns:
      - "FATAL"
      - "UnhandledPromiseRejection"
      - "EADDRINUSE"
    healthCheck:
      # ${AGENTS_PORT} is expanded by config.Load (defaults to 4000 if unset),
      # so the health probe targets whatever port the agents server actually
      # binds to under PORT || AGENTS_PORT || 4000.
      url: https://local.gasket.dev-godaddy.com:${AGENTS_PORT}/health
      unhealthyInterval: 10s
      healthyInterval: 60s

  - name: Control Plane
    command: pnpm run dev:control-plane
    dir: .
    errorPatterns:
      - "FATAL"
      - "panic:"
      - "bind: address already in use"
    healthCheck:
      url: http://localhost:4100/health
      unhealthyInterval: 10s
      healthyInterval: 60s

  # Local LLM fault-injection proxy (AIROBUILD-2998). Always in-path between the
  # agent and the LLM provider; transparent passthrough until a fault is armed
  # from the TUI (the `i` key). Health is the control listener on :8789.
  - name: LLM Proxy
    command: pnpm run llm-proxy
    dir: .
    errorPatterns:
      - "EADDRINUSE"
      - "Cannot find module"
      - "Cannot find package"
    healthCheck:
      url: http://localhost:8789/health
      unhealthyInterval: 10s
      healthyInterval: 60s

hooks:
  preStart:
    # DirenvCheck preflight is the actual gate for direnv state — it
    # blocks `pnpm run dev` if direnv isn't installed or `.envrc` is
    # blocked, since neither has an auto-fixer. By the time this hook
    # runs, preflight has already passed: the binary exists and either
    # the .envrc is already allowed, or the allow-state is unknown but
    # benign.
    #
    # This hook re-asserts the trust on every dev start: cheap and
    # idempotent on already-allowed `.envrc`, and clears any stale
    # ".envrc has changed since last allow" state introduced by the
    # post-clean-and-restart flow (settings → Clean + Restart) without
    # making the user drop to a shell to re-allow.
    - name: Authorize direnv
      command: direnv allow
      dir: .
    - name: Install dependencies
      command: pnpm install
      dir: .
