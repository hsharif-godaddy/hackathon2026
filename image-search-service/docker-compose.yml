# Docker Compose for local development
# Provides Qdrant vector database for the image-search-service
#
# For plain (non-TLS) local dev, use the shared Qdrant from the repo root:
#   docker compose up qdrant  (from repo root)
#
# To use with TLS (matches deployed environment):
#   ./scripts/gen-tls-certs.sh
#   docker compose --profile tls up

services:
  qdrant-tls:
    image: qdrant/qdrant:v1.16
    profiles: ["tls"]
    ports:
      - "6333:6333" # HTTPS API
      - "6334:6334" # gRPC+TLS API
    volumes:
      - qdrant_tls_data:/qdrant/storage
      - ./tls:/qdrant/tls:ro
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__ENABLE_TLS=true
      - QDRANT__TLS__CERT=/qdrant/tls/cert.pem
      - QDRANT__TLS__KEY=/qdrant/tls/key.pem
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "--no-check-certificate",
          "https://localhost:6333/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  qdrant_tls_data:
