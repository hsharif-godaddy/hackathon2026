services:
  # Agents API Service
  agents:
    platform: linux/amd64 # Force x64 platform for consistent native module compilation
    build:
      context: .
      dockerfile: ./agents/Dockerfile
      platforms:
        - linux/amd64
    container_name: airo-agents
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_PATH=/app/data/apps.db
      - DEBUG=true
      - LOG_LEVEL=info
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - proxy
    networks:
      - airo-network
    restart: unless-stopped

  # Frontend App Service
  app:
    platform: linux/amd64 # Force x64 platform for consistent native module compilation
    build:
      context: .
      dockerfile: ./app/Dockerfile
      platforms:
        - linux/amd64
    container_name: airo-app
    ports:
      - "8443:8443"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HTTPS_PORT=3443
      - DATABASE_URL=mysql://airo:airopassword@localhost:3306/airo_app
      - SSO_LOGIN_URL=https://sso.dev-godaddy.com/login
      - SSO_LOGOUT_URL=https://sso.dev-godaddy.com/logout
      - LOGIN_REDIRECT_URL=https://local.gasket.dev-godaddy.com:8443/
      - LOGOUT_REDIRECT_URL=https://local.gasket.dev-godaddy.com:8443/
    networks:
      - airo-network
    restart: unless-stopped

  proxy:
    platform: linux/amd64 # Force x64 platform for consistent native module compilation
    build:
      context: ./
      dockerfile: ./proxy/Dockerfile
      platforms:
        - linux/amd64
    container_name: airo-proxy
    ports:
      - "8888:8888"
    environment:
      - API_SECRET=${OPENAI_API_KEY:-<apikey>}
      - VALID_TOKENS=token1,token2,token3
      - GETTY_CERT=${GETTY_CERT}
      - GETTY_KEY=${GETTY_KEY}
      - AGENT_SSO_HOST=sso.dev-godaddy.com
    restart: unless-stopped
    networks:
      - airo-network

  # MySQL database for app local development
  app-mysql:
    image: mysql:8.0
    container_name: airo-app-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=airo_app
      - MYSQL_USER=airo
      - MYSQL_PASSWORD=airopassword
    volumes:
      - mysql-data:/var/lib/mysql
      - ./setup/mysql-init:/docker-entrypoint-initdb.d
    networks:
      - airo-network
    restart: unless-stopped

  # Qdrant Vector Database Service
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: airo-qdrant
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC API (optional)
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - airo-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  airo-network:
    driver: bridge

# SQLite databases are stored in mounted volumes, both MySQL and Qdrant data persisted in volumes
volumes:
  mysql-data:
  qdrant_data:
    driver: local
