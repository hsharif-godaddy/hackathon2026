services:
  # Agents API Service
  agents:
    platform: linux/amd64 # Force x64 platform for consistent native module compilation
    build:
      context: .
      dockerfile: ./agents/Dockerfile
      platforms:
        - linux/amd64
    container_name: airo-agents
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_PATH=/app/data/apps.db
      - DEBUG=true
      - LOG_LEVEL=info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - airo-network
    restart: unless-stopped

  # Frontend App Service
  app:
    platform: linux/amd64 # Force x64 platform for consistent native module compilation
    build:
      context: .
      dockerfile: ./app/Dockerfile
      platforms:
        - linux/amd64
    container_name: airo-app
    ports:
      - "8443:8443"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HTTPS_PORT=3443
      - SSO_LOGIN_URL=https://sso.dev-godaddy.com/login
      - SSO_LOGOUT_URL=https://sso.dev-godaddy.com/logout
      - LOGIN_REDIRECT_URL=https://local.gasket.dev-godaddy.com:8443/
      - LOGOUT_REDIRECT_URL=https://local.gasket.dev-godaddy.com:8443/
    networks:
      - airo-network
    restart: unless-stopped

  # MySQL database for local control plane app containers
  # Per-app databases are provisioned dynamically by local-control-plane
  app-mysql:
    image: mysql:8.0
    container_name: airo-app-mysql
    command: --require_secure_transport=ON
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - airo-network
    restart: unless-stopped

networks:
  airo-network:
    driver: bridge
    name: airo-network

# SQLite databases are stored in mounted volumes; MySQL data persisted in a volume
volumes:
  mysql-data:
