slack:
  secret_name: releases_slack_bot_token
  aws_profile: airobuild-dev-private-sso

lock:
  ssm_parameter: /airo/release-manager/deploy-lock
  aws_profile: airobuild-dev-private-sso

release:
  repo: gdcorp-partners/airo-app-builder
  enabled: true
  # Approvers @-mentioned in the "Awaiting prod approval" ping. Plain Slack
  # handles — a username, or a user-group handle like ask-airo-sre. The binary
  # resolves each to its Slack ID at run time (users.list / usergroups.list), so
  # raw handles here are fine. Requires the bot's users:read + usergroups:read
  # scopes; an unresolved handle or a missing scope just drops that mention.
  approval_mentions:
    - jeichorn
    - dmendis
    - ugupta
    - skilaru
    - arai1
    - deverton
    - matkinson
    - ask-airo-sre # Slack user group → <!subteam^…>
    - mlefebvre1
    - dmiller1
    - hgupta2
    - kra
    - hdewan

# Workflows that are NOT pipeline stages but whose in-flight runs must still
# block a manual TUI release. The headless GHA release pipeline (release.yml)
# holds no SSM lock, so the TUI's active-run preflight scans for it here and
# refuses to start if a GHA release is running (incl. one paused at the
# approve-prod gate, which shows as run status "waiting"). Empty filter = any
# active release run matches. Override with --force-lock for break-glass.
orchestrator_workflows:
  - repo: gdcorp-partners/airo-app-builder
    workflow: release.yml
  # rollback.yml has short windows (startup before the first dispatch, between
  # rollback-app finishing and rollback-images dispatching, and teardown) where
  # it is in_progress but none of its dispatched stages are — register it so a
  # manual release started in one of those windows is still blocked.
  - repo: gdcorp-partners/airo-app-builder
    workflow: rollback.yml

pipeline:
  environments:
    test:
      stages:
        # --- App deploy + image build run in parallel ---
        - id: deploy-app
          name: Deploy App to Test
          group: deploy
          repo: gdcorp-partners/airo-app-builder
          workflow: aws-deploy-app.yml
          active_run_filter: '[APP - test]'
          ref: '{{branch}}'
          inputs:
            DEPLOY_TO_ENV: test
            sha: '{{commit}}'
          outputs:
            artifact_id:
              from: run-log
              pattern: "Artifact ID: (\\d+)"

        - id: build-images
          name: Build Container Images
          group: deploy
          repo: gdcorp-commerce/pioneer-infra
          workflow: combined-airo-app-build.yml
          inputs:
            environment: c1-dev-private-us-west-2
            airo-app-builder-branch: '{{commit}}'
            node-version: '22'
            build-image: 'true'
            publish-image: 'true'
            preprov-management-action: 'Upsert + Reload Pre-Prov'
            preprov-variant: preview
          outputs:
            agent_image_tag:
              from: run-log
              job_match: 'build-airo-app-builder-agent.*Send Notifications'
              pattern: 'MOST_SPECIFIC_IMMUTABLE_TAG_SUFFIX=(pi-[a-f0-9]+-ext-[a-f0-9]+)'
            preview_image_tag:
              from: run-log
              job_match: 'build-airo-app-builder-preview.*Send Notifications'
              pattern: 'MOST_SPECIFIC_IMMUTABLE_TAG_SUFFIX=(pi-[a-f0-9]+-ext-[a-f0-9]+)'
            publish_image_tag:
              from: run-log
              job_match: 'build-airo-app-builder-publish.*Send Notifications'
              pattern: 'MOST_SPECIFIC_IMMUTABLE_TAG_SUFFIX=(pi-[a-f0-9]+-ext-[a-f0-9]+)'

        # --- Health check + manual checklist + simulation eval run in parallel after the deploy
        # group finishes. E2E + regression no longer run against the test env here — they run
        # against the real prod build in the PROD-DARK phase (dark-e2e / dark-regression). ---
        - id: health-check-test
          name: Health Check (Test)
          group: validate
          advisory: true # surfaced for the reviewer; does not block the prod gate
          type: health-check
          url: 'https://airo-builder.test-godaddy.com/api/health'
          expect_version: '{{commit}}'

        - id: checklist-test
          name: Manual Checklist
          group: validate
          type: checklist
          items:
            - 'Verify the katana app loads at test URL: https://airo-builder.test-godaddy.com/'
            - 'Create a new app and verify it builds the site'
            - 'Publish the app and verify it goes live'
            - 'Verify the app id in nomad c4 has the correct image versions'
            - 'Verify an existing app upgrades correctly and the agent is working'
            - 'Verify that you can add a credit pack'
            - 'Verify any new features in the release notes are working'

        # --- Simulation evaluation — advisory: a sub-threshold (<70) score is
        # surfaced in Slack + the approval summary but does NOT block; the
        # reviewer decides at the prod gate. (fail-on-threshold still makes the
        # underlying run go red so its result is unambiguous.)
        - id: simulation-eval-test
          name: Simulation Evaluation
          group: validate
          advisory: true
          repo: gdcorp-partners/airo-app-builder
          workflow: simulation_evaluation.yml
          active_run_check: false
          ref: '{{branch}}'
          inputs:
            fail-on-threshold: 'true'
            score-threshold: '70'

    # ===================== PROD-DARK: dark-deploy + advisory dark tests, BEFORE the approve-prod gate =====================
    # Deploy the new builder (Katana dark_release @ 0% traffic) and bind the agent/preview/publish
    # images to that build's commit SHA via a cohort-less Release Group, so the approver — and any
    # app the dark e2e creates — hits the full dark stack. This phase runs BEFORE approve-prod
    # (release.yml's dark-phase job), so the human reviews a live, already-tested dark build + the
    # Slack dark URL, then approves the fleet-wide promote. Dark e2e/regression are ADVISORY: they
    # inform the approver (test_summary in Slack) but do not auto-gate.
    #
    # NOTE: dark-create-rg + rg-rollback (in the prod env below) dispatch pioneer-infra's
    # release-group-simple.yml, enabled by pioneer-infra #5479 (merged 2026-06-19) and reconciled
    # against its merged workflow_dispatch contract: Create + Reload runs cohort-less here
    # (katanaSelector, no appIds) using action / environment / katanaSelector / compositionId /
    # compositionVersion / agentImageTag / previewImageTag / publishImageTag; Rollback uses
    # action / environment / releaseGroupId (it also carries appIds: 'appId' — a declared string
    # input that the Rollback job ignores, since it resolves the cohort from releaseGroupId).
    # rolloutPct is hard-coded to 0 inside the workflow (not an input) and variant is hard-coded
    # to "preview", so neither is passed here.
    #
    # The dark selector + URL are NOT scraped from the dispatched promote-artifact run (brittle —
    # it depends on which branch's workflow is dispatched; see Release #95). They are derived by the
    # release-manager: katanaSelector = the pinned {{commit}} (the dark artifact's x-katana-version
    # selector IS the build commit SHA); dark_url = {{dark_url}}, which the prod-dark phase computes
    # from {{commit}} + the prod builder host (see runProdDark).
    prod-dark:
      requires: test
      stages:
        - id: dark-deploy-app
          name: Dark-deploy App to Prod (0% traffic)
          repo: gdcorp-partners/airo-app-builder
          workflow: promote-artifact.yml
          ref: '{{branch}}'
          inputs:
            component: app
            environment: prod
            artifact_id: '{{test.deploy-app.artifact_id}}'
            strategy: dark_release
            skip_e2e: 'true'

        - id: dark-create-rg
          name: Create + bind dark Release Group
          advisory: true # RG create is best-effort; a failed create (e.g. 409) must not block the release
          repo: gdcorp-commerce/pioneer-infra
          workflow: release-group-simple.yml
          inputs:
            action: 'Create + Reload'
            environment: mgmt-prod-us-west-2
            # Cohort-less: bind by the builder's commit SHA only (no appIds) — enabled by #5479.
            # The selector IS the pinned release commit — derived, not scraped (see the phase note).
            # rolloutPct (hard-coded to 0) and variant ("preview") are internal to the workflow.
            katanaSelector: '{{commit}}'
            agentImageTag: '{{test.build-images.agent_image_tag}}'
            previewImageTag: '{{test.build-images.preview_image_tag}}'
            publishImageTag: '{{test.build-images.publish_image_tag}}'
            compositionId: ai-builder
            compositionVersion: v4
          outputs:
            release_group_id:
              from: run-log
              pattern: "RELEASE_GROUP_ID=(\\S+)"

        # --- Dark e2e + regression run in parallel against the dark URL. Advisory: surfaced in
        # Slack for the reviewer, they do not block the promote (for now). ---
        - id: dark-e2e
          name: Dark E2E (Prod)
          group: dark-validate
          advisory: true # surfaced in Slack; does NOT gate the promote (for now)
          test_summary: true
          repo: gdcorp-partners/airo-app-builder
          workflow: playwright-e2e.yml
          active_run_check: false
          ref: '{{branch}}'
          inputs:
            environment: prod
            test_filter: e2e
            dark_url: '{{dark_url}}'

        - id: dark-regression
          name: Dark Regression (Prod)
          group: dark-validate
          advisory: true # surfaced in Slack; does NOT gate the promote (for now)
          test_summary: true
          repo: gdcorp-partners/airo-app-builder
          workflow: playwright-e2e.yml
          active_run_check: false
          ref: '{{branch}}'
          inputs:
            environment: prod
            test_filter: regression
            dark_url: '{{dark_url}}'

    prod:
      requires: prod-dark
      stages:
        # Tear the dark experiment down (clears the SHA binding, reverts enrolled apps to stable)
        # FIRST — after the approve-prod gate, before the fleet-wide promote. ADVISORY: a failed
        # teardown is surfaced in Slack but does NOT halt the already-approved promote. The
        # fleet-wide stable promote below is the authoritative end state (upsert-reload-preprov
        # reloads every app to stable regardless), and the dark RG is bounded by rolloutPct=0 +
        # the dark artifact's 24h ttl. CAVEAT: a failed teardown leaves the dark RG active. Since
        # dark-create-rg is advisory too, the NEXT release's create then 409s ADVISORILY (mgmt-airo
        # allows one active RG per composition) — it won't block, but that release's dark stack is
        # silently partial (the "PARTIAL" Slack warning fires) until the leftover RG is rolled back
        # manually. A reuse-or-rollback self-heal on dark-create-rg (cf. the Katana publish-409 fix
        # in #5298) would remove this footgun. Also: if dark-create-rg failed THIS release,
        # release_group_id is unset, so this stage dispatches Rollback with an unexpanded id —
        # advisory + harmless (the dispatch fails, but there is no RG to roll back). On a DECLINED
        # gate (or a failed/cancelled dark-phase) the prod env never runs; the abort path
        # (release.yml's gate-declined / cancel cleanup) tears the RG down instead, using the
        # release_group_id carried in state.json.
        - id: rg-rollback
          name: Roll back dark Release Group
          advisory: true # teardown is best-effort; a failure must not withhold the approved promote
          repo: gdcorp-commerce/pioneer-infra
          workflow: release-group-simple.yml
          inputs:
            action: Rollback
            environment: mgmt-prod-us-west-2
            appIds: 'appId' # carried for the release-group-simple.yml string input; the Rollback path resolves the cohort from releaseGroupId
            releaseGroupId: '{{prod-dark.dark-create-rg.release_group_id}}'

        # ===================== Fleet-wide stable promote (unchanged) =====================
        # --- Promote images first (fast, upsert-reload-preprov depends on this) ---
        - id: promote-images
          name: Promote Images to Prod
          repo: gdcorp-commerce/pioneer-infra
          workflow: docker-promote.yml
          active_run_filter: 'airo-builder'
          matrix:
            - inputs:
                environment: c1-dev-private-us-west-2
                source-repository-name: airo-builder/agent
                image-tag: '{{test.build-images.agent_image_tag}}'
            - inputs:
                environment: c1-dev-private-us-west-2
                source-repository-name: airo-builder/preview
                image-tag: '{{test.build-images.preview_image_tag}}'
            - inputs:
                environment: c1-dev-private-us-west-2
                source-repository-name: airo-builder/publish
                image-tag: '{{test.build-images.publish_image_tag}}'

        # --- Promote app + upsert/reload pre-prov run in parallel ---
        - id: promote-app
          name: Promote App to Prod
          group: deploy-prod
          repo: gdcorp-partners/airo-app-builder
          workflow: promote-artifact.yml
          ref: '{{branch}}'
          inputs:
            component: app
            environment: prod
            artifact_id: '{{test.deploy-app.artifact_id}}'
            skip_e2e: 'true'

        - id: upsert-reload-preprov
          name: Upsert + Reload Pre-Prov
          group: deploy-prod
          repo: gdcorp-commerce/pioneer-infra
          workflow: airo-preprov-management-unified.yml
          inputs:
            action: 'Upsert + Reload Pre-Prov'
            environment: mgmt-prod-us-west-2
            agentImageTag: '{{test.build-images.agent_image_tag}}'
            previewImageTag: '{{test.build-images.preview_image_tag}}'
            publishImageTag: '{{test.build-images.publish_image_tag}}'
            compositionId: ai-builder
            compositionVersion: v4
            appTemplateName: default
            batchConcurrency: '5'

        # --- E2E + regression + manual checklist run in parallel. These are
        # advisory: prod is already live by this point (images promoted, app
        # promoted), so a failing prod smoke test is surfaced in Slack but does
        # NOT block — the GitHub release tag is still cut. Failure withholds
        # nothing operationally; it just signals the live deploy needs a look. ---
        - id: e2e-prod
          name: E2E Tests (Prod)
          group: validate-prod
          advisory: true # prod already live; failure does not withhold the release tag
          test_summary: true # render per-suite counts + failed tests from the run's e2e-summary artifact
          repo: gdcorp-partners/airo-app-builder
          workflow: playwright-e2e.yml
          active_run_check: false
          ref: '{{branch}}'
          inputs:
            environment: prod
            test_filter: e2e

        - id: regression-prod
          name: Regression Tests (Prod)
          group: validate-prod
          advisory: true # prod already live; failure does not withhold the release tag
          test_summary: true # render per-suite counts + failed tests from the run's e2e-summary artifact
          repo: gdcorp-partners/airo-app-builder
          workflow: playwright-e2e.yml
          active_run_check: false
          ref: '{{branch}}'
          inputs:
            environment: prod
            test_filter: regression

        # Shadow run of the split + parallel-safe e2e-v2 suite alongside the
        # canonical e2e/regression stages above. Advisory while we build a
        # green track record on prod (see tests/e2e/REFACTOR_PLAN.md); once
        # stable, the canonical stage flips to e2e-v2 and this is removed.
        # No test_summary: playwright-e2e-v2.yml does not emit the e2e-summary
        # artifact that flag renders (preview workflow reads the run directly).
        - id: e2e-v2-prod
          name: E2E v2 Tests (Prod)
          group: validate-prod
          advisory: true # shadow run; never gates the release (prod already live)
          repo: gdcorp-partners/airo-app-builder
          workflow: playwright-e2e-v2.yml
          active_run_check: false
          ref: '{{branch}}'
          inputs:
            environment: prod

        - id: health-check-prod
          name: Health Check (Prod)
          group: validate-prod
          advisory: true # prod already live; failure does not withhold the release tag
          type: health-check
          url: 'https://airo-builder.godaddy.com/api/health'
          expect_version: '{{commit}}'

        - id: checklist-prod
          name: Manual Checklist
          group: validate-prod
          type: checklist
          items:
            - 'Verify the katana app loads at prod URL: https://airo-builder.godaddy.com/'
            - 'Create a new app and verify it builds the site'
            - 'Publish the app and verify it goes live'
            - 'Verify the app id in prod nomad has the correct image versions'
            - 'Verify an existing app upgrades correctly and the agent is working'
            - 'Verify that you can add a credit pack'
            - 'Verify any new features in the release notes are working'

  dry_run:
    # Dry run queries last successful runs and exercises real log parsing.
    # No placeholders needed.

  rollback:
    sources:
      artifact_id:
        repo: gdcorp-partners/airo-app-builder
        workflow: promote-artifact.yml
        filter: "displayTitle contains '[app]' and 'prod'"
        extract_pattern: "Promoting (\\d+) to prod"
      image_tags:
        repo: gdcorp-commerce/pioneer-infra
        workflow: airo-preprov-management-unified.yml
        filter: "displayTitle contains 'Upsert + Reload Pre-Prov' and 'PROD'"
        extract_from: run-log
        job_match: 'Upsert Template Images'
        patterns:
          agent_image_tag: 'AGENT_TAG="(pi-[a-f0-9]+-ext-[a-f0-9]+)"'
          preview_image_tag: 'PREVIEW_TAG="(pi-[a-f0-9]+-ext-[a-f0-9]+)"'
          publish_image_tag: 'PUBLISH_TAG="(pi-[a-f0-9]+-ext-[a-f0-9]+)"'

    steps:
      - id: rollback-app
        name: Rollback App
        group: rollback
        repo: gdcorp-partners/airo-app-builder
        workflow: promote-artifact.yml
        ref: '{{branch}}'
        inputs:
          component: app
          environment: prod
          artifact_id: '{{previous_good.artifact_id}}'

      - id: rollback-images
        name: Rollback Images
        group: rollback
        repo: gdcorp-commerce/pioneer-infra
        workflow: airo-preprov-management-unified.yml
        inputs:
          action: 'Upsert + Reload Pre-Prov'
          environment: mgmt-prod-us-west-2
          agentImageTag: '{{previous_good.agent_image_tag}}'
          previewImageTag: '{{previous_good.preview_image_tag}}'
          publishImageTag: '{{previous_good.publish_image_tag}}'
          compositionId: ai-builder
          compositionVersion: v4
          appTemplateName: default
          batchConcurrency: '5'
