version: 2

registries:
  jfrog-npm:
    type: npm-registry
    url: "https://gdartifactory1.jfrog.io/artifactory/api/npm/node-virt"
    jfrog-oidc-provider-name: github
    replaces-base: true

# npm updates use the JFrog virtual registry above (replaces-base). Requires Dependabot
# access to that registry (e.g. JFrog OIDC for GitHub). Schedule times are UTC.

updates:
  # Root workspace
  # Dependabot will iterate from here
  - package-ecosystem: "npm"
    directory: "/"
    registries:
      - jfrog-npm
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      # Group AWS SDK updates together
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
          - "@aws-crypto/*"
          - "@smithy/*"
      # Group React ecosystem
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # Group Next.js related
      nextjs:
        patterns:
          - "next"
          - "@next/*"
      # Group testing dependencies
      testing:
        patterns:
          - "jest"
          - "@jest/*"
          - "vitest"
          - "@vitest/*"
          - "@playwright/*"
          - "@testing-library/*"
      # Group linting/formatting
      code-quality:
        patterns:
          - "eslint"
          - "@typescript-eslint/*"
          - "prettier"
          - "typescript"
      # Group AI SDK packages
      ai-sdk:
        patterns:
          - "ai"
          - "@ai-sdk/*"
  
  # Monitor dev-supervisor
  - package-ecosystem: "gomod"
    directory: "/dev-supervisor"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    schedule:
      interval: "daily"

  # Monitor go-agent
  - package-ecosystem: "gomod"
    directory: "/go-agent"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    schedule:
      interval: "daily"

  # Monitor local-control-plane
  - package-ecosystem: "gomod"
    directory: "/local-control-plane"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    schedule:
      interval: "daily"

  # Monitor knowledge-service
  - package-ecosystem: "gomod"
    directory: "/knowledge-service"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    schedule:
      interval: "daily"

  # Monitor image-search-service
  - package-ecosystem: "gomod"
    directory: "/image-search-service"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    schedule:
      interval: "daily"

  # Monitor budget-service
  - package-ecosystem: "gomod"
    directory: "/budget-service"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    schedule:
      interval: "daily"

  # Monitor packages/go-auth
  - package-ecosystem: "gomod"
    directory: "/packages/go-auth"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    schedule:
      interval: "daily"

  # Monitor GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
