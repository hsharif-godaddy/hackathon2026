name: E2E Tests

run-name: "E2E Tests - ${{ inputs.environment || 'prod' }}${{ (inputs.test_filter && format(' [{0}]', inputs.test_filter)) || (github.event.schedule == '0 6 * * *' && ' [regression]') || (github.event.schedule == '0 */2 * * *' && ' [e2e]') || '' }} (by ${{ github.actor }})"

on:
  # Scheduled runs against prod. github.event.schedule (the cron string itself)
  # is used below to dispatch to the right test suite.
  #
  # NOTE: Each cron string is referenced in three places that must stay in sync:
  #   1. This block (trigger registration)
  #   2. run-name expression (line 3) — labels scheduled runs as [e2e] vs [regression]
  #   3. "Run Playwright tests" step's bash dispatcher — picks FILTER from $GITHUB_EVENT_SCHEDULE
  # Update all three when adding or changing a schedule.
  schedule:
    # Critical-path E2E every 2 hours - fast post-deploy/regression gate.
    - cron: '0 */2 * * *'
    # Full regression suite once per day (06:00 UTC) - covers auth flows,
    # apps-page, media tab, publish popover, archive restore (otherwise only
    # exercised on manual dispatch).
    - cron: '0 6 * * *'

  # Allow manual triggering and post-promotion triggering
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test against'
        required: true
        default: 'prod'
        type: choice
        options:
          - dev
          - pre-test
          - test
          - prod
      test_filter:
        description: 'Test suite to run'
        required: false
        default: 'e2e'
        type: choice
        options:
          - e2e
          - regression
          - e2e-then-regression
          - authentication
          - apps-page
          - develop-chat
          - develop-edit-interactions
          - develop-media
          - develop-publish
          - develop-brand-book
          - develop-design-kit
          - develop-dpp-handoff
          - develop-analytics-period
          - develop-view-share
          - develop-archive-restore
      post_promotion:
        description: 'Triggered by promotion workflow (internal use)'
        required: false
        type: boolean
        default: false
      dark_url:
        description: 'Dark-release URL to pin tests to (carries the x-katana-version selector). Empty = test the stable build.'
        required: false
        type: string
        default: ''
      run_host_paas_e2e:
        description: 'Also run hosting-web-apps PaaS E2E (off by default — opt in only)'
        required: false
        type: boolean
        default: false
      locale:
        description: 'Browser locale for non-English smoke (e.g. de-DE). Leave empty for default en-US.'
        required: false
        default: ''
        type: string

  # Allow triggering from other GitHub Actions
  workflow_call:
    inputs:
      environment:
        description: 'Environment to test against'
        required: true
        default: 'test' # The workflow_call will mostly be called building for the test env
        type: string
      test_filter:
        description: 'Test suite: e2e, regression, e2e-then-regression (sequential, fail-fast), or individual spec name (e.g. authentication, apps-page)'
        required: false
        default: 'e2e'
        type: string
      post_promotion:
        description: 'Triggered by promotion workflow (internal use)'
        required: false
        type: boolean
        default: false
      dark_url:
        description: 'Dark-release URL to pin tests to (carries the x-katana-version selector). Empty = test the stable build.'
        required: false
        type: string
        default: ''
      run_host_paas_e2e:
        description: 'Also run hosting-web-apps PaaS E2E (off by default — opt in only)'
        required: false
        type: boolean
        default: false
      locale:
        description: 'Browser locale for non-English smoke (e.g. de-DE). Leave empty for default en-US.'
        required: false
        default: ''
        type: string

permissions:
  id-token: write # required for artifactory token login
  contents: read
  pull-requests: write

jobs:
  # Resolve the test filter and build the matrix payload for the `test` job.
  # Lifted out of the test step so the resolved filter can drive the matrix.
  #
  # Each matrix entry carries `project` (Playwright `--project` to run),
  # `shard` (1-based), `total` (denominator for `--shard=N/M`; 1 means no
  # shard flag), and optional `spec` (a filename for single-spec dispatches).
  # `multi_runner` is `'true'` when the matrix has more than one entry —
  # that gates blob reporting and the downstream merge-reports job.
  prepare:
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    outputs:
      filter: ${{ steps.resolve.outputs.filter }}
      matrix_include: ${{ steps.resolve.outputs.matrix_include }}
      multi_runner: ${{ steps.resolve.outputs.multi_runner }}
    steps:
      - name: Resolve filter and build matrix
        id: resolve
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          # Mirror the filter resolution in the `test` step.
          if [ -n "$GITHUB_EVENT_SCHEDULE" ]; then
            case "$GITHUB_EVENT_SCHEDULE" in
              "0 6 * * *") FILTER="regression" ;;
              *) FILTER="e2e" ;;
            esac
          elif [ -n "$INPUT_TEST_FILTER" ]; then
            FILTER="$INPUT_TEST_FILTER"
          else
            FILTER="e2e"
          fi

          # Shard count for the full `regression` suite. Set to match the
          # number of spec files in tests/e2e/ + tests/regression/ so each
          # shard owns roughly one spec's worth of work — the practical
          # ceiling before the per-shard setup tax (~5 min) eats the
          # wall-clock win.
          #
          # Empirically (run 26278762371 at N=10): wall-clock is ~16.5 min,
          # bounded by one shard running two ~8-min app-creation tests in
          # `develop-edit-interactions.spec.ts` (Modern color scheme,
          # Modern font theme). Splitting that cluster requires bumping to
          # N>=17, but the runner-minute cost (~36 -> ~85) outweighs the
          # ~5.5 min wall-clock win at current usage. If we want to go
          # below ~16 min, the right next move is optimizing those two
          # tests (shared app fixture) rather than throwing more runners.
          #
          # Practical caveats — revisit if a run trips either:
          #   1. Single test account → N parallel SSO logins + app-creates.
          #      If we hit throttling, provision per-shard accounts before
          #      bumping further.
          #   2. Self-hosted `airo-cicd-runners` pool size. If the pool has
          #      fewer than N idle runners at 06:00 UTC, shards queue and
          #      we save less wall-clock than expected.
          REGRESSION_SHARDS=10

          # Helper: emit the regression-suite include entries (one per shard).
          regression_entries() {
            for i in $(seq 1 "$REGRESSION_SHARDS"); do
              [ "$i" -gt 1 ] && printf ','
              printf '{"project":"regression","shard":%d,"total":%d}' \
                "$i" "$REGRESSION_SHARDS"
            done
          }

          case "$FILTER" in
            e2e)
              INCLUDES='[{"project":"e2e","shard":1,"total":1}]'
              ;;
            regression)
              INCLUDES="[$(regression_entries)]"
              ;;
            e2e-then-regression)
              # Despite the name, e2e and regression now run as PARALLEL
              # matrix entries (1 e2e job + N regression shards). The
              # original sequential "then" existed to fail-fast on e2e
              # before paying the 30 min regression cost, but now that
              # regression is sharded the parallel wall-clock is similar
              # to e2e alone. The fail-fast gate is gone — if you need
              # it back, dispatch `e2e` first and `regression` after.
              INCLUDES="[{\"project\":\"e2e\",\"shard\":1,\"total\":1},$(regression_entries)]"
              ;;
            all)
              # Removed in favor of e2e-then-regression. Reject explicitly
              # so callers that haven't migrated get a clear error instead
              # of silently building an unexpected matrix.
              echo "ERROR: 'all' filter was removed. Use 'e2e-then-regression' for parallel e2e + sharded regression, or run 'e2e' and 'regression' as separate dispatches." >&2
              exit 1
              ;;
            *)
              # Single-spec filter (e.g. 'authentication', 'develop-chat'):
              # one runner, no sharding, the `spec` field tells the test
              # step which file to pass to playwright.
              INCLUDES="[{\"project\":\"regression\",\"shard\":1,\"total\":1,\"spec\":\"${FILTER}.spec.ts\"}]"
              ;;
          esac

          COUNT=$(echo "$INCLUDES" | jq length)
          if [ "$COUNT" -gt 1 ]; then
            MULTI=true
          else
            MULTI=false
          fi

          echo "filter=$FILTER" >> $GITHUB_OUTPUT
          echo "matrix_include=$INCLUDES" >> $GITHUB_OUTPUT
          echo "multi_runner=$MULTI" >> $GITHUB_OUTPUT
          echo "Resolved filter: $FILTER, matrix entries: $COUNT, multi_runner: $MULTI"

  test:
    needs: prepare
    strategy:
      # Don't cancel sibling shards when one fails — we want full coverage so
      # the merged report shows every failure, not just the first.
      fail-fast: false
      matrix:
        # Each entry expands to one parallel job and carries:
        #   project: 'e2e' | 'regression'
        #   shard:   1..total (used for --shard=N/M)
        #   total:   shard denominator (1 = no shard flag)
        #   spec:    optional spec filename for single-spec filters
        include: ${{ fromJSON(needs.prepare.outputs.matrix_include) }}
    # Sized for the worst case (e2e-then-regression with one retry):
    # ~5 min setup + ~10 min e2e + ~30 min regression + retry headroom.
    # With sharding the regression slice per runner drops to ~10 min.
    timeout-minutes: 90
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    outputs:
      environment: ${{ steps.env-config.outputs.environment }}
      base_url: ${{ steps.env-config.outputs.base_url }}

    steps:
      - name: Determine test environment and URL
        id: env-config
        env:
          # Assigned via env: to safely pass github context data (prevents shell injection).
          # `inputs` works for both workflow_dispatch and workflow_call;
          # falls back to 'prod' for schedule (where inputs is empty).
          INPUT_ENVIRONMENT: ${{ inputs.environment || 'prod' }}
        run: |
          # Use 'prod' as default for scheduled runs, otherwise use manual input
          ENV="$INPUT_ENVIRONMENT"
          echo "environment=$ENV" >> $GITHUB_OUTPUT

          # Map environment to base URL
          case "$ENV" in
            prod)
              echo "base_url=https://airo-builder.godaddy.com" >> $GITHUB_OUTPUT
              ;;
            dev)
              echo "base_url=https://airo-builder.dev-godaddy.com" >> $GITHUB_OUTPUT
              ;;
            pre-test)
              echo "base_url=https://pre-test-airo-builder.test-godaddy.com" >> $GITHUB_OUTPUT
              ;;
            test)
              echo "base_url=https://airo-builder.test-godaddy.com" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "❌ Unknown environment: $ENV"
              exit 1
              ;;
          esac

          echo "✅ Test environment: $ENV"

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Get Artifactory Token
        id: jfrog
        uses: jfrog/setup-jfrog-cli@eb77328bc74211c6c65cada8d5f6c0e156a51440 # v4.11.0
        env:
          JF_URL: ${{ vars.JF_URL }}
        with:
          oidc-provider-name: github

      - name: Setup Artifactory Creds
        env:
          OIDC_TOKEN: ${{ steps.jfrog.outputs.oidc-token }}
        run: |
          echo "::add-mask::$OIDC_TOKEN"
          echo "ARTIFACTORY_NPM_TOKEN=${OIDC_TOKEN}" >> $GITHUB_ENV

      - name: Configure pnpm registry
        run: |
          echo "registry=https://gdartifactory1.jfrog.io/artifactory/api/npm/node-virt/" > .npmrc
          echo "//gdartifactory1.jfrog.io/artifactory/api/npm/:_authToken=${{ env.ARTIFACTORY_NPM_TOKEN }}" >> .npmrc

      - name: Get test credentials from Secrets Manager
        id: get-credentials
        run: |
          set -e

          # Get the secret value
          echo "Retrieving test credentials from Secrets Manager..."
          CREDENTIALS=$(aws secretsmanager get-secret-value --secret-id "/test/airo-app-builder-user" --query 'SecretString' --output text --region us-west-2)

          # Extract credentials from key-value pair format
          echo "Extracting credentials from key-value pair format..."
          USERNAME=$(echo $CREDENTIALS | jq -r 'keys[0]')  # Get the first key (email)
          PASSWORD=$(echo $CREDENTIALS | jq -r '.[]')      # Get the first value (password)
          echo "Extracted username: ${USERNAME}"

          # Validate credentials are not null or empty
          if [ "$USERNAME" = "null" ] || [ "$PASSWORD" = "null" ] || [ -z "$USERNAME" ] || [ -z "$PASSWORD" ]; then
            echo "❌ Failed to extract valid credentials. USERNAME='$USERNAME', PASSWORD='$PASSWORD'"
            echo "Raw credentials structure:"
            echo $CREDENTIALS | jq . || echo "Not valid JSON"
            exit 1
          fi

          # Set as masked output variables
          echo "::add-mask::$USERNAME"
          echo "::add-mask::$PASSWORD"
          echo "username=$USERNAME" >> $GITHUB_OUTPUT
          echo "password=$PASSWORD" >> $GITHUB_OUTPUT
          echo "✅ Test credentials retrieved successfully"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'

      - name: Enable Corepack and configure pnpm
        run: |
          npm install -g corepack@latest

          corepack enable
          EXPECTED_VERSION=$(node -p "
            const pm = require('./package.json').packageManager || '';
            const match = pm.match(/^pnpm@(.+?)(\+|$)/);
            if (!match) { console.error('Cannot parse packageManager:', pm); process.exit(1); }
            match[1];
          ")
          corepack prepare "pnpm@${EXPECTED_VERSION}" --activate
          ACTUAL_VERSION=$(pnpm --version)
          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "ERROR: pnpm version mismatch! Expected: $EXPECTED_VERSION, Actual: $ACTUAL_VERSION"
            exit 1
          fi
          echo "pnpm version $ACTUAL_VERSION matches expected version"

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          # Self-hosted runners may persist disk between jobs; cache makes the
          # win deterministic across runners and across fresh runners alike.
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: |
          echo "Installing workspace dependencies with pnpm..."
          pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: |
          # Check if Chromium is already installed
          if npx playwright list | grep -q "chromium.*installed"; then
            echo "✅ Chromium already installed, skipping download"
          else
            echo "📥 Installing Chromium browser..."
            npx playwright install chromium
            echo "✅ Chromium browser installed successfully"
          fi
          echo "ℹ️ Skipping system dependencies installation (assuming self-hosted runner has required deps)"

      - name: Get Elasticsearch credentials from Secrets Manager
        id: get-es-credentials
        continue-on-error: true
        run: |
          echo "Retrieving Elasticsearch credentials from Secrets Manager..."
          SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id "/airo/elasticsearch-credentials" --query 'SecretString' --output text --region us-west-2 2>/dev/null || echo "")

          if [ -z "$SECRET_JSON" ]; then
            echo "⚠️ Elasticsearch credentials not found - indexing will be skipped"
            exit 0
          fi

          ES_URL=$(echo "$SECRET_JSON" | jq -r '.url // .ingestion_url // empty')
          ES_API_KEY=$(echo "$SECRET_JSON" | jq -r '.api_key // empty')

          if [ -n "$ES_URL" ]; then
            echo "::add-mask::$ES_URL"
            echo "es_url=$ES_URL" >> $GITHUB_OUTPUT

            if [ -n "$ES_API_KEY" ]; then
              echo "::add-mask::$ES_API_KEY"
              echo "es_api_key=$ES_API_KEY" >> $GITHUB_OUTPUT
              echo "✅ Elasticsearch credentials retrieved (URL + API Key)"
            else
              echo "✅ Elasticsearch URL retrieved (no API key - assuming open access)"
            fi
          else
            echo "⚠️ Elasticsearch URL not found in secret - indexing will be skipped"
          fi

      - name: Run Playwright tests
        env:
          CI: true
          # Project, shard, total, and optional spec come straight off the
          # matrix entry — no per-step filter resolution needed.
          PROJECT: ${{ matrix.project }}
          SHARD: ${{ matrix.shard }}
          TOTAL_SHARDS: ${{ matrix.total }}
          SPEC: ${{ matrix.spec || '' }}
          # Switches playwright.config.ts to the blob reporter so each shard's
          # results can be merged by the `merge-reports` job downstream. Only
          # set when the matrix has multiple entries to keep single-run
          # behavior unchanged.
          PLAYWRIGHT_BLOB_REPORT: ${{ needs.prepare.outputs.multi_runner == 'true' && '1' || '' }}
          # tests/helpers/constants.ts getCredentials() reads env-specific variables
          # based on PLAYWRIGHT_ENV (DEV_*, PRE_TEST_*, TEST_*, PROD_*). All four
          # pairs must be set so the same secret value works for any environment
          # the workflow can target.
          DEV_USERNAME: ${{ steps.get-credentials.outputs.username }}
          DEV_PASSWORD: ${{ steps.get-credentials.outputs.password }}
          PRE_TEST_USERNAME: ${{ steps.get-credentials.outputs.username }}
          PRE_TEST_PASSWORD: ${{ steps.get-credentials.outputs.password }}
          TEST_USERNAME: ${{ steps.get-credentials.outputs.username }}
          TEST_PASSWORD: ${{ steps.get-credentials.outputs.password }}
          PROD_USERNAME: ${{ steps.get-credentials.outputs.username }}
          PROD_PASSWORD: ${{ steps.get-credentials.outputs.password }}
          PLAYWRIGHT_BASE_URL: ${{ steps.env-config.outputs.base_url }}
          PLAYWRIGHT_ENV: ${{ steps.env-config.outputs.environment }}
          PLAYWRIGHT_LOCALE: ${{ inputs.locale }}
          TEST_ENVIRONMENT: ${{ steps.env-config.outputs.environment }}
          # When set (release pipeline's dark run), tests/helpers/auth.ts seeds the
          # x_katana_version cookie parsed from this URL so every spec — and any app
          # the run creates — hits the dark build. Empty (schedule/normal) = stable.
          DARK_URL: ${{ inputs.dark_url }}
          ES_URL: ${{ steps.get-es-credentials.outputs.es_url }}
          ES_API_KEY: ${{ steps.get-es-credentials.outputs.es_api_key }}
        run: |
          # Only attach --shard when the matrix entry actually splits work.
          # Avoids passing --shard=1/1 (a no-op but noisy in logs) for the
          # e2e runner and single-spec dispatches.
          SHARD_FLAG=""
          if [ "$TOTAL_SHARDS" -gt 1 ]; then
            SHARD_FLAG="--shard=${SHARD}/${TOTAL_SHARDS}"
          fi
          if [ -n "$SPEC" ]; then
            echo "Running single spec: $SPEC (--project=$PROJECT)"
            npx playwright test --project="$PROJECT" "$SPEC"
          else
            echo "Running --project=$PROJECT ${SHARD_FLAG:-(no shard)}"
            npx playwright test --project="$PROJECT" $SHARD_FLAG
          fi

      - name: Upload results to Testla
        if: always() && !cancelled()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          JUNIT_FILE="./test-results/junit-shard-${{ matrix.shard }}.xml"
          if [ ! -f "$JUNIT_FILE" ]; then
            JUNIT_FILE="./test-results/junit.xml"
          fi
          NAME="${{ matrix.project }}"
          if [ "${{ matrix.total }}" -gt 1 ]; then
            NAME="${NAME}-shard-${{ matrix.shard }}"
          fi
          pnpm exec testla upload-results \
            --pcp-app-id 6082 \
            --file "$JUNIT_FILE" \
            --framework playwright \
            --name "$NAME" \
            --artifacts-dir ./test-results \
            --artifact-include "*.{png,webm}"

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          # upload-artifact v4+ requires unique names per matrix job. Project
          # is in the name so e2e and regression entries (which run in parallel
          # under `e2e-then-regression`) don't collide.
          name: test-results-${{ matrix.project }}-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 30

      - name: Upload Playwright blob report
        if: ${{ always() && needs.prepare.outputs.multi_runner == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: blob-report-${{ matrix.project }}-shard-${{ matrix.shard }}
          path: blob-report
          # Default `warn` would let a shard whose setup crashed before
          # Playwright produced blob-report/ upload nothing and exit 0,
          # leaving merge-reports to silently produce a partial HTML report.
          # `error` makes the missing blob a loud failure on the shard.
          if-no-files-found: error
          retention-days: 7

      - name: Comment PR with test results
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        if: github.event_name == 'pull_request' && always()
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Try to read test results
            let testStatus = '❓ Unknown';
            let testSummary = 'Test results not available';

            try {
              // Check if test passed or failed based on job outcome
              if (process.env.JOB_STATUS === 'success') {
                testStatus = '✅ Passed';
                testSummary = 'All Playwright E2E tests passed successfully!';
              } else if (process.env.JOB_STATUS === 'failure') {
                testStatus = '❌ Failed';
                testSummary = 'Some Playwright E2E tests failed. Check the artifacts for details.';
              }
            } catch (error) {
              console.log('Could not determine test status:', error);
            }

            const comment = `## 🎭 Playwright E2E Test Results

            **Status:** ${testStatus}

            ${testSummary}

            ### 📊 Test Details
            - **Environment:** ${process.env.TEST_ENVIRONMENT}
            - **User Journey Test:** Complete end-to-end user flow with Hello World site creation
            - **WebSocket Integration:** Tests real-time completion detection
            - **Browser:** Chromium (Desktop Chrome)
            - **Timeout:** 7 minutes per test

            ### 📁 Artifacts
            ${process.env.JOB_STATUS === 'failure' ? '- Screenshots and videos available in artifacts' : ''}
            ${process.env.JOB_STATUS !== 'success' ? '- Detailed test report available in artifacts' : ''}
            - HAR (HTTP Archive) files for network debugging available in test-results artifact

            <details>
            <summary>🔧 Test Configuration</summary>

            - **Test Directory:** \`./tests/e2e\` (critical path) + \`./tests/regression\` (full suite)
            - **Base URL:** \`${process.env.BASE_URL}\`
            - **Retries:** 0 (no retries)
            - **Workers:** 1 (serial execution)
            - **Reporter:** GitHub Actions
            - **HAR Recording:** Enabled (full network traffic capture)
            </details>
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
        env:
          JOB_STATUS: ${{ job.status }}
          TEST_ENVIRONMENT: ${{ steps.env-config.outputs.environment }}
          BASE_URL: ${{ steps.env-config.outputs.base_url }}

  # Calls hosting-web-apps' reusable Playwright workflow alongside our own
  # `test` job so PaaS UI E2E runs on every AAB Playwright trigger
  # (schedule, workflow_dispatch, and workflow_call from
  # deploy-test-e2e.yml). Lands the job on airo-cicd-runners via
  # `runs-on-json` because hosting-web-apps' own runner fleet doesn't
  # have Chromium's runtime libs (libnss3 et al.) baked in yet.
  #
  # `uses:` must be a compile-time constant, so we need separate jobs
  # per environment to reference different HWA branches:
  #   prod → @main (stable, merged code)
  #   test → @integration (latest test env changes)

  # --- prod: runs tests from main ---
  # Opt-in only: paas E2E runs when a caller (manual dispatch or another
  # workflow) explicitly sets `run_host_paas_e2e: true`. Cron, post-deploy,
  # and post-promotion no longer fan paas E2E out by default. The env gate
  # routes prod-targeted runs to this job (vs. host-paas-e2e-test for test
  # env). Dark runs are still skipped — the PaaS suite isn't dark-aware
  # (it runs hosting-web-apps' own tests, not the dark AAB build), so
  # dispatching on a dark run is pure waste even when explicitly opted in.
  host-paas-e2e:
    if: >-
      ${{ inputs.run_host_paas_e2e
          && (inputs.environment || 'prod') == 'prod'
          && (inputs.dark_url || '') == '' }}
    name: E2E Tests (host-paas, prod)
    uses: gdcorp-partners/hosting-web-apps/.github/workflows/e2e-playwright.yml@main
    with:
      environment: prod
      ref: main
      runs-on-json: '{"labels": ["airo-cicd-runners", "self-hosted"]}'
    secrets:
      CHECKOUT_SSH_KEY: ${{ secrets.PAAS_SSH_KEY }}
    permissions:
      id-token: write
      contents: read

  # --- test: runs tests from integration branch ---
  # Reaches the VPN-gated test env (host.beta.test-godaddy.com) via the
  # airo-cicd-runners' TGW egress, allowlisted in the PaaS test WAF
  # (hosting-infra HPXPaasWebACLv2).
  # Opt-in only (matches host-paas-e2e above): runs when a caller sets
  # `run_host_paas_e2e: true`. The env gate routes test-targeted runs
  # here vs. the prod job above.
  host-paas-e2e-test:
    if: >-
      ${{ inputs.run_host_paas_e2e
          && (inputs.environment || 'prod') == 'test' }}
    name: E2E Tests (host-paas, test)
    uses: gdcorp-partners/hosting-web-apps/.github/workflows/e2e-playwright.yml@integration
    with:
      environment: test
      ref: integration
      runs-on-json: '{"labels": ["airo-cicd-runners", "self-hosted"]}'
    secrets:
      CHECKOUT_SSH_KEY: ${{ secrets.PAAS_SSH_KEY }}
    permissions:
      id-token: write
      contents: read

  # Merge per-shard blob reports into a single HTML report. Only runs when
  # the test matrix had more than one entry (sharded regression, or the
  # parallel e2e + regression mix from `e2e-then-regression`). Uses
  # `if: always()` so a failing shard still contributes to the merged report
  # — reviewing partial-failure runs is the main reason this job exists.
  # `playwright merge-reports` happily stitches blobs from different
  # `--project=` runs into one HTML output.
  merge-reports:
    needs: [prepare, test]
    if: ${{ always() && needs.prepare.outputs.multi_runner == 'true' }}
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Get Artifactory Token
        id: jfrog
        uses: jfrog/setup-jfrog-cli@eb77328bc74211c6c65cada8d5f6c0e156a51440 # v4.11.0
        env:
          JF_URL: ${{ vars.JF_URL }}
        with:
          oidc-provider-name: github

      - name: Setup Artifactory Creds
        env:
          OIDC_TOKEN: ${{ steps.jfrog.outputs.oidc-token }}
        run: |
          echo "::add-mask::$OIDC_TOKEN"
          echo "ARTIFACTORY_NPM_TOKEN=${OIDC_TOKEN}" >> $GITHUB_ENV

      - name: Configure pnpm registry
        run: |
          echo "registry=https://gdartifactory1.jfrog.io/artifactory/api/npm/node-virt/" > .npmrc
          echo "//gdartifactory1.jfrog.io/artifactory/api/npm/:_authToken=${{ env.ARTIFACTORY_NPM_TOKEN }}" >> .npmrc

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'

      - name: Enable Corepack and configure pnpm
        run: |
          npm install -g corepack@latest
          corepack enable
          EXPECTED_VERSION=$(node -p "
            const pm = require('./package.json').packageManager || '';
            const match = pm.match(/^pnpm@(.+?)(\+|$)/);
            if (!match) { console.error('Cannot parse packageManager:', pm); process.exit(1); }
            match[1];
          ")
          corepack prepare "pnpm@${EXPECTED_VERSION}" --activate

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: all-blob-reports
          # Broad pattern so we pick up both `blob-report-regression-shard-*`
          # and `blob-report-e2e-shard-*` (parallel e2e + regression mix).
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload merged HTML report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-html-report
          path: playwright-report
          retention-days: 30

  # Aggregate the per-shard Playwright JSON reports into a single per-suite
  # summary (counts + failed test names, grouped by Playwright project so
  # e2e and regression are reported separately) and surface it three ways:
  #   1. The GitHub run summary (this run's Summary page) — what the release
  #      approver lands on via the release thread's "View Run" link.
  #   2. The `e2e-summary` artifact — downloaded + rendered by the
  #      release-manager in the release Slack thread.
  #   3. The `message` output — consumed by slack-notify below.
  # Runs `always()` so the run page always carries a summary (success or fail);
  # the script is defensive and never fails the job.
  summarize:
    name: Summarize results
    needs: [prepare, test, merge-reports, host-paas-e2e, host-paas-e2e-test]
    if: always()
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    outputs:
      # slack-notify gates on the job results (test/merge/host-paas) rather than
      # this script's verdict, so a summarize crash can't silence a real failure
      # — only `message` is consumed downstream. The script still prints
      # notify=/overall= to the step log for human debugging.
      message: ${{ steps.summary.outputs.message }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'

      - name: Download test result artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        # No artifacts (e.g. every shard crashed before uploading) must not
        # fail the summary — the script reports an infra failure instead.
        continue-on-error: true
        with:
          path: downloaded-results
          # Matches test-results-e2e-shard-* and test-results-regression-shard-*.
          pattern: test-results-*

      - name: Build summary
        id: summary
        env:
          RESULTS_DIR: downloaded-results
          TEST_RESULT: ${{ needs.test.result }}
          MERGE_RESULT: ${{ needs.merge-reports.result }}
          # Pick whichever host-paas job actually ran (prod vs test env);
          # exactly one runs per dispatch, the other is skipped.
          HOSTPAAS_RESULT: ${{ needs.host-paas-e2e.result != 'skipped' && needs.host-paas-e2e.result || needs.host-paas-e2e-test.result }}
          ENVIRONMENT: ${{ needs.test.outputs.environment }}
          TRIGGER: ${{ github.event_name == 'schedule' && 'Scheduled' || (github.event_name == 'workflow_dispatch' && github.event.inputs.post_promotion == 'true' && 'Post-Promotion' || 'Manual') }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SUMMARY_JSON_OUT: e2e-summary/summary.json
        run: node tests/scripts/summarize-e2e-results.mjs

      - name: Upload e2e summary artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-summary
          path: e2e-summary/summary.json
          retention-days: 30

  slack-notify:
    name: Send Slack Notification
    # Fire when *either* the test matrix or the merge-reports job fails.
    # Slack is the nightly surfacing channel — if merge-reports crashes
    # (zero blob artifacts, playwright merge error, install failure on
    # the merge runner) but every shard passed, the workflow goes red
    # on GitHub but nobody on-call would see it without this.
    # `skipped` (merge-reports doesn't run when total=1) doesn't match
    # `== 'failure'`, so single-shard runs aren't affected.
    # Both host-paas jobs are checked since exactly one runs per env.
    if: always() && (needs.test.result == 'failure' || needs.merge-reports.result == 'failure' || needs.host-paas-e2e.result == 'failure' || needs.host-paas-e2e-test.result == 'failure')
    needs: [test, merge-reports, host-paas-e2e, host-paas-e2e-test, summarize]
    uses: ./.github/workflows/slack-notify.yml
    permissions:
      id-token: write
      contents: read
    with:
      # Slack-notify is only invoked when something failed, so hard-code
      # `failure` rather than forwarding `needs.test.result` — that field
      # would be `'success'` in the merge-reports-only failure case and
      # produce a misleading notification.
      result: failure
      environment: ${{ needs.test.outputs.environment }}
      title: 'E2E Tests - ${{ needs.test.outputs.environment }} (by ${{ github.actor }})'
      # Per-suite breakdown (counts + failed test names) built by the
      # summarize job. Falls back to a minimal body if that output is empty
      # (e.g. summarize itself errored) so the channel still gets pinged.
      message: ${{ needs.summarize.outputs.message || format('E2E run failed — check {0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
      footer: 'airo-app-builder | E2E Tests'
