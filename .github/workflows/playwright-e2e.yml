name: E2E Tests

run-name: "E2E Tests - ${{ inputs.environment || 'prod' }} (by ${{ github.actor }})"

on:
  # Allow manual triggering and post-promotion triggering
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to test against"
        required: true
        default: "prod"
        type: choice
        options:
          - test
          - dev
          - prod
      post_promotion:
        description: "Triggered by promotion workflow (internal use)"
        required: false
        type: boolean
        default: false

  # Allow triggering from other GitHub Actions
  workflow_call:
    inputs:
      environment:
        description: "Environment to test against"
        required: true
        default: "test" # The workflow_call will mostly be called building for the test env
        type: string
      post_promotion:
        description: "Triggered by promotion workflow (internal use)"
        required: false
        type: boolean
        default: false

permissions:
  id-token: write # required for artifactory token login
  contents: read

jobs:
  test:
    timeout-minutes: 60
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    outputs:
      environment: ${{ steps.env-config.outputs.environment }}
      base_url: ${{ steps.env-config.outputs.base_url }}

    steps:
      - name: Determine test environment and URL
        id: env-config
        env:
          # Use env to safely pass github context data (prevents shell injection)
          INPUT_ENVIRONMENT: ${{ github.event.inputs.environment || 'prod' }}
        run: |
          # Use 'prod' as default for scheduled runs, otherwise use manual input
          ENV="$INPUT_ENVIRONMENT"
          echo "environment=$ENV" >> $GITHUB_OUTPUT

          # Map environment to base URL
          case "$ENV" in
            prod)
              echo "base_url=https://airo-builder.godaddy.com" >> $GITHUB_OUTPUT
              ;;
            dev)
              echo "base_url=https://airo-builder.dev-godaddy.com" >> $GITHUB_OUTPUT
              ;;
            test)
              echo "base_url=https://airo-builder.test-godaddy.com" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "❌ Unknown environment: $ENV"
              exit 1
              ;;
          esac

          echo "✅ Test environment: $ENV"

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get Artifactory Token
        id: jfrog
        uses: jfrog/setup-jfrog-cli@88e9eba31c07e31beefa4cef5c0e93d1af9535d7 # v4.6.1
        env:
          JF_URL: ${{ vars.JF_URL }}
        with:
          oidc-provider-name: github

      - name: Setup Artifactory Creds
        env:
          OIDC_TOKEN: ${{ steps.jfrog.outputs.oidc-token }}
        run: |
          echo "::add-mask::$OIDC_TOKEN"
          echo "ARTIFACTORY_NPM_TOKEN=${OIDC_TOKEN}" >> $GITHUB_ENV

      - name: Configure pnpm registry
        run: |
          echo "registry=https://gdartifactory1.jfrog.io/artifactory/api/npm/node-virt/" > .npmrc
          echo "//gdartifactory1.jfrog.io/artifactory/api/npm/node-virt/:_authToken=${{ env.ARTIFACTORY_NPM_TOKEN }}" >> .npmrc
          echo "//gdartifactory1.jfrog.io/artifactory/api/npm/npm-gasket-core-local/:_authToken=${{ env.ARTIFACTORY_NPM_TOKEN }}" >> .npmrc

      - name: Get test credentials from Secrets Manager
        id: get-credentials
        run: |
          set -e

          # Get the secret value
          echo "Retrieving test credentials from Secrets Manager..."
          CREDENTIALS=$(aws secretsmanager get-secret-value --secret-id "/test/airo-app-builder-user" --query 'SecretString' --output text --region us-west-2)

          # Extract credentials from key-value pair format
          echo "Extracting credentials from key-value pair format..."
          USERNAME=$(echo $CREDENTIALS | jq -r 'keys[0]')  # Get the first key (email)
          PASSWORD=$(echo $CREDENTIALS | jq -r '.[]')      # Get the first value (password)
          echo "Extracted username: ${USERNAME}"

          # Validate credentials are not null or empty
          if [ "$USERNAME" = "null" ] || [ "$PASSWORD" = "null" ] || [ -z "$USERNAME" ] || [ -z "$PASSWORD" ]; then
            echo "❌ Failed to extract valid credentials. USERNAME='$USERNAME', PASSWORD='$PASSWORD'"
            echo "Raw credentials structure:"
            echo $CREDENTIALS | jq . || echo "Not valid JSON"
            exit 1
          fi

          # Set as masked output variables
          echo "::add-mask::$USERNAME"
          echo "::add-mask::$PASSWORD"
          echo "username=$USERNAME" >> $GITHUB_OUTPUT
          echo "password=$PASSWORD" >> $GITHUB_OUTPUT
          echo "✅ Test credentials retrieved successfully"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install pnpm
        run: npm install -g pnpm@10.17.0+sha512.fce8a3dd29a4ed2ec566fb53efbb04d8c44a0f05bc6f24a73046910fb9c3ce7afa35a0980500668fa3573345bd644644fa98338fa168235c80f4aa17aa17fbef

      - name: Install dependencies
        run: |
          echo "Installing workspace dependencies with pnpm..."
          pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: |
          # Check if Chromium is already installed
          if npx playwright list | grep -q "chromium.*installed"; then
            echo "✅ Chromium already installed, skipping download"
          else
            echo "📥 Installing Chromium browser..."
            npx playwright install chromium
            echo "✅ Chromium browser installed successfully"
          fi
          echo "ℹ️ Skipping system dependencies installation (assuming self-hosted runner has required deps)"

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true
          TEST_USERNAME: ${{ steps.get-credentials.outputs.username }}
          TEST_PASSWORD: ${{ steps.get-credentials.outputs.password }}
          PLAYWRIGHT_BASE_URL: ${{ steps.env-config.outputs.base_url }}

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Test Results (includes HAR files)
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 30

      - name: Upload Screenshots and Videos
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Comment PR with test results
        uses: actions/github-script@v8
        if: github.event_name == 'pull_request' && always()
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Try to read test results
            let testStatus = '❓ Unknown';
            let testSummary = 'Test results not available';

            try {
              // Check if test passed or failed based on job outcome
              if (process.env.JOB_STATUS === 'success') {
                testStatus = '✅ Passed';
                testSummary = 'All Playwright E2E tests passed successfully!';
              } else if (process.env.JOB_STATUS === 'failure') {
                testStatus = '❌ Failed';
                testSummary = 'Some Playwright E2E tests failed. Check the artifacts for details.';
              }
            } catch (error) {
              console.log('Could not determine test status:', error);
            }

            const comment = `## 🎭 Playwright E2E Test Results

            **Status:** ${testStatus}

            ${testSummary}

            ### 📊 Test Details
            - **Environment:** ${process.env.TEST_ENVIRONMENT}
            - **User Journey Test:** Complete end-to-end user flow with Hello World site creation
            - **WebSocket Integration:** Tests real-time completion detection
            - **Browser:** Chromium (Desktop Chrome)
            - **Timeout:** 7 minutes per test

            ### 📁 Artifacts
            ${process.env.JOB_STATUS === 'failure' ? '- Screenshots and videos available in artifacts' : ''}
            ${process.env.JOB_STATUS !== 'success' ? '- Detailed test report available in artifacts' : ''}
            - HAR (HTTP Archive) files for network debugging available in test-results artifact

            <details>
            <summary>🔧 Test Configuration</summary>

            - **Test Directory:** \`./tests/smoke\`
            - **Base URL:** \`${process.env.BASE_URL}\`
            - **Retries:** 0 (no retries)
            - **Workers:** 1 (serial execution)
            - **Reporter:** GitHub Actions
            - **HAR Recording:** Enabled (full network traffic capture)
            </details>
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
        env:
          JOB_STATUS: ${{ job.status }}
          TEST_ENVIRONMENT: ${{ steps.env-config.outputs.environment }}
          BASE_URL: ${{ steps.env-config.outputs.base_url }}

  slack-notify:
    name: Send Slack Notification
    if: always()
    needs: [test]
    uses: ./.github/workflows/slack-notify.yml
    permissions:
      id-token: write
      contents: read
    with:
      result: ${{ needs.test.result }}
      environment: ${{ needs.test.outputs.environment }}
      title: "E2E Tests - ${{ needs.test.outputs.environment }} (by ${{ github.actor }})"
      message: |
        *Environment:* ${{ needs.test.outputs.environment }}
        *Trigger:* ${{ github.event_name == 'schedule' && 'Scheduled' || (github.event_name == 'workflow_dispatch' && github.event.inputs.post_promotion == 'true' && 'Post-Promotion' || 'Manual') }}
        *Actor:* ${{ github.actor }}
        *Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>
      footer: "airo-app-builder | E2E Tests"
