name: Qdrant TLS Certificate

# Issues and renews TLS certificates for Qdrant cluster using GoDaddy Cert API.
# Certificates are stored in AWS Secrets Manager and fetched by Qdrant entrypoint.
#
# The certificate common name follows the pattern: qdrant.{env}.airo.local
# This matches the Service Discovery DNS name used by ECS.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to issue certificate for"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod
  schedule:
    # Run weekly on Sunday at 2 AM UTC to check for renewals
    - cron: "0 2 * * 0"

permissions:
  id-token: write
  contents: read

env:
  # Environment-specific accounts
  DEV_ACCOUNT: "694282668781"
  PROD_ACCOUNT: "644094189644"
  # GoDaddy PCP project ID (from airo-builder project)
  PROJECT_ID: "1013936"

jobs:
  issue-certificate:
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted

    strategy:
      matrix:
        # For scheduled runs, process both environments
        # For manual runs, only process the selected environment
        environment: ${{ github.event_name == 'schedule' && fromJSON('["dev", "prod"]') || fromJSON(format('["{0}"]', inputs.environment)) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set environment variables
        id: env
        run: |
          ENV="${{ matrix.environment }}"
          if [ "$ENV" == "prod" ]; then
            ACCOUNT="${{ env.PROD_ACCOUNT }}"
          else
            ACCOUNT="${{ env.DEV_ACCOUNT }}"
          fi

          # Certificate common name matches Service Discovery DNS
          COMMON_NAME="qdrant.${ENV}.airo.local"
          SECRET_NAME="${ENV}-qdrant-tls-cert"

          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "account=$ACCOUNT" >> $GITHUB_OUTPUT
          echo "common_name=$COMMON_NAME" >> $GITHUB_OUTPUT
          echo "secret_name=$SECRET_NAME" >> $GITHUB_OUTPUT
          echo "Processing certificate for: $COMMON_NAME (account: $ACCOUNT)"

      - name: Get SSO Token
        id: sso
        uses: gdcorp-actions/sso-awsiam-jwt@v1

      - name: Configure AWS Credentials
        run: |
          # Assume role to target account with error handling
          CREDENTIALS=$(aws sts assume-role \
            --role-arn arn:aws:iam::${{ steps.env.outputs.account }}:role/GD-AWS-SSG-Deploy-Role \
            --role-session-name GHACertSession \
            --query "Credentials.[AccessKeyId,SecretAccessKey,SessionToken]" \
            --output text 2>&1) || {
            echo "::error::Failed to assume AWS role for account ${{ steps.env.outputs.account }}"
            exit 1
          }

          if [ -z "$CREDENTIALS" ] || [ "$CREDENTIALS" = "None" ]; then
            echo "::error::Received empty credentials from assume-role"
            exit 1
          fi

          # Parse credentials
          AWS_ACCESS_KEY_ID=$(echo "$CREDENTIALS" | awk '{print $1}')
          AWS_SECRET_ACCESS_KEY=$(echo "$CREDENTIALS" | awk '{print $2}')
          AWS_SESSION_TOKEN=$(echo "$CREDENTIALS" | awk '{print $3}')

          # Export with masking for security
          echo "::add-mask::$AWS_ACCESS_KEY_ID"
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          echo "::add-mask::$AWS_SESSION_TOKEN"

          echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> $GITHUB_ENV
          echo "AWS_SESSION_TOKEN=$AWS_SESSION_TOKEN" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=us-west-2" >> $GITHUB_ENV

      - name: Issue/Renew TLS Certificate
        id: ssl
        uses: gdcorp-actions/ssl-action@v1
        with:
          command: import-secrets
          certificates: |
            [
              {
                "server": "${{ steps.env.outputs.common_name }}",
                "common_name": "${{ steps.env.outputs.common_name }}",
                "bundle_intermediate": true,
                "allow_renewal": true,
                "secret_id": "${{ steps.env.outputs.secret_name }}",
                "issuer_validation": "UCC_DV_SSL"
              }
            ]
          project_id: ${{ env.PROJECT_ID }}
          sso_token: ${{ steps.sso.outputs.jwt }}
          renew: true
          renewal_days: "30"

      - name: Report Results
        run: |
          echo "Certificate action completed for ${{ steps.env.outputs.common_name }}"

          # Parse the results with validation
          ACTIONS='${{ steps.ssl.outputs.performed_actions }}'

          # Validate JSON before parsing
          if [ -z "$ACTIONS" ] || ! echo "$ACTIONS" | jq empty 2>/dev/null; then
            echo "::warning::Unable to parse certificate action results"
            echo "Raw output: $ACTIONS"
            exit 0
          fi

          echo "Results: $ACTIONS"

          # Check what action was performed
          if echo "$ACTIONS" | jq -e '."${{ steps.env.outputs.common_name }}".created' 2>/dev/null | grep -q true; then
            echo "::notice::New certificate created for ${{ steps.env.outputs.common_name }}"
          elif echo "$ACTIONS" | jq -e '."${{ steps.env.outputs.common_name }}".renewed' 2>/dev/null | grep -q true; then
            echo "::notice::Certificate renewed for ${{ steps.env.outputs.common_name }}"
          else
            echo "::notice::Certificate already exists and is valid for ${{ steps.env.outputs.common_name }}"
          fi

      - name: Notify on Failure
        if: failure()
        run: |
          echo "::error::Failed to issue/renew TLS certificate for ${{ steps.env.outputs.common_name }}"
          echo "Check the GoDaddy Cert API logs and AWS Secrets Manager permissions."
