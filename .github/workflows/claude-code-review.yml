name: Claude PR Reviewer

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    uses: gdcorp-actions/gd-claude-code-action/.github/workflows/secure-claude-code.yml@v2.0.0
    with:
      runner_group: ${{ vars.CLAUDE_RUNNER_GROUP }}
      runner_labels_json: '["self-hosted", "linux"]'
      gocode_environment: prod
      track_progress: "true"
      prompt: "/review-pr REPO: ${{ github.repository }} PR_NUMBER: ${{ github.event.pull_request.number }}"
      # claude_args: |
      #   --allowedTools "mcp__github_inline_comment__create_inline_comment"
