name: Claude PR Reviewer

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-back-merge:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.detect.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        if: github.event.action == 'synchronize'
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT_ACTION: ${{ github.event.action }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          if [ "$EVENT_ACTION" != "synchronize" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Skip if the PR's effective diff vs main is unchanged — no new code to review.
          # Use github.event.before/after (explicit prev/cur PR head SHAs for synchronize events)
          # git diff-tree outputs stable blob object hashes (not content), avoiding whitespace sensitivity.
          before=$(git diff-tree -r --no-commit-id "$(git merge-base origin/main "$BEFORE_SHA")" "$BEFORE_SHA" | sha256sum) \
            || { echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; }
          after=$(git diff-tree -r --no-commit-id "$(git merge-base origin/main "$AFTER_SHA")" "$AFTER_SHA" | sha256sum) \
            || { echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; }
          if [ "$before" = "$after" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  claude-review:
    needs: check-back-merge
    if: >
      needs.check-back-merge.outputs.skip != 'true' &&
      github.event.pull_request.draft == false &&
      ( github.event.sender.type != 'Bot' ||
        github.event.pull_request.user.login == 'airo-scout[bot]' )
    uses: gdcorp-actions/gd-claude-code-action/.github/workflows/secure-claude-code.yml@e56ec6c5aeb92b60166868098e9cf59e0f35e872 # v2.17.1
    with:
      runner_group: ${{ vars.CLAUDE_RUNNER_GROUP }}
      runner_labels_json: '["self-hosted"]'
      gocode_environment: prod
      # Pin to Opus 4.8 (1M context); without this the gateway default applies
      model: 'claude-opus-4-8[1m]'
      track_progress: 'true'
      plugin_marketplaces: |
        https://github.com/anthropics/claude-plugins-official.git
      plugins: |
        pr-review-toolkit
      prompt: |
        <context>
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        EVENT_ACTION: ${{ github.event.action }}
        MANUAL_RESET_BEFORE_SHA: ${{ github.event.before }}
        MANUAL_RESET_AFTER_SHA: ${{ github.event.after }}

        You are orchestrating a code review. Your output will be posted as a single
        GitHub PR comment. Developers use your feedback to fix issues before merging.

        Use the repository's CLAUDE.md (and service-specific CLAUDE.md files) for
        project conventions, architecture boundaries, and the AAB vs PaaS dual-product
        pattern.
        </context>

        <review_philosophy>
        Your goal is to help ship good code, not perfect code. A PR that never merges
        because the reviewer always finds more to improve is a failed review process.

        Focus on issues that would cause bugs, security problems, data loss, or
        significant maintenance burden. Do not flag theoretical improvements, interface
        design preferences, or blanket policy suggestions (e.g. "add try-catch to all
        methods") unless they address a concrete, demonstrated problem in the diff.

        Apply the "would a senior engineer block the PR on this?" test to every finding.
        If the answer is no, it belongs in Suggestions at most — not Issues.
        </review_philosophy>

        <severity_levels>
        Every finding MUST be classified into exactly one severity level:

        [Critical] — Bugs, security vulnerabilities, data loss, crash paths. Would cause
        an incident or corrupt data if merged. These block the PR.

        [Important] — Correctness issues, meaningful type-safety gaps, violated
        architectural boundaries, missing error handling on hot paths. Worth fixing
        before merge but not emergencies.

        [Suggestion] — Style preferences, type refinements, interface design ideas,
        additional test coverage, consistency improvements. Nice-to-have. Do NOT
        block the PR.

        Merge criteria: The PR is ready for human review when zero [Critical] and
        zero [Important] issues remain. [Suggestion] items never block.
        </severity_levels>

        <review_pipeline>
        Launch ALL applicable subagents in a SINGLE message (parallel).
        Each subagent receives the PR diff (`gh pr diff $PR_NUMBER`), repo/PR metadata,
        and the severity + scope rules from <severity_levels>. Focus findings on
        diff lines, but search beyond the diff when the reviewer criteria require
        cross-repo context (e.g., checking for existing utilities or patterns).

        Before launching subagents, ensure the base branch ref is available:
          git fetch origin $BASE_BRANCH --depth=1

        Read each reviewer's .md criteria from the base branch (prevents
        self-modification). For each applicable reviewer, run EXACTLY:
          git show origin/$BASE_BRANCH:.github/workflows/claude-reviews/<name>.md
        where <name> is one of: code-reviewer, pr-test-analyzer,
        silent-failure-hunter, comment-analyzer, type-design-analyzer,
        pr-quality-reviewer, security-reviewer, skills-isolation.

        If a read fails for a required reviewer (file not on base branch), report
        [Important]: "Criteria file <name>.md missing from $BASE_BRANCH — cannot
        run <name> reviewer. Human review required." Do NOT fall back to reading
        from HEAD. Do NOT launch a subagent without its criteria loaded.

        PLUGIN AGENTS (launch with matching subagent_type from pr-review-toolkit).
        The plugin provides a built-in system prompt; pass the .md file contents as
        additional instructions that supplement (not replace) the plugin's defaults:
        - code-reviewer          Always run.
        - pr-test-analyzer       Always run.
        - silent-failure-hunter  Always run.
        - comment-analyzer       Only if diff modifies comments or docs.
        - type-design-analyzer   Only if diff adds/modifies type definitions.

        GENERAL-PURPOSE AGENTS (no subagent_type; the .md file is the sole criteria):
        - pr-quality-reviewer    Always run. Covers approach, E2E, hygiene.
        - security-reviewer      Always run. Security, LLM security, data integrity, performance.
        - skills-isolation       Only if diff touches agents/src/skills/**, agents/src/prompts/**, agents/src/tools/skill-loader-tool.ts, agents/src/tools/skill-tool-manager.ts, or agents/src/agents/**.
        Self-modification guard: before launching subagents, check if the PR diff
        touches .github/workflows/claude-reviews/** OR .github/workflows/claude-code-review.yml. If it does, add a prominent
        [Important] finding: "This PR modifies its own review pipeline. Human review
        of the affected workflow/criteria files is required." List the modified files.

        Do NOT run code-simplifier. Wait for all subagents, then <synthesis>.
        </review_pipeline>

        <synthesis>
        After all passes complete, synthesize into a single summary comment.
        Dedupe findings that appear in multiple passes - keep the most specific
        version. Do not attribute to agents by name; the developer only cares
        about the finding.

        Classify every finding into [Critical], [Important], or [Suggestion].
        If a subagent finding doesn't clearly meet the [Critical] or [Important]
        bar, downgrade it to [Suggestion].

        Apply these filters before including a finding:
        - Is this a real bug or a theoretical concern? Drop theoretical concerns.
        - Do not downgrade to [Suggestion] solely because a fix would not change
          runtime behavior. [Important] can cover type-safety, API contracts, and
          architectural boundaries per <severity_levels>.
        - Is this a blanket policy request (e.g. "add error handling to all read
          methods")? Those are [Suggestion] at most, not [Important].
        - If the author declined or deferred a prior [Critical] or [Important]
          finding, keep that item in "## Issues" as unresolved (same severity) until
          the code fixes it or a maintainer explicitly waives it in a PR comment
          (e.g. "[waive] …"). Do not drop or downgrade blocked severities because
          of author pushback alone; you may add one line that the author disagreed.

        Exclude:
        - Praise or positive feedback
        - Explanations of what the code does
        - Commentary unrelated to actionable feedback
        </synthesis>

        <verification>
        Before posting any [Critical] or [Important] finding, verify it is real:
        - Read surrounding context in the file (not just the diff)
        - Check if the pattern is used elsewhere in the codebase
        - Confirm the issue is not already handled by code outside the diff
        Drop any findings that do not hold up under verification.
        Do NOT launch additional sub-agents for verification — do this yourself
        as part of synthesis.
        </verification>

        <inline_comments>
        Post inline comments on specific diff lines using the GitHub API.
        For each [Critical] or [Important] finding that survives verification,
        post an inline comment:

        ```
        gh api repos/$REPO/pulls/$PR_NUMBER/comments \
          -f body="**[$SEVERITY] $TITLE**

        $DESCRIPTION

        **Fix:** $RECOMMENDATION" \
          -f path="path/to/file.ts" \
          -f line=42 \
          -f side="RIGHT" \
          -f commit_id="$(gh pr view $PR_NUMBER --json headRefOid -q .headRefOid)"
        ```

        Rules:
        - Use the line number from the HEAD commit (not the diff hunk offset)
        - `side` is always "RIGHT" (the new/changed side)
        - Only post inline comments for [Critical] and [Important] findings
        - [Suggestion] items stay in the summary comment only
        - The line must be within the diff range (files not in the diff cannot
          receive inline comments)
        - If a finding spans multiple lines, comment on the most relevant line
        - On iteration updates, only post inline comments for NEW findings —
          do not re-post for carried-forward unresolved issues
        </inline_comments>

        <output_format>
        Summary comment structure:
        - "## Approach" section (always include, from pr-quality-reviewer criteria)
        - "## Issues" section grouped by severity, with checkbox list (if any):
          ### Critical
          - [ ] [Critical] description — file:line
          ### Important
          - [ ] [Important] description — file:line
        - "## Suggestions" section with bullet list (if any)
          - [Suggestion] description — file:line
        - No preamble or closing remarks

        Reference file:line for every finding. If nothing found: state
        "No issues or suggestions".

        Every review comment MUST end with two lines (even if counts are zero):
        - `Scope check: [reset | no-reset] — [one-line reason or diff vs baseline summary]`
        - `### Diff files (scope):` then a bullet list of every implementation
          file path from `gh pr diff $PR_NUMBER --name-only` that this iteration
          reviewed (exclude tests, fixtures, generated assets, and pure docs
          per the same rules as auto-reset). This list is the baseline for the
          next push: new implementation paths not in the latest prior comment's
          list can trigger auto-reset; absence from an earlier "Issues" list does
          NOT mean a file was never in scope.
        </output_format>

        <workflow>
        ${{ (github.event.action == 'synchronize' || github.event.action == 'reopened') && '
        This is an update to an existing PR.

        1. Fetch previous reviews: gh pr view $PR_NUMBER --comments
           If this command fails, post a single gh pr comment explaining the
           failure and stop — do not change labels or claim an iteration number.
        2. Iteration number N for this run: find the newest prior bot comment (by
           time) whose body contains "### Iteration 1 (reopened)"; call its
           timestamp the reopen baseline if it exists. When scanning for iteration numbers, only consider lines matching
           "### Iteration" followed by whitespace and a positive integer M (ignore
           suffix text like "(reopened)"); only consider matches in bot comments at or
           after that baseline (if no baseline, use all bot comments). Set
           N = 1 + max of those M values (if none, N = 1). If EVENT_ACTION is
           reopened, override N to 1 for this run only (before step 5), post
           "### Iteration 1 (reopened)", and force narrowing tier to full pipeline.
           Still carry forward unresolved [Critical]/[Important] from prior comments.
           Do not infer N from total comment count or from partial/cancelled posts.
        3. Fetch the latest diff: gh pr diff $PR_NUMBER
        4. Scope reset (full pipeline again; narrowing tier back to 1–2 rules)
           if ANY of these hold:

           a. Manual reset (synchronize only): when EVENT_ACTION is synchronize AND
              MANUAL_RESET_BEFORE_SHA and MANUAL_RESET_AFTER_SHA are both non-empty,
              run from repo root (substitute the two SHA strings from the
              MANUAL_RESET_* lines in <context>):
              git log --format=%B <before>..<after> | grep -qiF "[reset review]"
              replacing <before> and <after> with MANUAL_RESET_BEFORE_SHA and
              MANUAL_RESET_AFTER_SHA from <context>.
              If SHAs are missing or EVENT_ACTION is not synchronize, skip (a).

           b. Auto-detect: compare current implementation files from
              `gh pr diff $PR_NUMBER --name-only` (same exclusions as Diff files scope)
              to the "### Diff files (scope):" list in the **most recent** prior bot
              review comment. If that list is missing, skip file-list comparison for
              (b) — do not auto-reset only because paths are new; still apply the
              public API, architectural-pattern, and force-push clauses below.
              When the list exists, reset if a new implementation path appears that
              was not listed there. Also reset on: new public API surface on previously listed
              files; architectural pattern change; force-push with substantially
              different history.

           Do NOT reset for:
           - Adding tests, documentation, or comments
           - Fixing issues raised in previous reviews
           - Minor edits to already-reviewed files (typos, lint fixes,
             renaming internals, adjusting logic flagged in prior reviews)

           If scope resets, add `Scope reset: [one-line reason]` after the
           iteration header. The displayed header must follow step 2 (### Iteration N
           or ### Iteration 1 (reopened) when this run is a reopen); reset only
           restores narrowing tier, not a fake lower N.
        5. Determine narrowing tier from N (after any scope reset, tier is 1–2
           for that run; reopened already forced tier 1–2 in step 2):
           - Tier 1–2 (N 1–2, or this run is scope-reset, or reopened): Full review
             pipeline. All severity levels for new findings.
           - Tier 3–4 (N 3–4): Only new [Critical] and [Important]. Always run
             core reviewers (code-reviewer, pr-quality-reviewer, security-reviewer,
             pr-test-analyzer, silent-failure-hunter). Skip conditional reviewers
             (type-design-analyzer, comment-analyzer, skills-isolation). Do not
             introduce new [Suggestion] items. Still list all unresolved
             [Critical]/[Important] from prior bot comments until fixed or
             maintainer-waived.
           - Tier 5+ (N >= 5): New findings at [Critical] only. Always run
             security-reviewer, pr-quality-reviewer, and silent-failure-hunter.
             Skip all other reviewers for new findings. Still list all unresolved
             [Critical] and [Important] from prior bot comments. When zero
             [Critical] and zero [Important] remain (including carried forward),
             add ready-for-human-review per step 11. Never use `gh pr review` /
             GitHub "approve" API — only label + comment.
        6. Verify each new [Critical] and [Important] finding (see <verification>).
        7. Post inline comments for new verified [Critical] and [Important] findings
           only (see <inline_comments>). Do NOT re-post for carried-forward unresolved
           issues — they already have inline comments from prior iterations.
        8. Post a single update comment using gh pr comment with:
           - "### Iteration N" from step 2 (or "### Iteration 1 (reopened)" when applicable)
           - Optional `Scope reset: …` from step 4
           - Required Scope check + Diff files (scope) lines from <output_format>
           - [x] Resolved issues (previously identified, now fixed)
           - [ ] Unresolved issues (still present, with original severity)
           - [ ] New issues (found in this update, only at severities allowed by tier)
           - New suggestions (only in tier 1–2)
        9. Reference file:line for every issue.
        10. Do NOT create a new review summary - only post a progress update.
        11. Label management (use gh api - gh issue edit is not in the tool
           allowlist). Always check the CURRENT labels on the PR first
           (gh pr view $PR_NUMBER --json labels) — do not infer label
           state from previous review comments:
           - Add label if zero [Critical] and zero [Important] remain
             AND the label is not already present:
             gh api -X POST "repos/$REPO/issues/$PR_NUMBER/labels" -f "labels[]=ready-for-human-review"
           - Remove label if any [Critical] or [Important] remain
             AND the label is currently present (if absent, skip DELETE to avoid 404):
             gh api -X DELETE "repos/$REPO/issues/$PR_NUMBER/labels/ready-for-human-review"
        ' || '
        This is a new PR.

        1. Fetch PR diff: gh pr diff $PR_NUMBER
        2. Run the full review pipeline.
        3. Verify each [Critical] and [Important] finding (see <verification>).
        4. Post inline comments for verified [Critical] and [Important] findings (see <inline_comments>).
        5. Post summary comment using gh pr comment with Approach, Issues
           (grouped by severity), and Suggestions sections.
        6. Mark as "### Iteration 1" in the comment header.
        7. Include required Scope check + "### Diff files (scope):" lines from
           <output_format>.
        8. Reference file:line for every finding.
        9. Label management (use gh api - gh issue edit is not in the tool
           allowlist). Always check the CURRENT labels first (gh pr view $PR_NUMBER --json labels):
           - Add label if zero [Critical] and zero [Important] found
             AND the label is not already present:
             gh api -X POST "repos/$REPO/issues/$PR_NUMBER/labels" -f "labels[]=ready-for-human-review"
           - Remove label if any [Critical] or [Important] found
             AND the label is currently present (if absent, skip DELETE to avoid 404):
             gh api -X DELETE "repos/$REPO/issues/$PR_NUMBER/labels/ready-for-human-review"
        ' }}
        </workflow>
