name: Promote Artifact

on:
  workflow_dispatch:
    inputs:
      component:
        description: "Component to promote"
        required: true
        default: "app"
        type: choice
        options:
          - "app"
          - "proxy"
      environment:
        description: "Environment to promote to"
        required: true
        default: "test"
        type: choice
        options:
          - "dev-private-ecs"
          - "test"
          - "prod-ecs"
      artifact_id:
        description: "Artifact ID to promote (numeric only, from Katana UI)"
        required: true
        type: string

run-name: "[${{ inputs.component }}] Promoting ${{ inputs.artifact_id }} to ${{ inputs.environment }} | actor: ${{ github.actor }}"

permissions:
  id-token: write # Required for Katana auth
  contents: read # Required for checkout

jobs:
  promote:
    name: "[${{ inputs.component }}] Promoting ${{ inputs.artifact_id }} to ${{ inputs.environment }}"
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted

    environment: ${{ inputs.environment }}

    steps:
      - name: Validate Artifact ID
        run: |
          if ! [[ "${{ inputs.artifact_id }}" =~ ^[0-9]+$ ]]; then
            echo "❌ Error: Artifact ID must be numeric only"
            echo "Provided value: ${{ inputs.artifact_id }}"
            exit 1
          fi
          echo "✅ Artifact ID validation passed: ${{ inputs.artifact_id }}"

      - name: Checkout Codebase
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      # Authenticate with Katana
      - id: katana-auth
        name: Authenticate with Katana
        uses: gdcorp-actions/katana-auth@v1

      # Get Katana app info based on component
      - id: katana-app
        name: Get Katana App Info for ${{ inputs.component }}
        uses: gdcorp-actions/katana-get-app@v1
        with:
          path: /${{ inputs.component }}

      # Promote the artifact
      - name: Promote ${{ inputs.component }} to ${{ inputs.environment }}
        id: promote
        uses: gdcorp-actions/katana-promote-artifact@v1
        with:
          namespace: ${{ steps.katana-app.outputs.namespace }}
          app: ${{ steps.katana-app.outputs.app }}
          environment: ${{ inputs.environment }}
          artifact_id: ${{ inputs.artifact_id }}
          retain_previous_count: 1

      - name: Promotion Success
        if: success()
        env:
          COMPONENT: ${{ inputs.component }}
          ENVIRONMENT: ${{ inputs.environment }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          NAMESPACE: ${{ steps.katana-app.outputs.namespace }}
          APP: ${{ steps.katana-app.outputs.app }}
        run: |
          echo "✅ Successfully promoted artifact"
          echo "Component: $COMPONENT"
          echo "Environment: $ENVIRONMENT"
          echo "Artifact ID: $ARTIFACT_ID"
          echo "Namespace: $NAMESPACE"
          echo "App: $APP"
          {
            printf '## ✅ Successfully promoted artifact\n\n'
            printf '**Promotion Summary:**\n\n```\n'
            echo "Component: $COMPONENT"
            echo "Promoted artifact ID: $ARTIFACT_ID"
            echo "To environment: $ENVIRONMENT"
            echo "Namespace: $NAMESPACE"
            echo "Actor: ${{ github.actor }}"
            printf '\n```\n\n'
          } >> $GITHUB_STEP_SUMMARY

  slack-notify:
    name: Send Slack Notification
    if: always()
    needs: [promote]
    uses: ./.github/workflows/slack-notify.yml
    permissions:
      id-token: write
      contents: read
    with:
      result: ${{ needs.promote.result }}
      environment: ${{ inputs.environment }}
      title: "Promotion"
      message: |
        *Component:* ${{ inputs.component }}
        *Environment:* ${{ inputs.environment }}
        *Artifact ID:* ${{ inputs.artifact_id }}
        *Actor:* ${{ github.actor }}
      footer: "airo-app-builder"

  trigger-e2e:
    name: Trigger E2E Tests
    if: ${{ needs.promote.result == 'success' && inputs.environment == 'prod-ecs' && inputs.component == 'app' }}
    needs: [promote]
    permissions:
      actions: write # Required to trigger other workflows
      contents: read
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    steps:
      - name: Trigger E2E Test Workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🎭 Triggering E2E tests after successful production promotion..."
          gh workflow run playwright-e2e.yml \
            --repo ${{ github.repository }} \
            --ref main \
            --field environment=prod \
            --field post_promotion=true

          echo "✅ E2E test workflow triggered successfully"
          echo "Production promotion validation will run automatically"

  trigger-knowledge-base:
    name: Trigger Knowledge Base Update
    if: ${{ needs.promote.result == 'success' && inputs.environment == 'prod-ecs' }}
    needs: [promote]
    uses: ./.github/workflows/knowledge_base.yml
    with:
      environment: PROD
      filenames: ""
