name: Promote Artifact

on:
  workflow_dispatch:
    inputs:
      component:
        description: 'Component to promote'
        required: true
        default: 'app'
        type: choice
        options:
          - 'app'
          - 'blog'
          - 'budget-service'
          - 'debug-console'
          - 'notification-service'
      environment:
        description: 'Environment to promote to'
        required: true
        default: 'test'
        type: choice
        options:
          - 'dev-private'
          - 'pre-test'
          - 'test'
          - 'prod'
      artifact_id:
        description: 'Artifact ID to promote (numeric only, from Katana UI)'
        required: true
        type: string
      strategy:
        description: 'Promotion strategy (dark_release deploys at 0% traffic; reach it via x-katana-version)'
        required: false
        default: 'simple'
        type: choice
        options:
          - 'simple'
          - 'dark_release'
      skip_e2e:
        description: 'Skip E2E tests (used by release manager which triggers E2E separately)'
        required: false
        type: boolean
        default: false

run-name: "[${{ inputs.component }}] ${{ inputs.strategy == 'dark_release' && 'DARK-RELEASE' || 'SIMPLE' }}: Promoting ${{ inputs.artifact_id }} to ${{ inputs.environment }} | actor: ${{ github.actor }}"

permissions:
  id-token: write # Required for Katana auth
  contents: read # Required for checkout

jobs:
  promote:
    name: '[${{ inputs.component }}] Promoting ${{ inputs.artifact_id }} to ${{ inputs.environment }}'
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted

    environment: ${{ inputs.environment }}

    steps:
      - name: Validate Artifact ID
        env:
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          if ! [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo "❌ Error: Artifact ID must be numeric only"
            echo "Provided value: $ARTIFACT_ID"
            exit 1
          fi
          echo "✅ Artifact ID validation passed: $ARTIFACT_ID"

      - name: Get Component Specific Environment
        id: resolve
        env:
          COMPONENT: ${{ inputs.component }}
          ENVIRONMENT: ${{ inputs.environment }}
          COMPONENT_MAP: >-
            {
              "app": {
                "dev-private": "dev-private-ecs",
                "pre-test": "pre-test",
                "test": "test",
                "prod": "prod-ecs"
              },
              "blog": {
                "dev-private": "dev-private",
                "test": "test",
                "prod": "prod"
              },
              "budget-service": {
                "dev-private": "dev-private",
                "test": "test",
                "prod": "prod"
              },
              "debug-console": {
                "dev-private": "dev-private",
                "prod": "prod"
              },
              "notification-service": {
                "dev-private": "dev-private",
                "test": "test",
                "prod": "prod"
              }
            }
        run: |
          COMPONENT_OBJ=$(echo "$COMPONENT_MAP" | jq --arg c "$COMPONENT" '.[$c]')
          if [ "$COMPONENT_OBJ" = "null" ]; then
            echo "Unknown component: $COMPONENT"
            {
              printf '## ❌ Unknown Component\n\n'
              printf '**Component:** `%s`\n\n' "$COMPONENT"
              printf '**Error:** Component not found in configuration.\n'
            } >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          TARGET_ENV=$(echo "$COMPONENT_MAP" | jq -r --arg c "$COMPONENT" --arg e "$ENVIRONMENT" '.[$c][$e] // empty')
          if [ -z "$TARGET_ENV" ]; then
            AVAILABLE_ENVS=$(echo "$COMPONENT_OBJ" | jq -r 'keys | join(", ")')
            echo "Mapping not found for $COMPONENT <> $ENVIRONMENT."
            echo "The $COMPONENT component has only the following environments: $AVAILABLE_ENVS"
            {
              printf '## ❌ Invalid Environment Mapping\n\n'
              printf '**Component:** `%s`\n\n' "$COMPONENT"
              printf '**Requested Environment:** `%s`\n\n' "$ENVIRONMENT"
              printf '**Available Environments:** `%s`\n\n' "$AVAILABLE_ENVS"
              printf '**Error:** Mapping not found for the component <> environment combination.\n\n'
            } >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "TARGET_ENV=$TARGET_ENV" >> $GITHUB_OUTPUT

      - name: Checkout Codebase
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      # Authenticate with Katana
      - id: katana-auth
        name: Authenticate with Katana
        uses: gdcorp-actions/katana-auth@8ad45fa591b1cc9105510f220aa8f01bd299343c # v1
      - id: katana-app
        name: Get Katana App Info for ${{ inputs.component }}
        uses: gdcorp-actions/katana-get-app@52402efba54793a0dd9ae14d33e55641a6efb485 # v1
        with:
          path: /${{ inputs.component }}

      # Promote the artifact
      - name: ${{ inputs.component }} - Promote ${{ inputs.artifact_id }} to ${{ steps.resolve.outputs.TARGET_ENV }}
        id: promote
        uses: gdcorp-actions/katana-promote-artifact@606ea83db07cdbf1729450e6482f2d02d953b23e # v1
        with:
          namespace: ${{ steps.katana-app.outputs.namespace }}
          app: ${{ steps.katana-app.outputs.app }}
          environment: ${{ steps.resolve.outputs.TARGET_ENV }}
          artifact_id: ${{ inputs.artifact_id }}
          strategy: ${{ inputs.strategy }}
          # dark_release: cap at 12 dark artifacts (current + 11 retained); ttl demotes each after 24h.
          # simple/canary: keep 1 warm standby for rollback; no ttl.
          retain_previous_count: ${{ inputs.strategy == 'dark_release' && '11' || '1' }}
          ttl: ${{ inputs.strategy == 'dark_release' && '86400' || '' }}

      - name: Promotion Success
        if: success()
        env:
          COMPONENT: ${{ inputs.component }}
          ENVIRONMENT: ${{ inputs.environment }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          NAMESPACE: ${{ steps.katana-app.outputs.namespace }}
          APP: ${{ steps.katana-app.outputs.app }}
          ACTOR: ${{ github.actor }}
          STRATEGY: ${{ inputs.strategy }}
          CUSTOM_URL: ${{ steps.promote.outputs.promoted_artifact_custom_url }}
          RAW_URL: ${{ steps.promote.outputs.promoted_artifact_url }}
        run: |
          echo "✅ Successfully promoted artifact"
          echo "Component: $COMPONENT"
          echo "Environment: $ENVIRONMENT"
          echo "Artifact ID: $ARTIFACT_ID"
          echo "Namespace: $NAMESPACE"
          echo "App: $APP"
          {
            printf '## ✅ Successfully promoted artifact\n\n'
            printf '**Promotion Summary:**\n\n```\n'
            echo "Component: $COMPONENT"
            echo "Promoted artifact ID: $ARTIFACT_ID"
            echo "To environment: $ENVIRONMENT"
            echo "Namespace: $NAMESPACE"
            echo "Actor: $ACTOR"
            printf '\n```\n\n'
          } >> $GITHUB_STEP_SUMMARY

          if [ "$STRATEGY" = "dark_release" ]; then
            # The x-katana-version selector is the artifact's version/tag (not the numeric
            # id). promoted_artifact_custom_url is the env's friendly custom-domain URL (with
            # cookie) but is empty when no custom hostname is configured in katana (e.g.
            # prod); promoted_artifact_url is the raw onkatana.net URL. Read the selector
            # from whichever the action returned.
            SELECTOR=$(printf '%s' "${CUSTOM_URL:-$RAW_URL}" | sed -n 's/.*[?&]x-katana-version=\([^&]*\).*/\1/p')
            # Prefer katana's custom URL; otherwise build the friendly builder URL from the
            # env→host map (same hosts as playwright-e2e / dark-release-dev) with cookie=1 so
            # the browser sets the persistent x_katana_version cookie — rather than surface
            # the internal onkatana.net host.
            URL="$CUSTOM_URL"
            if [ -z "$URL" ] && [ -n "$SELECTOR" ]; then
              case "$ENVIRONMENT" in
                prod)        HOST=airo-builder.godaddy.com ;;
                test)        HOST=airo-builder.test-godaddy.com ;;
                pre-test)    HOST=pre-test-airo-builder.test-godaddy.com ;;
                dev-private) HOST=airo-builder.dev-godaddy.com ;;
                *)           HOST="" ;;
              esac
              if [ -n "$HOST" ]; then
                URL="https://${HOST}?x-katana-version=${SELECTOR}&cookie=1"
              fi
            fi
            {
              printf '## 🌑 Dark release — 0%% traffic\n\n'
              if [ -n "$URL" ]; then
                printf 'This artifact takes **no live traffic**. Reach it explicitly:\n\n'
                printf '**Browser** (sets a persistent `x_katana_version` cookie + redirects):\n\n%s\n\n' "$URL"
                if [ -n "$SELECTOR" ]; then
                  printf '**Direct (API / curl)** — send the selector on each request:\n```\n'
                  printf 'Header: x-katana-version: %s\n' "$SELECTOR"
                  printf 'Cookie: x_katana_version=%s\n' "$SELECTOR"
                  printf '```\n'
                fi
              else
                printf 'This artifact takes **no live traffic** and the promotion returned no reachable URL — check the promote step log for the `x-katana-version` selector.\n\n'
              fi
            } >> $GITHUB_STEP_SUMMARY
          fi

  slack-notify:
    name: Send Slack Notification
    if: always()
    needs: [promote]
    uses: ./.github/workflows/slack-notify.yml
    permissions:
      id-token: write
      contents: read
    with:
      result: ${{ needs.promote.result }}
      environment: ${{ inputs.environment }}
      title: 'Promotion'
      message: |
        *Component:* ${{ inputs.component }}
        *Environment:* ${{ inputs.environment }}
        *Artifact ID:* ${{ inputs.artifact_id }}
        *Strategy:* ${{ inputs.strategy }}
        *Actor:* ${{ github.actor }}
      footer: 'airo-app-builder'

  trigger-e2e:
    name: Trigger E2E Tests
    if: ${{ needs.promote.result == 'success' && inputs.environment == 'prod' && inputs.component == 'app' && !inputs.skip_e2e }}
    needs: [promote]
    permissions:
      actions: write # Required to trigger other workflows
      contents: read
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    steps:
      - name: Trigger E2E Test Workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🎭 Triggering E2E tests after successful production promotion..."
          gh workflow run playwright-e2e.yml \
            --repo ${{ github.repository }} \
            --ref main \
            --field environment=prod \
            --field post_promotion=true

          echo "✅ E2E test workflow triggered successfully"
          echo "Production promotion validation will run automatically"

  trigger-knowledge-base:
    name: Trigger Knowledge Base Update
    if: ${{ needs.promote.result == 'success' && inputs.environment == 'prod' && inputs.component == 'app' }}
    needs: [promote]
    continue-on-error: true
    permissions:
      actions: write
      contents: read
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    steps:
      - name: Trigger Knowledge Base Workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "📚 Triggering knowledge base update after successful production promotion..."
          gh workflow run knowledge_base.yml \
            --repo ${{ github.repository }} \
            --ref main \
            --field environment=PROD

          echo "✅ Knowledge base update workflow dispatch queued"
