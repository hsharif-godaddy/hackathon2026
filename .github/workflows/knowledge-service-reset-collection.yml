name: Knowledge Service - Reset Qdrant Collection

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - DEV-PRIVATE
          - PROD
        default: DEV-PRIVATE

run-name: "Reset Qdrant collection (${{ inputs.environment }})"

permissions:
  id-token: write # required for sso-awsiam-jwt action
  contents: read

jobs:
  reset-collection:
    name: Drop and Recreate Qdrant Collection (${{ inputs.environment }})
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    timeout-minutes: 5
    environment: ${{ inputs.environment == 'PROD' && 'prod' || 'dev-private' }}

    steps:
      - name: Set environment URLs
        id: env
        run: |
          if [ "${{ inputs.environment }}" = "PROD" ]; then
            echo "api_url=https://airobuilde-app-builder-knowledge-prod.airobuilde-prod.prod.onkatana.net" >> "$GITHUB_OUTPUT"
            echo "sso_env=prod" >> "$GITHUB_OUTPUT"
          else
            echo "api_url=https://airobuilde-app-builder-knowledge-dev-private.airobuilde-dev-private.prod.onkatana.net" >> "$GITHUB_OUTPUT"
            echo "sso_env=test" >> "$GITHUB_OUTPUT"
          fi

      - name: Get AWS IAM JWT
        id: get-awsiam
        uses: gdcorp-actions/sso-awsiam-jwt@1a1c7cef15317e1b1baeab47fa47666b6cc84960
        with:
          sso_env: ${{ steps.env.outputs.sso_env }}

      - name: Reset collection
        env:
          API_URL: ${{ steps.env.outputs.api_url }}
          IAM_JWT: ${{ steps.get-awsiam.outputs.jwt }}
        run: |
          echo "::add-mask::$IAM_JWT"
          echo "Dropping and recreating Qdrant collection in ${{ inputs.environment }}..."

          response=$(curl -s -w "\n%{http_code}" \
            -X POST \
            "${API_URL}/api/v1/collection/reset" \
            -H "Authorization: sso-jwt ${IAM_JWT}" \
            -H "Content-Type: application/json")

          http_code=$(echo "$response" | tail -n 1)
          response_body=$(echo "$response" | head -n -1)

          echo "Response status: $http_code"
          echo "Response body: $response_body"

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ Collection reset successfully. Re-ingest documents to repopulate."
          else
            echo "❌ Collection reset failed (HTTP $http_code)"
            exit 1
          fi
