# Reusable workflow for package quality checks (lint, test, build)
# Called by package-specific workflows with path filters
#
# Runs lint+build and tests in parallel for faster feedback

name: Quality Checks (Reusable)

on:
  workflow_call:
    inputs:
      package-name:
        description: 'Package name for display and artifact naming (e.g., "agents", "app", "proxy")'
        required: true
        type: string
      pnpm-filter:
        description: 'pnpm filter name (e.g., "@airo/agents", "website", "airo-proxy")'
        required: true
        type: string
      working-directory:
        description: 'Working directory for the package (e.g., "./agents", "./app", "./proxy")'
        required: true
        type: string
      node-version:
        description: 'Node.js version to use'
        required: false
        type: string
        default: '22.12'
      skip-tests:
        description: 'Skip running tests'
        required: false
        type: boolean
        default: false
      skip-lint-build:
        description: 'Skip lint, license check, and build'
        required: false
        type: boolean
        default: false
      cache-next-build:
        description: 'Cache Next.js build output (app only)'
        required: false
        type: boolean
        default: false
      test-script:
        description: "Test script to run (e.g., 'test', 'test:unit', 'test:integration')"
        required: false
        type: string
        default: 'test'
      testla-pcp-app-id:
        description: 'PCP App ID for Testla result uploads'
        required: false
        type: string
        default: ''
      testla-run-name:
        description: 'Display name for the Testla test run (e.g., "Agents - Unit Tests")'
        required: false
        type: string
        default: ''
      validate-i18n:
        description: 'Validate i18n translation keys for changed app/src files'
        required: false
        type: boolean
        default: false

jobs:
  # Job 1: Lint, License Check, and Build (runs in parallel with tests)
  lint-build:
    if: ${{ !inputs.skip-lint-build }}
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: ${{ inputs.validate-i18n && 0 || 1 }}
      - name: Setup Artifactory and Node.js
        id: setup
        uses: jfrog/setup-jfrog-cli@eb77328bc74211c6c65cada8d5f6c0e156a51440
        env:
          JF_URL: ${{ vars.JF_URL }}
        with:
          oidc-provider-name: github

      - name: Set up Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Enable Corepack and configure pnpm
        env:
          OIDC_TOKEN: ${{ steps.setup.outputs.oidc-token }}
        run: |
          echo "::add-mask::$OIDC_TOKEN"

          npm install -g corepack@latest
          corepack enable

          EXPECTED_VERSION=$(node -p "
            const pkg = require('./package.json');
            const pm = pkg.packageManager || '';
            const match = pm.match(/^pnpm@(.+?)(\+|$)/);
            if (!match) {
              console.error('ERROR: Could not parse packageManager field:', pm);
              process.exit(1);
            }
            match[1];
          ")

          corepack prepare "pnpm@${EXPECTED_VERSION}" --activate
          ACTUAL_VERSION=$(pnpm --version)

          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "ERROR: pnpm version mismatch!"
            echo "Expected: $EXPECTED_VERSION"
            echo "Actual: $ACTUAL_VERSION"
            exit 1
          fi
          echo "pnpm version $ACTUAL_VERSION matches expected version"

          # Configure pnpm registry
          echo "registry=https://gdartifactory1.jfrog.io/artifactory/api/npm/node-virt/" > .npmrc
          echo "//gdartifactory1.jfrog.io/artifactory/api/npm/node-virt/:_authToken=${OIDC_TOKEN}" >> .npmrc
          echo "//gdartifactory1.jfrog.io/artifactory/api/npm/npm-gasket-core-local/:_authToken=${OIDC_TOKEN}" >> .npmrc
          echo "//gdartifactory1.jfrog.io/artifactory/api/npm/npm-user-experience-local/:_authToken=${OIDC_TOKEN}" >> .npmrc

      # Note: pnpm store path is Linux-specific; self-hosted runners are Linux-only
      - name: Cache pnpm store
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Cache Next.js build
        if: inputs.cache-next-build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ inputs.working-directory }}/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles(format('{0}/**/*.ts', inputs.working-directory), format('{0}/**/*.tsx', inputs.working-directory), format('{0}/next.config.*', inputs.working-directory), format('{0}/tailwind.config.*', inputs.working-directory), format('{0}/tsconfig*.json', inputs.working-directory), format('{0}/package.json', inputs.working-directory), 'pnpm-lock.yaml') }}
          restore-keys: nextjs-${{ runner.os }}-

      - name: Cache Turborepo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate i18n translation keys
        if: inputs.validate-i18n
        env:
          I18N_VALIDATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || '' }}
          I18N_VALIDATION_HEAD_SHA: ${{ github.sha }}
        run: bash scripts/validate-i18n-ci.sh

      - name: Check license compliance
        working-directory: ${{ inputs.working-directory }}
        run: ${{ github.workspace }}/scripts/license-check.sh
        env:
          MATRIX_PACKAGE: ${{ inputs.package-name }}

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: license-report-${{ inputs.package-name }}
          path: ${{ inputs.working-directory }}/licenses-report.txt
          retention-days: 30

      - name: Run linting
        run: pnpm exec turbo run lint --filter=${{ inputs.pnpm-filter }}

      - name: Typecheck
        run: pnpm exec turbo run typecheck --filter=${{ inputs.pnpm-filter }}

      - name: Build
        run: pnpm exec turbo run build --filter=${{ inputs.pnpm-filter }}

  # Job 2: Tests (runs in parallel with lint-build)
  test:
    if: ${{ !inputs.skip-tests }}
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Artifactory and Node.js
        id: setup
        uses: jfrog/setup-jfrog-cli@eb77328bc74211c6c65cada8d5f6c0e156a51440
        env:
          JF_URL: ${{ vars.JF_URL }}
        with:
          oidc-provider-name: github

      - name: Set up Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Enable Corepack and configure pnpm
        env:
          OIDC_TOKEN: ${{ steps.setup.outputs.oidc-token }}
        run: |
          echo "::add-mask::$OIDC_TOKEN"

          npm install -g corepack@latest
          corepack enable

          EXPECTED_VERSION=$(node -p "
            const pkg = require('./package.json');
            const pm = pkg.packageManager || '';
            const match = pm.match(/^pnpm@(.+?)(\+|$)/);
            if (!match) {
              console.error('ERROR: Could not parse packageManager field:', pm);
              process.exit(1);
            }
            match[1];
          ")

          corepack prepare "pnpm@${EXPECTED_VERSION}" --activate
          ACTUAL_VERSION=$(pnpm --version)

          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "ERROR: pnpm version mismatch!"
            echo "Expected: $EXPECTED_VERSION"
            echo "Actual: $ACTUAL_VERSION"
            exit 1
          fi
          echo "pnpm version $ACTUAL_VERSION matches expected version"

          # Configure pnpm registry
          echo "registry=https://gdartifactory1.jfrog.io/artifactory/api/npm/node-virt/" > .npmrc
          echo "//gdartifactory1.jfrog.io/artifactory/api/npm/node-virt/:_authToken=${OIDC_TOKEN}" >> .npmrc
          echo "//gdartifactory1.jfrog.io/artifactory/api/npm/npm-gasket-core-local/:_authToken=${OIDC_TOKEN}" >> .npmrc
          echo "//gdartifactory1.jfrog.io/artifactory/api/npm/npm-user-experience-local/:_authToken=${OIDC_TOKEN}" >> .npmrc

      # Note: pnpm store path is Linux-specific; self-hosted runners are Linux-only
      - name: Cache pnpm store
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Cache Turborepo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm exec turbo run build --filter="${{ inputs.pnpm-filter }}^..."

      - name: Run tests
        run: pnpm exec turbo run "${{ inputs.test-script }}" --filter="${{ inputs.pnpm-filter }}"

      - name: Upload results to Testla
        if: always() && !cancelled() && inputs.testla-pcp-app-id != ''
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pnpm exec testla upload-results \
            --pcp-app-id "${{ inputs.testla-pcp-app-id }}" \
            --file "${{ inputs.working-directory }}/junit-results.xml" \
            --coverage-file "${{ inputs.working-directory }}/coverage/cobertura-coverage.xml" \
            --coverage-format cobertura \
            --framework vitest \
            --name "${{ inputs.testla-run-name || inputs.package-name }}"
