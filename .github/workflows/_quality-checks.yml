# Reusable workflow for package quality checks (lint, test, build)
# Called by package-specific workflows with path filters

name: Quality Checks (Reusable)

on:
  workflow_call:
    inputs:
      package-name:
        description: 'Package name for display and artifact naming (e.g., "agents", "app", "proxy")'
        required: true
        type: string
      pnpm-filter:
        description: 'pnpm filter name (e.g., "@airo/agents", "website", "airo-proxy")'
        required: true
        type: string
      working-directory:
        description: 'Working directory for the package (e.g., "./agents", "./app", "./proxy")'
        required: true
        type: string
      node-version:
        description: 'Node.js version to use'
        required: false
        type: string
        default: '22.12'
      run-prisma-generate:
        description: 'Run Prisma generate (app only)'
        required: false
        type: boolean
        default: false
      build-ai-lib:
        description: 'Build @airo/ai-lib before tests (app only)'
        required: false
        type: boolean
        default: false
      skip-tests:
        description: 'Skip running tests'
        required: false
        type: boolean
        default: false

jobs:
  quality-checks:
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get Artifactory Token
        id: jfrog
        uses: jfrog/setup-jfrog-cli@f748a0599171a192a2668afee8d0497f7c1069df
        env:
          JF_URL: ${{ vars.JF_URL }}
        with:
          oidc-provider-name: github

      - name: Setup Artifactory Creds
        env:
          OIDC_TOKEN: ${{ steps.jfrog.outputs.oidc-token }}
        run: |
          echo "::add-mask::$OIDC_TOKEN"
          echo "ARTIFACTORY_NPM_TOKEN=${OIDC_TOKEN}" >> $GITHUB_ENV

      - name: Set up Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}

      - name: Enable Corepack and verify pnpm version
        run: |
          npm install -g corepack@latest
          corepack enable

          EXPECTED_VERSION=$(node -p "
            const pkg = require('./package.json');
            const pm = pkg.packageManager || '';
            const match = pm.match(/^pnpm@(.+?)(\+|$)/);
            if (!match) {
              console.error('ERROR: Could not parse packageManager field:', pm);
              process.exit(1);
            }
            match[1];
          ")

          corepack prepare "pnpm@${EXPECTED_VERSION}" --activate
          ACTUAL_VERSION=$(pnpm --version)

          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "ERROR: pnpm version mismatch!"
            echo "Expected: $EXPECTED_VERSION"
            echo "Actual: $ACTUAL_VERSION"
            exit 1
          fi
          echo "pnpm version $ACTUAL_VERSION matches expected version"

      - name: Configure pnpm registry
        run: |
          echo "registry=https://gdartifactory1.jfrog.io/artifactory/api/npm/node-virt/" > .npmrc
          echo "//gdartifactory1.jfrog.io/artifactory/api/npm/node-virt/:_authToken=${{ env.ARTIFACTORY_NPM_TOKEN }}" >> .npmrc
          echo "//gdartifactory1.jfrog.io/artifactory/api/npm/npm-gasket-core-local/:_authToken=${{ env.ARTIFACTORY_NPM_TOKEN }}" >> .npmrc

      - name: Verify lockfile format consistency
        run: |
          if grep -q 'lockfileVersion: "' pnpm-lock.yaml; then
            echo "ERROR: pnpm-lock.yaml uses double quotes (old format)"
            exit 1
          fi
          echo "pnpm-lock.yaml format is consistent"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check license compliance
        working-directory: ${{ inputs.working-directory }}
        run: ../scripts/license-check.sh
        env:
          MATRIX_PACKAGE: ${{ inputs.package-name }}

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: license-report-${{ inputs.package-name }}
          path: ${{ inputs.working-directory }}/licenses-report.txt
          retention-days: 30

      - name: Run linting
        run: pnpm --filter ${{ inputs.pnpm-filter }} lint

      - name: Generate Prisma Client
        if: inputs.run-prisma-generate
        working-directory: ${{ inputs.working-directory }}
        run: npx prisma generate

      - name: Build @airo/ai-lib
        if: inputs.build-ai-lib
        run: pnpm --filter @airo/ai-lib build

      - name: Run tests
        if: ${{ !inputs.skip-tests }}
        run: pnpm --filter ${{ inputs.pnpm-filter }} test

      - name: Run build
        run: pnpm --filter ${{ inputs.pnpm-filter }} build
