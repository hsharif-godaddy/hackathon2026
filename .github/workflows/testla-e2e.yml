name: Testla E2E Tests

on:
  # Manual trigger with environment selection
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run tests against"
        required: true
        default: "test"
        type: choice
        options:
          - test
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  testla-e2e:
    name: E2E Tests (${{ github.event.inputs.environment || 'test' }})
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get Artifactory Token
        id: jfrog
        uses: jfrog/setup-jfrog-cli@f748a0599171a192a2668afee8d0497f7c1069df
        env:
          JF_URL: ${{ vars.JF_URL }}
        with:
          oidc-provider-name: github

      - name: Setup Artifactory Creds
        env:
          OIDC_TOKEN: ${{ steps.jfrog.outputs.oidc-token }}
        run: |
          echo "::add-mask::$OIDC_TOKEN"
          echo "ARTIFACTORY_NPM_TOKEN=${OIDC_TOKEN}" >> $GITHUB_ENV

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.12"
          registry-url: https://gdartifactory1.jfrog.io/artifactory/api/npm/node-virt/

      - name: Configure npm registry
        working-directory: ./e2e
        env:
          NODE_AUTH_TOKEN: ${{ env.ARTIFACTORY_NPM_TOKEN }}
        run: |
          npm config set registry https://gdartifactory1.jfrog.io/artifactory/api/npm/node-virt/
          npm config set //gdartifactory1.jfrog.io/artifactory/api/npm/node-virt/:_authToken ${NODE_AUTH_TOKEN}

      - name: Install E2E dependencies
        working-directory: ./e2e
        run: npm ci

      - name: Run Testla E2E Tests
        id: testla
        uses: gdcorp-actions/testla-action@v1.6.1
        with:
          cache-tests: "true"
          run-tests: "true"
          run-name: "E2E-GHA-${{ github.event.inputs.environment || 'test' }}"
          project-id: "26202"
          cypress-config: "cypress.config.ts"
          config-file: "testla.json"
          cypress-root: "e2e"
          wait: "true"
          additional-cli-params: "--env=CYPRESS_ENV=${{ github.event.inputs.environment || 'test' }}"

      - name: Check test results
        if: success() || failure()
        working-directory: ./e2e
        run: |
          if [ ! -f "test-report.xml" ]; then
            echo "::error::test-report.xml not found - Testla may have failed to run tests"
            exit 1
          fi
          FAILURES=$(grep -o 'failures="[0-9]*"' test-report.xml | head -1 | grep -o '[0-9]*' || echo "")
          FAILURES=${FAILURES:-0}
          echo "Test failures: $FAILURES"
          if [ "$FAILURES" -gt 0 ]; then
            echo "::error::E2E tests failed with $FAILURES failures"
            exit 1
          fi
          echo "All tests passed!"
