name: Release Supersede

# Clears a release left UN-APPROVED at the prod gate so the next scheduled
# release isn't blocked behind it. A run paused at `release-prod-approval` keeps
# the `airo-release-main` lock for up to 30 days; without this, a forgotten
# approval stalls the whole cadence.
#
# Runs on the SAME cron as release.yml but in its OWN concurrency group, so it
# can act WHILE a release holds airo-release-main. It only touches runs in
# `waiting` status (paused at the gate) — never an actively-deploying release
# (`in_progress`) or a rollback (a different workflow).
#
# How it frees a stuck run: it REJECTS the run's pending deployment. This is the
# only thing that works — `gh run cancel` is a no-op against a run held by a
# required-reviewers gate (GitHub keeps it `waiting` until a reviewer acts or the
# 30-day timeout). Rejecting requires a REVIEWER-authorized token: the ambient
# GITHUB_TOKEN (github-actions[bot]) is NOT a release-prod-approval reviewer and
# gets 403, so the reject uses the `RELEASE_SUPERSEDE_TOKEN` secret (a PAT / App
# token belonging to a release-prod-approval reviewer, with actions:write). The
# reject makes approve-prod fail, which triggers the release run's OWN
# gate-declined job to finalize its single Slack message — no Slack work here.
#
# Without RELEASE_SUPERSEDE_TOKEN set, the janitor can't free the lock itself
# (cancel doesn't work); it emits a loud warning with the run URL so the oncall
# rejects the gate manually. See docs/release-pipeline.md → "Don't-approve".
#
# Asymmetry note: a hard "Cancel workflow run" can't be superseded this way
# (it cancels this janitor too); this targets the explicit gate-wait case.

on:
  schedule:
    - cron: '0 0,6,12,18,21 * * 1-5' # same ticks as release.yml (incl. the 21:00 train)
  workflow_dispatch:
    inputs:
      min_age_minutes:
        description: 'Only supersede waiting runs older than this many minutes (guards a freshly-dispatched run)'
        default: '30'
        type: string

permissions:
  actions: write # gh run list + fallback `gh run cancel` (the reject uses RELEASE_SUPERSEDE_TOKEN)

concurrency:
  # Deliberately NOT airo-release-main — the janitor must run while a release
  # holds that lock. Its own singleton just prevents overlapping janitor ticks.
  group: airo-release-supersede
  cancel-in-progress: false

jobs:
  supersede:
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    steps:
      # No checkout/build: this job only calls the GitHub API via `gh`. Freeing a
      # gate-stuck run is a reject (below), and the release run's own gate-declined
      # job finalizes Slack — so the release-manager binary isn't needed here.
      - name: Supersede stale gate-stuck releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # reads runs + fallback cancel
          # Reviewer-authorized token used ONLY to reject the pending deployment.
          # Must belong to a release-prod-approval reviewer (a PAT or App token)
          # with actions:write; the ambient GITHUB_TOKEN can't reject the gate.
          SUPERSEDE_TOKEN: ${{ secrets.RELEASE_SUPERSEDE_TOKEN }}
          MIN_AGE_MINUTES: ${{ inputs.min_age_minutes || '30' }}
        run: |
          set -uo pipefail

          # Runs paused at the prod gate report status "waiting". Active deploys
          # are "in_progress"; rollbacks are a different workflow — filtering on
          # status == waiting excludes both, so we never abort a live deploy.
          mapfile -t RUNS < <(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow release.yml \
            -L 30 \
            --json databaseId,status,createdAt \
            --jq '.[] | select(.status == "waiting") | "\(.databaseId) \(.createdAt)"')

          if [ "${#RUNS[@]}" -eq 0 ]; then
            echo "No release runs waiting at the gate — nothing to supersede."
            exit 0
          fi

          NOW=$(date -u +%s)
          MIN_AGE_SECONDS=$(( MIN_AGE_MINUTES * 60 ))

          for entry in "${RUNS[@]}"; do
            RUN_ID="${entry%% *}"
            CREATED="${entry#* }"
            CREATED_TS=$(date -u -d "$CREATED" +%s 2>/dev/null || echo 0)
            if [ "$CREATED_TS" -eq 0 ]; then
              echo "::warning::could not parse createdAt=$CREATED for run $RUN_ID; skipping"
              continue
            fi
            AGE=$(( NOW - CREATED_TS ))
            if [ "$AGE" -lt "$MIN_AGE_SECONDS" ]; then
              echo "Run $RUN_ID is only ${AGE}s old (< ${MIN_AGE_SECONDS}s) — leaving it for now."
              continue
            fi

            RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
            echo "Superseding gate-stuck run $RUN_ID (waiting ${AGE}s)…"

            # `gh run cancel` does NOT clear a reviewer-gated run — the only thing
            # that frees the airo-release-main lock is REJECTING the pending
            # deployment, which needs a reviewer-authorized token. Rejecting makes
            # approve-prod fail → the release run's gate-declined job finalizes the
            # Slack message (and the /approvals API records this comment as the
            # reason), so there's nothing to post here.
            if [ -z "${SUPERSEDE_TOKEN:-}" ]; then
              # cancel is a no-op on a reviewer gate; flag it for manual action.
              echo "::warning::run $RUN_ID is stuck at the prod gate but RELEASE_SUPERSEDE_TOKEN is not set — it can't be auto-superseded (gh run cancel doesn't clear a reviewer-gated run). Approve or reject it manually to free the release lock: $RUN_URL"
              continue
            fi

            ENV_IDS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/pending_deployments" \
              --jq '[.[].environment.id]' 2>/dev/null || echo '[]')
            if [ "$ENV_IDS" = "[]" ]; then
              echo "::warning::run $RUN_ID has no pending deployments to reject; skipping"
              continue
            fi

            BODY=$(jq -nc --argjson ids "$ENV_IDS" \
              '{environment_ids: $ids, state: "rejected", comment: "Superseded — no approval before the next scheduled release"}')
            if GH_TOKEN="$SUPERSEDE_TOKEN" gh api \
                 "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/pending_deployments" \
                 --method POST --input - <<<"$BODY" >/dev/null; then
              echo "Rejected the gate for run $RUN_ID — lock freed; its gate-declined job finalizes Slack."
            else
              echo "::warning::reject failed for run $RUN_ID — is RELEASE_SUPERSEDE_TOKEN a release-prod-approval reviewer with actions:write? Approve/reject manually: $RUN_URL"
            fi
          done
