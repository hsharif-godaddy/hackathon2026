name: budget-service CI

on:
  push:
    branches:
      - main
    paths:
      - 'budget-service/**'
      - '.github/workflows/budget-service-ci.yml'
  pull_request:
    paths:
      - 'budget-service/**'
      - '.github/workflows/budget-service-ci.yml'
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  lint:
    name: budget-service / Lint
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25'
          cache-dependency-path: budget-service/go.mod

      - name: Get Artifactory token
        id: jfrog
        uses: jfrog/setup-jfrog-cli@eb77328bc74211c6c65cada8d5f6c0e156a51440 # v4.11.0
        env:
          JF_URL: ${{ vars.JF_URL }}
        with:
          oidc-provider-name: github

      - name: Go mod download
        working-directory: budget-service
        env:
          JFROG_TOKEN: ${{ steps.jfrog.outputs.oidc-token }}
        run: |
          echo "::add-mask::$JFROG_TOKEN"
          export GOPROXY="https://:${JFROG_TOKEN}@gdartifactory1.jfrog.io/artifactory/api/go/go-virt"
          export GOPRIVATE=
          export GONOPROXY=none
          export GONOSUMDB="github.com/gdcorp-identity/*"
          go mod download

      - name: go vet
        working-directory: budget-service
        run: go vet ./...

      - name: Check gofmt
        working-directory: budget-service
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not properly formatted:" >&2
            gofmt -s -l .
            exit 1
          fi

  test:
    name: budget-service / Test
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: budget
          POSTGRES_PASSWORD: budget
          POSTGRES_DB: budget_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budget -d budget_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25'
          cache-dependency-path: budget-service/go.mod

      - name: Get Artifactory token
        id: jfrog
        uses: jfrog/setup-jfrog-cli@eb77328bc74211c6c65cada8d5f6c0e156a51440 # v4.11.0
        env:
          JF_URL: ${{ vars.JF_URL }}
        with:
          oidc-provider-name: github

      - name: Go mod download
        working-directory: budget-service
        env:
          JFROG_TOKEN: ${{ steps.jfrog.outputs.oidc-token }}
        run: |
          echo "::add-mask::$JFROG_TOKEN"
          export GOPROXY="https://:${JFROG_TOKEN}@gdartifactory1.jfrog.io/artifactory/api/go/go-virt"
          export GOPRIVATE=
          export GONOPROXY=none
          export GONOSUMDB="github.com/gdcorp-identity/*"
          go mod download

      - name: go test (with database)
        working-directory: budget-service
        env:
          TEST_DATABASE_URL: postgres://budget:budget@localhost:5432/budget_test?sslmode=disable
        run: |
          go test -race -coverprofile=coverage.out ./internal/... ./cmd/server/...
          go test -race ./cmd/...

      - name: Convert coverage to lcov
        working-directory: budget-service
        run: |
          go install github.com/jandelgado/gcov2lcov@v1.1.1
          mkdir -p coverage
          gcov2lcov -infile=coverage.out -outfile=coverage/lcov.info

      - name: SPAQ Actions
        uses: gdcorp-actions/spaq-actions@1d939be9fe4c55ad1739e03818651ccc6fa94e51 # v3
        with:
          coveragePath: budget-service/coverage/lcov.info

  e2e:
    name: budget-service / E2E
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: budget
          POSTGRES_PASSWORD: budget
          POSTGRES_DB: budget_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budget -d budget_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Get Artifactory token
        id: jfrog
        uses: jfrog/setup-jfrog-cli@eb77328bc74211c6c65cada8d5f6c0e156a51440 # v4.11.0
        env:
          JF_URL: ${{ vars.JF_URL }}
        with:
          oidc-provider-name: github

      - name: Golden Container Registry login
        run: |
          aws ecr get-login-password --region us-west-2 | docker login 764525110978.dkr.ecr.us-west-2.amazonaws.com -u AWS --password-stdin

      - name: Build budget-service image
        env:
          JFROG_TOKEN: ${{ steps.jfrog.outputs.oidc-token }}
        run: |
          echo "::add-mask::$JFROG_TOKEN"
          DOCKER_BUILDKIT=1 docker build --platform linux/amd64 \
            --secret id=jfrog_token,env=JFROG_TOKEN \
            -f budget-service/Dockerfile \
            -t budget-e2e:ci \
            .

      # Image HEALTHCHECK uses HTTPS; we run HTTP in CI — disable so the container is not stuck unhealthy.
      - name: Run server container
        run: |
          docker rm -f budget-e2e 2>/dev/null || true
          docker run -d --name budget-e2e -p 8080:8080 \
            --no-healthcheck \
            --add-host=host.docker.internal:host-gateway \
            -e DATABASE_URL='postgres://budget:budget@host.docker.internal:5432/budget_test?sslmode=disable' \
            -e LOCAL_AUTH_DISABLE=true \
            -e SERVER_CERT_PATH= \
            -e SERVER_KEY_PATH= \
            budget-e2e:ci

      - name: Wait for health
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo "budget-e2e healthy"
              exit 0
            fi
            sleep 2
          done
          echo "timeout waiting for /health" >&2
          docker logs budget-e2e >&2 || true
          exit 1

      - name: Run PR e2e script
        env:
          BUDGET_SERVICE_URL: http://127.0.0.1:8080
        run: bash budget-service/scripts/e2e-pr.sh

      - name: Dump container logs on failure
        if: failure()
        run: docker logs budget-e2e 2>&1 || true

      - name: Stop server container
        if: always()
        run: docker rm -f budget-e2e 2>/dev/null || true
