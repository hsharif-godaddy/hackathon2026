name: dev-supervisor CI

on:
  push:
    branches:
      - main
    paths:
      - "dev-supervisor/**"
      - ".github/workflows/dev-supervisor.yml"
  pull_request:
    paths:
      - "dev-supervisor/**"
      - ".github/workflows/dev-supervisor.yml"
  workflow_call:

jobs:
  lint:
    name: dev-supervisor / Lint
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: "1.25"
          cache-dependency-path: dev-supervisor/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9
        with:
          version: v2.8.0
          working-directory: dev-supervisor
          args: --timeout=5m

      - name: Run go vet
        working-directory: dev-supervisor
        run: go vet ./...

      - name: Run go fmt check
        working-directory: dev-supervisor
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not properly formatted:"
            gofmt -s -l .
            exit 1
          fi

  test:
    name: dev-supervisor / Test
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: "1.25"
          cache-dependency-path: dev-supervisor/go.sum

      - name: Download dependencies
        working-directory: dev-supervisor
        run: go mod download

      - name: Verify dependencies
        working-directory: dev-supervisor
        run: go mod verify

      - name: Run tests
        working-directory: dev-supervisor
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6
        with:
          files: dev-supervisor/coverage.out
          flags: dev-supervisor
          name: dev-supervisor

  test-docker:
    name: dev-supervisor / Docker Integration Tests
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Run Docker integration tests
        working-directory: dev-supervisor
        run: |
          chmod +x test/run-docker-tests.sh
          ./test/run-docker-tests.sh

  build:
    name: dev-supervisor / Build
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    needs: [lint, test, test-docker]
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: "1.25"
          cache-dependency-path: dev-supervisor/go.sum

      - name: Download dependencies
        working-directory: dev-supervisor
        run: go mod download

      - name: Build binaries
        working-directory: dev-supervisor
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BINARY_NAME="dev-supervisor"
          SANDBOX_NAME="airo-sandbox"
          if [ "$GOOS" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
            SANDBOX_NAME="${SANDBOX_NAME}.exe"
          fi
          go build -ldflags="-w -s" -o "dist/${BINARY_NAME}-${GOOS}-${GOARCH}" ./cmd/dev-supervisor

          # airo-sandbox requires POSIX sh and is excluded for Windows by build tags
          if [ "$GOOS" != "windows" ]; then
            go build -ldflags="-w -s" -o "dist/${SANDBOX_NAME}-${GOOS}-${GOARCH}" ./cmd/airo-sandbox
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dev-supervisor-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dev-supervisor/dist/

  docker-build:
    name: dev-supervisor / Docker Build
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    needs: [lint, test, test-docker]
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Build Docker image
        working-directory: dev-supervisor
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --tag dev-supervisor:latest \
            --file Dockerfile \
            .
