name: dev-supervisor CI

on:
  push:
    branches:
      - main
    paths:
      - 'dev-supervisor/**'
      - '.github/workflows/dev-supervisor.yml'
  pull_request:
    paths:
      - 'dev-supervisor/**'
      - '.github/workflows/dev-supervisor.yml'
  workflow_call:

jobs:
  lint:
    name: dev-supervisor / Lint
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.25'
          cache-dependency-path: dev-supervisor/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9
        with:
          version: v2.8.0
          working-directory: dev-supervisor
          args: --timeout=5m

      - name: Run go vet
        working-directory: dev-supervisor
        run: go vet ./...

      - name: Run go fmt check
        working-directory: dev-supervisor
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not properly formatted:"
            gofmt -s -l .
            exit 1
          fi

  lint-rust:
    name: dev-supervisor / Lint Rust
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96'
          components: clippy, rustfmt
      - name: Rust cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dev-supervisor/rust/target
          key: rust-lint-${{ runner.os }}-${{ hashFiles('dev-supervisor/rust/**/Cargo.lock') }}
          restore-keys: rust-lint-${{ runner.os }}-
      - name: Check formatting
        working-directory: dev-supervisor/rust
        run: cargo fmt --all -- --check
      - name: Run clippy
        working-directory: dev-supervisor/rust
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: dev-supervisor / Test
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.25'
          cache-dependency-path: dev-supervisor/go.sum

      - name: Install ripgrep
        run: command -v rg || sudo apt-get install -y ripgrep
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Download dependencies
        working-directory: dev-supervisor
        run: go mod download

      - name: Verify dependencies
        working-directory: dev-supervisor
        run: go mod verify

      - name: Run tests
        working-directory: dev-supervisor
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6
        with:
          files: dev-supervisor/coverage.out
          flags: dev-supervisor
          name: dev-supervisor

  test-rust:
    name: dev-supervisor / Test Rust
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96'
      - name: Rust cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dev-supervisor/rust/target
          key: rust-test-${{ runner.os }}-${{ hashFiles('dev-supervisor/rust/**/Cargo.lock') }}
          restore-keys: rust-test-${{ runner.os }}-
      - name: Run tests
        working-directory: dev-supervisor/rust
        run: cargo test

  test-docker:
    name: dev-supervisor / Docker Integration Tests
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    needs: [test, test-rust]
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Run Docker integration tests
        working-directory: dev-supervisor
        run: |
          chmod +x test/run-docker-tests.sh
          ./test/run-docker-tests.sh

  build:
    name: dev-supervisor / Build
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    needs: [lint, lint-rust, test, test-rust, test-docker]
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.25'
          cache-dependency-path: dev-supervisor/go.sum
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96'
      - name: Add cross-compilation targets
        run: |
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          rustup target list --installed | grep musl
      - name: Rust cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dev-supervisor/rust/target
          key: rust-build-${{ runner.os }}-${{ matrix.goarch }}-${{ hashFiles('dev-supervisor/rust/**/Cargo.lock') }}
          restore-keys: rust-build-${{ runner.os }}-${{ matrix.goarch }}-

      - name: Download Go dependencies
        working-directory: dev-supervisor
        run: go mod download

      - name: Build Go binaries
        working-directory: dev-supervisor
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_REF_NAME:-${GITHUB_SHA::8}}"
          go build -trimpath -ldflags="-w -s -X main.Version=${VERSION}" -o "dist/${BINARY_NAME}-${GOOS}-${GOARCH}" ./cmd/dev-supervisor
          go build -trimpath -ldflags="-w -s" -o "dist/airo-sandbox-${GOOS}-${GOARCH}" ./cmd/airo-sandbox

      - name: Build Rust binary
        working-directory: dev-supervisor/rust
        run: |
          case "${{ matrix.goarch }}" in
            amd64) RUST_TARGET="x86_64-unknown-linux-musl" ;;
            arm64) RUST_TARGET="aarch64-unknown-linux-musl" ;;
          esac
          cargo +1.96 build --release --target "${RUST_TARGET}"
          cp "target/${RUST_TARGET}/release/airo-workspace" "../dist/airo-workspace-linux-${{ matrix.goarch }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dev-supervisor-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dev-supervisor/dist/

  docker-build:
    name: dev-supervisor / Docker Build
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    needs: [lint, lint-rust, test, test-rust, test-docker]
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Build Docker image
        working-directory: dev-supervisor
        run: |
          VERSION="${GITHUB_REF_NAME:-${GITHUB_SHA::8}}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --build-arg VERSION=${VERSION} \
            --tag dev-supervisor:latest \
            --file Dockerfile \
            .
