name: dev-supervisor CI

on:
  push:
    branches:
      - main
    paths:
      - 'dev-supervisor/**'
      - '.github/workflows/dev-supervisor.yml'
  pull_request:
    paths:
      - 'dev-supervisor/**'
      - '.github/workflows/dev-supervisor.yml'
  workflow_call:

jobs:
  lint:
    name: dev-supervisor / Lint
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25'
          cache-dependency-path: dev-supervisor/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9
        with:
          version: v2.8.0
          working-directory: dev-supervisor
          args: --timeout=5m

      - name: Run go vet
        working-directory: dev-supervisor
        run: go vet ./...

      - name: Run go fmt check
        working-directory: dev-supervisor
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not properly formatted:"
            gofmt -s -l .
            exit 1
          fi

  lint-rust:
    name: dev-supervisor / Lint Rust
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96'
          components: clippy, rustfmt
      - name: Rust cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dev-supervisor/rust/target
          key: rust-lint-${{ runner.os }}-${{ hashFiles('dev-supervisor/rust/**/Cargo.lock') }}
          restore-keys: rust-lint-${{ runner.os }}-
      - name: Check formatting
        working-directory: dev-supervisor/rust
        run: cargo fmt --all -- --check
      - name: Run clippy
        working-directory: dev-supervisor/rust
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: dev-supervisor / Test
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25'
          cache-dependency-path: dev-supervisor/go.sum

      - name: Install ripgrep
        run: command -v rg || sudo apt-get install -y ripgrep
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Download dependencies
        working-directory: dev-supervisor
        run: go mod download

      - name: Verify dependencies
        working-directory: dev-supervisor
        run: go mod verify

      - name: Run tests
        working-directory: dev-supervisor
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          files: dev-supervisor/coverage.out
          flags: dev-supervisor
          name: dev-supervisor

  test-rust:
    name: dev-supervisor / Test Rust
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96'
      - name: Rust cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dev-supervisor/rust/target
          key: rust-test-${{ runner.os }}-${{ hashFiles('dev-supervisor/rust/**/Cargo.lock') }}
          restore-keys: rust-test-${{ runner.os }}-
      - name: Run tests
        working-directory: dev-supervisor/rust
        run: cargo test

  test-integration-subproc:
    name: dev-supervisor / Integration (subproc)
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25'
          cache-dependency-path: dev-supervisor/go.sum

      - name: Install ripgrep
        run: command -v rg || sudo apt-get install -y ripgrep
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Download dependencies
        working-directory: dev-supervisor
        run: go mod download

      - name: Run integration tests (subproc)
        working-directory: dev-supervisor
        run: make test-integration-subproc

  test-docker:
    name: dev-supervisor / Docker Integration Tests
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    needs: [test, test-rust]
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Run Docker integration tests
        working-directory: dev-supervisor
        run: |
          chmod +x test/run-docker-tests.sh
          ./test/run-docker-tests.sh
