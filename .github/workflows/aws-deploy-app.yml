name: AWS Deploy App
on:
  # Manual deployment with environment choice
  workflow_dispatch:
    inputs:
      DEPLOY_TO_ENV:
        description: 'Environment to deploy the artifact'
        required: true
        default: 'test'
        type: choice
        options:
          - 'dev-private-ecs'
          - 'pre-test'
          - 'test'
          - 'NA'
      sha:
        description: 'Commit SHA to build (defaults to branch tip)'
        required: false
        type: string
        default: ''
      strategy:
        description: 'Promotion strategy (canary, the default, ramps weight in steps to avoid demotion-race 503s; dark_release deploys at 0% traffic, reach it via x-katana-version)'
        required: false
        default: 'canary'
        type: choice
        options:
          - 'simple'
          - 'canary'
          - 'dark_release'
      dark_ttl:
        description: 'dark_release only: how long before Katana demotes the dark artifact, as a duration like 3h or 90m. Default 3h. Keep it in sync with the Release Group TTL so the artifact is not demoted before the rollout expires. Ignored for simple deploys (they never carry a TTL).'
        required: false
        type: string
        default: '3h'

  # Allow triggering from other workflows (e.g. deploy-test-e2e)
  workflow_call:
    inputs:
      DEPLOY_TO_ENV:
        description: 'Environment to deploy the artifact'
        required: true
        type: string
      sha:
        description: 'Commit SHA to build (defaults to branch tip)'
        required: false
        type: string
        default: ''
      strategy:
        description: 'Promotion strategy passed through to katana-promote-artifact (canary [default] | simple | dark_release)'
        required: false
        type: string
        default: 'canary'
      dark_ttl:
        description: 'dark_release only: how long before Katana demotes the dark artifact, as a duration like 3h or 90m (default 3h). Ignored for simple.'
        required: false
        type: string
        default: '3h'

run-name: "[APP - ${{ inputs.DEPLOY_TO_ENV }}] ${{ inputs.strategy == 'dark_release' && 'DARK-RELEASE' || inputs.strategy == 'canary' && 'CANARY' || 'SIMPLE' }} | branch: ${{ github.ref_name }} | actor: ${{ github.actor }}"

permissions:
  id-token: write # required for artifactory token login
  contents: read

jobs:
  continuous-integration:
    name: '[APP - ${{ inputs.DEPLOY_TO_ENV }}] branch: ${{ github.ref_name }}'
    if: ${{ (inputs.DEPLOY_TO_ENV == 'test' && github.ref_name == 'main') || inputs.DEPLOY_TO_ENV != 'test' }}
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}

      # Retrieve Katana application info with the katana-get-app GitHub Action
      - id: katana-app
        name: Get Katana App Info
        uses: gdcorp-actions/katana-get-app@52402efba54793a0dd9ae14d33e55641a6efb485 # v1
        with:
          path: /app

      - name: Get Artifactory Token # This action retrieves the Artifactory token
        id: jfrog
        uses: jfrog/setup-jfrog-cli@1641575d87647fb969c0545f0b6a76873e328b7c # v5.0.0
        env:
          JF_URL: ${{ vars.JF_URL }} # Stored at the org level so you don't have to worry about it
        with:
          oidc-provider-name: github

      - name: Setup Artifactory Creds
        env:
          OIDC_TOKEN: ${{ steps.jfrog.outputs.oidc-token }} # Use the token as you'd normally use a token or password
        run: |
          echo "::add-mask::$OIDC_TOKEN"
          echo "always-auth=true" > /tmp/.npmrc-secret
          echo "progress=false" >> /tmp/.npmrc-secret
          echo "registry=https://gdartifactory1.jfrog.io/artifactory/api/npm/node-virt/" >> /tmp/.npmrc-secret
          echo "//gdartifactory1.jfrog.io/artifactory/api/npm/:_authToken=${OIDC_TOKEN}" >> /tmp/.npmrc-secret

      # Sets up authentication with Amazon ECR in the chosen region. Note that the URL can be obtained from GoDaddy's Golden Containers Registry at `https://gcr.katana.int.gdcorp.tools/`.
      - name: Golden Container Registry Login
        run: |
          aws ecr get-login-password --region us-west-2 | docker login 764525110978.dkr.ecr.us-west-2.amazonaws.com -u AWS --password-stdin

      # Login to team ECR for remote build cache
      - name: Cache Registry Login
        run: |
          set -e
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
          export $(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s" \
          $(aws sts assume-role --role-arn arn:aws:iam::694282668781:role/GD-AWS-SSG-Deploy-Role --role-session-name GHASession --query "Credentials.[AccessKeyId,SecretAccessKey,SessionToken]" --output text))
          aws ecr get-login-password --region us-west-2 | docker login --username AWS --password-stdin 694282668781.dkr.ecr.us-west-2.amazonaws.com

      # Set up Docker Buildx for advanced caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker-container

      # Build with remote layer caching via ECR registry
      - name: Build Container
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: app/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ steps.katana-app.outputs.app }}:${{ inputs.sha || github.sha }}
          secret-files: |
            npmrc=/tmp/.npmrc-secret
          cache-from: type=registry,ref=694282668781.dkr.ecr.us-west-2.amazonaws.com/airo-builder/app:cache
          cache-to: type=registry,ref=694282668781.dkr.ecr.us-west-2.amazonaws.com/airo-builder/app:cache,mode=max
          build-args: |
            NODE_ENV=production

      # Clean up credentials after build
      - name: Cleanup Credentials
        if: always()
        run: rm -f /tmp/.npmrc-secret

      # Publish the built container image to Katana with the katana-publish-artifact GitHub Action.
      # continue-on-error: Katana artifacts are immutable per (app, version=commit SHA). Re-deploying
      # a commit that was already published — but whose image rebuilt to a different checksum (Docker
      # builds aren't byte-reproducible) — returns 409 Conflict. Rather than fail the deploy, the
      # steps below reuse the artifact already published for this version.
      - id: katana-publish
        name: Publish Katana Artifact
        continue-on-error: true
        uses: gdcorp-actions/katana-publish-artifact@df952a1ac3cecf94b34c838265ce23f6271838f8 # v1
        with:
          namespace: ${{ steps.katana-app.outputs.namespace }}
          app: ${{ steps.katana-app.outputs.app }}
          image_name: ${{ steps.katana-app.outputs.app }}:${{ inputs.sha || github.sha }}
          artifact_kind: ecs
          artifact_options_json: |
            {
              "protocol": "https",
              "ports": [8443],
              "healthcheckPath": "/api/health",
              "healthcheckGracePeriod": 30
            }

      # On a publish failure (typically the 409 for an already-published commit), list this app's
      # artifacts so the next step can reuse the one already published for this version.
      - id: katana-artifacts
        name: List Katana Artifacts (only when publish failed)
        if: steps.katana-publish.outcome == 'failure'
        uses: gdcorp-actions/katana-api@b83a427b8cb7b421b765ff0357b954ab572e15c0 # v1
        with:
          method: GET
          path: /v1/apps/${{ steps.katana-app.outputs.namespace }}/${{ steps.katana-app.outputs.app }}/artifacts

      # Resolve the artifact id to promote: the just-published one on success, else the existing
      # artifact for this version (idempotent re-deploy). Fails loud if publish failed AND no
      # existing artifact matches — that's a real publish error, not a benign already-exists 409.
      - id: resolve-artifact
        name: Resolve artifact id (published or existing)
        env:
          PUBLISH_OUTCOME: ${{ steps.katana-publish.outcome }}
          PUBLISHED_ID: ${{ steps.katana-publish.outputs.artifact_id }}
          PUBLISHED_IMAGE: ${{ steps.katana-publish.outputs.image_uri }}
          ARTIFACTS_JSON: ${{ steps.katana-artifacts.outputs.body_json }}
          APP: ${{ steps.katana-app.outputs.app }}
          VERSION: ${{ inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          # Happy path: publish succeeded — it must have returned an artifact id.
          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            if [ -z "$PUBLISHED_ID" ]; then
              echo "::error::Publish reported success but returned no artifact_id." >&2
              exit 1
            fi
            echo "Published new artifact $PUBLISHED_ID for $VERSION"
            # The release-manager captures this id for the prod promote by scraping the run's
            # stdout (`gh run view --log`) with the `(\d+)` pattern in release-manager.yml's
            # deploy-app stage. The Build Summary below renders to $GITHUB_STEP_SUMMARY, which
            # --log does NOT include — so the canonical line must reach stdout here, on both the
            # published and reused paths. (Keep any example value out of this comment: a digit
            # right after the prefix would make the script-source echo the first matched line.)
            echo "Artifact ID: $PUBLISHED_ID"
            echo "artifact_id=$PUBLISHED_ID" >> "$GITHUB_OUTPUT"
            echo "source=published" >> "$GITHUB_OUTPUT"
            echo "image=$PUBLISHED_IMAGE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Publish FAILED. This is expected ONLY for the immutability 409 (commit already
          # published). continue-on-error also swallows genuine failures (expired creds, registry
          # unreachable, bad image), so warn loudly — a real failure on an already-published SHA
          # would otherwise be masked by the reuse below and report green.
          echo "::warning::Publish step failed; attempting to reuse an existing artifact for $VERSION. If this was NOT an expected re-deploy of an already-published commit, check the 'Publish Katana Artifact' step log for a real failure (credentials, registry, image)."

          # The katana-api body must be a JSON array (per the Katana get-artifact-id docs); guard so
          # a wrapped/empty/error body yields a clear message instead of an opaque jq abort.
          if ! printf '%s' "$ARTIFACTS_JSON" | jq -e 'type == "array"' >/dev/null 2>&1; then
            echo "::error::katana-api did not return a JSON array of artifacts for $APP (response shape changed?)." >&2
            exit 1
          fi
          MATCHES=$(printf '%s' "$ARTIFACTS_JSON" | jq --arg n "$APP" --arg v "$VERSION" \
            '[.[] | select(.name == $n and .version == $v)]')
          COUNT=$(printf '%s' "$MATCHES" | jq 'length')
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Publish failed and no existing artifact found for $APP version $VERSION — treating as a real publish error, not a benign conflict." >&2
            exit 1
          fi
          if [ "$COUNT" -gt 1 ]; then
            echo "::warning::Found $COUNT artifacts for $APP version $VERSION (expected 1, per Katana's per-commit invariant); using the first."
          fi
          ID=$(printf '%s' "$MATCHES" | jq -r '.[0].artifactId // empty')
          if [ -z "$ID" ]; then
            echo "::error::Matched an artifact for $VERSION but it has no artifactId (katana-api response shape changed?)." >&2
            exit 1
          fi
          echo "Reusing already-published artifact $ID for $VERSION (Katana artifacts are immutable per commit)."
          echo "Artifact ID: $ID" # canonical stdout line scraped by the release-manager (see note on the published path)
          echo "artifact_id=$ID" >> "$GITHUB_OUTPUT"
          echo "source=reused" >> "$GITHUB_OUTPUT"
          # Best-effort: surface the reused artifact's image in the summary (// empty if the
          # response omits the field — no hard dependency, just a possibly-blank Image line).
          echo "image=$(printf '%s' "$MATCHES" | jq -r '.[0].options.containerUri // empty')" >> "$GITHUB_OUTPUT"

      # dark_ttl is a human duration (3h / 90m); Katana's ttl wants seconds, so
      # convert here. Only runs for dark_release — simple deploys carry no TTL.
      - name: Resolve dark TTL (duration → seconds)
        id: dark-ttl
        if: ${{ inputs.strategy == 'dark_release' }}
        env:
          DARK_TTL: ${{ inputs.dark_ttl }}
        run: |
          set -euo pipefail
          v="${DARK_TTL:-3h}"
          case "$v" in
            *h) num="${v%h}"; mult=3600 ;;
            *m) num="${v%m}"; mult=60 ;;
            *)  echo "::error::dark_ttl must be a duration like 3h or 90m (got: '$v')"; exit 1 ;;
          esac
          # Validate the numeric part explicitly — awk would silently coerce a bad
          # prefix (e.g. 'abch', '2xh', '0h') to 0 ⇒ ttl:0 ⇒ immediate demotion.
          if [[ ! "$num" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::dark_ttl must be a positive number followed by h or m, e.g. 3h or 90m (got: '$v')"; exit 1
          fi
          secs=$(awk -v n="$num" -v m="$mult" 'BEGIN { printf "%d", n * m }')
          if [ "$secs" -le 0 ]; then
            echo "::error::dark_ttl must be greater than zero (got: '$v')"; exit 1
          fi
          echo "seconds=$secs" >> "$GITHUB_OUTPUT"
          echo "Dark artifact TTL: $v → ${secs}s"

      # Promote the published artifact to the selected environment with the katana-promote-artifact GitHub Action
      - name: Promote to ${{ inputs.DEPLOY_TO_ENV }} Environment
        id: promote
        if: ${{ inputs.DEPLOY_TO_ENV != 'NA' }}
        uses: gdcorp-actions/katana-promote-artifact@606ea83db07cdbf1729450e6482f2d02d953b23e # v1
        with:
          namespace: ${{ steps.katana-app.outputs.namespace }}
          app: ${{ steps.katana-app.outputs.app }}
          environment: ${{ inputs.DEPLOY_TO_ENV }}
          artifact_id: ${{ steps.resolve-artifact.outputs.artifact_id }}
          strategy: ${{ inputs.strategy }}
          # dark_release: cap at 12 dark artifacts (current + 11 retained); ttl (from dark_ttl,
          # default 3h) demotes each — callers raise it in lockstep with the RG TTL.
          # simple/canary: keep 1 warm standby for rollback; no ttl.
          retain_previous_count: ${{ inputs.strategy == 'dark_release' && '11' || '1' }}
          ttl: ${{ inputs.strategy == 'dark_release' && steps.dark-ttl.outputs.seconds || '' }}

      # Publish summary
      - name: Publish Summary
        env:
          STRATEGY: ${{ inputs.strategy }}
          CUSTOM_URL: ${{ steps.promote.outputs.promoted_artifact_custom_url }}
          RAW_URL: ${{ steps.promote.outputs.promoted_artifact_url }}
          SOURCE: ${{ steps.resolve-artifact.outputs.source }}
          ARTIFACT_ID: ${{ steps.resolve-artifact.outputs.artifact_id }}
          IMAGE: ${{ steps.resolve-artifact.outputs.image }}
        run: |
          {
            printf '**Build Summary:**\n\n```\n'
            echo "Artifact ID: $ARTIFACT_ID ($SOURCE)"
            echo "Deployed to: ${{ inputs.DEPLOY_TO_ENV }}"
            echo "Strategy: ${{ inputs.strategy }}"
            echo "Image: $IMAGE"
            echo "Commit: ${{ inputs.sha || github.sha }}"
            echo "Branch: ${{ github.ref_name }}"
            echo "Actor: ${{ github.actor }}"
            printf '\n```\n\n'
          } >> $GITHUB_STEP_SUMMARY

          if [ "$STRATEGY" = "dark_release" ]; then
            # Prefer the friendly custom-domain URL (carries the cookie param + redirect);
            # fall back to the raw artifact URL. promoted_artifact_custom_url is empty when
            # the env has no custom hostname configured in katana (e.g. prod), but
            # promoted_artifact_url is always populated — so without the fallback the prod
            # dark summary printed the heading with no reachable URL. The x-katana-version
            # selector is the artifact's version/tag (not the numeric id); read it from
            # whichever URL we have so URL, header, and cookie all reference the same value.
            URL="${CUSTOM_URL:-$RAW_URL}"
            SELECTOR=$(printf '%s' "$URL" | sed -n 's/.*[?&]x-katana-version=\([^&]*\).*/\1/p')
            {
              printf '## 🌑 Dark release — 0%% traffic\n\n'
              if [ -n "$URL" ]; then
                printf 'This artifact takes **no live traffic**. Reach it explicitly:\n\n'
                if [ -n "$CUSTOM_URL" ]; then
                  printf '**Browser** (sets a persistent `x_katana_version` cookie + redirects):\n\n%s\n\n' "$CUSTOM_URL"
                else
                  printf '**Browser** (direct access via the version selector):\n\n%s\n\n' "$RAW_URL"
                fi
                if [ -n "$SELECTOR" ]; then
                  printf '**Direct (API / curl)** — send the selector on each request:\n```\n'
                  printf 'Header: x-katana-version: %s\n' "$SELECTOR"
                  printf 'Cookie: x_katana_version=%s\n' "$SELECTOR"
                  printf '```\n'
                fi
              else
                printf 'This artifact takes **no live traffic** and the promotion returned no reachable URL — check the promote step log for the `x-katana-version` selector.\n\n'
              fi
            } >> $GITHUB_STEP_SUMMARY
          fi
