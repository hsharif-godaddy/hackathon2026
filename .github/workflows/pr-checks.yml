name: Code Quality Checks


on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  id-token: write # required for artifactory token login
  contents: read

jobs:
  quality-checks:
    runs-on:
      group: 8606-awsx64
      labels:
        - self-hosted

    strategy:
      fail-fast: false  # Continue other jobs even if one fails
      matrix:
        package: [agents, app]
        include:
          - package: agents
            working-directory: ./agents
            node-version: "22.12"
          - package: app
            working-directory: ./app
            node-version: "22.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Artifactory Token
        id: jfrog
        uses: jfrog/setup-jfrog-cli@f748a0599171a192a2668afee8d0497f7c1069df
        env:
          JF_URL: ${{ vars.JF_URL }}
        with:
          oidc-provider-name: github

      - name: Setup Artifactory Creds
        env:
          OIDC_TOKEN: ${{ steps.jfrog.outputs.oidc-token }}
        run: |
          echo "::add-mask::$OIDC_TOKEN"
          echo "ARTIFACTORY_NPM_TOKEN=${OIDC_TOKEN}" >> $GITHUB_ENV

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install license checker
        run: npm install -g license-checker

      - name: Configure pnpm registry (root workspace)
        run: |
          echo "registry=https://gdartifactory1.jfrog.io/artifactory/api/npm/node-virt/" > .npmrc
          echo "//gdartifactory1.jfrog.io/artifactory/api/npm/node-virt/:_authToken=${{ env.ARTIFACTORY_NPM_TOKEN }}" >> .npmrc
          echo "//gdartifactory1.jfrog.io/artifactory/api/npm/npm-gasket-core-local/:_authToken=${{ env.ARTIFACTORY_NPM_TOKEN }}" >> .npmrc

      - name: Install workspace dependencies  
        run: |
          echo "📦 Installing workspace dependencies with pnpm"
          pnpm install --frozen-lockfile
      - name: Check license compliance
        working-directory: ${{ matrix.working-directory }}
        run: |
          ../scripts/license-check.sh
        env:
          MATRIX_PACKAGE: ${{ matrix.package }}
        continue-on-error: false

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-report-${{ matrix.package }}
          path: ${{ matrix.working-directory }}/licenses-report.txt
          retention-days: 30

      - name: Run linting
        run: |
          if [ "${{ matrix.package }}" = "agents" ]; then
            pnpm --filter @airo/agents lint
          else
            pnpm --filter website lint
          fi

      - name: Run tests
        run: |
          if [ "${{ matrix.package }}" = "agents" ]; then
            echo "🧪 Running unit tests with coverage..."
            pnpm --filter @airo/agents test:coverage:unit
            echo "🔧 Running integration tests..."
            pnpm --filter @airo/agents test:integration
          else
            echo "⚠️ No tests configured yet, skipping..."
          fi
        continue-on-error: true

      - name: Run build
        run: |
          if [ "${{ matrix.package }}" = "agents" ]; then
            pnpm --filter @airo/agents build
          else
            pnpm --filter website build
          fi

  
  v8-template-license-check:
    runs-on:
      group: 8606-awsx64
      labels:
        - self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.12
        uses: actions/setup-node@v4
        with:
          node-version: "22.12"

      - name: Install license checker
        run: npm install -g license-checker

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install v8 template dependencies
        working-directory: ./app-templates/v8
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "📦 Installing v8 template with pnpm (lock file present)"
            pnpm install --frozen-lockfile --ignore-workspace
          else
            echo "📦 Installing v8 template with pnpm (no lock file)"
            pnpm install --ignore-workspace
          fi

      - name: Check v8 template license compliance
        working-directory: ./app-templates/v8
        run: |
          echo "🔍 Checking v8 template license compliance..."
          
          ALLOWED_LICENSES="MIT;Apache-2.0;BSD-3-Clause;BSD-2-Clause;ISC"
          
          echo "✅ Allowed licenses: $ALLOWED_LICENSES"
          
          license-checker \
            --onlyAllow "$ALLOWED_LICENSES" \
            --summary
          
          echo "📋 Generating detailed license report..."
          license-checker \
            --onlyAllow "$ALLOWED_LICENSES" \
            --out licenses-report.txt
        continue-on-error: false

      - name: Upload v8 template license report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-report-v8-template
          path: ./app-templates/v8/licenses-report.txt
          retention-days: 30
