name: CDK Workflow
run-name: "CDK ${{ github.event.inputs.DEFAULT_ACTION }} - ${{ github.event.inputs.STACK_NAME }} (${{ github.event.inputs.ENV_NAME }})"

on:
  workflow_dispatch:
    inputs:
      ENV_NAME:
        description: "Environment to deploy the CDK stack"
        required: true
        type: choice
        options:
          - "dev"
          - "test"
          - "prod"
        default: "dev"
      STACK_NAME:
        description: "Stack to deploy"
        required: true
        type: choice
        options:
          - "--all"
          - "AiroBuilderStack"
          - "MySQLV2Stack"
          - "PostgresStack"
          - "AiroJWTKeyStack"
          - "AiroStripeServiceStack"
          - "GocaasSpendLambdaStack"
          - "LangfuseMetricsEsspExporterStack"
          - "EvalSnapshotsStack"
          - "FeedbackS3Stack"
          - "LakeFormationAdminsStack"
          - "QdrantEcrStack"
          - "QdrantVectorDbStack"
          - "LambdaBaseEcrStack"
          - "AiroInvestigatorStack"
        default: "--all"
      DEFAULT_ACTION:
        description: "Default action to take"
        required: true
        type: choice
        options:
          - "diff"
          - "deploy"
        default: "diff"

permissions:
  id-token: write # required for artifactory token login
  contents: read

jobs:
  build:
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Get Artifactory Token
        id: jfrog
        uses: jfrog/setup-jfrog-cli@1641575d87647fb969c0545f0b6a76873e328b7c # v5.0.0
        env:
          JF_URL: ${{ vars.JF_URL }}
        with:
          oidc-provider-name: github

      - name: Setup Artifactory Creds
        env:
          OIDC_TOKEN: ${{ steps.jfrog.outputs.oidc-token }}
        run: |
          echo "::add-mask::$OIDC_TOKEN"
          echo "ARTIFACTORY_NPM_TOKEN=${OIDC_TOKEN}" >> $GITHUB_ENV

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22.7

      - name: Enable Corepack and configure pnpm
        run: |
          npm install -g corepack@latest

          corepack enable
          EXPECTED_VERSION=$(node -p "
            const pm = require('./package.json').packageManager || '';
            const match = pm.match(/^pnpm@(.+?)(\+|$)/);
            if (!match) { console.error('Cannot parse packageManager:', pm); process.exit(1); }
            match[1];
          ")
          corepack prepare "pnpm@${EXPECTED_VERSION}" --activate
          ACTUAL_VERSION=$(pnpm --version)
          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "ERROR: pnpm version mismatch! Expected: $EXPECTED_VERSION, Actual: $ACTUAL_VERSION"
            exit 1
          fi
          echo "pnpm version $ACTUAL_VERSION matches expected version"

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Set environment variables
        run: |
          echo "ENV_NAME=${{ inputs.ENV_NAME || github.event.inputs.ENV_NAME || 'dev' }}" >> $GITHUB_ENV
          echo "STACK_NAME=${{ inputs.STACK_NAME || github.event.inputs.STACK_NAME || '--all' }}" >> $GITHUB_ENV
          case "${{ inputs.ENV_NAME || github.event.inputs.ENV_NAME || 'dev' }}" in
          'dev') ACCOUNT_ID='694282668781' ;;
          'test') ACCOUNT_ID='269423819739' ;;
          'prod') ACCOUNT_ID='644094189644' ;;
          esac
          echo "CDK_AWS_ACCOUNT_ID=${ACCOUNT_ID}" >> $GITHUB_ENV
          echo "DEFAULT_ACTION=${{ inputs.DEFAULT_ACTION || github.event.inputs.DEFAULT_ACTION || 'diff' }}" >> $GITHUB_ENV

      - name: Print environment variables
        run: |
          echo "ENV_NAME=${{ env.ENV_NAME }}"
          echo "CDK_AWS_ACCOUNT_ID=${{ env.CDK_AWS_ACCOUNT_ID }}"
          echo "STACK_NAME=${{ env.STACK_NAME }}"
          echo "DEFAULT_ACTION=${{ env.DEFAULT_ACTION }}"

      - name: Setup Artifactory .npmrc
        working-directory: ./cdk
        run: |
          # Create .npmrc file for workspace
          echo "always-auth=true" > .npmrc
          echo "progress=false" >> .npmrc
          echo @godaddy:registry=https://gdartifactory1.jfrog.io/artifactory/api/npm/node-virt/ >> .npmrc
          echo @gd-datalake:registry=https://gdartifactory1.jfrog.io/artifactory/api/npm/node-virt/ >> .npmrc
          echo "//gdartifactory1.jfrog.io/artifactory/api/npm/node-virt/:_authToken=${{ env.ARTIFACTORY_NPM_TOKEN }}" >> .npmrc
          cp .npmrc lambda/gocode-spend-essp-exporter/.npmrc
          cp .npmrc lambda/langfuse-metrics-essp-exporter/.npmrc
          cp .npmrc lambda/qdrant-tls-bootstrap/.npmrc
          # investigator is a Docker Lambda image (not esbuild-bundled);
          # its Dockerfile bind-mounts this .npmrc to install gd-auth-client
          # from the private GoDaddy Artifactory registry. gd-auth-client
          # is UNSCOPED, so the @godaddy/@gd-datalake scope redirects above
          # don't cover it — add a default-registry redirect for this copy
          # only. Artifactory's node-virt virtual repo proxies public npm
          # for everything else.
          cp .npmrc ../investigator/.npmrc
          echo "registry=https://gdartifactory1.jfrog.io/artifactory/api/npm/node-virt/" >> ../investigator/.npmrc

      - name: Install dependencies
        working-directory: ./cdk
        run: pnpm --filter airo-builder-cdk install --frozen-lockfile

      - name: Build and verify Lambda functions
        working-directory: ./cdk
        run: |
          # Build Lambda functions before CDK synth
          npx tsx lambda/build.ts --all
          # Verify they can be loaded
          npx tsx lambda/verify.ts

      - name: Run CDK
        working-directory: ./cdk
        env:
          ENV_NAME: ${{ env.ENV_NAME }}
          CDK_AWS_ACCOUNT_ID: ${{ env.CDK_AWS_ACCOUNT_ID }}
          STACK_NAME: ${{ env.STACK_NAME }}
          DEFAULT_ACTION: ${{ env.DEFAULT_ACTION }}
          # Enable BuildKit for Docker asset builds.
          DOCKER_BUILDKIT: "1"
        run: |
          # Ensure pipeline failures are detected (grep was swallowing exit codes)
          set -o pipefail

          # CICD runner needs to assume role
          export $(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s" $(aws sts assume-role \
          --role-arn arn:aws:iam::${CDK_AWS_ACCOUNT_ID}:role/GD-AWS-SSG-Deploy-Role --role-session-name CLISession \
          --query "Credentials.[AccessKeyId,SecretAccessKey,SessionToken]" --output text))

          if { [ "${STACK_NAME}" = "--all" ] || [ "${STACK_NAME}" = "AiroInvestigatorStack" ]; } && { [ "${ENV_NAME}" = "dev" ] || [ "${ENV_NAME}" = "prod" ]; }; then
            echo "Checking private Lambda base mirror: lambda-nodejs:22"
            aws ecr describe-images \
              --repository-name lambda-nodejs \
              --image-ids imageTag="22" \
              --region us-west-2 \
              --no-cli-pager >/dev/null
          fi

          # bootstrap the CDK, required once per account
          npx cdk bootstrap --template node_modules/@gd-safeguard/godaddy-constructs/bootstrap-template.yaml --tags godaddy:governance:tool=safeguard | grep -v "warn: ⚙️ \|warn: \""

          if [ "${{ env.DEFAULT_ACTION }}" == "deploy" ]; then
            if [ "${{ env.STACK_NAME }}" == "--all" ]; then
              npx cdk synth | grep -v "warn: ⚙️ \|warn: \""
            else
              npx cdk synth ${STACK_NAME} | grep -v "warn: ⚙️ \|warn: \""
            fi

            # deploy if synth is successful
            npx cdk deploy ${STACK_NAME} --require-approval never --tags godaddy:governance:tool=safeguard | grep -v "warn: ⚙️ \|warn: \""
          else
            # diff if synth is successful
            npx cdk diff ${STACK_NAME} | grep -v "warn: ⚙️ \|warn: \""
          fi
