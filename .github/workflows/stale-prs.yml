name: Stale PRs

on:
  schedule:
    # Daily; off the :00 mark to avoid the fleet-wide cron spike.
    - cron: '37 6 * * *'
  workflow_dispatch:

permissions:
  pull-requests: write
  # actions/stale lists PRs via the issues endpoint (PRs are issues in the
  # REST API), so it needs the issues permission even though issue staling
  # is disabled below. Read is enough since we never label/close issues.
  issues: read
  # The action persists a cursor in the Actions cache so each run resumes
  # from the first unprocessed PR (see operations-per-run + ascending
  # below). That state save requires actions: write.
  actions: write

concurrency:
  group: stale-prs
  cancel-in-progress: false

jobs:
  stale:
    name: Mark and close stale PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@eb5cf3af3ac0a1aa4c9c45633dd1ae542a27a899 # v10.3.0
        with:
          days-before-stale: 7
          days-before-close: 7
          stale-pr-label: 'stale'
          stale-pr-message: >
            This PR has been inactive for 7 days. Please push an update or
            comment to keep it open — otherwise it will be closed in 7 days.
          close-pr-message: >
            Closing due to 14 days of inactivity. Reopen when you're ready to
            continue.
          # PRs only — leave issues untouched.
          days-before-issue-stale: -1
          days-before-issue-close: -1
          exempt-pr-labels: 'wip,blocked,do-not-close'
          exempt-draft-pr: true
          # Default budget is 30 ops/run; raise it so the initial backlog
          # of idle PRs drains faster, oldest first.
          operations-per-run: 100
          ascending: true
