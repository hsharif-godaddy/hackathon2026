name: Update Knowledge Base

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - "TEST"
          - "PROD"
        default: "TEST"
      filenames:
        description: "Comma-separated filenames (e.g., deployment.md,media_manager.md) or leave empty to upload all"
        required: false
        type: string
        default: ""
      files_to_delete:
        description: "Delete files: Comma-separated filenames (e.g., deployment.md,media_manager.md)"
        required: false
        type: string
        default: ""
      skip_repo_check:
        description: "Skip safety check that blocks deletion when file still exists in knowledge-base/ (use for cleanup / re-ingest flows)"
        required: false
        type: boolean
        default: false
      kb_strategy:
        description: "kbStrategy for uploads (e.g. KNOWB001, KNOWB002, KNOWB003). Empty = inherit parent node default."
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: string
      filenames:
        description: "Comma-separated filenames or empty to upload all"
        required: false
        type: string
        default: ""
      files_to_delete:
        description: "Comma-separated filenames to delete"
        required: false
        type: string
        default: ""
      skip_repo_check:
        description: "Skip safety check that blocks deletion when file still exists in knowledge-base/"
        required: false
        type: boolean
        default: false
      kb_strategy:
        description: "kbStrategy for uploads. Empty = inherit parent node default."
        required: false
        type: string
        default: ""

run-name: "[${{ inputs.environment }}] ${{ inputs.files_to_delete != '' && 'Delete' || 'Upload' }} ${{ inputs.files_to_delete || inputs.filenames || 'all files' }} by ${{ github.actor }}"

jobs:
  upload-knowledge-base:
    name: "[${{ inputs.environment }}] ${{ inputs.files_to_delete != '' && 'Delete' || 'Upload' }} Knowledge Base Document(s)"
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    timeout-minutes: 10

    steps:
      - name: Validate branch for PROD
        if: ${{ inputs.environment == 'PROD' && github.ref_name != 'main' }}
        run: |
          echo "❌ ERROR: PROD environment only allows main branch"
          echo "Current branch: ${{ github.ref_name }}"
          echo "Please run this workflow from main branch for PROD deployments"
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Fetch certificates and generate SSO JWT
        env:
          AWS_REGION: us-west-2
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          echo "Fetching certificates from AWS Secrets Manager..."

          # Determine AWS account ID and IAM role based on environment
          if [ "$ENVIRONMENT" = "PROD" ]; then
            AWS_ACCOUNT_ID="644094189644"
            IAM_ROLE="GD-AWS-USA-GD-AiroBuilde-Prod-Deploy"
            SSO_ENDPOINT="https://sso.godaddy.com/v1/secure/api/token"
            CERT_SECRET_PATH="getty.airo-builder.authclient.int.godaddy.com.crt"
            KEY_SECRET_PATH="getty.airo-builder.authclient.int.godaddy.com.key"
            echo "Using PROD environment"
          else
            AWS_ACCOUNT_ID="694282668781"
            IAM_ROLE="GD-AWS-USA-GD-AiroBuilde-Dev-Private-Deploy"
            SSO_ENDPOINT="https://sso.test-godaddy.com/v1/secure/api/token"
            CERT_SECRET_PATH="getty.airo-builder.test.authclient.int.godaddy.com.crt"
            KEY_SECRET_PATH="getty.airo-builder.test.authclient.int.godaddy.com.key"
            echo "Using TEST environment"
          fi

          # Assume role
          export $(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s" $(aws sts assume-role \
          --role-arn arn:aws:iam::${AWS_ACCOUNT_ID}:role/${IAM_ROLE} \
          --role-session-name knowledge-base-${GITHUB_RUN_ID} \
          --query "Credentials.[AccessKeyId,SecretAccessKey,SessionToken]" --output text))

          # Fetch certificate from Secrets Manager
          GETTY_CERT=$(aws secretsmanager get-secret-value \
            --secret-id "${CERT_SECRET_PATH}" \
            --region "${AWS_REGION}" \
            --query SecretString \
            --output text)

          # Fetch key from Secrets Manager
          GETTY_KEY=$(aws secretsmanager get-secret-value \
            --secret-id "${KEY_SECRET_PATH}" \
            --region "${AWS_REGION}" \
            --query SecretString \
            --output text)

          echo "✅ Certificates retrieved successfully"

          # Create secure temporary directory with restricted permissions
          CERT_TEMP_DIR=$(mktemp -d)
          chmod 700 "$CERT_TEMP_DIR"

          # Ensure cleanup on exit (success or failure)
          cleanup() {
            rm -rf "$CERT_TEMP_DIR"
          }
          trap cleanup EXIT

          # Save certificates to secure temp directory
          echo "$GETTY_CERT" > "$CERT_TEMP_DIR/getty.crt"
          echo "$GETTY_KEY" > "$CERT_TEMP_DIR/getty.key"
          chmod 600 "$CERT_TEMP_DIR/getty.crt" "$CERT_TEMP_DIR/getty.key"

          # Get SSO JWT token using mTLS (client certificate authentication)
          echo "Requesting SSO JWT token from $SSO_ENDPOINT..."
          SSO_RESPONSE=$(curl -s \
            --cert "$CERT_TEMP_DIR/getty.crt" \
            --key "$CERT_TEMP_DIR/getty.key" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d '{"realm": "cert"}' \
            "${SSO_ENDPOINT}")

          # Cleanup is handled by trap

          # Extract token from response (try data, access_token, or token fields)
          SSO_JWT=$(echo "$SSO_RESPONSE" | jq -r '.data // .access_token // .token // empty')

          if [ -z "$SSO_JWT" ] || [ "$SSO_JWT" = "null" ]; then
            echo "❌ Failed to extract token from SSO response"
            echo "Response: $SSO_RESPONSE"
            exit 1
          fi

          echo "::add-mask::$SSO_JWT"
          echo "SSO_JWT=$SSO_JWT" >> $GITHUB_ENV
          echo "✅ SSO JWT token generated successfully"

      - name: Upload knowledge base files
        if: ${{ inputs.files_to_delete == '' }}
        env:
          FILENAMES: ${{ inputs.filenames }}
          ENVIRONMENT: ${{ inputs.environment }}
          KB_STRATEGY: ${{ inputs.kb_strategy }}
        run: |
          echo "Starting knowledge base upload..."
          echo "Branch: ${{ github.ref_name }}"
          echo "Environment: $ENVIRONMENT"
          if [ -n "$KB_STRATEGY" ]; then
            echo "Using kbStrategy: $KB_STRATEGY"
          else
            echo "Using kbStrategy: (inherit parent default)"
          fi

          # Set API URL and kbNodeId based on environment
          if [ "$ENVIRONMENT" == "PROD" ]; then
            API_URL="https://knowb.api.int.godaddy.com/v1/kbnodes"
            KB_NODE_ID="/airo_info"
            echo "Target: Production KB (/airo_info)"
          else
            API_URL="https://knowb.api.int.test-godaddy.com/v1/kbnodes"
            KB_NODE_ID="/airo_info"
            echo "Target: Test KB (/airo_info)"
          fi

          echo "Using API: $API_URL"

          UPLOAD_COUNT=0
          FAILED_COUNT=0

          # Build file list
          if [ -n "$FILENAMES" ]; then
            echo "Uploading specific files: $FILENAMES"
            # Convert comma-separated list to array
            IFS=',' read -ra FILE_ARRAY <<< "$FILENAMES"
            FILES_TO_UPLOAD=()
            for fname in "${FILE_ARRAY[@]}"; do
              # Trim whitespace
              fname=$(echo "$fname" | xargs)
              FILES_TO_UPLOAD+=("knowledge-base/$fname")
            done
          else
            echo "Uploading all markdown files"
            FILES_TO_UPLOAD=(knowledge-base/*.md)
          fi

          # Upload each file
          for file in "${FILES_TO_UPLOAD[@]}"; do
            if [ ! -f "$file" ]; then
              echo "⚠️  File not found: $file"
              FAILED_COUNT=$((FAILED_COUNT + 1))
              continue
            fi

            filename=$(basename "$file")
            echo ""
            echo "=================================================="
            echo "Uploading: $filename"
            echo "=================================================="

            # Build curl form fields; include kbStrategy only when provided.
            # ACL: uploader (service cert) gets admin; everyone gets read so
            # the docs are visible to agents S2S + any authenticated user.
            # Parent ACL does NOT propagate to children in GoKnowb — must set
            # explicitly per-doc at upload time.
            ACL_JSON='{"allowedPrincipals":[{"id":"getty.airo-builder.test.authclient.int.godaddy.com","type":"jomax","scope":"admin"},{"id":"*","type":"*","scope":"read"}]}'
            if [ "$ENVIRONMENT" == "PROD" ]; then
              ACL_JSON='{"allowedPrincipals":[{"id":"getty.airo-builder.authclient.int.godaddy.com","type":"jomax","scope":"admin"},{"id":"*","type":"*","scope":"read"}]}'
            fi

            CURL_FORM_ARGS=(
              -F "files=@${file}"
              -F "kbNodeId=${KB_NODE_ID}"
              -F "resourceType=document"
              -F "metadata={\"filename\":\"${filename}\"}"
              -F "acl=${ACL_JSON}"
            )
            if [ -n "$KB_STRATEGY" ]; then
              CURL_FORM_ARGS+=(-F "kbStrategy=${KB_STRATEGY}")
            fi

            response=$(curl -s -w "\n%{http_code}" \
              -X POST \
              "${API_URL}" \
              -H "Authorization: sso-jwt ${SSO_JWT}" \
              -H "Accept: application/json" \
              "${CURL_FORM_ARGS[@]}")

            http_code=$(echo "$response" | tail -n 1)
            response_body=$(echo "$response" | head -n -1)

            echo "Response status: $http_code"
            echo "Response body: $response_body"

            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              echo "✅ Successfully uploaded: $filename"
              UPLOAD_COUNT=$((UPLOAD_COUNT + 1))
            else
              echo "❌ Failed to upload: $filename (HTTP $http_code)"
              FAILED_COUNT=$((FAILED_COUNT + 1))
            fi
          done

          echo ""
          echo "=================================================="
          echo "Upload Summary"
          echo "=================================================="
          echo "Environment: $ENVIRONMENT"
          echo "KB Node ID: $KB_NODE_ID"
          echo "Successfully uploaded: $UPLOAD_COUNT file(s)"
          echo "Failed uploads: $FAILED_COUNT file(s)"

          if [ $FAILED_COUNT -gt 0 ]; then
            echo ""
            echo "⚠️  Some uploads failed. Please check the logs above."
            exit 1
          fi

          if [ $UPLOAD_COUNT -eq 0 ]; then
            echo ""
            echo "⚠️  No files were uploaded. Check if files exist in knowledge-base directory."
            exit 1
          else
            echo ""
            echo "✅ All knowledge base files uploaded successfully!"
          fi

      - name: Delete knowledge base files
        if: ${{ inputs.files_to_delete != '' }}
        env:
          FILES_TO_DELETE: ${{ inputs.files_to_delete }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          echo "Starting knowledge base deletion..."
          echo "Branch: ${{ github.ref_name }}"
          echo "Environment: $ENVIRONMENT"

          # Set API URL and kbNodeId based on environment
          if [ "$ENVIRONMENT" == "PROD" ]; then
            API_URL="https://knowb.api.int.godaddy.com/v1/kbnodes"
            KB_NODE_ID="/airo_info"
            echo "Target: Production KB (/airo_info)"
          else
            API_URL="https://knowb.api.int.test-godaddy.com/v1/kbnodes"
            KB_NODE_ID="/airo_info"
            echo "Target: Test KB (/airo_info)"
          fi

          echo "Using API: $API_URL"

          DELETE_COUNT=0
          FAILED_COUNT=0

          echo "Deleting specific files: $FILES_TO_DELETE"
          IFS=',' read -ra FILE_ARRAY <<< "$FILES_TO_DELETE"
          DELETE_PATHS=()
          for fname in "${FILE_ARRAY[@]}"; do
            fname=$(echo "$fname" | xargs)
            if [ -z "$fname" ]; then
              continue
            fi
            if [[ "$fname" == *"/"* ]] || [[ "$fname" == *".."* ]]; then
              echo "❌ ERROR: Invalid filename '$fname' — must not contain '/' or '..'"
              exit 1
            fi
            if [ -f "knowledge-base/$fname" ] && [ "${{ inputs.skip_repo_check }}" != "true" ]; then
              echo "❌ ERROR: '$fname' still exists in knowledge-base/ — remove it from the repo before deleting from KB, or set 'skip_repo_check: true' to bypass"
              exit 1
            fi
            if [ -f "knowledge-base/$fname" ] && [ "${{ inputs.skip_repo_check }}" = "true" ]; then
              echo "⚠️  SAFETY BYPASS: '$fname' still exists in knowledge-base/ but skip_repo_check=true — proceeding with delete | actor=${{ github.actor }} run_id=${{ github.run_id }} env=${{ inputs.environment }} ref=${{ github.ref_name }}"
            fi
            DELETE_PATHS+=("$fname")
          done

          if [ ${#DELETE_PATHS[@]} -eq 0 ]; then
            echo "❌ ERROR: No valid filenames provided"
            exit 1
          fi

          for filename in "${DELETE_PATHS[@]}"; do
            echo ""
            echo "=================================================="
            echo "Deleting: $filename"
            echo "=================================================="

            response=$(curl -s -w "\n%{http_code}" \
              -X DELETE \
              "${API_URL}${KB_NODE_ID}/${filename}" \
              -H "Authorization: sso-jwt ${SSO_JWT}" \
              -H "Accept: application/json")

            http_code=$(echo "$response" | tail -n 1)
            response_body=$(echo "$response" | head -n -1)

            echo "Response status: $http_code"
            echo "Response body: $response_body"

            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              echo "✅ Successfully deleted: $filename"
              DELETE_COUNT=$((DELETE_COUNT + 1))
            else
              echo "❌ Failed to delete: $filename (HTTP $http_code)"
              FAILED_COUNT=$((FAILED_COUNT + 1))
            fi
            # Regardless of the response, continue to the next file
          done

          echo ""
          echo "=================================================="
          echo "Delete Summary"
          echo "=================================================="
          echo "Environment: $ENVIRONMENT"
          echo "KB Node ID: $KB_NODE_ID"
          echo "Successfully deleted: $DELETE_COUNT file(s)"
          echo "Failed deletions: $FAILED_COUNT file(s)"

          if [ $FAILED_COUNT -gt 0 ]; then
            echo ""
            echo "⚠️  Some deletions failed. Please check the logs above."
            exit 1
          fi

          if [ $DELETE_COUNT -eq 0 ]; then
            echo ""
            echo "⚠️  No files were deleted. Check if files were removed from knowledge-base directory."
            exit 1
          else
            echo ""
            echo "✅ All knowledge base files (${FILES_TO_DELETE}) deleted successfully!"
          fi
