name: AWS Deploy Proxy

on:
  workflow_dispatch:
    inputs:
      DEPLOY_TO_ENV:
        description: "Environment to deploy the artifact"
        required: true
        default: "pre-dev"
        type: choice
        options:
          - "pre-dev"
          - "dev-private-ecs"
          - "test"

run-name: "[Env: ${{ inputs.DEPLOY_TO_ENV }}] branch: ${{ github.ref_name }} | actor: ${{ github.actor }}"

permissions:
  id-token: write # required for artifactory token login
  contents: read

jobs:
  continuous-integration:
    name: "[Env: ${{ inputs.DEPLOY_TO_ENV }}] branch: ${{ github.ref_name }}"
    runs-on:
      group: 8606-awsx64v2
      labels:
        - self-hosted

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Retrieve Katana application info with the katana-get-app GitHub Action
      - id: katana-app
        name: Get Katana App Info
        uses: gdcorp-actions/katana-get-app@v1
        with:
          path: /proxy

      - name: Get Artifactory Token # This action retrieves the Artifactory token
        id: jfrog
        uses: jfrog/setup-jfrog-cli@88e9eba31c07e31beefa4cef5c0e93d1af9535d7 # v4.6.1
        env:
          JF_URL: ${{ vars.JF_URL }} # Stored at the org level so you don't have to worry about it
        with:
          oidc-provider-name: github

      # Sets up authentication with Amazon ECR in the chosen region. Note that the URL can be obtained from GoDaddy's Golden Containers Registry at `https://gcr.katana.int.gdcorp.tools/`.
      - name: Golden Container Registry Login
        run: |
          aws ecr get-login-password --region us-west-2 | docker login 764525110978.dkr.ecr.us-west-2.amazonaws.com -u AWS --password-stdin

      # Execute the necessary commands to build your application's Docker container image. Place any further build commands under `run:`
      - name: Build Container
        env:
          OIDC_TOKEN: ${{ steps.jfrog.outputs.oidc-token }}
        run: |
          echo "::add-mask::$OIDC_TOKEN"
          echo "$OIDC_TOKEN" > /tmp/npm_token
          chmod 600 /tmp/npm_token
          docker build --platform linux/amd64 -f proxy/Dockerfile --secret id=npm_token,src=/tmp/npm_token -t ${{ steps.katana-app.outputs.app }}:${{ github.sha }} .
          rm -f /tmp/npm_token

      # Publish the built container image to Katana with the katana-publish-artifact GitHub Action
      - id: katana-publish
        name: Publish Katana Artifact
        uses: gdcorp-actions/katana-publish-artifact@v1
        with:
          namespace: ${{ steps.katana-app.outputs.namespace }}
          app: ${{ steps.katana-app.outputs.app }}
          image_name: ${{ steps.katana-app.outputs.app }}:${{ github.sha }}
          artifact_kind: ecs
          artifact_options_json: |
            {
              "protocol": "https",
              "ports": [8888],
              "healthcheckPath": "/health"
            }

      # Promote the published artifact to the `dev` environment with the katana-promote-artifact GitHub Action
      - name: Promote to ${{ inputs.DEPLOY_TO_ENV }} Environment
        uses: gdcorp-actions/katana-promote-artifact@v1
        with:
          namespace: ${{ steps.katana-app.outputs.namespace }}
          app: ${{ steps.katana-app.outputs.app }}
          environment: ${{ inputs.DEPLOY_TO_ENV }}
          artifact_id: ${{ steps.katana-publish.outputs.artifact_id }}

      # Publish summary
      - name: Publish Summary
        run: |
          {
            printf '**Build Summary:**\n\n```\n'
            echo "Artifact ID: ${{ steps.katana-publish.outputs.artifact_id }}"
            echo "Deployed to: ${{ inputs.DEPLOY_TO_ENV }}"
            echo "Image: ${{ steps.katana-publish.outputs.image_uri }}"
            echo "Commit: ${{ github.sha }}"
            echo "Branch: ${{ github.ref_name }}"
            echo "Actor: ${{ github.actor }}"
            printf '\n```\n\n'
          } >> $GITHUB_STEP_SUMMARY
