name: Tools Security Check

on:
  pull_request:
    paths:
      - "agents/src/tools/**"
  workflow_call:
  push:
    branches:
      - main
    paths:
      - "agents/src/tools/**"

jobs:
  security-check:
    name: Check for dangerous process execution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20"

      - name: Run security check
        run: node scripts/check-tools-security.js
