name: AWS Deploy Budget Service

on:
  push:
    branches:
      - main
    paths:
      - "budget-service/**"
      - "packages/go-auth/**"
      - ".github/workflows/aws-deploy-budget-service.yml"

  workflow_dispatch:
    inputs:
      DEPLOY_TO_ENV:
        description: "Environment to deploy the artifact"
        required: true
        type: choice
        options:
          - dev-private
          - test
          - prod
        default: dev-private

run-name: "[BUDGET SERVICE - ${{ github.event_name == 'workflow_dispatch' && inputs.DEPLOY_TO_ENV || 'dev-private+test' }}] ${{ github.ref_name }} | ${{ github.actor }}"

permissions:
  id-token: write # required for artifactory token login
  contents: read

jobs:
  set-matrix:
    name: Resolve promotion targets
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    outputs:
      environments: ${{ steps.set.outputs.environments }}
    steps:
      - id: set
        env:
          MANUAL_ENV: ${{ inputs.DEPLOY_TO_ENV }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo 'environments=["dev-private","test"]' >> $GITHUB_OUTPUT
          else
            printf 'environments=["%s"]\n' "$MANUAL_ENV" >> $GITHUB_OUTPUT
          fi

  build-publish:
    name: "[BUDGET SERVICE] Build and publish artifact"
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted

    outputs:
      artifact_id: ${{ steps.katana-publish.outputs.artifact_id }}
      image_uri: ${{ steps.katana-publish.outputs.image_uri }}
      namespace: ${{ steps.katana-app.outputs.namespace }}
      app: ${{ steps.katana-app.outputs.app }}

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      # Retrieve Katana application info with the katana-get-app GitHub Action
      - id: katana-app
        name: Get Katana App Info
        uses: gdcorp-actions/katana-get-app@52402efba54793a0dd9ae14d33e55641a6efb485 # v1
        with:
          path: /budget-service

      - name: Get Artifactory Token
        id: jfrog
        uses: jfrog/setup-jfrog-cli@eb77328bc74211c6c65cada8d5f6c0e156a51440 # v4.11.0
        env:
          JF_URL: ${{ vars.JF_URL }}
        with:
          oidc-provider-name: github

      # Sets up authentication with Amazon ECR in the chosen region.
      - name: Golden Container Registry Login
        run: |
          aws ecr get-login-password --region us-west-2 | docker login 764525110978.dkr.ecr.us-west-2.amazonaws.com -u AWS --password-stdin

      # Execute the necessary commands to build your application's Docker container image.
      # DOCKER_BUILDKIT=1 is required to support --mount=type=secret for private module auth.
      - name: Build Container
        env:
          JFROG_TOKEN: ${{ steps.jfrog.outputs.oidc-token }}
        run: |
          echo "::add-mask::$JFROG_TOKEN"
          DOCKER_BUILDKIT=1 docker build --platform linux/amd64 \
            --secret id=jfrog_token,env=JFROG_TOKEN \
            -f budget-service/Dockerfile \
            -t ${{ steps.katana-app.outputs.app }}:${{ github.sha }} \
            .

      # Publish the built container image to Katana with the katana-publish-artifact GitHub Action
      - id: katana-publish
        name: Publish Katana Artifact
        uses: gdcorp-actions/katana-publish-artifact@df952a1ac3cecf94b34c838265ce23f6271838f8 # v1
        with:
          namespace: ${{ steps.katana-app.outputs.namespace }}
          app: ${{ steps.katana-app.outputs.app }}
          image_name: ${{ steps.katana-app.outputs.app }}:${{ github.sha }}
          artifact_kind: ecs
          artifact_options_json: |
            {
              "protocol": "https",
              "ports": [8080],
              "healthcheckPath": "/health",
              "healthcheckGracePeriod": 120
            }

      - name: Publish Summary
        run: |
          {
            printf '**Build Summary:**\n\n```\n'
            echo "Artifact ID: ${{ steps.katana-publish.outputs.artifact_id }}"
            echo "Image: ${{ steps.katana-publish.outputs.image_uri }}"
            echo "Commit: ${{ github.sha }}"
            echo "Branch: ${{ github.ref_name }}"
            echo "Actor: ${{ github.actor }}"
            printf '\n```\n\n'
          } >> $GITHUB_STEP_SUMMARY

  promote:
    name: "[BUDGET SERVICE] Promote to ${{ matrix.environment }}"
    needs:
      - set-matrix
      - build-publish
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.set-matrix.outputs.environments) }}

    steps:
      - name: Promote to ${{ matrix.environment }} Environment
        uses: gdcorp-actions/katana-promote-artifact@606ea83db07cdbf1729450e6482f2d02d953b23e # v1
        with:
          namespace: ${{ needs.build-publish.outputs.namespace }}
          app: ${{ needs.build-publish.outputs.app }}
          environment: ${{ matrix.environment }}
          artifact_id: ${{ needs.build-publish.outputs.artifact_id }}

      - name: Publish Summary
        env:
          ARTIFACT_ID: ${{ needs.build-publish.outputs.artifact_id }}
          IMAGE_URI: ${{ needs.build-publish.outputs.image_uri }}
          ENV_NAME: ${{ matrix.environment }}
        run: |
          {
            printf '**Promotion Summary:**\n\n```\n'
            echo "Artifact ID: $ARTIFACT_ID"
            echo "Deployed to: $ENV_NAME"
            echo "Image: $IMAGE_URI"
            echo "Commit: ${{ github.sha }}"
            echo "Branch: ${{ github.ref_name }}"
            echo "Actor: ${{ github.actor }}"
            printf '\n```\n\n'
          } >> $GITHUB_STEP_SUMMARY
