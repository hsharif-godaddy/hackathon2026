name: Load Online Evaluators

on:
  workflow_dispatch:
    inputs:
      synthia-env:
        description: 'Synthia environment'
        required: false
        default: 'prod'
        type: choice
        options:
          - prod
          - test
          - dev
      langfuse-project-id:
        description: 'Langfuse project ID to target (prod: cmj7ew7m20026tr41gsi9knd4)'
        required: true
        type: string
      config-path:
        description: 'Path to evaluators (use subfolder like website/ to load only those evaluators)'
        required: false
        default: 'evals/goarena/online-evaluators'
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: load-online-evaluators-${{ github.ref }}
  cancel-in-progress: false

jobs:
  load-online-evaluators:
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Inject Langfuse project ID
        env:
          LANGFUSE_PROJECT_ID: ${{ inputs.langfuse-project-id }}
          CONFIG_PATH: ${{ inputs.config-path }}
        run: |
          # Support both flat and nested directory structures
          find "${CONFIG_PATH}" -name "*.yaml" -type f -exec \
            sed -i "s/REPLACE_LANGFUSE_PROJECT_ID/${LANGFUSE_PROJECT_ID}/g" {} +
          echo "--- Verifying injection ---"
          find "${CONFIG_PATH}" -name "*.yaml" -type f -exec \
            grep -l "langfuseProjectIds" {} + | head -5

      - name: Load Online Evaluators
        id: load-evaluators
        uses: gdcorp-dna/synthia/actions/load-evaluators@main
        with:
          config-path: ${{ inputs.config-path }}
          synthia-env: ${{ inputs.synthia-env }}

      - name: Load Online Suites
        id: load-suites
        uses: gdcorp-dna/synthia/actions/load-online-suites@main
        with:
          config-path: evals/goarena/online-suites
          synthia-env: ${{ inputs.synthia-env }}

      - name: Summary
        if: always()
        env:
          EVALUATOR_COUNT: ${{ steps.load-evaluators.outputs.evaluator-count }}
          CREATED_COUNT: ${{ steps.load-evaluators.outputs.created-count }}
          UPDATED_COUNT: ${{ steps.load-evaluators.outputs.updated-count }}
          EVALUATOR_NAMES: ${{ steps.load-evaluators.outputs.evaluator-names }}
          SUITE_COUNT: ${{ steps.load-suites.outputs.suite-count }}
          SUITE_NAMES: ${{ steps.load-suites.outputs.suite-names }}
        run: |
          echo "## Online Evaluators Loaded" >> "$GITHUB_STEP_SUMMARY"
          echo "- Total: $EVALUATOR_COUNT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Created: $CREATED_COUNT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Updated: $UPDATED_COUNT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Names: $EVALUATOR_NAMES" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Online Suites Loaded" >> "$GITHUB_STEP_SUMMARY"
          echo "- Total: $SUITE_COUNT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Names: $SUITE_NAMES" >> "$GITHUB_STEP_SUMMARY"
