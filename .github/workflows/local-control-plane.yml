name: local-control-plane CI

on:
  push:
    branches:
      - main
    paths:
      - "local-control-plane/**"
      - ".github/workflows/local-control-plane.yml"
  pull_request:
    paths:
      - "local-control-plane/**"
      - ".github/workflows/local-control-plane.yml"
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  lint:
    name: local-control-plane / Lint
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Get Artifactory Token
        id: jfrog
        uses: jfrog/setup-jfrog-cli@1641575d87647fb969c0545f0b6a76873e328b7c # v5.0.0
        env:
          JF_URL: ${{ vars.JF_URL }}
        with:
          oidc-provider-name: github

      - name: Configure Go environment for JFrog
        env:
          OIDC_TOKEN: ${{ steps.jfrog.outputs.oidc-token }}
        run: |
          if [ -z "$OIDC_TOKEN" ]; then
            echo "::error::JFrog OIDC token is empty -- check oidc-provider-name and JF_URL." >&2
            exit 1
          fi
          GOPROXY_URL="https://:${OIDC_TOKEN}@gdartifactory1.jfrog.io/artifactory/api/go/go-virt|direct"
          echo "::add-mask::$OIDC_TOKEN"
          echo "::add-mask::$GOPROXY_URL"
          echo "GOPROXY=$GOPROXY_URL" >> $GITHUB_ENV
          echo "GONOSUMDB=github.com/gdcorp-golang/*" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25"
          cache-dependency-path: local-control-plane/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9
        with:
          version: v2.12.1
          working-directory: local-control-plane
          args: --timeout=5m

      - name: Run go vet
        working-directory: local-control-plane
        run: go vet ./...

      - name: Run go fmt check
        working-directory: local-control-plane
        run: |
          # Capture output so a `gofmt` parse failure (non-zero exit, empty stdout)
          # can't slip past `wc -l`.
          UNFORMATTED=$(gofmt -s -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not properly formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

  test:
    name: local-control-plane / Test
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Get Artifactory Token
        id: jfrog
        uses: jfrog/setup-jfrog-cli@1641575d87647fb969c0545f0b6a76873e328b7c # v5.0.0
        env:
          JF_URL: ${{ vars.JF_URL }}
        with:
          oidc-provider-name: github

      - name: Configure Go environment for JFrog
        env:
          OIDC_TOKEN: ${{ steps.jfrog.outputs.oidc-token }}
        run: |
          if [ -z "$OIDC_TOKEN" ]; then
            echo "::error::JFrog OIDC token is empty -- check oidc-provider-name and JF_URL." >&2
            exit 1
          fi
          GOPROXY_URL="https://:${OIDC_TOKEN}@gdartifactory1.jfrog.io/artifactory/api/go/go-virt|direct"
          echo "::add-mask::$OIDC_TOKEN"
          echo "::add-mask::$GOPROXY_URL"
          echo "GOPROXY=$GOPROXY_URL" >> $GITHUB_ENV
          echo "GONOSUMDB=github.com/gdcorp-golang/*" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25"
          cache-dependency-path: local-control-plane/go.sum

      - name: Download dependencies
        working-directory: local-control-plane
        run: go mod download

      - name: Verify dependencies
        working-directory: local-control-plane
        run: go mod verify

      - name: Run tests
        working-directory: local-control-plane
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          files: local-control-plane/coverage.out
          flags: local-control-plane
          name: local-control-plane

  build:
    name: local-control-plane / Build
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    needs: [lint, test]
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Get Artifactory Token
        id: jfrog
        uses: jfrog/setup-jfrog-cli@1641575d87647fb969c0545f0b6a76873e328b7c # v5.0.0
        env:
          JF_URL: ${{ vars.JF_URL }}
        with:
          oidc-provider-name: github

      - name: Configure Go environment for JFrog
        env:
          OIDC_TOKEN: ${{ steps.jfrog.outputs.oidc-token }}
        run: |
          if [ -z "$OIDC_TOKEN" ]; then
            echo "::error::JFrog OIDC token is empty -- check oidc-provider-name and JF_URL." >&2
            exit 1
          fi
          GOPROXY_URL="https://:${OIDC_TOKEN}@gdartifactory1.jfrog.io/artifactory/api/go/go-virt|direct"
          echo "::add-mask::$OIDC_TOKEN"
          echo "::add-mask::$GOPROXY_URL"
          echo "GOPROXY=$GOPROXY_URL" >> $GITHUB_ENV
          echo "GONOSUMDB=github.com/gdcorp-golang/*" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25"
          cache-dependency-path: local-control-plane/go.sum

      - name: Download dependencies
        working-directory: local-control-plane
        run: go mod download

      - name: Build binary
        working-directory: local-control-plane
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -ldflags="-w -s" -o "dist/local-control-plane-${GOOS}-${GOARCH}" ./cmd/server

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: local-control-plane-${{ matrix.goos }}-${{ matrix.goarch }}
          path: local-control-plane/dist/
