name: release-manager CI

on:
  push:
    branches:
      - main
    paths:
      - "release-manager/**"
      - ".github/workflows/release-manager.yml"
  pull_request:
    paths:
      - "release-manager/**"
      - ".github/workflows/release-manager.yml"

jobs:
  lint:
    name: Lint
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: release-manager/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.1
          working-directory: release-manager
          args: --timeout=5m

      - name: Run go vet
        working-directory: release-manager
        run: go vet ./...

      - name: Run go fmt check
        working-directory: release-manager
        run: |
          # Capture output so a `gofmt` parse failure (non-zero exit, empty stdout)
          # can't slip past `wc -l`.
          UNFORMATTED=$(gofmt -s -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not properly formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

  test:
    name: Test
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: release-manager/go.sum

      - name: Download dependencies
        working-directory: release-manager
        run: go mod download

      - name: Verify dependencies
        working-directory: release-manager
        run: go mod verify

      - name: Run tests
        working-directory: release-manager
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: release-manager/coverage.out
          flags: release-manager
          name: release-manager

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    needs: [lint, test]
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: release-manager/go.sum

      - name: Download dependencies
        working-directory: release-manager
        run: go mod download

      - name: Build binary
        working-directory: release-manager
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -ldflags="-w -s" -o "dist/release-manager-${GOOS}-${GOARCH}" ./cmd/release-manager

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-manager-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release-manager/dist/
