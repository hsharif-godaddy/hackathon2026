name: AWS Deploy Knowledge Service

on:
  push:
    branches:
      - main
    paths:
      - "knowledge-service/**"
      - ".github/workflows/aws-deploy-knowledge-service.yml"
      - "packages/go-auth/**"

  # Manual deployment
  workflow_dispatch:

run-name: "[Env: dev-private] branch: ${{ github.ref_name }} | actor: ${{ github.actor }}"

permissions:
  id-token: write # required for artifactory token login
  contents: read

jobs:
  continuous-integration:
    name: "[Env: dev-private] branch: ${{ github.ref_name }}"
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted

    env:
      DEPLOY_TO_ENV: dev-private

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      # Retrieve Katana application info with the katana-get-app GitHub Action
      - id: katana-app
        name: Get Katana App Info
        uses: gdcorp-actions/katana-get-app@v1
        with:
          path: /knowledge-service

      # Assume role into step outputs only - intentionally NOT written to $GITHUB_ENV
      # so the runner's original instance role remains intact for Katana steps.
      - name: Assume CI/CD AWS role for GHEC token
        id: assume-role
        run: |
          read -r KEY SECRET TOKEN <<< $(aws sts assume-role \
            --role-arn arn:aws:iam::694282668781:role/GD-AWS-USA-GD-AiroBuilde-Dev-Private-Deploy \
            --role-session-name GHASession \
            --query "Credentials.[AccessKeyId,SecretAccessKey,SessionToken]" \
            --output text)
          echo "::add-mask::$KEY"
          echo "::add-mask::$SECRET"
          echo "::add-mask::$TOKEN"
          [[ -z "$KEY" || -z "$SECRET" || -z "$TOKEN" ]] && { echo "ERROR: STS assume-role failed or returned empty credentials"; exit 1; }
          echo "access_key_id=$KEY" >> $GITHUB_OUTPUT
          echo "secret_access_key=$SECRET" >> $GITHUB_OUTPUT
          echo "session_token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Get GHEC-SA token for gdcorp-golang/auth
        uses: gdcorp-actions/get-ghec-sa-tokens@e1012cc92874c6363b29ed6930b7b48badd66440
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.assume-role.outputs.access_key_id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.assume-role.outputs.secret_access_key }}
          AWS_SESSION_TOKEN: ${{ steps.assume-role.outputs.session_token }}
        with:
          repositories: gdcorp-golang/auth

      # Sets up authentication with Amazon ECR in the chosen region.
      - name: Golden Container Registry Login
        run: |
          aws ecr get-login-password --region us-west-2 | docker login 764525110978.dkr.ecr.us-west-2.amazonaws.com -u AWS --password-stdin

      # Execute the necessary commands to build your application's Docker container image.
      # DOCKER_BUILDKIT=1 is required to support --mount=type=secret for private module auth.
      - name: Build Container
        run: |
          DOCKER_BUILDKIT=1 docker build --platform linux/amd64 \
            --secret id=ghec_token,env=GHECSA_GDCORP_GOLANG_AUTH \
            -f knowledge-service/Dockerfile \
            -t ${{ steps.katana-app.outputs.app }}:${{ github.sha }} \
            .

      # Publish the built container image to Katana with the katana-publish-artifact GitHub Action
      - id: katana-publish
        name: Publish Katana Artifact
        uses: gdcorp-actions/katana-publish-artifact@v1
        with:
          namespace: ${{ steps.katana-app.outputs.namespace }}
          app: ${{ steps.katana-app.outputs.app }}
          image_name: ${{ steps.katana-app.outputs.app }}:${{ github.sha }}
          artifact_kind: ecs
          artifact_options_json: |
            {
              "protocol": "https",
              "ports": [8081],
              "healthcheckPath": "/api/v1/health",
              "healthcheckGracePeriod": 60
            }

      # Promote the published artifact to dev-private environment with the katana-promote-artifact GitHub Action
      - name: Promote to dev-private Environment
        uses: gdcorp-actions/katana-promote-artifact@v1
        with:
          namespace: ${{ steps.katana-app.outputs.namespace }}
          app: ${{ steps.katana-app.outputs.app }}
          environment: ${{ env.DEPLOY_TO_ENV }}
          artifact_id: ${{ steps.katana-publish.outputs.artifact_id }}

      # Publish summary
      - name: Publish Summary
        run: |
          {
            printf '**Build Summary:**\n\n```\n'
            echo "Artifact ID: ${{ steps.katana-publish.outputs.artifact_id }}"
            echo "Deployed to: ${{ env.DEPLOY_TO_ENV }}"
            echo "Image: ${{ steps.katana-publish.outputs.image_uri }}"
            echo "Commit: ${{ github.sha }}"
            echo "Branch: ${{ github.ref_name }}"
            echo "Actor: ${{ github.actor }}"
            printf '\n```\n\n'
          } >> $GITHUB_STEP_SUMMARY
