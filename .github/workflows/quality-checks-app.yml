name: Quality Checks - App

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
    paths:
      - "app/**"
      - "packages/shared/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - "scripts/license-check.sh"
      - ".github/workflows/quality-checks-app.yml"
      - ".github/workflows/_quality-checks.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "packages/shared/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - "scripts/license-check.sh"
      - ".github/workflows/quality-checks-app.yml"
      - ".github/workflows/_quality-checks.yml"

permissions:
  id-token: write
  contents: read

jobs:
  quality-checks-app:
    uses: ./.github/workflows/_quality-checks.yml
    with:
      package-name: app
      pnpm-filter: website
      working-directory: ./app
      cache-next-build: true
    secrets: inherit
