name: Quality Checks - App

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
    paths:
      - 'app/**'
      - 'packages/pattern-library/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - 'scripts/license-check.sh'
      - 'scripts/validate-i18n.mjs'
      - 'scripts/validate-i18n-ci.sh'
      - '.github/workflows/quality-checks-app.yml'
      - '.github/workflows/_quality-checks.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'packages/pattern-library/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - 'scripts/license-check.sh'
      - 'scripts/validate-i18n.mjs'
      - 'scripts/validate-i18n-ci.sh'
      - '.github/workflows/quality-checks-app.yml'
      - '.github/workflows/_quality-checks.yml'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  quality-checks-app-lint-build:
    uses: ./.github/workflows/_quality-checks.yml
    with:
      package-name: app
      # website... = website plus its workspace dependencies (pattern-library,
      # shared, ai-lib, etc.) so their own lint/typecheck/build run here. The
      # turbo `typecheck` task depends on `^build` (not `^typecheck`), so a bare
      # `website` filter only builds deps and never typechecks their sources
      # (including test files) — this closes that gap.
      pnpm-filter: website...
      working-directory: ./app
      cache-next-build: true
      skip-tests: true
      validate-i18n: true
    secrets: inherit

  quality-checks-app-unit-tests:
    uses: ./.github/workflows/_quality-checks.yml
    with:
      package-name: app-unit
      pnpm-filter: website
      working-directory: ./app
      cache-next-build: false
      skip-lint-build: true
      test-script: test:unit
      testla-pcp-app-id: '6082'
      testla-run-name: 'App - Unit Tests'
    secrets: inherit

  quality-checks-app-integration-tests:
    uses: ./.github/workflows/_quality-checks.yml
    with:
      package-name: app-integration
      pnpm-filter: website
      working-directory: ./app
      cache-next-build: false
      skip-lint-build: true
      test-script: test:integration
      testla-pcp-app-id: '6082'
      testla-run-name: 'App - Integration Tests'
    secrets: inherit
