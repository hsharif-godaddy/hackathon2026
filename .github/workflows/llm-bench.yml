name: llm-bench CI

on:
  push:
    branches:
      - main
    paths:
      - 'evals/llm-bench/**'
      - '.github/workflows/llm-bench.yml'
  pull_request:
    paths:
      - 'evals/llm-bench/**'
      - '.github/workflows/llm-bench.yml'
  workflow_call:

jobs:
  lint:
    name: llm-bench / Lint
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: '1.96'
          components: clippy, rustfmt
      - name: Rust cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            evals/llm-bench/target
          key: llm-bench-lint-${{ runner.os }}-${{ hashFiles('evals/llm-bench/Cargo.lock') }}
          restore-keys: llm-bench-lint-${{ runner.os }}-
      - name: Check formatting
        working-directory: evals/llm-bench
        run: cargo fmt --all -- --check
      - name: Run clippy
        working-directory: evals/llm-bench
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: llm-bench / Test
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: '1.96'
      - name: Rust cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            evals/llm-bench/target
          key: llm-bench-test-${{ runner.os }}-${{ hashFiles('evals/llm-bench/Cargo.lock') }}
          restore-keys: llm-bench-test-${{ runner.os }}-
      - name: Run tests
        working-directory: evals/llm-bench
        # --all-targets also builds and links the examples (e.g. mock_server),
        # which a plain `cargo test` skips, so a compile/link error there fails CI.
        run: cargo test --all-targets
