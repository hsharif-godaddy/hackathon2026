name: Quality Checks - Agents

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
    paths:
      - "agents/**"
      - "packages/ai-lib/**"
      - "packages/ai-common/**"
      - "packages/ai-grants/**"
      - "packages/ai-transport/**"
      - "packages/ai-skills/**"
      - "packages/shared/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - "scripts/license-check.sh"
      - ".github/workflows/quality-checks-agents.yml"
      - ".github/workflows/_quality-checks.yml"
  merge_group:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "agents/**"
      - "packages/ai-lib/**"
      - "packages/ai-common/**"
      - "packages/ai-grants/**"
      - "packages/ai-transport/**"
      - "packages/ai-skills/**"
      - "packages/shared/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - "scripts/license-check.sh"
      - ".github/workflows/quality-checks-agents.yml"
      - ".github/workflows/_quality-checks.yml"

permissions:
  id-token: write
  contents: read

jobs:
  quality-checks-agents:
    uses: ./.github/workflows/_quality-checks.yml
    with:
      package-name: agents
      pnpm-filter: "@airo/agents"
      working-directory: ./agents
      skip-tests: false
    secrets: inherit
