name: Quality Checks - Proxy

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
    paths:
      - "proxy/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "scripts/license-check.sh"
      - ".github/workflows/quality-checks-proxy.yml"
      - ".github/workflows/_quality-checks.yml"
  push:
    branches: [main]
    paths:
      - "proxy/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "scripts/license-check.sh"
      - ".github/workflows/quality-checks-proxy.yml"
      - ".github/workflows/_quality-checks.yml"

permissions:
  id-token: write
  contents: read

jobs:
  quality-checks-proxy:
    uses: ./.github/workflows/_quality-checks.yml
    with:
      package-name: proxy
      pnpm-filter: airo-proxy
      working-directory: ./proxy
    secrets: inherit
