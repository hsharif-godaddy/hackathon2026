# GitHub Actions Workflow: Run Browser-Based Scenarios
# Runs browser-based website testing scenarios using Synthia

name: Run Browser Testing Scenarios

on:
  workflow_dispatch:
    inputs:
      agent-name:
        description: 'Agent to test'
        required: true
        default: 'TEST_EB_AiroAppBuilder_regression'
        type: choice
        options:
          - TEST_EB_AiroAppBuilder_regression
      config-file:
        description: 'Suite configuration file'
        required: true
        default: 'evals/goarena/simulation_eval_suite.yaml'
        type: choice
        options:
          - evals/goarena/simulation_eval_suite.yaml
      synthia-env:
        description: 'Synthia environment'
        required: false
        default: 'test'
        type: choice
        options:
          - test
      wait-for-completion:
        description: 'Wait for results'
        required: false
        default: true
        type: boolean
      timeout-minutes:
        description: 'Synthia step timeout (minutes)'
        required: false
        default: 45
        type: number
      fail-on-threshold:
        description: 'Fail if score is below threshold'
        required: false
        default: true
        type: boolean
      score-threshold:
        description: 'Minimum overall score to pass (0-100)'
        required: false
        default: '70'
        type: string

  # Allow calling from other workflows (e.g., promote-artifact.yml)
  workflow_call:
    inputs:
      agent-name:
        description: 'Agent to test'
        required: false
        type: string
        default: 'TEST_EB_AiroAppBuilder_regression'
      config-file:
        description: 'Suite configuration file'
        required: false
        type: string
        default: 'evals/goarena/simulation_eval_suite.yaml'
      synthia-env:
        description: 'Synthia environment'
        required: false
        type: string
        default: 'test'
      wait-for-completion:
        description: 'Wait for results'
        required: false
        type: boolean
        default: true
      timeout-minutes:
        description: 'Synthia step timeout (minutes)'
        required: false
        type: string
        default: '45'
      fail-on-threshold:
        description: 'Fail if score is below threshold'
        required: false
        type: boolean
        default: true
      score-threshold:
        description: 'Minimum overall score to pass (0-100)'
        required: false
        type: string
        default: '70'

permissions:
  contents: read
  # Required: Synthia actions use OIDC to authenticate with the Synthia service.
  # The load-* and run-scenarios actions exchange the GitHub OIDC token for
  # Synthia API credentials.
  id-token: write

# Limit concurrent runs to prevent exhausting self-hosted runner capacity
# Include github.workflow to separate manual runs from workflow_call invocations
# (prevents manual runs from blocking prod promotion gates)
concurrency:
  group: simulation-evaluation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Top up TEST subscription credits before running scenarios so a low balance
  # doesn't silently fail the run mid-way. The refill workflow is a no-op when
  # all subscriptions are above the threshold, so this is safe to run every time.
  refill-credits:
    name: Refill TEST subscription credits
    uses: ./.github/workflows/refill-test-credits.yml
    permissions:
      contents: read

  # Capture the post-refill, pre-simulation credit baseline. Pairs with
  # snapshot-after below to compute pool-level credit spend for this run.
  # Runs after refill so the baseline reflects any newly-granted credit
  # packs (otherwise the diff would be polluted by the refill's grant).
  snapshot-before:
    name: Snapshot credits (before)
    needs: refill-credits
    uses: ./.github/workflows/snapshot-test-credits.yml
    with:
      label: before-${{ github.run_id }}
    permissions:
      contents: read

  run-browser-scenarios:
    needs: [refill-credits, snapshot-before]
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    # Fixed job timeout - generous buffer for any step timeout value
    timeout-minutes: 50
    steps:
      - name: Validate inputs
        env:
          AGENT_NAME: ${{ inputs.agent-name }}
          CONFIG_FILE: ${{ inputs.config-file }}
          SYNTHIA_ENV: ${{ inputs.synthia-env }}
          FAIL_ON_THRESHOLD: ${{ inputs.fail-on-threshold }}
        run: |
          # Validate inputs against allowed values (mirrors workflow_dispatch choices)
          ALLOWED_AGENTS="TEST_EB_AiroAppBuilder_regression"
          ALLOWED_CONFIGS="evals/goarena/simulation_eval_suite.yaml"
          ALLOWED_ENVS="test"

          error=0
          if [[ ! " $ALLOWED_AGENTS " =~ " $AGENT_NAME " ]]; then
            echo "::error::Invalid agent-name '$AGENT_NAME'. Allowed: $ALLOWED_AGENTS"
            error=1
          fi
          if [[ ! " $ALLOWED_CONFIGS " =~ " $CONFIG_FILE " ]]; then
            echo "::error::Invalid config-file '$CONFIG_FILE'. Allowed: $ALLOWED_CONFIGS"
            error=1
          fi
          if [[ ! " $ALLOWED_ENVS " =~ " $SYNTHIA_ENV " ]]; then
            echo "::error::Invalid synthia-env '$SYNTHIA_ENV'. Allowed: $ALLOWED_ENVS"
            error=1
          fi
          # Validate fail-on-threshold is a real boolean (GitHub coerces invalid strings to false)
          if [[ "$FAIL_ON_THRESHOLD" != "true" && "$FAIL_ON_THRESHOLD" != "false" ]]; then
            echo "::error::Invalid fail-on-threshold '$FAIL_ON_THRESHOLD'. Must be 'true' or 'false'."
            error=1
          fi
          if [ $error -eq 1 ]; then
            exit 1
          fi
          echo "✅ All inputs validated"

      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Load Synthetic Users
        id: load-users
        uses: gdcorp-dna/synthia/actions/load-synthetic-users@6452899fdfb9f693e03e271a58111dc11c0414e1 # release-1.1.2
        with:
          config-path: evals/goarena/synthetic-users
          synthia-env: ${{ inputs.synthia-env }}

      - name: Load Evaluators
        id: load-evaluators
        uses: gdcorp-dna/synthia/actions/load-evaluators@6452899fdfb9f693e03e271a58111dc11c0414e1 # release-1.1.2
        with:
          config-path: evals/goarena/evaluators
          synthia-env: ${{ inputs.synthia-env }}

      - name: Load Scenarios
        id: load-scenarios
        uses: gdcorp-dna/synthia/actions/load-scenarios@6452899fdfb9f693e03e271a58111dc11c0414e1 # release-1.1.2
        with:
          config-path: evals/goarena/scenarios
          agent-name: ${{ inputs.agent-name }}
          synthia-env: ${{ inputs.synthia-env }}

      - name: Run Browser Scenarios
        id: synthia
        uses: gdcorp-dna/synthia/actions/run-scenarios@6452899fdfb9f693e03e271a58111dc11c0414e1 # release-1.1.2
        with:
          config-path: ${{ inputs.config-file }}
          agent-name: ${{ inputs.agent-name }}
          synthia-env: ${{ inputs.synthia-env }}
          wait-for-completion: ${{ inputs.wait-for-completion }}
          timeout-minutes: ${{ inputs.timeout-minutes }}
          fail-on-threshold: ${{ inputs.fail-on-threshold }}
          score-threshold: ${{ inputs.score-threshold }}

      - name: Show outputs and write summary
        if: always()
        env:
          SYNTHIA_CONCLUSION: ${{ steps.synthia.conclusion }}
          RUN_ID: ${{ steps.synthia.outputs.run-id }}
          SIMULATION_IDS: ${{ steps.synthia.outputs.simulation-ids }}
          STATUS: ${{ steps.synthia.outputs.status }}
          TOTAL_SIMULATIONS: ${{ steps.synthia.outputs.total-simulations }}
          COMPLETED_SIMULATIONS: ${{ steps.synthia.outputs.completed-simulations }}
          FAILED_SIMULATIONS: ${{ steps.synthia.outputs.failed-simulations }}
          SUMMARY_MARKDOWN: ${{ steps.synthia.outputs.summary-markdown }}
          RESULTS_JSON: ${{ steps.synthia.outputs.results-json }}
        run: |
          # Log outputs to console
          echo "Run ID: $RUN_ID"
          echo "Simulation IDs: $SIMULATION_IDS"
          echo "Status: $STATUS"
          echo "Total Simulations: $TOTAL_SIMULATIONS"
          echo "Completed: $COMPLETED_SIMULATIONS"
          echo "Failed: $FAILED_SIMULATIONS"

          # Write job summary
          if [ "$SYNTHIA_CONCLUSION" != "success" ]; then
            echo "## ❌ Synthia Run Failed" >> "$GITHUB_STEP_SUMMARY"
            echo "Synthia step did not complete successfully (conclusion: $SYNTHIA_CONCLUSION)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "$SUMMARY_MARKDOWN" ]; then
            printf '%s\n' "$SUMMARY_MARKDOWN" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No summary available (Synthia may have failed or timed out)" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Print results JSON
          echo "### Results JSON" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$RESULTS_JSON" ]; then
            echo "No results returned (empty output)" >> "$GITHUB_STEP_SUMMARY"
          elif jq_err=$(echo "$RESULTS_JSON" | jq empty 2>&1); then
            # Valid JSON - pretty print it
            echo "$RESULTS_JSON" | jq . >> "$GITHUB_STEP_SUMMARY"
          else
            # Invalid JSON - show raw output and fail
            echo "::error::Invalid JSON returned from Synthia: $jq_err"
            echo "Error: Invalid JSON returned from Synthia" >> "$GITHUB_STEP_SUMMARY"
            echo "$RESULTS_JSON" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Assert Synthia succeeded
        if: always()
        env:
          SYNTHIA_CONCLUSION: ${{ steps.synthia.conclusion }}
        run: |
          # Independent assertion that Synthia completed successfully
          # This catches edge cases where the action exits 0 but conclusion != success
          if [ "$SYNTHIA_CONCLUSION" != "success" ]; then
            echo "::error::Synthia step did not complete successfully (conclusion: $SYNTHIA_CONCLUSION)"
            exit 1
          fi

  # Capture the post-simulation credit total. Runs even if the scenario
  # job failed -- a partial run still spent credits and we want to know
  # how many. Pairs with snapshot-before to bound the spend window.
  snapshot-after:
    name: Snapshot credits (after)
    needs: run-browser-scenarios
    if: always()
    uses: ./.github/workflows/snapshot-test-credits.yml
    with:
      label: after-${{ github.run_id }}
    permissions:
      contents: read

  # Compute the pool-level credit spend (sum of after.creditsSpent -
  # before.creditsSpent across all available grants on all subs) and
  # render it into the run summary alongside the scenario results.
  report-credit-spend:
    name: Report credit spend for this run
    # Use `always()` so the report still runs when scenarios failed --
    # we still want to surface "this failed run cost X credits".
    needs: [snapshot-before, snapshot-after]
    if: always()
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Download before snapshot
        # Tolerate a missing snapshot-before (e.g. refill failed and
        # cancelled this dependency) -- the report step below explicitly
        # handles "before missing" by reporting absolute spend.
        if: needs.snapshot-before.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.8
        with:
          name: airo-credits-snapshot-before-${{ github.run_id }}
          path: ./snapshot-before

      - name: Download after snapshot
        if: needs.snapshot-after.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.8
        with:
          name: airo-credits-snapshot-after-${{ github.run_id }}
          path: ./snapshot-after

      - name: Compute and report credit spend
        env:
          BEFORE_RESULT: ${{ needs.snapshot-before.result }}
          AFTER_RESULT: ${{ needs.snapshot-after.result }}
        run: |
          # Best-effort: this report should never fail the workflow run
          # because it runs after the actual scenarios -- a credit-diff
          # parsing blip shouldn't mask a real scenario pass/fail.
          set -uo pipefail

          BEFORE_FILE="./snapshot-before/snapshot.json"
          AFTER_FILE="./snapshot-after/snapshot.json"

          {
            echo ""
            echo "## Airo credit spend for this run"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$BEFORE_RESULT" != "success" ] || [ ! -f "$BEFORE_FILE" ]; then
            echo "::warning::No 'before' snapshot available (snapshot-before result: $BEFORE_RESULT) -- can't compute delta"
            {
              echo ":warning: \`before\` snapshot unavailable (job result: \`$BEFORE_RESULT\`) -- skipping delta."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$AFTER_RESULT" != "success" ] || [ ! -f "$AFTER_FILE" ]; then
            echo "::warning::No 'after' snapshot available (snapshot-after result: $AFTER_RESULT) -- can't compute delta"
            {
              echo ":warning: \`after\` snapshot unavailable (job result: \`$AFTER_RESULT\`) -- skipping delta."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Pool-level totals stamped onto each snapshot by snapshot-test-credits.yml.
          #
          # Delta math MUST use `pool_credits_spent_total` (sum over ALL
          # grants regardless of `isAvailable`), not `pool_credits_spent`
          # (which filters to active grants). When a grant exhausts
          # mid-suite it flips `isAvailable: true -> false`, and the
          # filtered sum drops it from the after side -- producing a
          # negative delta even though real spend went up. The
          # `_total` field is unfiltered and avoids that trap.
          BEFORE_TOTAL=$(jq -r '.pool_credits_spent_total // 0' "$BEFORE_FILE")
          AFTER_TOTAL=$(jq -r '.pool_credits_spent_total // 0' "$AFTER_FILE")
          BEFORE_TAKEN_AT=$(jq -r '.taken_at // "unknown"' "$BEFORE_FILE")
          AFTER_TAKEN_AT=$(jq -r '.taken_at // "unknown"' "$AFTER_FILE")
          DELTA_TOTAL=$((AFTER_TOTAL - BEFORE_TOTAL))

          # Per-subscription delta. Same reason as above for using
          # `credits_spent_total` rather than `credits_spent_available`.
          # Inner-join on subscription_id; emit rows only for subs that
          # read OK in both snapshots so we don't show misleading
          # "0 spend" rows for failed reads.
          PER_SUB_TABLE=$(jq -nr \
            --slurpfile before "$BEFORE_FILE" \
            --slurpfile after "$AFTER_FILE" \
            '
            ($before[0].subscriptions // []) as $b
            | ($after[0].subscriptions  // []) as $a
            | [
                $a[]
                | select(.ok == true)
                | . as $after_row
                | ($b[] | select(.subscription_id == $after_row.subscription_id and .ok == true)) as $before_row
                | {
                    sub: $after_row.subscription_id,
                    before: $before_row.credits_spent_total,
                    after: $after_row.credits_spent_total,
                    delta: ($after_row.credits_spent_total - $before_row.credits_spent_total)
                  }
              ]
            | sort_by(-.delta)
            | .[]
            | "| `\(.sub)` | \(.before) | \(.after) | \(.delta) |"
            ')

          {
            echo "**Pool credits spent this run:** \`$DELTA_TOTAL\`"
            echo ""
            echo "- Before snapshot: \`$BEFORE_TOTAL\` credits at \`$BEFORE_TAKEN_AT\`"
            echo "- After snapshot:  \`$AFTER_TOTAL\` credits at \`$AFTER_TAKEN_AT\`"
            echo ""
            echo "_Totals above sum \`creditsSpent\` over **all** grants (including expired) so the delta stays correct when a grant exhausts mid-run. They will not match the \`creditsSpent (available)\` totals in the snapshot tables, which intentionally show only currently-active grants._"
            echo ""
            echo "### Per-subscription delta"
            echo ""
            echo "| Subscription | Before | After | Delta |"
            echo "| --- | ---: | ---: | ---: |"
            if [ -n "$PER_SUB_TABLE" ]; then
              echo "$PER_SUB_TABLE"
            else
              echo "| _no subscriptions read OK in both snapshots_ | — | — | — |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "=================================================="
          echo "Pool credits spent this run: $DELTA_TOTAL (before=$BEFORE_TOTAL after=$AFTER_TOTAL)"
          echo "=================================================="
