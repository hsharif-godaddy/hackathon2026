name: stripe-service CI

on:
  push:
    branches:
      - main
    paths:
      - "stripe-service/**"
      - "packages/go-auth/**"
      - ".github/workflows/quality-checks-stripe-service.yml"
  pull_request:
    paths:
      - "stripe-service/**"
      - "packages/go-auth/**"
      - ".github/workflows/quality-checks-stripe-service.yml"
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  lint:
    name: stripe-service / Lint
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Get Artifactory Token
        id: jfrog
        uses: jfrog/setup-jfrog-cli@eb77328bc74211c6c65cada8d5f6c0e156a51440 # v4.11.0
        env:
          JF_URL: ${{ vars.JF_URL }}
        with:
          oidc-provider-name: github

      - name: Configure Go environment for JFrog
        env:
          OIDC_TOKEN: ${{ steps.jfrog.outputs.oidc-token }}
        run: |
          echo "::add-mask::$OIDC_TOKEN"
          echo "GOPROXY=https://:${OIDC_TOKEN}@gdartifactory1.jfrog.io/artifactory/api/go/go-virt|direct" >> $GITHUB_ENV
          echo "GONOSUMDB=github.com/gdcorp-golang/*" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25"
          cache-dependency-path: stripe-service/go.mod

      - name: Go mod download
        working-directory: stripe-service
        run: go mod download

      - name: go vet
        working-directory: stripe-service
        run: go vet ./...

      - name: Check gofmt
        working-directory: stripe-service
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not properly formatted:" >&2
            gofmt -s -l .
            exit 1
          fi

  test:
    name: stripe-service / Test
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Get Artifactory Token
        id: jfrog
        uses: jfrog/setup-jfrog-cli@eb77328bc74211c6c65cada8d5f6c0e156a51440 # v4.11.0
        env:
          JF_URL: ${{ vars.JF_URL }}
        with:
          oidc-provider-name: github

      - name: Configure Go environment for JFrog
        env:
          OIDC_TOKEN: ${{ steps.jfrog.outputs.oidc-token }}
        run: |
          echo "::add-mask::$OIDC_TOKEN"
          echo "GOPROXY=https://:${OIDC_TOKEN}@gdartifactory1.jfrog.io/artifactory/api/go/go-virt|direct" >> $GITHUB_ENV
          echo "GONOSUMDB=github.com/gdcorp-golang/*" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25"
          cache-dependency-path: stripe-service/go.mod

      - name: Go mod download
        working-directory: stripe-service
        run: go mod download

      - name: go test
        working-directory: stripe-service
        run: go test -race ./...
