name: Merge Queue

# Triggers on both pull_request and merge_group so that "Merge Gate" always
# reports a status. On pull_request all CI jobs are skipped (gated by the
# if: condition below); the sentinel sees all-skipped and passes immediately,
# satisfying the required status check. On merge_group the full suite runs.
#
# Scope: the queue gates only the JS/TS surface (agents, app) plus the
# v8 template checks that interact with agents via template sync. Go services
# and other independent checks are validated by their per-service path-filtered
# PR workflows; they don't need re-validation in the queue because their PRs
# can't conflict with unrelated JS/TS work.
#
# Pattern from: https://boinkor.net/2023/11/neat-github-actions-patterns-for-github-merge-queues/
on:
  pull_request:
  merge_group:
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  # Only runs in the merge queue. Passes immediately so developers have a link
  # to click while CI is running rather than waiting for the sentinel to finish.
  ci-running:
    name: Merge Queue (CI running...)
    if: github.event_name == 'merge_group'
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    steps:
      - run: echo "Merge queue checks are running"

  # JS/TS packages — call _quality-checks.yml directly
  agents:
    if: github.event_name == 'merge_group'
    uses: ./.github/workflows/_quality-checks.yml
    with:
      package-name: agents
      pnpm-filter: "@airo/agents"
      working-directory: ./agents
      testla-pcp-app-id: '7548'
      testla-run-name: 'Agents - Unit Tests'
    secrets: inherit

  app-lint-build:
    if: github.event_name == 'merge_group'
    uses: ./.github/workflows/_quality-checks.yml
    with:
      package-name: app
      pnpm-filter: website
      working-directory: ./app
      cache-next-build: true
      skip-tests: true
      validate-i18n: true
    secrets: inherit

  app-unit-tests:
    if: github.event_name == 'merge_group'
    uses: ./.github/workflows/_quality-checks.yml
    with:
      package-name: app-unit
      pnpm-filter: website
      working-directory: ./app
      skip-lint-build: true
      test-script: test:unit
      testla-pcp-app-id: '6082'
      testla-run-name: 'App - Unit Tests'
    secrets: inherit

  app-integration-tests:
    if: github.event_name == 'merge_group'
    uses: ./.github/workflows/_quality-checks.yml
    with:
      package-name: app-integration
      pnpm-filter: website
      working-directory: ./app
      skip-lint-build: true
      test-script: test:integration
      testla-pcp-app-id: '6082'
      testla-run-name: 'App - Integration Tests'
    secrets: inherit

  # v8 template checks — gated because template changes flow into agents via
  # the sync scripts, so a v8 change can break agents in a way that only shows
  # up when both land together.
  v8-license:
    if: github.event_name == 'merge_group'
    uses: ./.github/workflows/v8-template-license-check.yml
    secrets: inherit

  v8-migration:
    if: github.event_name == 'merge_group'
    uses: ./.github/workflows/v8-template-migration-checks.yml
    secrets: inherit

  # The single required status check for the merge queue ruleset.
  # if: always() ensures this runs even when all deps are skipped (pull_request
  # event). The jq check accepts "skipped" as success so it passes immediately
  # on PRs and only gates on real failures in the merge queue.
  merge-gate:
    name: Merge Gate
    needs:
      - agents
      - app-lint-build
      - app-unit-tests
      - app-integration-tests
      - v8-license
      - v8-migration
    if: always()
    permissions:
      actions: read
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    steps:
      - name: All merge checks passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -e '
            to_entries | map(
              [.value.result == "success", .value.result == "skipped"] | any
            ) | all'
