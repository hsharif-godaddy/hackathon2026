name: V8 Template License Check

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
    paths:
      - "app-templates/v8/package.json"
      - "app-templates/v8/package-lock.json"
      - "scripts/license-check.sh"
      - ".github/workflows/v8-template-license-check.yml"
  push:
    branches: [main]
    paths:
      - "app-templates/v8/package.json"
      - "app-templates/v8/package-lock.json"
      - "scripts/license-check.sh"
      - ".github/workflows/v8-template-license-check.yml"

permissions:
  contents: read

jobs:
  v8-template-license-check:
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable Corepack and verify pnpm version
        run: |
          # Install latest corepack to avoid signature verification issues
          npm install -g corepack@latest
          corepack enable

          # Extract expected version from package.json packageManager field
          EXPECTED_VERSION=$(node -p "
            const pkg = require('./package.json');
            const pm = pkg.packageManager || '';
            const match = pm.match(/^pnpm@(.+?)(\+|$)/);
            if (!match) {
              console.error('ERROR: Could not parse packageManager field:', pm);
              process.exit(1);
            }
            match[1];
          ")

          # Prepare the exact pnpm version from package.json
          corepack prepare "pnpm@${EXPECTED_VERSION}" --activate
          ACTUAL_VERSION=$(pnpm --version)

          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "ERROR: pnpm version mismatch!"
            echo "Expected: $EXPECTED_VERSION (from package.json packageManager field)"
            echo "Actual: $ACTUAL_VERSION"
            echo ""
            echo "This will cause pnpm-lock.yaml format inconsistencies."
            echo "Please ensure Corepack is enabled: corepack enable"
            exit 1
          fi
          echo "pnpm version $ACTUAL_VERSION matches expected version"

      - name: Verify lockfile and install v8 template dependencies
        working-directory: ./app-templates/v8
        run: |
          npm install --package-lock-only
          if ! git diff --quiet package-lock.json; then
            echo "ERROR: v8 template package-lock.json is out of date"
            echo "Please run: cd app-templates/v8 && npm install"
            echo ""
            echo "Changes detected:"
            git diff package-lock.json
            exit 1
          fi
          npm ci

      - name: Check v8 template license compliance
        working-directory: ./app-templates/v8
        run: |
          echo "Checking v8 template license compliance using script..."
          ../../scripts/license-check.sh
        continue-on-error: false

      - name: Upload v8 template license report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: license-report-v8-template
          path: ./app-templates/v8/licenses-report.txt
          retention-days: 30
