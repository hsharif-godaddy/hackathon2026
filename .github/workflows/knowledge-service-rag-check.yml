name: Knowledge Service - RAG Quality Check

on:
  schedule:
    - cron: "0 9 * * *" # Daily at 09:00 UTC

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to check"
        required: true
        type: choice
        options:
          - "PROD"
          - "DEV-PRIVATE"
        default: "PROD"
      force_fail:
        description: "TEST ONLY: force check_failed=true to verify Slack alert fires (no real queries run)"
        required: false
        type: boolean
        default: false
      test_query_gen:
        description: "TEST ONLY: run generate-rag-queries.sh against this doc via CaaS (dry run, no commit)"
        required: false
        type: choice
        options:
          - ""
          - "media_manager"
          - "deployment"
          - "llm-models"
        default: ""

  # Called from knowledge-service-ingest.yml after a successful prod ingest
  workflow_call:
    inputs:
      environment:
        description: "Environment to check"
        required: true
        type: string

run-name: "RAG Quality Check - ${{ inputs.environment || 'PROD' }} (${{ github.event_name == 'schedule' && 'scheduled' || format('by {0}', github.actor) }})"

permissions:
  id-token: write
  contents: read

jobs:
  check:
    name: Run RAG Quality Check
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    timeout-minutes: 15
    outputs:
      check_failed: ${{ steps.force-fail.outputs.check_failed || steps.run-check.outputs.check_failed }}
      slack_message: ${{ steps.force-fail.outputs.slack_message || steps.run-check.outputs.slack_message }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          # For workflow_call (triggered from ingest): checkout main so we get
          # freshly committed query files that may be ahead of the ingest commit.
          # For push/schedule/dispatch: use the triggering ref directly.
          ref: ${{ github.event_name == 'workflow_call' && 'main' || github.ref }}

      - name: Resolve environment config
        id: env
        env:
          ENVIRONMENT: ${{ inputs.environment || 'PROD' }}
        run: |
          if [ "$ENVIRONMENT" = "PROD" ]; then
            echo "api_url=https://airobuilde-app-builder-knowledge-prod.airobuilde-prod.prod.onkatana.net" >> $GITHUB_OUTPUT
            echo "sso_env=prod" >> $GITHUB_OUTPUT
            echo "slack_secret=/Katana/Secrets/airobuilde/app/_katana/SLACK_WEBHOOK_PROD" >> $GITHUB_OUTPUT
          else
            echo "api_url=https://airobuilde-app-builder-knowledge-dev-private.airobuilde-dev-private.prod.onkatana.net" >> $GITHUB_OUTPUT
            echo "sso_env=test" >> $GITHUB_OUTPUT
            echo "slack_secret=/Katana/Secrets/airobuilde/app/_katana/SLACK_WEBHOOK_NONPROD" >> $GITHUB_OUTPUT
          fi

      - name: Get AWS IAM JWT
        id: get-awsiam
        uses: gdcorp-actions/sso-awsiam-jwt@1a1c7cef15317e1b1baeab47fa47666b6cc84960
        with:
          sso_env: ${{ steps.env.outputs.sso_env }}

      - name: Get CaaS JWT for query generation test
        id: get-caas-jwt
        if: inputs.test_query_gen != '' && inputs.test_query_gen != null
        uses: gdcorp-actions/sso-awsiam-jwt@4fa027318def6898322564a008818dad427387b2 # v2.0.0
        with:
          sso_host: sso.godaddy.com

      # TEST ONLY: verify gpt-4o-mini query generation works via CaaS.
      # Runs the script against an existing doc and prints output. Nothing committed.
      - name: "[TEST] Dry-run query generation via CaaS"
        if: inputs.test_query_gen != '' && inputs.test_query_gen != null
        env:
          CAAS_JWT: ${{ steps.get-caas-jwt.outputs.jwt }}
          DOC_NAME: ${{ inputs.test_query_gen }}
        run: |
          echo "::add-mask::$CAAS_JWT"
          echo "Testing gpt-4o-mini query generation for: $DOC_NAME (dry run)"
          bash knowledge-service/scripts/generate-rag-queries.sh \
            "$DOC_NAME" \
            "knowledge-base/${DOC_NAME}.md" \
            "$CAAS_JWT"
          echo "Query generation succeeded. File NOT committed (dry run)."

      # TEST ONLY: skip real queries and force the Slack alert to fire.
      - name: "[TEST] Force failure output for Slack testing"
        if: inputs.force_fail == 'true'
        run: |
          echo "check_failed=true" >> "$GITHUB_OUTPUT"
          echo "slack_message=TEST ALERT — force_fail=true. No real queries were run." >> "$GITHUB_OUTPUT"
          echo "Force-fail mode: skipping real RAG queries, Slack alert should fire."
          exit 0
        id: force-fail

      - name: Run RAG quality check
        id: run-check
        if: inputs.force_fail != 'true'
        env:
          API_URL: ${{ steps.env.outputs.api_url }}
          IAM_JWT: ${{ steps.get-awsiam.outputs.jwt }}
          THRESHOLD: "80"
        run: |
          echo "::add-mask::$IAM_JWT"

          TOTAL_PASS=0
          TOTAL_FAIL=0
          ANY_FAILED=false
          SLACK_PARTS=""

          QUERY_FILES=()
          while IFS= read -r -d '' f; do
            QUERY_FILES+=("$f")
          done < <(find knowledge-service/rag-tests -name "*.json" -print0 2>/dev/null | sort -z)

          if [ ${#QUERY_FILES[@]} -eq 0 ]; then
            echo "No query files found in knowledge-service/rag-tests/ — nothing to check"
            echo "check_failed=false" >> "$GITHUB_OUTPUT"
            echo "slack_message=No query files found — skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "## RAG Quality Check Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Document | Pass | Fail | Accuracy | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|------|------|----------|--------|" >> "$GITHUB_STEP_SUMMARY"

          for query_file in "${QUERY_FILES[@]}"; do
            doc_name=$(jq -r '.docName' "$query_file")
            query_count=$(jq '.queries | length' "$query_file")

            if [ "$query_count" -eq 0 ]; then
              echo "⚠️  Skipping $doc_name — query file has no queries"
              continue
            fi

            DOC_PASS=0
            DOC_FAIL=0
            FAILING_LINES=""

            for i in $(seq 0 $((query_count - 1))); do
              query=$(jq -r ".queries[$i]" "$query_file")

              raw=$(curl -s -w "\n%{http_code}" -X POST "${API_URL}/api/v1/search" \
                -H "Authorization: sso-jwt ${IAM_JWT}" \
                -H "Content-Type: application/json" \
                -d "$(jq -n --arg q "$query" '{query: $q, topN: 1}')")
              http_code=$(echo "$raw" | tail -n1)
              response=$(echo "$raw" | head -n -1)

              if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
                echo "ERROR: search API returned HTTP $http_code for query: $query"
                exit 1
              fi

              top_doc=$(echo "$response" | jq -r '.results[0].docName // "none"')

              if [ "$top_doc" = "$doc_name" ]; then
                DOC_PASS=$((DOC_PASS + 1))
              else
                DOC_FAIL=$((DOC_FAIL + 1))
                FAILING_LINES="${FAILING_LINES}  - \"${query}\" → got: ${top_doc}\n"
              fi
            done

            DOC_TOTAL=$((DOC_PASS + DOC_FAIL))
            DOC_PCT=0
            [ $DOC_TOTAL -gt 0 ] && DOC_PCT=$((DOC_PASS * 100 / DOC_TOTAL))

            TOTAL_PASS=$((TOTAL_PASS + DOC_PASS))
            TOTAL_FAIL=$((TOTAL_FAIL + DOC_FAIL))

            if [ $DOC_PCT -ge $THRESHOLD ]; then
              STATUS="✅"
              TABLE_STATUS="✅ Pass"
            else
              STATUS="❌"
              TABLE_STATUS="❌ Fail"
              ANY_FAILED=true
            fi

            echo "$STATUS $doc_name: $DOC_PASS/$DOC_TOTAL ($DOC_PCT%)"
            [ -n "$FAILING_LINES" ] && printf "  Failing queries:\n%b" "$FAILING_LINES"

            echo "| \`$doc_name\` | $DOC_PASS | $DOC_FAIL | $DOC_PCT% | $TABLE_STATUS |" >> "$GITHUB_STEP_SUMMARY"

            SLACK_PARTS="${SLACK_PARTS}${doc_name}: ${DOC_PASS}/${DOC_TOTAL} (${DOC_PCT}%) ${STATUS} | "
          done

          OVERALL_TOTAL=$((TOTAL_PASS + TOTAL_FAIL))
          OVERALL_PCT=0
          [ $OVERALL_TOTAL -gt 0 ] && OVERALL_PCT=$((TOTAL_PASS * 100 / OVERALL_TOTAL))

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Overall: $TOTAL_PASS/$OVERALL_TOTAL ($OVERALL_PCT%)**" >> "$GITHUB_STEP_SUMMARY"

          echo "check_failed=$ANY_FAILED" >> "$GITHUB_OUTPUT"
          {
            echo "slack_message<<EOF"
            printf '%s' "${SLACK_PARTS}Overall: ${TOTAL_PASS}/${OVERALL_TOTAL} (${OVERALL_PCT}%)"
            echo ""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  slack-notify:
    name: Slack Alert on Failure
    needs: check
    if: always() && needs.check.outputs.check_failed == 'true'
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    steps:
      - name: Resolve Slack webhook secret
        id: slack-config
        env:
          ENVIRONMENT: ${{ inputs.environment || 'PROD' }}
        run: |
          if [ "$ENVIRONMENT" = "PROD" ]; then
            echo "secret=/Katana/Secrets/airobuilde/app/_katana/SLACK_WEBHOOK_PROD" >> $GITHUB_OUTPUT
          else
            echo "secret=/Katana/Secrets/airobuilde/app/_katana/SLACK_WEBHOOK_NONPROD" >> $GITHUB_OUTPUT
          fi

      - name: Fetch Slack webhook
        run: |
          WEBHOOK=$(aws secretsmanager get-secret-value \
            --secret-id "${{ steps.slack-config.outputs.secret }}" \
            --query SecretString \
            --output text)
          echo "::add-mask::$WEBHOOK"
          echo "SLACK_WEBHOOK_URL=$WEBHOOK" >> $GITHUB_ENV

      - name: Send Slack alert
        env:
          SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL }}
          SUMMARY: ${{ needs.check.outputs.slack_message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ENVIRONMENT: ${{ inputs.environment || 'PROD' }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg summary "$SUMMARY" \
              --arg run_url "$RUN_URL" \
              --arg env "$ENVIRONMENT" \
              '{
                attachments: [{
                  color: "danger",
                  title: (":x: RAG Quality Check Failed — " + $env),
                  text: $summary,
                  footer: "airo-app-builder | RAG Quality Check",
                  actions: [{
                    type: "button",
                    text: "View Run",
                    url: $run_url
                  }]
                }]
              }')"
