name: Knowledge Service - Ingest Documentation

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - "DEV-PRIVATE"
          - "PROD"
        default: "DEV-PRIVATE"
      documents:
        description: "Comma-separated document names (without .md) or empty to ingest all"
        required: false
        type: string
        default: ""
      force:
        description: "Force re-embed all chunks even if content is unchanged (use after pipeline upgrades)"
        required: false
        type: boolean
        default: false
  # workflow_call inputs mirror workflow_dispatch above — GitHub requires both
  # blocks to declare inputs independently; they cannot share a definition.
  workflow_call:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: string
      documents:
        description: "Comma-separated document names (without .md) or empty to ingest all"
        required: false
        type: string
        default: ""
      force:
        description: "Force re-embed all chunks even if content is unchanged"
        required: false
        type: boolean
        default: false

run-name: "Ingest ${{ inputs.documents || 'all documents' }} to ${{ inputs.environment }}"

permissions:
  id-token: write # required for sso-awsiam-jwt action
  contents: read

jobs:
  ingest-documents:
    name: Ingest Documents to Knowledge Service
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Resolve environment config
        id: env
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ "$ENVIRONMENT" = "PROD" ]; then
            echo "api_url=https://knowledge.api.int.godaddy.com" >> $GITHUB_OUTPUT
            echo "sso_env=prod" >> $GITHUB_OUTPUT
          else
            echo "api_url=https://airobuilde-app-builder-knowledge-dev-private.airobuilde-dev-private.prod.onkatana.net" >> $GITHUB_OUTPUT
            echo "sso_env=test" >> $GITHUB_OUTPUT
          fi

      - name: Get AWS IAM JWT
        id: get-awsiam
        uses: gdcorp-actions/sso-awsiam-jwt@1a1c7cef15317e1b1baeab47fa47666b6cc84960
        with:
          sso_env: ${{ steps.env.outputs.sso_env }}

      - name: Ingest documents
        env:
          API_URL: ${{ steps.env.outputs.api_url }}
          IAM_JWT: ${{ steps.get-awsiam.outputs.jwt }}
          ENVIRONMENT: ${{ inputs.environment }}
          DOCUMENTS: ${{ inputs.documents }}
          FORCE: ${{ inputs.force }}
        run: |
          echo "::add-mask::$IAM_JWT"
          echo "Starting knowledge service document ingestion..."
          echo "Environment: $ENVIRONMENT"
          echo "API URL: $API_URL"
          echo "Force re-embed: $FORCE"

          INGEST_COUNT=0
          FAILED_COUNT=0

          # Build document list
          if [ -n "$DOCUMENTS" ]; then
            echo "Ingesting specific documents: $DOCUMENTS"
            IFS=',' read -ra DOC_ARRAY <<< "$DOCUMENTS"
            DOCS_TO_INGEST=()
            for item in "${DOC_ARRAY[@]}"; do
              DOCS_TO_INGEST+=("$(echo "$item" | xargs)")
            done
          else
            echo "Ingesting all markdown files from knowledge-base/"
            DOCS_TO_INGEST=(knowledge-base/*.md)
          fi

          for doc in "${DOCS_TO_INGEST[@]}"; do
            if [ -n "$DOCUMENTS" ]; then
              if [[ "$doc" == */* ]] || [[ "$doc" == *..* ]]; then
                echo "ERROR: invalid document name (path separators not allowed): $doc"
                exit 1
              fi
              doc_file="knowledge-base/${doc}.md"
            else
              doc_file="$doc"
            fi

            if [ ! -f "$doc_file" ]; then
              echo "⚠️  Document not found: $doc_file"
              FAILED_COUNT=$((FAILED_COUNT + 1))
              continue
            fi

            doc_name=$(basename "$doc_file" .md)
            echo ""
            echo "=================================================="
            echo "Ingesting: $doc_name"
            echo "=================================================="

            doc_content=$(cat "$doc_file")

            # Payload matches IngestDocument model: {name, content}
            payload=$(jq -n \
              --arg name "$doc_name" \
              --arg content "$doc_content" \
              --argjson force "${FORCE:-false}" \
              '{documents: [{name: $name, content: $content}], force: $force}')

            response=$(curl -s -w "\n%{http_code}" \
              -X POST \
              "${API_URL}/api/v1/ingest" \
              -H "Authorization: sso-jwt ${IAM_JWT}" \
              -H "Content-Type: application/json" \
              -d "$payload")

            http_code=$(echo "$response" | tail -n 1)
            response_body=$(echo "$response" | head -n -1)

            echo "Response status: $http_code"
            echo "Response body: $response_body"

            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              echo "✅ Successfully ingested: $doc_name"
              INGEST_COUNT=$((INGEST_COUNT + 1))
            else
              echo "❌ Failed to ingest: $doc_name (HTTP $http_code)"
              FAILED_COUNT=$((FAILED_COUNT + 1))
            fi
          done

          echo ""
          echo "=================================================="
          echo "Ingestion Summary"
          echo "=================================================="
          echo "Environment: $ENVIRONMENT"
          echo "API URL: $API_URL"
          echo "Successfully ingested: $INGEST_COUNT document(s)"
          echo "Failed: $FAILED_COUNT document(s)"

          if [ $FAILED_COUNT -gt 0 ]; then
            exit 1
          fi

          if [ $INGEST_COUNT -eq 0 ]; then
            echo "⚠️  No documents were ingested."
            exit 1
          fi

          echo "✅ All documents ingested successfully!"
