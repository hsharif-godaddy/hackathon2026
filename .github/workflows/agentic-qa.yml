name: Agentic QA Tests

run-name: "Agentic QA - ${{ inputs.environment || 'prod' }} (${{ github.event_name == 'schedule' && 'scheduled' || format('by {0}', github.actor) }})"

on:
  schedule:
    - cron: "0 */6 * * *" # create-site smoke test + friction evals every 6h
    - cron: "0 1 * * *" # credit-small daily at 01:00 UTC
    - cron: "0 9 * * *" # credit-medium daily at 09:00 UTC
    - cron: "0 17 * * *" # credit-large daily at 17:00 UTC

  # Allow manual triggering
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to test against"
        required: true
        default: "prod"
        type: choice
        options:
          - test
          - dev
          - prod
      scenario:
        description: "Scenario to run (all/golden-dataset-all run in PARALLEL)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - golden-dataset-all
          # Quick test
          - scenarios/hello-world.yaml
          # Main scenarios
          - scenarios/create-site.yaml
          # Credit: Small (10 credits)
          - scenarios/credit-constraint-runs/trainer-landing-small.yaml
          # Credit: Medium (25 credits)
          - scenarios/credit-constraint-runs/restaurant-site-medium.yaml
          - scenarios/credit-constraint-runs/consulting-site-medium.yaml
          # Credit: Large (50 credits)
          - scenarios/credit-constraint-runs/saas-auth-large.yaml
          - scenarios/credit-constraint-runs/ecommerce-store-large.yaml
          - scenarios/credit-constraint-runs/analytics-saas-large.yaml
          - scenarios/credit-constraint-runs/healthcare-clinic-large.yaml
          # App Types (10 scenarios)
          - scenarios/golden-dataset/app-types/landing-page.yaml
          - scenarios/golden-dataset/app-types/ecommerce-store.yaml
          - scenarios/golden-dataset/app-types/portfolio-site.yaml
          - scenarios/golden-dataset/app-types/restaurant-site.yaml
          - scenarios/golden-dataset/app-types/blog-site.yaml
          - scenarios/golden-dataset/app-types/fitness-studio.yaml
          - scenarios/golden-dataset/app-types/medical-practice.yaml
          - scenarios/golden-dataset/app-types/law-firm.yaml
          - scenarios/golden-dataset/app-types/event-planner.yaml
          - scenarios/golden-dataset/app-types/nonprofit-charity.yaml
          # Friction Evals (2 scenarios)
          - friction-evals-all
          - scenarios/friction-evals/friction-pattern-detection.yaml
          - scenarios/friction-evals/error-loop-retry-waste.yaml
          # Feature Tests (called from release-manager.yml's validate stage)
          - scenarios/feature-tests/skill-database.yaml
          - scenarios/feature-tests/skills-comprehensive.yaml
          - scenarios/feature-tests/publish-lifecycle.yaml
      headed:
        description: "Run with visible browser"
        required: false
        type: boolean
        default: false
      credits:
        description: "Credit limit override (e.g. 500). Only applies to credit-constraint scenarios."
        required: false
        type: string
        default: ""

  # Allow triggering from other workflows
  workflow_call:
    inputs:
      environment:
        description: "Environment to test against"
        required: true
        default: "prod"
        type: string
      scenario:
        description: "Scenario to run"
        required: false
        type: string
        default: "all"
      credits:
        description: "Credit limit override (e.g. 500). Only applies to credit-constraint scenarios."
        required: false
        type: string
        default: ""

# Cancel in-progress runs for the same trigger (schedule cron or branch)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.schedule || github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  # Setup job: determine which scenarios to run and output as matrix
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      environment: ${{ steps.env-config.outputs.environment }}
      base_url: ${{ steps.env-config.outputs.base_url }}
    steps:
      - name: Determine test environment
        id: env-config
        env:
          INPUT_ENVIRONMENT: ${{ github.event.inputs.environment || 'prod' }}
        run: |
          ENV="$INPUT_ENVIRONMENT"
          echo "environment=$ENV" >> $GITHUB_OUTPUT

          case "$ENV" in
            prod)
              echo "base_url=https://airo-builder.godaddy.com" >> $GITHUB_OUTPUT
              ;;
            dev)
              echo "base_url=https://airo-builder.dev-godaddy.com" >> $GITHUB_OUTPUT
              ;;
            test)
              echo "base_url=https://airo-builder.test-godaddy.com" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "❌ Unknown environment: $ENV"
              exit 1
              ;;
          esac
          echo "✅ Test environment: $ENV"

      - name: Build scenario matrix
        id: set-matrix
        env:
          INPUT_SCENARIO: ${{ github.event.inputs.scenario || 'all' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Define all available scenarios (single-line JSON to avoid output format issues)
          ALL_SCENARIOS='["scenarios/create-site.yaml","scenarios/golden-dataset/app-types/landing-page.yaml","scenarios/golden-dataset/app-types/ecommerce-store.yaml","scenarios/golden-dataset/app-types/portfolio-site.yaml","scenarios/golden-dataset/app-types/restaurant-site.yaml","scenarios/golden-dataset/app-types/blog-site.yaml","scenarios/golden-dataset/app-types/fitness-studio.yaml","scenarios/golden-dataset/app-types/medical-practice.yaml","scenarios/golden-dataset/app-types/law-firm.yaml","scenarios/golden-dataset/app-types/event-planner.yaml","scenarios/golden-dataset/app-types/nonprofit-charity.yaml","scenarios/friction-evals/friction-pattern-detection.yaml","scenarios/friction-evals/error-loop-retry-waste.yaml"]'

          GOLDEN_DATASET_SCENARIOS='["scenarios/golden-dataset/app-types/landing-page.yaml","scenarios/golden-dataset/app-types/ecommerce-store.yaml","scenarios/golden-dataset/app-types/portfolio-site.yaml","scenarios/golden-dataset/app-types/restaurant-site.yaml","scenarios/golden-dataset/app-types/blog-site.yaml","scenarios/golden-dataset/app-types/fitness-studio.yaml","scenarios/golden-dataset/app-types/medical-practice.yaml","scenarios/golden-dataset/app-types/law-firm.yaml","scenarios/golden-dataset/app-types/event-planner.yaml","scenarios/golden-dataset/app-types/nonprofit-charity.yaml"]'

          FRICTION_EVAL_SCENARIOS='["scenarios/friction-evals/friction-pattern-detection.yaml","scenarios/friction-evals/error-loop-retry-waste.yaml"]'

          # Credit scenario groups (pick one randomly per scheduled run)
          CREDIT_SMALL=("scenarios/credit-constraint-runs/trainer-landing-small.yaml")
          CREDIT_MEDIUM=("scenarios/credit-constraint-runs/restaurant-site-medium.yaml" "scenarios/credit-constraint-runs/consulting-site-medium.yaml")
          CREDIT_LARGE=("scenarios/credit-constraint-runs/saas-auth-large.yaml" "scenarios/credit-constraint-runs/ecommerce-store-large.yaml" "scenarios/credit-constraint-runs/analytics-saas-large.yaml" "scenarios/credit-constraint-runs/healthcare-clinic-large.yaml")

          # Scheduled runs: map cron expression to a random scenario from the group
          if [ "$EVENT_NAME" = "schedule" ]; then
            CRON="${{ github.event.schedule }}"
            case "$CRON" in
              "0 1 * * *")
                PICK=${CREDIT_SMALL[$RANDOM % ${#CREDIT_SMALL[@]}]}
                echo "ℹ️ Scheduled credit-small: $PICK"
                SCENARIOS="[\"$PICK\"]"
                ;;
              "0 9 * * *")
                PICK=${CREDIT_MEDIUM[$RANDOM % ${#CREDIT_MEDIUM[@]}]}
                echo "ℹ️ Scheduled credit-medium: $PICK"
                SCENARIOS="[\"$PICK\"]"
                ;;
              "0 17 * * *")
                PICK=${CREDIT_LARGE[$RANDOM % ${#CREDIT_LARGE[@]}]}
                echo "ℹ️ Scheduled credit-large: $PICK"
                SCENARIOS="[\"$PICK\"]"
                ;;
              *)
                echo "ℹ️ Scheduled run: create-site smoke test + friction evals"
                SCENARIOS='["scenarios/create-site.yaml","scenarios/friction-evals/friction-pattern-detection.yaml","scenarios/friction-evals/error-loop-retry-waste.yaml"]'
                ;;
            esac
          elif [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "pull_request" ]; then
            echo "ℹ️ Push/PR trigger: running ALL scenarios in PARALLEL"
            SCENARIOS="$ALL_SCENARIOS"
          elif [ "$INPUT_SCENARIO" = "all" ]; then
            echo "ℹ️ Running ALL scenarios in PARALLEL"
            SCENARIOS="$ALL_SCENARIOS"
          elif [ "$INPUT_SCENARIO" = "golden-dataset-all" ]; then
            echo "ℹ️ Running golden-dataset scenarios in PARALLEL"
            SCENARIOS="$GOLDEN_DATASET_SCENARIOS"
          elif [ "$INPUT_SCENARIO" = "friction-evals-all" ]; then
            echo "ℹ️ Running friction-eval scenarios in PARALLEL"
            SCENARIOS="$FRICTION_EVAL_SCENARIOS"
          else
            echo "ℹ️ Running single scenario: $INPUT_SCENARIO"
            SCENARIOS="[\"$INPUT_SCENARIO\"]"
          fi

          # Output as JSON for matrix (must be single line)
          echo "matrix={\"scenario\":$SCENARIOS}" >> $GITHUB_OUTPUT
          echo "✅ Matrix set successfully"

  # Test job: runs scenarios in parallel via matrix strategy
  agentic-qa:
    needs: setup
    timeout-minutes: 60
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    strategy:
      fail-fast: false # Don't cancel other scenarios if one fails
      max-parallel: 13 # Run all scenarios in parallel (matches ALL_SCENARIOS count)
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get Artifactory Token
        id: jfrog
        uses: jfrog/setup-jfrog-cli@1641575d87647fb969c0545f0b6a76873e328b7c # v5.0.0
        env:
          JF_URL: ${{ vars.JF_URL }}
        with:
          oidc-provider-name: github

      - name: Setup Artifactory Creds
        env:
          OIDC_TOKEN: ${{ steps.jfrog.outputs.oidc-token }}
        run: |
          echo "::add-mask::$OIDC_TOKEN"
          echo "ARTIFACTORY_NPM_TOKEN=${OIDC_TOKEN}" >> $GITHUB_ENV

      - name: Configure pnpm registry
        run: |
          echo "registry=https://gdartifactory1.jfrog.io/artifactory/api/npm/node-virt/" > .npmrc
          echo "//gdartifactory1.jfrog.io/artifactory/api/npm/node-virt/:_authToken=${{ env.ARTIFACTORY_NPM_TOKEN }}" >> .npmrc
          echo "//gdartifactory1.jfrog.io/artifactory/api/npm/npm-gasket-core-local/:_authToken=${{ env.ARTIFACTORY_NPM_TOKEN }}" >> .npmrc

      - name: Get test credentials from Secrets Manager
        id: get-credentials
        run: |
          set -e

          USERNAME="airo-app-builder-qa@godaddy.com"

          echo "Retrieving password from Secrets Manager..."
          CREDENTIALS=$(aws secretsmanager get-secret-value --secret-id "/test/airo-app-builder-user" --query 'SecretString' --output text --region us-west-2)

          PASSWORD=$(jq -r '.[keys[0]]' <<< "$CREDENTIALS")

          if [ "$PASSWORD" = "null" ] || [ -z "$PASSWORD" ]; then
            echo "❌ Failed to extract password"
            exit 1
          fi

          echo "::add-mask::$PASSWORD"
          {
            echo "username=$USERNAME"
            echo "password<<EOF"
            echo "$PASSWORD"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "✅ Credentials ready"

      - name: Get AWS IAM Token for CaaS proxy
        id: get-awsiam-token
        uses: gdcorp-actions/sso-awsiam-jwt@2.0.0
        with:
          sso_host: sso.godaddy.com

      - name: Validate CaaS proxy token
        env:
          JWT_TOKEN: ${{ steps.get-awsiam-token.outputs.jwt }}
          OPENAI_BASE_URL: "https://api.gocode.caas.gdcorp.tools/v1"
        run: |
          set -e

          echo "::add-mask::$JWT_TOKEN"
          echo "Validating CaaS proxy token with /models endpoint..."
          HTTP_STATUS=$(curl -s -o /tmp/caas-response.json -w "%{http_code}" \
            "${OPENAI_BASE_URL}/models" \
            -H "Authorization: Bearer ${JWT_TOKEN}")

          if [ "$HTTP_STATUS" -ge 400 ]; then
            echo "❌ CaaS proxy token validation failed with HTTP $HTTP_STATUS"
            cat /tmp/caas-response.json
            exit 1
          fi

          echo "✅ CaaS proxy token is valid (HTTP $HTTP_STATUS)"

      - name: Get Elasticsearch credentials from Secrets Manager
        id: get-es-creds
        continue-on-error: true
        run: |
          echo "Retrieving Elasticsearch credentials from Secrets Manager..."
          SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id "/airo/elasticsearch-credentials" --query 'SecretString' --output text --region us-west-2 2>/dev/null || echo "")

          if [ -z "$SECRET_JSON" ]; then
            echo "⚠️ Elasticsearch credentials not found - indexing will be skipped"
            exit 0
          fi

          ES_URL=$(echo "$SECRET_JSON" | jq -r '.url // .ingestion_url // empty')
          ES_API_KEY=$(echo "$SECRET_JSON" | jq -r '.api_key // empty')

          if [ -n "$ES_URL" ]; then
            echo "::add-mask::$ES_URL"
            echo "es_url=$ES_URL" >> $GITHUB_OUTPUT

            if [ -n "$ES_API_KEY" ]; then
              echo "::add-mask::$ES_API_KEY"
              echo "es_api_key=$ES_API_KEY" >> $GITHUB_OUTPUT
              echo "✅ Elasticsearch credentials retrieved (URL + API Key)"
            else
              echo "✅ Elasticsearch URL retrieved (no API key - assuming open access)"
            fi
          else
            echo "⚠️ Elasticsearch URL not found in secret - indexing will be skipped"
          fi

      - name: Get Langfuse credentials from Secrets Manager
        id: get-langfuse-creds
        continue-on-error: true
        run: |
          echo "Retrieving Langfuse credentials from Secrets Manager..."
          SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id "langfuse_test" --query 'SecretString' --output text --region us-west-2 2>/dev/null || echo "")

          if [ -z "$SECRET_JSON" ]; then
            echo "⚠️ Langfuse credentials not found - build metrics tracking will be skipped"
            exit 0
          fi

          PUBLIC_KEY=$(echo "$SECRET_JSON" | jq -r '.LANGFUSE_PUBLIC_KEY // empty')
          SECRET_KEY=$(echo "$SECRET_JSON" | jq -r '.LANGFUSE_SECRET_KEY // empty')
          BASE_URL=$(echo "$SECRET_JSON" | jq -r '.LANGFUSE_BASE_URL // empty')
          PROJECT_ID=$(echo "$SECRET_JSON" | jq -r '.LANGFUSE_PROJECT_ID // empty')

          if [ -n "$PUBLIC_KEY" ] && [ -n "$SECRET_KEY" ]; then
            echo "::add-mask::$PUBLIC_KEY"
            echo "::add-mask::$SECRET_KEY"
            echo "public_key=$PUBLIC_KEY" >> $GITHUB_OUTPUT
            echo "secret_key=$SECRET_KEY" >> $GITHUB_OUTPUT
            if [ -n "$BASE_URL" ]; then
              echo "base_url=$BASE_URL" >> $GITHUB_OUTPUT
            fi
            if [ -n "$PROJECT_ID" ]; then
              echo "project_id=$PROJECT_ID" >> $GITHUB_OUTPUT
            fi
            echo "✅ Langfuse credentials retrieved (base_url=${BASE_URL:-default}, project_id=${PROJECT_ID:-none})"
          else
            echo "⚠️ Langfuse keys not found in secret - build metrics tracking will be skipped"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: "22"

      - name: Enable Corepack and configure pnpm
        run: |
          npm install -g corepack@latest

          corepack enable
          EXPECTED_VERSION=$(node -p "
            const pm = require('./package.json').packageManager || '';
            const match = pm.match(/^pnpm@(.+?)(\+|$)/);
            if (!match) { console.error('Cannot parse packageManager:', pm); process.exit(1); }
            match[1];
          ")
          corepack prepare "pnpm@${EXPECTED_VERSION}" --activate
          ACTUAL_VERSION=$(pnpm --version)
          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "ERROR: pnpm version mismatch! Expected: $EXPECTED_VERSION, Actual: $ACTUAL_VERSION"
            exit 1
          fi
          echo "pnpm version $ACTUAL_VERSION matches expected version"

      - name: Install dependencies
        run: |
          echo "Installing workspace dependencies with pnpm..."
          pnpm install --frozen-lockfile

      - name: Build agentic-qa
        run: pnpm --filter agentic-qa build

      - name: Install Chrome/Chromium for Stagehand
        run: |
          echo "📥 Installing Chromium browser (without system deps - assuming runner has them)..."
          npx playwright install chromium

          # Find the Playwright Chromium executable
          PLAYWRIGHT_BROWSERS_PATH="${HOME}/.cache/ms-playwright"
          echo "Looking for Chrome in: $PLAYWRIGHT_BROWSERS_PATH"

          # List what's in the playwright cache
          echo "Playwright cache contents:"
          ls -la "$PLAYWRIGHT_BROWSERS_PATH" 2>/dev/null || echo "Cache directory not found"

          # Find chrome executable (Playwright stores it in chromium-*/chrome-linux/chrome)
          CHROME_EXECUTABLE=$(find "$PLAYWRIGHT_BROWSERS_PATH" -path "*/chrome-linux/chrome" -type f 2>/dev/null | head -1)

          if [ -z "$CHROME_EXECUTABLE" ]; then
            # Try alternative paths
            CHROME_EXECUTABLE=$(find "$PLAYWRIGHT_BROWSERS_PATH" -name "chrome" -type f -executable 2>/dev/null | head -1)
          fi

          if [ -z "$CHROME_EXECUTABLE" ]; then
            # Fallback to system Chrome
            echo "Trying system Chrome..."
            CHROME_EXECUTABLE=$(which google-chrome-stable || which google-chrome || which chromium-browser || which chromium || echo "")
          fi

          if [ -z "$CHROME_EXECUTABLE" ]; then
            echo "❌ Could not find Chrome/Chromium executable"
            echo "Full playwright cache contents:"
            find "$PLAYWRIGHT_BROWSERS_PATH" -type f 2>/dev/null | head -30
            exit 1
          fi

          echo "CHROME_PATH=$CHROME_EXECUTABLE" >> $GITHUB_ENV
          echo "✅ CHROME_PATH set to: $CHROME_EXECUTABLE"

      - name: Run Agentic QA Test - ${{ matrix.scenario }}
        id: run-tests
        timeout-minutes: 60
        env:
          CI: true
          TEST_USERNAME: ${{ steps.get-credentials.outputs.username }}
          TEST_PASSWORD: ${{ steps.get-credentials.outputs.password }}
          OPENAI_API_KEY: ${{ steps.get-awsiam-token.outputs.jwt }}
          OPENAI_BASE_URL: "https://api.gocode.caas.gdcorp.tools/v1"
          INPUT_HEADED: ${{ github.event.inputs.headed }}
          INPUT_CREDITS: ${{ inputs.credits || github.event.inputs.credits }}
          # Elasticsearch for result indexing (optional)
          ES_URL: ${{ steps.get-es-creds.outputs.es_url }}
          ES_API_KEY: ${{ steps.get-es-creds.outputs.es_api_key }}
          # Langfuse for website-building agent cost tracking (optional)
          LANGFUSE_PUBLIC_KEY: ${{ steps.get-langfuse-creds.outputs.public_key }}
          LANGFUSE_SECRET_KEY: ${{ steps.get-langfuse-creds.outputs.secret_key }}
          LANGFUSE_BASE_URL: ${{ steps.get-langfuse-creds.outputs.base_url }}
          LANGFUSE_PROJECT_ID: ${{ steps.get-langfuse-creds.outputs.project_id }}
          TEST_ENVIRONMENT: ${{ needs.setup.outputs.environment }}
        run: |
          # Use array-based command construction to prevent shell injection
          ARGS=("--filter" "agentic-qa" "test:e2e")

          # Add the specific scenario from matrix
          ARGS+=("${{ matrix.scenario }}")

          if [ "$INPUT_HEADED" = "true" ]; then
            ARGS+=("--headed")
          fi

          if [ -n "$INPUT_CREDITS" ]; then
            ARGS+=("--credits" "$INPUT_CREDITS")
          fi

          echo "🚀 Running: pnpm ${ARGS[*]}"
          pnpm "${ARGS[@]}"

      - name: Extract scenario name for artifact
        if: always()
        id: scenario-name
        run: |
          # Extract filename without path and extension for cleaner artifact names
          SCENARIO="${{ matrix.scenario }}"
          SCENARIO_NAME=$(basename "$SCENARIO" .yaml)
          echo "name=$SCENARIO_NAME" >> $GITHUB_OUTPUT

      - name: Upload Agentic QA Reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: agentic-qa-reports-${{ steps.scenario-name.outputs.name }}
          path: agentic-qa/reports/
          retention-days: 30

      - name: Upload Screenshots
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: agentic-qa-screenshots-${{ steps.scenario-name.outputs.name }}
          path: agentic-qa/reports/screenshots/
          retention-days: 30

  # Summary job: collect results and send notification
  summary:
    name: Test Summary
    if: always()
    needs: [setup, agentic-qa]
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ needs.setup.outputs.environment }}
    steps:
      - name: Check test results
        run: |
          echo "📊 Agentic QA Test Summary"
          echo "=========================="
          echo "Environment: ${{ needs.setup.outputs.environment }}"
          echo "Overall Result: ${{ needs.agentic-qa.result }}"

          if [ "${{ needs.agentic-qa.result }}" = "success" ]; then
            echo "✅ All scenarios passed!"
          elif [ "${{ needs.agentic-qa.result }}" = "failure" ]; then
            echo "❌ Some scenarios failed"
          else
            echo "⚠️ Tests completed with status: ${{ needs.agentic-qa.result }}"
          fi

  # slack-notify:
  #   name: Send Slack Notification
  #   if: always()
  #   needs: [setup, agentic-qa, summary]
  #   uses: ./.github/workflows/slack-notify.yml
  #   permissions:
  #     id-token: write
  #     contents: read
  #   with:
  #     result: ${{ needs.agentic-qa.result }}
  #     environment: ${{ needs.setup.outputs.environment }}
  #     title: "Agentic QA - ${{ needs.setup.outputs.environment }} (by ${{ github.actor }})"
  #     message: |
  #       *Environment:* ${{ needs.setup.outputs.environment }}
  #       *Scenario:* ${{ github.event.inputs.scenario || 'All scenarios (parallel)' }}
  #       *Execution:* Parallel matrix strategy
  #       *Actor:* ${{ github.actor }}
  #       *Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>
  #     footer: "airo-app-builder | Agentic QA"
