name: Claude Code responder

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

concurrency:
  group: claude-responder-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude-responder:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && !contains(github.event.comment.body, '@claude review')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && !contains(github.event.comment.body, '@claude review')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude') && !contains(github.event.issue.body, '@claude review'))
    uses: gdcorp-actions/gd-claude-code-action/.github/workflows/secure-claude-code.yml@91b65be0e70ad0e67776765e46b950f39fe84695 # v2
    with:
      runner_group: ${{ vars.CLAUDE_RUNNER_GROUP }}
      runner_labels_json: '["self-hosted"]'
      gocode_environment: prod
      trigger_phrase: "@claude"
      track_progress: "true"
      max_turns: "50"
