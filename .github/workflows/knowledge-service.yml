name: knowledge-service CI

on:
  push:
    branches:
      - main
    paths:
      - "knowledge-service/**"
      - "packages/go-auth/**"
      - ".github/workflows/knowledge-service.yml"
  pull_request:
    paths:
      - "knowledge-service/**"
      - "packages/go-auth/**"
      - ".github/workflows/knowledge-service.yml"

permissions:
  id-token: write
  contents: read

jobs:
  lint:
    name: Lint
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get Artifactory Token
        id: jfrog
        uses: jfrog/setup-jfrog-cli@88e9eba31c07e31beefa4cef5c0e93d1af9535d7 # v4.6.1
        env:
          JF_URL: ${{ vars.JF_URL }}
        with:
          oidc-provider-name: github

      - name: Configure Go environment for JFrog
        env:
          OIDC_TOKEN: ${{ steps.jfrog.outputs.oidc-token }}
        run: |
          echo "::add-mask::$OIDC_TOKEN"
          echo "GOPROXY=https://:${OIDC_TOKEN}@gdartifactory1.jfrog.io/artifactory/api/go/go-virt|direct" >> $GITHUB_ENV
          echo "GONOSUMDB=github.com/gdcorp-golang/*" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: knowledge-service/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.8.0
          working-directory: knowledge-service
          args: --timeout=5m

      - name: Run go vet
        working-directory: knowledge-service
        run: go vet ./...

      - name: Run go fmt check
        working-directory: knowledge-service
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not properly formatted:"
            gofmt -s -l .
            exit 1
          fi

  test:
    name: Test
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get Artifactory Token
        id: jfrog
        uses: jfrog/setup-jfrog-cli@88e9eba31c07e31beefa4cef5c0e93d1af9535d7 # v4.6.1
        env:
          JF_URL: ${{ vars.JF_URL }}
        with:
          oidc-provider-name: github

      - name: Configure Go environment for JFrog
        env:
          OIDC_TOKEN: ${{ steps.jfrog.outputs.oidc-token }}
        run: |
          echo "::add-mask::$OIDC_TOKEN"
          echo "GOPROXY=https://:${OIDC_TOKEN}@gdartifactory1.jfrog.io/artifactory/api/go/go-virt|direct" >> $GITHUB_ENV
          echo "GONOSUMDB=github.com/gdcorp-golang/*" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: knowledge-service/go.sum

      - name: Download dependencies
        working-directory: knowledge-service
        run: go mod download

      - name: Verify dependencies
        working-directory: knowledge-service
        run: go mod verify

      - name: Run tests
        working-directory: knowledge-service
        run: go test -v -race ./...

      - name: Run go-auth package tests
        working-directory: packages/go-auth
        run: go test -v -race ./...

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on:
      labels:
        - airo-cicd-runners
        - self-hosted
    needs: [lint, test]
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get Artifactory Token
        id: jfrog
        uses: jfrog/setup-jfrog-cli@88e9eba31c07e31beefa4cef5c0e93d1af9535d7 # v4.6.1
        env:
          JF_URL: ${{ vars.JF_URL }}
        with:
          oidc-provider-name: github

      - name: Configure Go environment for JFrog
        env:
          OIDC_TOKEN: ${{ steps.jfrog.outputs.oidc-token }}
        run: |
          echo "::add-mask::$OIDC_TOKEN"
          echo "GOPROXY=https://:${OIDC_TOKEN}@gdartifactory1.jfrog.io/artifactory/api/go/go-virt|direct" >> $GITHUB_ENV
          echo "GONOSUMDB=github.com/gdcorp-golang/*" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: knowledge-service/go.sum

      - name: Download dependencies
        working-directory: knowledge-service
        run: go mod download

      - name: Build binary
        working-directory: knowledge-service
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -ldflags="-w -s" -o dist/knowledge-service ./cmd/server
