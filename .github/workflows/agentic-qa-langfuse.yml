name: Agentic QA Evaluation

run-name: "Agentic QA Evaluation - ${{ github.event_name == 'pull_request' && '1' || inputs.hours || '4' }}h (by ${{ github.actor }})"

on:
  schedule:
    # 6x daily: every 4 hours starting at midnight UTC
    - cron: '0 0,4,8,12,16,20 * * *'

  pull_request:
    paths:
      - 'evals/agentic-qa-langfuse/**'
      - '.github/workflows/agentic-qa-langfuse.yml'

  workflow_dispatch:
    inputs:
      hours:
        description: 'Time window: process traces from the last N hours'
        required: false
        default: '4'
        type: string
      session:
        description: 'Session ID to scope to (optional, overrides hours)'
        required: false
        type: string
      workers:
        description: 'Number of concurrent workers'
        required: false
        default: '10'
        type: string
      evaluator:
        description: 'Run a single evaluator only. Leave empty to run all.'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - 'error'
          - 'intent'
          - 'vertical'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  evaluate:
    timeout-minutes: 30
    runs-on:
      labels:
        - airo-cicd-runners

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Get Artifactory Token
        id: jfrog
        uses: jfrog/setup-jfrog-cli@eb77328bc74211c6c65cada8d5f6c0e156a51440 # v4.11.0
        env:
          JF_URL: ${{ vars.JF_URL }}
        with:
          oidc-provider-name: github

      - name: Setup Artifactory Creds
        env:
          OIDC_TOKEN: ${{ steps.jfrog.outputs.oidc-token }}
        run: |
          echo "::add-mask::$OIDC_TOKEN"
          echo "ARTIFACTORY_NPM_TOKEN=${OIDC_TOKEN}" >> $GITHUB_ENV

      - name: Configure pnpm registry
        run: |
          echo "registry=https://gdartifactory1.jfrog.io/artifactory/api/npm/node-virt/" > .npmrc
          echo "//gdartifactory1.jfrog.io/artifactory/api/npm/:_authToken=${{ env.ARTIFACTORY_NPM_TOKEN }}" >> .npmrc

      - name: Get AWS IAM Token for CaaS proxy
        id: get-awsiam-test
        uses: gdcorp-actions/sso-awsiam-jwt@4fa027318def6898322564a008818dad427387b2 # 2.0.0
        with:
          sso_host: sso.godaddy.com

      - name: Validate CaaS proxy token
        env:
          JWT_TOKEN: ${{ steps.get-awsiam-test.outputs.jwt }}
          OPENAI_BASE_URL: 'https://api.gocode.caas.gdcorp.tools/v1'
        run: |
          set -e

          echo "Validating CaaS proxy token with a test request..."
          HTTP_STATUS=$(curl -s -o /tmp/caas-response.json -w "%{http_code}" \
            "${OPENAI_BASE_URL}/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${JWT_TOKEN}" \
            -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"Reply with OK"}],"max_tokens":5}')

          if [ "$HTTP_STATUS" -ge 400 ]; then
            echo "CaaS proxy token validation failed with HTTP $HTTP_STATUS"
            cat /tmp/caas-response.json
            exit 1
          fi

          echo "CaaS proxy token is valid (HTTP $HTTP_STATUS)"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Enable Corepack and configure pnpm
        run: |
          npm install -g corepack@latest

          corepack enable
          EXPECTED_VERSION=$(node -p "
            const pm = require('./package.json').packageManager || '';
            const match = pm.match(/^pnpm@(.+?)(\+|$)/);
            if (!match) { console.error('Cannot parse packageManager:', pm); process.exit(1); }
            match[1];
          ")
          corepack prepare "pnpm@${EXPECTED_VERSION}" --activate
          ACTUAL_VERSION=$(pnpm --version)
          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "ERROR: pnpm version mismatch! Expected: $EXPECTED_VERSION, Actual: $ACTUAL_VERSION"
            exit 1
          fi
          echo "pnpm version $ACTUAL_VERSION matches expected version"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build agentic-qa-langfuse
        run: pnpm --filter agentic-qa-langfuse build

      - name: Run evaluation pipeline
        env:
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: 'https://agentobser-langfuse.int.godaddy.com'
          JWT_TOKEN: ${{ steps.get-awsiam-test.outputs.jwt }}
          OPENAI_BASE_URL: 'https://api.gocode.caas.gdcorp.tools/v1'
          OPENAI_MODEL: 'gpt-5'
        run: |
          BASE_ARGS=("--filter" "agentic-qa-langfuse" "start")

          HOURS_INPUT="${{ inputs.hours || '4' }}"
          WORKERS_INPUT="${{ inputs.workers || '10' }}"
          if ! [[ "$HOURS_INPUT" =~ ^[0-9]+$ ]] || ! [[ "$WORKERS_INPUT" =~ ^[0-9]+$ ]]; then
            echo "Error: hours ('$HOURS_INPUT') and workers ('$WORKERS_INPUT') must be positive integers."
            exit 1
          fi

          # PR runs use 1h window to keep it fast
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            HOURS="1"
          else
            HOURS="$HOURS_INPUT"
          fi

          # Session ID takes priority over hours
          if [ -n "${{ inputs.session }}" ]; then
            BASE_ARGS+=("--session" "${{ inputs.session }}")
          else
            BASE_ARGS+=("--hours" "$HOURS")
          fi

          BASE_ARGS+=("--workers" "$WORKERS_INPUT")

          EVALUATOR="${{ inputs.evaluator }}"
          if [ -n "$EVALUATOR" ]; then
            BASE_ARGS+=("--${EVALUATOR}")
          fi

          echo "Running: pnpm ${BASE_ARGS[*]}"
          pnpm "${BASE_ARGS[@]}"
