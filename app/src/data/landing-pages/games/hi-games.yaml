  name: games
  label: गेम्स
  lang: hi
  useCase: games

meta:
  title: "GoDaddy Airo AI Builder | AI से गेम बनाएं"
  description: "मिनटों में मज़ेदार, इंटरैक्टिव ब्राउज़र गेम बनाएं। किसी गेम इंजन या कोडिंग कौशल की ज़रूरत नहीं — अपने गेम आइडिया का वर्णन करें और AI उसे साकार करे।"

theme:
  backgroundGradient: >-
    linear-gradient(0deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.55) 100%),
    radial-gradient(87% 100% at 100% 66%, rgba(230,60,50,0.90) 0%, rgba(200,50,40,0.73) 31%, rgba(180,40,30,0.00) 100%),
    radial-gradient(97% 95% at 10% 92%, #B53030 0%, rgba(181,48,48,0.93) 12%, rgba(181,48,48,0.00) 100%),
    radial-gradient(96% 113% at 35% -8%, #4A1020 0%, rgba(74,16,32,0.96) 22%, rgba(200,40,40,0.00) 100%),
    #3B0E1A
  glowColors:
    - "#DC3545"
    - "#FFB347"
    - "#FFF176"
    - "#C62828"
    - "#DC3545"
  featureColors:
    - "#DC3545"
    - "#FFB347"
    - "#FFF176"
  accentColor: "#FFB347"

header:
  showLogo: true
  location: landing-games

hero:
  title: "AI से गेम बनाएं — कोडिंग की ज़रूरत नहीं"
  subtitle: "अपने गेम आइडिया का वर्णन करें और उसे अपने ब्राउज़र में जीवंत होते देखें।"
  placeholders:
    - "पावर-अप्स और हाई स्कोर वाला एक रेट्रो स्पेस शूटर..."
    - "दैनिक चुनौतियों के साथ Wordle जैसा शब्द पहेली गेम..."
    - "विभिन्न श्रेणियों वाला एक मल्टीप्लेयर ट्रिविया क्विज़..."
    - "पिक्सेल आर्ट कैरेक्टर वाला प्लेटफ़ॉर्मर गेम..."
    - "एनिमेशन के साथ कार्ड मैचिंग मेमोरी गेम..."
  placeholdersMobile:
    - "रेट्रो स्पेस शूटर गेम..."
    - "शब्द पहेली गेम..."
    - "ट्रिविया क्विज़ गेम..."
  examples:
    - title: "मेमोरी कार्ड गेम"
      prompt: "टाइमर, स्कोर ट्रैकिंग और कई कठिनाई स्तरों वाला एक कार्ड मैचिंग मेमोरी गेम बनाएं। स्मूद फ्लिप एनिमेशन और साफ़, रंगीन डिज़ाइन का उपयोग करें।"
      slug: memory_game
    - title: "ट्रिविया क्विज़"
      prompt: "विज्ञान, इतिहास और पॉप कल्चर जैसी कई श्रेणियों वाला ट्रिविया क्विज़ गेम बनाएं। स्कोरिंग सिस्टम, प्रति प्रश्न टाइमर और अंतिम परिणाम स्क्रीन शामिल करें।"
      slug: trivia_quiz
    - title: "आइडल क्लिकर"
      prompt: "एक आइडल क्लिकर गेम बनाएं जहां आप सिक्के कमाने के लिए क्लिक करते हैं, पैसिव इनकम जेनरेट करने वाले अपग्रेड खरीदते हैं, और अचीवमेंट अनलॉक करते हैं। संतोषजनक एनिमेशन और साउंड इफेक्ट्स शामिल करें।"
      slug: idle_clicker
      featured: true
    - title: "शब्द पहेली"
      prompt: "Wordle स्टाइल वर्ड गेसिंग गेम बनाएं। खिलाड़ियों को 5 अक्षर वाले शब्द का अनुमान लगाने के लिए 6 प्रयास दें, सही अक्षरों और स्थिति दिखाने के लिए रंग-कोडेड संकेत दें।"
      slug: word_puzzle
    - title: "स्नेक गेम"
      prompt: "स्मूद कंट्रोल वाला क्लासिक स्नेक गेम बनाएं, साँप के बढ़ने पर बढ़ती गति, हाई स्कोर लीडरबोर्ड, और रेट्रो पिक्सेल-आर्ट स्टाइलिंग।"
      slug: snake_game
    - title: "ड्रॉइंग ऐप"
      prompt: "विभिन्न ब्रश साइज़, रंग, इरेज़र टूल, अनडू/रीडू, और ड्रॉइंग सेव और शेयर करने की क्षमता वाला ड्रॉइंग ऐप बनाएं।"
      slug: drawing_app
    - title: "प्लेटफ़ॉर्मर गेम"
      prompt: "एक साइड-स्क्रॉलिंग प्लेटफ़ॉर्मर गेम बनाएं जिसमें कैरेक्टर कूद और दौड़ सके, कलेक्टिबल सिक्के हों, बाधाओं से बचना हो, और कम से कम 3 लेवल हों।"
      slug: platformer
    - title: "रॉक पेपर सिज़र्स"
      prompt: "कंप्यूटर प्रतिद्वंद्वी के खिलाफ़ रॉक पेपर सिज़र्स गेम बनाएं, 5 में से सर्वश्रेष्ठ राउंड, स्कोर ट्रैकिंग, एनिमेटेड हैंड जेस्चर, और जीत/हार सेलिब्रेशन।"
      slug: rock_paper_scissors
  scrollLabel: "देखें कैसे काम करता है"
  disclaimer: true

sections:
  - type: explainer
    id: infra-section
    preTitle: "गेम डेवलपमेंट, सरलीकृत"
    title: "गेम आइडिया से खेलने योग्य गेम मिनटों में"
    text: "जटिल गेम इंजन और महीनों के विकास को भूल जाइए। अपने गेम कॉन्सेप्ट का वर्णन करें — मैकेनिक्स, लुक, फ़ील — और हमारा AI पूरी तरह खेलने योग्य ब्राउज़र गेम बनाता है। रियल टाइम में बदलाव करें जब तक यह परफ़ेक्ट न हो।"
    image: /images/block-1-big.png
    imageSmall: /images/block-1-small.png
    imagePosition: left

  - type: features
    items:
      - title: "वर्णन करें, कोड नहीं"
        description: "AI को बताएं कि आप किस तरह का गेम चाहते हैं — मैकेनिक्स, स्टाइल, और फ़ीचर्स। यह JavaScript, HTML5 Canvas, और CSS संभालता है।"
      - title: "तुरंत प्ले टेस्टिंग"
        description: "बनते समय अपना गेम लाइव चलता देखें। तुरंत टेस्ट करें और रियल टाइम में AI से बदलाव कहें।"
      - title: "किसी के साथ शेयर करें"
        description: "एक क्लिक में अपना गेम पब्लिश करें और लिंक शेयर करें। दोस्त, सहपाठी, या पूरी दुनिया खेल सकती है।"

  - type: explainer
    preTitle: "अनंत संभावनाएं"
    title: "पज़ल, आर्केड, स्ट्रेटेजी — जो चाहें"
    text: "चाहे आप एक कैज़ुअल वर्ड गेम, एक एक्शन-पैक्ड शूटर, एक ब्रेन-टीज़िंग पज़ल, या एक रिलैक्सिंग आइडल क्लिकर चाहते हों — AI बना सकता है। मैकेनिक्स मिलाकर कुछ अनोखा बनाएं।"
    image: /images/block-2-big.jpg
    imageSmall: /images/block-2-small.png
    imagePosition: right

  - type: features
    items:
      - title: "अपने गेम का वर्णन करें"
        description: "एक कॉन्सेप्ट से शुरू करें — क्विज़, प्लेटफ़ॉर्मर, कार्ड गेम। जितना अधिक विवरण, उतना बेहतर परिणाम।"
      - title: "गेमप्ले को रिफ़ाइन करें"
        description: "मैकेनिक्स एडजस्ट करने, फ़ीचर्स जोड़ने, कठिनाई ट्वीक करने और अनुभव को पॉलिश करने के लिए AI से चैट करें।"
      - title: "पब्लिश करें और खेलें"
        description: "एक क्लिक में अपना गेम लाइव करें। लिंक शेयर करें और दूसरों को खेलने दें — कोई डाउनलोड या इंस्टॉल नहीं।"

  - type: faq
    title: "अक्सर पूछे जाने वाले प्रश्न"
    items:
      - question: "मैं किस तरह के गेम बना सकता हूँ?"
        answer: "HTML5, CSS, और JavaScript का उपयोग करने वाले ब्राउज़र-आधारित गेम — जैसे पज़ल गेम, आर्केड गेम, कार्ड गेम, क्विज़ गेम, आइडल क्लिकर, सिंपल प्लेटफ़ॉर्मर, और भी बहुत कुछ।"
      - question: "क्या मुझे गेम डेवलपमेंट का अनुभव चाहिए?"
        answer: "नहीं। आप सादी भाषा में बताएं कि आप क्या चाहते हैं और AI बना देगा। अगर आपके पास कोडिंग स्किल हैं तो आप सोर्स कोड देख और एडिट भी कर सकते हैं।"
      - question: "क्या मैं ग्राफ़िक्स और साउंड इफ़ेक्ट्स जोड़ सकता हूँ?"
        answer: "हाँ। आप जो विज़ुअल स्टाइल चाहते हैं उसका वर्णन करें, और AI CSS एनिमेशन, कैनवास ग्राफ़िक्स बनाएगा। आप अपनी खुद की एसेट्स भी अपलोड कर सकते हैं।"
      - question: "क्या गेम मोबाइल-फ़्रेंडली हैं?"
        answer: "AI रेस्पॉन्सिव गेम बनाता है जो डेस्कटॉप और मोबाइल ब्राउज़र दोनों पर काम करते हैं। आप मोबाइल-फ़र्स्ट गेमप्ले के लिए टच कंट्रोल भी निर्दिष्ट कर सकते हैं।"
      - question: "क्या मैं अपने गेम से पैसे कमा सकता हूँ?"
        answer: "जेनरेट किया गया सारा कोड आपका है। आप अपने गेम को जैसे चाहें पब्लिश, शेयर या मॉनेटाइज़ कर सकते हैं।"

  - type: help
    title: "गेम आइडिया में अटके हैं?"
    text: "हमारी सपोर्ट टीम शुरुआत करने या आपकी रचना में समस्या हल करने में मदद कर सकती है।"
    ctaText: "मदद लें"
    ctaUrl: "https://www.godaddy.com/help/contact-us"
