  description: "Official landing for Airo Build-a-Thon. Turn Your Business Idea Into a Polished Web Experience. Build for projects, portfolios, student organizations, or real-world ventures."

theme:
  backgroundGradient: >-
    linear-gradient(160deg, #0f172a 0%, #1e293b 45%, #0c4a6e 100%)
  glowColors:
    - "#38bdf8"
