packages:
  - "agents"
  - "app"
  - "blog"
  - "packages/*"
  - "setup"
  - "cdk"
  - "debug-console"
  - "fanout"
  - "evals/agentic-qa"
  - "evals/agentic-qa-langfuse"
  - "design-rag"
  - "ts-bridge"
  - "evals/corpus-eval"
  - "evals/gosym-probe"
  - "evals/rebuild-prompts"
  - "!app-templates/**"

catalog:
  # Tooling - single source of truth for shared dev dependencies.
  # Note: eslint, prettier, vitest, and dotenv also exist in pnpm.overrides
  # (root package.json) to enforce versions for transitive deps pulled by
  # plugins/configs.
  "@ai-sdk/openai": ^3.0.63
  "@ai-sdk/provider": ^3.0.10
  "@airo/components": ^6.2.0
  "@aws-sdk/client-lambda": ^3.1048.0

  # Shared runtime
  '@babel/generator': ^7.29.1
  '@babel/parser': ^7.29.3
  '@babel/traverse': ^7.29.0
  '@babel/types': ^7.29.0
  '@domains/domain-recommendations': ^1.4.0
  '@elastic/elasticsearch': ^8.19.1
  '@gd-asm/asm-client': ^1.9.0
  '@godaddy/agent-observability-events': ^2.2.0
  '@godaddy/agent-otel-sdk': ^2.4.1
  '@godaddy/goknowb-client': ^1.0.9
  '@godaddy/request': ^4.0.0

  # Observability
  '@langfuse/tracing': ^4.6.1
  '@opentelemetry/api': ^1.9.1
  '@testing-library/dom': ^10.4.1
  '@testing-library/react': ^16.3.2
  '@types/archiver': ^6.0.4
  '@types/express': ^4.17.25
  # Shared type definitions
  '@types/multer': ^2.1.0
  '@types/node': ^22.19.18
  '@types/react': ^19.2.14
  '@types/react-dom': ^19.2.3
  '@types/react-speech-recognition': ^3.9.6
  '@types/supertest': ^7.2.0
  '@types/tar': ^7.0.87
  '@types/ws': ^8.18.1
  '@ux/util': ^2400.11.0
  '@vitest/coverage-v8': ^3.2.4
  '@vitest/ui': ^3.2.4

  # AI SDK
  ai: ^6.0.177
  ai-tokenizer: ^1.0.6
  archiver: ^7.0.1
  commander: ^12.1.0
  diff: ^8.0.4
  dotenv: 17.2.3
  echarts: ^6.0.0
  echarts-for-react: ^3.0.6
  eslint: 9.39.4
  events: ^3.3.0
  execa: ^9.6.1
  express: ^4.22.1

  # Auth
  gd-auth: 1.5.0
  gd-auth-client: ^2.1.1
  gray-matter: ^4.0.3
  helmet: ^8.1.0
  hyparquet: ^1.25.8
  jose: ^6.2.3
  jszip: ^3.10.1
  jwt-decode: ^4.0.0
  magic-string: 0.30.17
  multer: ^2.1.1
  next: ^16.2.6
  openai: ^6.37.0
  parquetjs: ^0.11.2
  prettier: 3.8.3
  react: ^19.2.6
  react-device-detect: ^2.2.3
  react-dom: ^19.2.6
  react-filerobot-image-editor: 5.0.0-beta.156
  react-focus-lock: ^2.13.7
  react-markdown: ^10.1.0
  react-speech-recognition: ^4.0.1
  react-transition-group: ^4.4.5
  remark-gfm: ^4.0.1
  socket.io: ^4.8.3
  socket.io-client: ^4.8.3
  supertest: ^7.2.2
  tar: ^7.5.15
  tsx: ^4.21.0
  typescript: 5.9.3
  uuid: ^11.1.1
  vitest: 3.2.4
  ws: ^8.20.0
  yaml: ^2.8.4
  zod: ^4.4.3
  # AWS SDK - not cataloged; pinned versions are sensitive to
  # Artifactory mirror lag for transitive @smithy/* deps.
  # Coordinate AWS SDK bumps manually across app/ and ai-lib/.
